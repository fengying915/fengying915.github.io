<title>黄果短剧</title>

<script>
/* hls.js 多 CDN 依次回退加载；四个源文件字节一致，用同一份 SRI 校验防篡改 */
(function loadHls() {
  const HLS_SRI = "sha384-w6Gb3fXHb5e1LUYa/hYA5Q41bEDglN5ZPCG7Jvnoo8/X90oGnlPqBlBJCe38mEMm";
  const sources = [
    "https://registry.npmmirror.com/hls.js/1.5.13/files/dist/hls.min.js",
    "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js",
    "https://unpkg.com/hls.js@1.5.13/dist/hls.min.js"
  ];
  let i = 0;
  (function next() {
    if (i >= sources.length) return;
    const s = document.createElement("script");
    s.src = sources[i++];
    s.integrity = HLS_SRI;
    s.crossOrigin = "anonymous";
    s.onerror = () => { s.remove(); next(); };
    document.head.appendChild(s);
  })();
})();
</script>
<style>
  :root {
    --accent: #ffd21a;
    --accent-2: #ff9d2e;
    --accent-3: #ffe36e;
    --accent-glow: rgba(255,210,26,.35);
    --accent-glow-2: rgba(255,157,46,.22);
    --on-accent: #2b1d00;
    --rank-1: #ff4d6d; --rank-2: #ffa23a; --rank-3: #ffd166;
  }
  :root[data-theme="dark"] {
    --bg: #0e0e12;
    --bg-grad-1: #2b2005;
    --card: #17181d;
    --panel-solid: #1a1b21;
    --line: rgba(255,255,255,.07);
    --line-hi: rgba(255,255,255,.16);
    --text: #f2f3f7;
    --text-dim: #b9bdcb;
    --sub: #7d8296;
    --hover: rgba(255,255,255,.06);
    --header-bg: rgba(14,14,18,.82);
    --drawer-bg: rgba(19,20,26,.94);
    --mask: rgba(0,0,0,.55);
    --sk-1: #16171c; --sk-2: #23242c;
    --shadow-md: 0 12px 32px rgba(0,0,0,.5);
    --shadow-lg: 0 24px 56px rgba(0,0,0,.6);
    --hero-mask: linear-gradient(180deg, rgba(0,0,0,.02) 20%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.92) 100%);
    --chip-bg: rgba(255,255,255,.06);
  }
  :root[data-theme="light"] {
    --bg: #f5f6fa;
    --bg-grad-1: #ffe9b8;
    --card: #ffffff;
    --panel-solid: #ffffff;
    --line: rgba(20,20,40,.08);
    --line-hi: rgba(20,20,40,.18);
    --text: #17181d;
    --text-dim: #3a3e4e;
    --sub: #6b7085;
    --hover: rgba(20,20,40,.05);
    --header-bg: rgba(255,255,255,.88);
    --drawer-bg: rgba(255,255,255,.98);
    --mask: rgba(30,30,50,.35);
    --sk-1: #eceef4; --sk-2: #f8f9fc;
    --shadow-md: 0 10px 30px rgba(90,95,140,.12);
    --shadow-lg: 0 20px 50px rgba(90,95,140,.16);
    --hero-mask: linear-gradient(180deg, rgba(0,0,0,.02) 20%, rgba(0,0,0,.45) 62%, rgba(0,0,0,.82) 100%);
    --chip-bg: rgba(20,20,40,.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    transition: background .4s ease, color .4s ease;
  }
  body::before {
    content: "";
    position: fixed; inset: -30% -30% auto -30%; height: 75vh;
    background:
      radial-gradient(50% 80% at 20% 0%, var(--bg-grad-1) 0%, transparent 60%),
      radial-gradient(45% 70% at 88% 5%, var(--accent-glow-2) 0%, transparent 60%);
    pointer-events: none; z-index: 0; opacity: .5;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  img.pending { opacity: 0; }
  img[data-enc] { transition: opacity .35s ease; }
  button { font-family: inherit; }

  /* 老内核不支持毛玻璃时改用不透明底色，避免半透明栏背面穿透看不清 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root[data-theme="dark"] {
      --header-bg: #0e0e12;
      --drawer-bg: #13141a;
      --mask: rgba(0,0,0,.72);
    }
    :root[data-theme="light"] {
      --header-bg: #ffffff;
      --drawer-bg: #ffffff;
      --mask: rgba(30,30,50,.45);
    }
  }

  /* ============ 顶栏 ============ */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
  }
  .top {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px 44px;
    align-items: center;
    gap: 12px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 13px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    padding: 0; position: relative; overflow: hidden;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 8px 22px var(--accent-glow); transform: translateY(-2px); }
  .icon-btn:active { transform: translateY(0) scale(.9); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .brand {
    display: flex; align-items: center; justify-content: flex-start;
    min-width: 0; cursor: pointer; user-select: none;
  }
  .brand .logo {
    font-size: 27px; font-weight: 900;
    background: linear-gradient(110deg, var(--accent) 0%, var(--accent-2) 40%, var(--accent-3) 70%, var(--accent) 100%);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 1.5px; white-space: nowrap;
    animation: logo-shine 4s linear infinite;
    line-height: 1.1;
  }
  @keyframes logo-shine { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }
  @media (max-width: 480px) {
    .brand .logo { font-size: 22px; letter-spacing: .5px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 11px; }
    .top { grid-template-columns: 40px minmax(0, 1fr) 40px 40px; gap: 8px; }
  }

  /* 桌面导航行 */
  .navrow { display: none; max-width: 1280px; margin: 10px auto 0; gap: 4px; }
  .navrow .nlink {
    padding: 7px 16px; border-radius: 20px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-dim); cursor: pointer;
    transition: all .25s; white-space: nowrap;
  }
  .navrow .nlink:hover { color: var(--text); background: var(--hover); }
  .navrow .nlink.active { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px var(--accent-glow); }
  @media (min-width: 900px) { .navrow { display: flex; } }

  .theme-btn { position: relative; }
  .theme-btn .sun, .theme-btn .moon { position: absolute; transition: opacity .4s, transform .55s cubic-bezier(.34,1.56,.64,1); }
  :root[data-theme="dark"] .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(90deg) scale(.3); }
  :root[data-theme="light"] .theme-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.3); }
  :root[data-theme="light"] .theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }

  /* ============ 搜索（弹层） ============ */
  .search-pop {
    position: fixed; top: 0; left: 0; right: 0; z-index: 220;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px calc(14px + env(safe-area-inset-top));
    padding-top: calc(12px + env(safe-area-inset-top));
    transform: translateY(-102%);
    transition: transform .38s cubic-bezier(.34,1.2,.64,1);
    box-shadow: var(--shadow-lg);
  }
  .search-pop.show { transform: translateY(0); }
  .search-pop .sp-row {
    display: flex; align-items: center; gap: 10px;
    max-width: 1280px; margin: 0 auto;
  }
  .search-pop .search { flex: 1; }
  .search-cancel {
    background: transparent; border: none; color: var(--sub);
    font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 10px 4px; white-space: nowrap; flex-shrink: 0;
    transition: color .25s;
  }
  .search-cancel:hover { color: var(--accent); }
  .sp-hist {
    max-width: 1280px; margin: 12px auto 0;
    display: none; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .sp-hist.show { display: flex; }
  .sp-hist .sp-label { font-size: 12px; font-weight: 700; color: var(--sub); }
  .sp-hist .sp-chip {
    position: relative;
    padding: 5px 22px 5px 12px; border-radius: 16px;
    background: var(--chip-bg); border: 1px solid var(--line);
    color: var(--text-dim); font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all .22s; white-space: nowrap;
  }
  .sp-hist .sp-chip:hover { color: var(--text); border-color: var(--line-hi); }
  .sp-hist .sp-x {
    position: absolute; top: -5px; right: -5px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel-solid); border: 1px solid var(--line-hi);
    color: var(--sub); font-size: 9px; font-style: normal; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .sp-hist .sp-x:hover { background: #e5484d; color: #fff; border-color: transparent; transform: scale(1.15); }
  .sp-hist .sp-chip:hover .sp-x { opacity: 1; }
  @media (hover: hover) { .sp-hist .sp-x { opacity: .65; } .sp-hist .sp-chip:hover .sp-x { opacity: 1; } }
  .search-mask {
    position: fixed; inset: 0; z-index: 219;
    background: var(--mask);
    opacity: 0; pointer-events: none;
    transition: opacity .35s;
  }
  .search-mask.show { opacity: 1; pointer-events: auto; }

  .search {
    display: flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .3s, box-shadow .4s;
    min-width: 0;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); padding: 12px 15px; font-size: 14px; font-weight: 500; min-width: 0;
  }
  .search input::placeholder { color: var(--sub); }
  .search button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: var(--on-accent);
    padding: 0 22px; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: .5px;
    transition: filter .3s;
    white-space: nowrap;
    display: flex; align-items: center; justify-content: center;
  }
  .search .sico { display: none; width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .search button:hover { filter: brightness(1.1); }
  .search button:active { filter: brightness(.94); transform: scale(.97); }

  /* ============ 抽屉 ============ */
  .drawer-mask {
    position: fixed; inset: 0; z-index: 200;
    background: var(--mask);
    opacity: 0; pointer-events: none;
    transition: opacity .4s;
  }
  .drawer-mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0; z-index: 201;
    width: 250px; max-width: 82vw;
    background: var(--drawer-bg);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-right: 1px solid var(--line);
    transform: translateX(calc(-100% - 16px));
    transition: transform .45s cubic-bezier(.34,1.2,.64,1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head {
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .drawer-head .info { flex: 1; min-width: 0; }
  .drawer-head .name {
    font-size: 15px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drawer-head .close {
    width: 28px; height: 28px; border-radius: 8px;
    background: transparent; border: none; color: var(--sub);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .3s; flex-shrink: 0;
  }
  .drawer-head .close:hover { background: var(--hover); color: var(--accent); transform: rotate(90deg); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
  .drawer-body::-webkit-scrollbar { width: 3px; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
  .drawer-label {
    font-size: 10px; font-weight: 800; letter-spacing: 1.6px;
    color: var(--sub); text-transform: uppercase;
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-radius: 10px;
    font-size: 13.5px; font-weight: 500;
    color: var(--text-dim); cursor: pointer;
    transition: all .25s; margin-bottom: 1px;
    position: relative;
  }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--on-accent); font-weight: 700;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .nav-item .cnt { margin-left: auto; font-size: 11px; color: var(--sub); font-weight: 600; }
  .nav-item.active .cnt { color: rgba(255,255,255,.85); }

  /* ============ 主内容 ============ */
  main {
    max-width: 1280px; margin: 0 auto;
    padding: 16px 16px 40px;
    position: relative; z-index: 1;
  }
  @media (max-width: 768px) {
    main { padding: 12px 12px calc(76px + env(safe-area-inset-bottom)); }
  }

  /* ============ Hero 轮播 ============ */
  .hero-scroll {
    display: flex; gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 4px 2px 16px;
    margin: 0 -2px 8px;
    scrollbar-width: none;
  }
  .hero-scroll::-webkit-scrollbar { display: none; }
  .hero-card {
    flex: 0 0 72%; max-width: 620px;
    scroll-snap-align: start;
    aspect-ratio: 16/8.2;
    border-radius: 18px; overflow: hidden; position: relative;
    background: var(--sk-1);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    cursor: pointer;
    transition: transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s;
    animation: hero-in .6s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  @keyframes hero-in { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
  .hero-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg), 0 0 0 1px var(--accent-glow); }
  @media (max-width: 640px) { .hero-card { flex: 0 0 90%; aspect-ratio: 16/10; border-radius: 14px; } }
  /* 老版安卓内核不支持 aspect-ratio，退化为固定高度，避免横版海报高度错乱 */
  @supports not (aspect-ratio: 16 / 8.2) {
    .hero-card { height: 300px; }
    @media (max-width: 640px) { .hero-card { height: 210px; } }
  }
  .hero-card img { transition: transform .9s cubic-bezier(.4,0,.2,1); }
  .hero-card:hover img { transform: scale(1.07); }
  .hero-card::after { content: ""; position: absolute; inset: 0; background: var(--hero-mask); pointer-events: none; }
  .hero-info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 18px 20px; color: #fff; z-index: 3;
    display: flex; flex-direction: column; gap: 7px;
  }
  @media (max-width: 640px) { .hero-info { padding: 12px 14px; } }
  .hero-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .hero-rank {
    display: inline-flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--on-accent); font-size: 11px; font-weight: 800;
    padding: 4px 11px; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    letter-spacing: .5px;
  }
  .hero-chip {
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.22);
    color: #fff; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hero-title {
    font-size: 21px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 2px 14px rgba(0,0,0,.7);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (max-width: 640px) { .hero-title { font-size: 17px; } }
  .hero-desc {
    font-size: 12.5px; opacity: .9; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .hero-play {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; transition: all .3s;
  }
  .hero-play svg { width: 16px; height: 16px; margin-left: 2px; fill: currentColor; stroke: none; }
  .hero-card:hover .hero-play { background: var(--accent); border-color: transparent; transform: scale(1.08); box-shadow: 0 8px 22px var(--accent-glow); }
  .hero-dots { display: flex; justify-content: center; gap: 6px; margin: -4px 0 18px; }
  .hero-dots .dot-item {
    width: 6px; height: 6px; border-radius: 3px;
    background: var(--line-hi);
    transition: all .4s cubic-bezier(.34,1.56,.64,1); cursor: pointer;
  }
  .hero-dots .dot-item.on { width: 22px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent-glow); }

  /* ============ 继续观看 ============ */
  .cont-scroll {
    display: flex; gap: 12px;
    overflow-x: auto; padding: 2px 2px 12px;
    margin: 0 -2px 6px;
    scrollbar-width: none;
  }
  .cont-scroll::-webkit-scrollbar { display: none; }
  .cont-card { flex: 0 0 128px; cursor: pointer; animation: fade-up .45s cubic-bezier(.34,1.56,.64,1) backwards; }
  .cont-poster {
    position: relative;
    width: 128px; height: 171px;   /* 固定 3:4，兼容不支持 aspect-ratio 的内核 */
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
    background: var(--sk-1);
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .cont-poster .pbadge {
    position: absolute; top: 7px; left: 7px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 2;
  }
  .cont-poster .pmask { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.72)); }
  .cont-poster .presume {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    display: flex; align-items: center; gap: 6px;
    color: #fff; font-size: 11px; font-weight: 600;
  }
  .presume .picon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .presume .picon svg { width: 10px; height: 10px; fill: #fff; stroke: none; margin-left: 1px; }
  .cont-title {
    margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cont-sub { font-size: 11px; color: var(--sub); margin-top: 1px; }

  /* ============ 区块标题 ============ */
  .sec-head {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 2px 14px;
    animation: fade-up .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sec-head .bar {
    width: 4px; height: 19px; border-radius: 3px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .sec-head h2 { font-size: 17px; font-weight: 800; letter-spacing: .3px; color: var(--text); white-space: nowrap; }
  .sec-head .sub { font-size: 12px; color: var(--sub); white-space: nowrap; margin-top: 2px; }
  .sec-head .more {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--sub); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 3px;
    padding: 5px 10px; border-radius: 18px;
    transition: all .25s;
  }
  .sec-head .more:hover { color: var(--accent); background: var(--hover); }
  .sec-head .more svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }

  /* ============ 卡片网格 ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  /* minmax(0,1fr)：避免长标题/标签把某一列撑宽导致卡片大小不一 */
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 18px; } }

  .card { background: transparent; cursor: pointer; position: relative; animation: card-in .5s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes card-in { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
  .card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.06s}
  .card:nth-child(4){animation-delay:.08s}.card:nth-child(5){animation-delay:.1s}.card:nth-child(6){animation-delay:.12s}
  .card:nth-child(7){animation-delay:.14s}.card:nth-child(8){animation-delay:.16s}.card:nth-child(9){animation-delay:.18s}
  .card:nth-child(n+10){animation-delay:.2s}
  .card:active { transform: scale(.97); }

  /* 封面框固定 3:4：用 padding 撑高（padding 百分比按卡片列宽计算），
     不依赖 aspect-ratio，老版安卓 WebView / X5 内核下尺寸同样一致 */
  .thumb {
    position: relative;
    height: 0;
    padding-top: 133.34%;
    background: var(--sk-1);
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
    transition: box-shadow .35s, border-color .35s, transform .35s cubic-bezier(.34,1.4,.64,1);
  }
  .thumb::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 55%;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.3) 50%, rgba(0,0,0,.78) 100%);
    pointer-events: none; z-index: 2;
  }
  .thumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .6s cubic-bezier(.34,1.2,.64,1);
  }
  @media (hover: hover) {
    .card:hover .thumb {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 38px rgba(0,0,0,.4), 0 0 0 1px var(--accent-glow), 0 0 34px var(--accent-glow);
      z-index: 4;
    }
    .card:hover .thumb img { transform: scale(1.08); }
    .card:hover .card-title { color: var(--accent); }
  }

  .badge-new, .badge-hot, .badge-rank {
    position: absolute; top: 8px; z-index: 3;
    font-size: 10.5px; font-weight: 800;
    padding: 3px 9px; border-radius: 14px;
    letter-spacing: .5px;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  .badge-new { left: 8px; background: linear-gradient(135deg, #22c55e, #4ade80); color: #fff; }
  .badge-hot { left: 8px; background: linear-gradient(135deg, #ff4d6d, #ff7a45); color: #fff; }
  .badge-rank {
    left: 8px; min-width: 26px; text-align: center;
    background: rgba(0,0,0,.62); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .badge-rank.r1 { background: linear-gradient(135deg, var(--rank-1), #ff8fa3); border: none; }
  .badge-rank.r2 { background: linear-gradient(135deg, var(--rank-2), #ffc46b); border: none; }
  .badge-rank.r3 { background: linear-gradient(135deg, var(--rank-3), #ffe3a3); border: none; color: #5c4300; }

  .thumb-plays {
    position: absolute; bottom: 8px; left: 9px; right: 9px; z-index: 3;
    display: flex; align-items: center; gap: 4px;
    color: #fff; font-size: 11px; font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .thumb-plays svg { width: 11px; height: 11px; fill: currentColor; stroke: none; flex-shrink: 0; }
  .thumb-plays .rem { margin-left: auto; font-size: 10.5px; opacity: .95; }

  .card-title {
    padding: 8px 2px 0;
    font-size: 13px; line-height: 1.42; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .25s; letter-spacing: .2px;
  }
  @media (max-width: 640px) { .card-title { font-size: 12px; } }
  /* 固定行高，保证有标签/无标签的卡片总高一致 */
  .card-tags { display: flex; gap: 5px; margin-top: 5px; overflow: hidden; min-height: 23px; }
  .ctag {
    flex-shrink: 0;
    font-size: 10.5px; font-weight: 600;
    padding: 2.5px 8px; border-radius: 10px;
    background: var(--chip-bg);
    color: var(--sub);
    border: 1px solid var(--line);
    white-space: nowrap;
    cursor: pointer;
    transition: all .2s;
  }
  .ctag:hover { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  @media (max-width: 640px) { .card-tags .ctag:nth-child(n+3) { display: none; } }

  .card-del {
    position: absolute; top: 6px; right: 6px; z-index: 5;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; line-height: 1;
    opacity: 0; transition: all .25s;
  }
  .card:hover .card-del, .card-del.always { opacity: 1; }
  .card-del:hover { background: #e5484d; transform: scale(1.1); }
  @media (hover: none) { .card-del { opacity: 1; } }

  .hist-prog { height: 4px; border-radius: 3px; background: var(--chip-bg); margin-top: 7px; overflow: hidden; }
  .hist-prog i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .card-sub { font-size: 11px; color: var(--sub); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .skel .thumb { background: linear-gradient(90deg, var(--sk-1), var(--sk-2), var(--sk-1)); background-size: 200% 100%; animation: sk 1.6s ease-in-out infinite; }
  .skel .card-title { background: var(--sk-1); color: transparent; border-radius: 5px; height: 16px; margin-top: 8px; }
  .skel .card-tags { visibility: hidden; }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ============ 分页 ============ */
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 26px 0 6px; flex-wrap: wrap;
  }
  .pager button, .pager .pg-info {
    min-width: 42px; height: 42px; padding: 0 15px;
    border-radius: 11px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text); font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all .28s;
    display: flex; align-items: center; justify-content: center;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); transform: translateY(-2px); }
  .pager button:active:not(:disabled) { transform: scale(.94); }
  .pager button:disabled { opacity: .3; cursor: not-allowed; }
  .pager .pg-info { background: transparent; border: none; cursor: default; color: var(--sub); font-weight: 500; }
  .pager .pg-info b { color: var(--accent); margin: 0 3px; font-size: 15px; font-weight: 800; }
  .pager .goto input {
    width: 62px; height: 42px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    color: var(--text); text-align: center;
    font-size: 13.5px; font-weight: 600; outline: none;
    transition: all .28s; font-family: inherit;
  }
  .pager .goto input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .pager .goto input::-webkit-outer-spin-button,
  .pager .goto input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ============ 列表页工具行 ============ */
  .list-tools {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 2px 14px;
    animation: fade-up .4s cubic-bezier(.34,1.56,.64,1);
  }
  .list-tools .bar { width: 4px; height: 19px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px var(--accent-glow); flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
  .list-tools h2 { font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  .list-tools .total { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .list-tools .act {
    margin-left: auto;
    padding: 7px 14px; border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--card); color: var(--sub);
    font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all .25s;
    white-space: nowrap;
  }
  .list-tools .act:hover { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 6px 18px var(--accent-glow); }

  /* ============ 详情 & 播放器 ============ */
  .player-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 10px;
    animation: fade-up .4s cubic-bezier(.34,1.56,.64,1);
  }
  .toolbar-right { display: flex; gap: 8px; align-items: center; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    padding: 9px 15px; cursor: pointer; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    transition: all .28s;
    white-space: nowrap;
  }
  .back-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateX(-3px); box-shadow: 0 6px 18px var(--accent-glow); }
  .fav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text-dim); cursor: pointer; transition: all .28s;
    white-space: nowrap;
  }
  .fav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fav-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); }
  .fav-btn.on { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  .fav-btn.on svg { fill: var(--accent); stroke: var(--accent); }
  .close-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--card); color: var(--sub);
    border: 1px solid var(--line);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .35s; padding: 0; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--hover); color: var(--accent); border-color: var(--accent); transform: rotate(90deg) scale(1.08); }

  .player-wrap {
    position: relative; width: 100%;
    background: #000;
    border-radius: 18px; overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow-lg), 0 0 50px var(--accent-glow-2);
    border: 1px solid var(--line);
    animation: fade-up .45s cubic-bezier(.34,1.56,.64,1);
  }
  video { width: 100%; display: block; background: #000; max-height: 76vh; }

  .detail-head {
    display: flex; gap: 16px;
    margin-bottom: 18px;
    animation: fade-up .5s cubic-bezier(.34,1.56,.64,1) backwards;
    animation-delay: .08s;
  }
  .detail-head .poster {
    width: 128px; height: 171px; flex-shrink: 0;
    border-radius: 16px; overflow: hidden;
    background: var(--sk-1); border: 1px solid var(--line);
    box-shadow: var(--shadow-md), 0 0 26px var(--accent-glow-2);
  }
  @media (max-width: 560px) { .detail-head .poster { width: 100px; height: 133px; } .detail-head { gap: 12px; } }
  .detail-info { min-width: 0; padding-top: 2px; }
  .detail-info h1 { font-size: 19px; line-height: 1.38; margin-bottom: 10px; font-weight: 800; letter-spacing: .3px; }
  @media (max-width: 560px) { .detail-info h1 { font-size: 16.5px; } }
  .detail-info .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .tag {
    font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 20px;
    background: var(--chip-bg); color: var(--sub);
    border: 1px solid var(--line);
  }
  .tag.tg { cursor: pointer; transition: all .22s; }
  .tag.tg:hover {
    color: var(--on-accent);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    box-shadow: 0 5px 16px var(--accent-glow);
    transform: translateY(-1px);
  }
  .hash { color: var(--accent); font-weight: 900; }
  .tag.accent {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--on-accent); border-color: transparent; font-weight: 700;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .desc {
    font-size: 12.5px; line-height: 1.75; color: var(--sub);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer; transition: color .25s;
    white-space: pre-line;
  }
  .desc.open { display: block; }
  .desc:hover { color: var(--text-dim); }

  .ep-section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 800;
    margin: 20px 0 12px; letter-spacing: .3px;
  }
  .ep-section-title::before {
    content: ""; width: 4px; height: 17px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px var(--accent-glow); flex-shrink: 0;
  }
  .episodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 9px; }
  @media (max-width: 640px) { .episodes { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; } }
  .ep {
    background: var(--panel-solid);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 5px;
    font-size: 12px; font-weight: 600;
    color: var(--sub); text-align: center;
    cursor: pointer; transition: all .25s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    user-select: none;
  }
  .ep:hover { color: var(--text); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 16px var(--accent-glow); }
  .ep.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--on-accent); border-color: transparent; font-weight: 800;
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  .empty { text-align: center; padding: 80px 20px; color: var(--sub); font-size: 14px; font-weight: 500; }
  .empty .ico { font-size: 50px; margin-bottom: 16px; opacity: .45; }
  .empty .eact {
    display: inline-block; margin-top: 16px;
    padding: 9px 22px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--on-accent); font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 22px var(--accent-glow);
    transition: transform .25s;
  }
  .empty .eact:hover { transform: translateY(-2px); }

  .player-error {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.82);
    color: #fff; gap: 16px;
    font-size: 14px; font-weight: 500;
    padding: 24px; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 5;
  }
  .player-error button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: var(--on-accent);
    padding: 11px 26px; border-radius: 11px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 26px var(--accent-glow);
    transition: all .3s;
  }
  .player-error button:hover { transform: translateY(-2px) scale(1.04); }

  .topbar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    background-size: 200% 100%;
    width: 0; z-index: 999;
    transition: width .3s cubic-bezier(.34,1.4,.64,1);
    box-shadow: 0 0 14px var(--accent-glow);
    border-radius: 0 3px 3px 0;
    animation: topbar-shine 2s linear infinite;
  }
  @keyframes topbar-shine { 0%{background-position:0% 0} 100%{background-position:200% 0} }

  /* ============ 手机底部导航 ============ */
  .bottom-nav {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0; z-index: 150;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .bnav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    padding: 5px 2px;
    color: var(--sub); font-size: 10.5px; font-weight: 600;
    cursor: pointer; user-select: none;
    border-radius: 12px;
    transition: color .25s, background .25s;
    position: relative;
  }
  .bnav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .bnav-item.on { color: var(--accent); }
  .bnav-item.on svg { transform: translateY(-1.5px) scale(1.12); }
  .bnav-item:active svg { transform: scale(.85); }
  .bnav-item .bdot {
    position: absolute; top: 2px; right: 50%; margin-right: -24px;
    min-width: 16px; height: 15px; padding: 0 4px;
    border-radius: 8px;
    background: var(--accent); color: var(--on-accent);
    font-size: 9.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  @media (max-width: 768px) { .bottom-nav { display: flex; } }

  /* toast */
  .toast {
    position: fixed;
    left: 50%; bottom: calc(90px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-solid);
    color: var(--text);
    border: 1px solid var(--line-hi);
    box-shadow: var(--shadow-lg);
    padding: 10px 18px; border-radius: 13px;
    font-size: 13px; font-weight: 600;
    z-index: 400; opacity: 0; pointer-events: none;
    transition: all .35s cubic-bezier(.34,1.56,.64,1);
    max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>

<div class="topbar" id="topbar"></div>
<div class="toast" id="toast"></div>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="info"><div class="name">黄果短剧</div></div>
    <button class="close" id="drawerClose" title="关闭">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="drawer-label">快捷</div>
    <div id="drawerQuick"></div>
    <div id="drawerGroups"></div>
  </div>
</aside>

<div class="search-mask" id="searchMask"></div>
<div class="search-pop" id="searchPop">
  <div class="sp-row">
    <div class="search">
      <input id="wd" type="search" placeholder="搜索短剧…" autocomplete="off"

<script>
/* ============================================================
   数据层：直连黄果短剧（页面与接口均已开启 CORS，无需代理）
   - 分类：精选推荐 / 最近上新 走 SSR HTML 解析；AI 四分类走 JSON API
   - 封面：pic.drleao.cn 的图是 AES-CBC 加密（octet-stream），取回后浏览器解密
   - 播放：/video/{vid}/ep-{n}/ 内嵌 videoInitialData，实时取签名 m3u8（auth_key 有效期短，不可缓存）
   ============================================================ */
const HOSTS = [
  "https://huangguoai.com",
  "https://a1b2.ediayikma.cc",
  "https://c3d4.ediayikma.cc"
];

/* 公共中转（见下 PUBLIC_PROXIES）的两个用途：
   1) 视频清单被 CDN 换成宣传片时，替我们取真清单；
   2) 黄果官网（huangguoai.com）被墙、直连不通时，替我们取页面/接口数据（fetchText 兜底）；
   分片(.ts)与密钥不受限且是国内 CDN，始终直连、不走中转；
   本机打开（bat）时清单优先走 _local_server.cjs 的同源 /hg-media。 */
const HG_MANIFEST_PROXIES = [
  // "https://你的中转/m?u=",   // 可选：自建中转（如按 _cf_proxy_worker.js 部署的 Worker）
];

/* 内置公共中转：build 生成请求地址，pick 从响应正文提取清单文本（两家实测均可返回真清单） */
const PUBLIC_PROXIES = [
  { name: "allorigins",
    build: (u) => "https://allorigins.hexlet.app/raw?url=" + encodeURIComponent(u),
    pick: (t) => t },
  { name: "jina",
    build: (u) => "https://r.jina.ai/" + encodeURIComponent(u),
    pick: (t) => { const i = t.indexOf("#EXTM3U"); return i >= 0 ? t.slice(i) : t; } },
];

/* 本机/局域网主机判断（这些来源由 _local_server.cjs 提供同源中转） */
function isLocalHostName(h) {
  if (!h) return false;
  return h === "localhost" || /^127\./.test(h) || h === "[::1]" ||
         /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
}

/* 封面 AES-CBC 解密密钥 */
const MEDIA_KEY = new TextEncoder().encode("f5d965df75336270");
const MEDIA_IV  = new TextEncoder().encode("97b60394abc2fbe1");

/* 已知加密封面主机 */
const ENC_HOSTS = [/pic\.drleao\.cn/];

/* 分类：mode html → /{id}/{page}/，mode api → /api/videos/category/{id} */
const CATS = [
  { id: "recommend",   name: "精选推荐", mode: "html" },
  { id: "newest",      name: "最近上新", mode: "html" },
  { id: "ai-duanju",   name: "AI成人短剧", mode: "api" },
  { id: "ai-manju",    name: "AI成人漫剧", mode: "api" },
  { id: "ai-huanlian", name: "AI换脸", mode: "api" },
  { id: "ai-mogai",    name: "AI魔改", mode: "api" },
];
const PAGE_SIZE = 24;

/* ---------- 底层请求：三域名容灾 + 粘住可用域名 + 并发限制 ----------
   源站回源不稳定（502 时有发生），首次请求三域名竞速并记住赢家，
   后续直接走赢家域名，失败再整体竞速 + 重试两次。 */
let goodHost = null;
let goodApiRelay = null;   /* 官网被墙时命中的公共中转（优先复用） */
let apiMode = null;        /* 最近命中的通道："direct"（直连）/ "relay"（公共中转） */
let apiModeUntil = 0;      /* 通道有效期：5 分钟内沿用，过期待下次竞速重新判定 */
let fetchActive = 0;
const fetchQueue = [];
const FETCH_CONCURRENCY = 3;

function fetchLimit(task) {
  return new Promise((resolve, reject) => {
    fetchQueue.push({ task, resolve, reject });
    pumpFetch();
  });
}
function pumpFetch() {
  while (fetchActive < FETCH_CONCURRENCY && fetchQueue.length) {
    const { task, resolve, reject } = fetchQueue.shift();
    fetchActive++;
    task().then(resolve, reject).finally(() => { fetchActive--; pumpFetch(); });
  }
}

/* 中转请求走独立并发池：直连被墙时会挂住占满主池，不能挡住中转的路 */
let relayActive = 0;
const relayQueue = [];
const RELAY_CONCURRENCY = 3;
function relayLimit(task) {
  return new Promise((resolve, reject) => {
    relayQueue.push({ task, resolve, reject });
    pumpRelay();
  });
}
function pumpRelay() {
  while (relayActive < RELAY_CONCURRENCY && relayQueue.length) {
    const { task, resolve, reject } = relayQueue.shift();
    relayActive++;
    task().then(resolve, reject).finally(() => { relayActive--; pumpRelay(); });
  }
}

async function fetchOnce(url, timeoutMs, extSignal) {
  if (extSignal && extSignal.aborted) throw new Error("aborted");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 12000);
  if (extSignal) extSignal.addEventListener("abort", () => ctrl.abort(), { once: true });
  try {
    const r = await fetch(url, { signal: ctrl.signal, referrerPolicy: "no-referrer", cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    if (!text || text.length < 50) throw new Error("empty body");
    return text;
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- 取数据：直连 / 公共中转 双通道，自动竞速切换 ----------
   直连（官网三域名）快就用直连；官网被墙时直连会挂，自动切公共中转。
   命中的通道沿用 5 分钟：期间不再在失败的一侧浪费时间（挂梯/不挂梯都不空等）。 */

/* 直连：并发竞速三个官网域名，谁先成功用谁；quick=true 时先只试粘住的域名 */
async function fetchDirect(path, signal, quick) {
  if (quick && goodHost) {
    try {
      const t = await fetchLimit(() => fetchOnce(goodHost + path, 12000, signal));
      if (t) return t;
    } catch (e) {}
  }
  try {
    return await Promise.any(HOSTS.map(h => fetchLimit(async () => {
      const t = await fetchOnce(h + path, 12000, signal);
      goodHost = h;
      return t;
    })));
  } catch (e) { return null; }
}

/* 直连 + 中转竞速：直连先行，1.2 秒内没成功才启动中转；先成功者胜，另一方立即中止 */
async function fetchRace(path) {
  const ctrl = new AbortController();
  let settled = false, text = null, kind = null, resolveWin = null, resolveAll = null, remaining = 2;
  const won = new Promise(r => { resolveWin = r; });
  const all = new Promise(r => { resolveAll = r; });
  const win = (k) => (t) => {
    if (settled || t === null) return t;
    settled = true; text = t; kind = k;
    ctrl.abort();
    resolveWin();
    return t;
  };
  const failed = () => { if (!settled && --remaining === 0) resolveAll(); };
  fetchDirect(path, ctrl.signal).then(win("direct")).then(failed, failed);
  (async () => {
    await new Promise(s => setTimeout(s, 1200));
    if (settled) return null;
    return fetchViaRelay(path, ctrl.signal).then(win("relay"));
  })().then(failed, failed);
  await Promise.race([won, all]);
  if (text !== null) { apiMode = kind; apiModeUntil = Date.now() + 5 * 60 * 1000; }
  return text;
}

async function fetchText(path, attempt) {
  attempt = attempt || 0;
  /* 已确认的通道：5 分钟内直接沿用（挂梯=直连，不挂梯=中转），不再每笔都竞速 */
  if (apiMode && Date.now() < apiModeUntil) {
    const t = apiMode === "relay" ? await fetchViaRelay(path) : await fetchDirect(path, null, true);
    if (t !== null) return t;
    apiMode = null;
  }
  const t = await fetchRace(path);
  if (t !== null) return t;
  if (attempt < 2) {
    await new Promise(s => setTimeout(s, 600 * (attempt + 1)));
    return fetchText(path, attempt + 1);
  }
  console.log("[fetchText] all failed:", path);
  return null;
}

/* 经公共中转取数据（优先复用上次命中的中转组合） */
async function fetchViaRelay(path, signal) {
  const relays = PUBLIC_PROXIES.concat(HG_MANIFEST_PROXIES.map(p => ({ name: "自定义中转", build: (u) => p + encodeURIComponent(u), pick: (t) => t })));
  const hosts = goodHost ? [goodHost].concat(HOSTS.filter(x => x !== goodHost)) : HOSTS.slice();
  if (goodApiRelay) {
    const t = await relayRace(goodApiRelay, hosts.slice(0, 1), path, signal);
    if (t !== null) return t;
    goodApiRelay = null; /* 失效则重新挑 */
  }
  for (const r of relays) {
    if (signal && signal.aborted) return null;
    const t = await relayRace(r, hosts, path, signal);
    if (t !== null) { goodApiRelay = r; return t; }
  }
  return null;
}

/* 用指定中转取数据：先试第一个域名（最常见情况一次就中），失败再并发竞速其余 */
async function relayRace(relay, hosts, path, signal) {
  const tryHost = (h) => relayLimit(async () => {
    const x = await fetchOnce(relay.build(h + path), 15000, signal);
    const o = relay.pick(x);
    if (!o || o.length < 50) throw new Error("empty");
    return o;
  });
  try {
    return await tryHost(hosts[0]);
  } catch (e) {}
  if (hosts.length < 2) return null;
  try {
    return await Promise.any(hosts.slice(1).map(tryHost));
  } catch (e) { return null; }
}

async function apiGetJSON(path) {
  const text = await fetchText(path);
  if (text === null) return null;
  try { return JSON.parse(text); } catch (e) { return null; }
}

/* 关键词清洗：与官网 cyber-shell.js 的 sanitizeKeyword 对齐。
   "/" 落进 /search/video/{kw}/ 会被撕成多段，接口直接判 404，所以换成空格。 */
function sanitizeKeyword(q) {
  const s = String(q || "");
  if (s.indexOf("/") < 0) return s.trim();
  return s.replace(/\//g, " ").split(/\s+/).filter(Boolean).join(" ");
}

function fmtPlays(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "亿";
  if (n >= 10000) return Math.round(n / 10000) + "W";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}

async function aesCbcDecrypt(cipherBytes, keyBytes, ivBytes) {
  try {
    const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
    const dec = await crypto.subtle.decrypt({ name: "AES-CBC", iv: ivBytes }, key, cipherBytes);
    return new Uint8Array(dec);
  } catch (e) { return null; }
}

/* ---------- 字段映射 ---------- */
function toVod(it) {
  if (!it) return null;
  const vid = String(it.id === undefined || it.id === null ? "" : it.id).trim();
  const title = String(it.title || "").trim();
  if (!vid || !title) return null;
  const epTotal = parseInt(it.total_episodes || it.episode_count || it.episodeCount || 0) || 0;
  const finished = it.is_finished === true || it.is_finished === 1;
  return {
    vod_id: vid,
    vod_name: title,
    vod_pic: String(it.cover || it.pic || "").trim(),
    vod_remarks: finished ? (epTotal ? `全${epTotal}集` : "已完结") : (epTotal ? `更新至${epTotal}集` : ""),
    vod_plays: it.hot ? fmtPlays(it.hot) : "",
    vod_badge: "",
    vod_tags: Array.isArray(it.tags) ? it.tags.slice(0, 3).map(t => String(t).trim()).filter(Boolean) : [],
    vod_intro: String(it.description || "").trim()
  };
}

/* 卡片文本清洗：先去掉 sr-only 辅助文本，再去标签 */
function stripCardText(s) {
  return String(s || "")
    .replace(/<span class="sr-only">[\s\S]*?<\/span>/g, "")
    .replace(/<[^>]+>/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* 首页/搜索/标签等页面顶部都带一份隐藏的“猜你喜欢”下拉推荐（固定 4 张卡片），
   真列表统一放在 hg-card-grid 容器里：从这里开始解析，避免推荐卡混进列表 */
function htmlFromResults(html) {
  const i = html.indexOf("hg-card-grid");
  return i >= 0 ? html.slice(i) : html;
}

/* SSR 列表页卡片解析（精选推荐 / 最近上新 / 搜索 / 标签共用）
   注意：站内卡片详情链接是 /video/{id}/（旧版曾用 /detail/{id}/，两者都兼容） */
function parseListHtml(html) {
  if (!html) return [];
  const out = [];
  const seen = new Set();
  const blocks = html.split('<div class="hg-drama-card"');
  for (let i = 1; i < blocks.length; i++) {
    const block = blocks[i];
    const vidMatch = block.match(/href="\/(?:video|detail)\/(\d+)\/"/);
    if (!vidMatch) continue;
    const vid = vidMatch[1];
    if (seen.has(vid)) continue;
    seen.add(vid);
    /* 封面：data-src 是真图，src 是站内占位图，兜底时只认 http(s) 绝对地址 */
    const picMatch = block.match(/data-src="([^"]+)"/) || block.match(/src="(https?:\/\/[^"]+)"/);
    /* 标题：标题区 <a> 内的文本（剔除 sr-only），兜底 alt */
    let title = "";
    const titleMatch = block.match(/class="[^"]*hg-drama-card__title[^"]*"[^>]*>\s*<a[^>]*>([\s\S]*?)<\/a>/);
    if (titleMatch) title = stripCardText(titleMatch[1]);
    if (!title) {
      const altMatch = block.match(/alt="([^"]+)"/);
      title = altMatch ? stripCardText(altMatch[1]) : "";
    }
    if (!title) continue;
    /* 集数备注：优先 data-ep-base（保留“全X集/更新至X集”原文） */
    const epBase = block.match(/data-ep-base="([^"]+)"/);
    const epMatch = block.match(/(?:全|更新至)\d+集/);
    const remark = epBase ? stripCardText(epBase[1]) : (epMatch ? epMatch[0] : "");
    /* 角标 */
    const badge = /hg-drama-card__badge--new/.test(block) ? "new"
      : (/hg-drama-card__badge--hot/.test(block) ? "hot" : "");
    /* 标签（卡片上带 /tag/{slug}/ 链接，点击后可直达标签页） */
    const tags = [];
    const tagSlugs = {};
    const tagRe = /<a class="hg-tag"[^>]*href="\/tag\/([^\/"]+)\/"[^>]*>([\s\S]*?)<\/a>/g;
    let tm;
    while ((tm = tagRe.exec(block)) !== null) {
      const name = stripCardText(tm[2]);
      if (name && !tagSlugs[name]) { tags.push(name); tagSlugs[name] = tm[1]; }
    }
    /* 简介（首页 Hero 用得到） */
    const descMatch = block.match(/hg-drama-card__desc">([\s\S]*?)<\/p>/);
    out.push({
      vod_id: vid,
      vod_name: title,
      vod_pic: picMatch ? picMatch[1] : "",
      vod_remarks: remark,
      vod_plays: "",
      vod_badge: badge,
      vod_tags: tags.slice(0, 3),
      vod_tag_slugs: tagSlugs,
      vod_intro: descMatch ? stripCardText(descMatch[1]) : ""
    });
  }
  return out;
}

/* ============================================================
   封面加载：pic.drleao.cn 为 AES 加密图，取回后解密 + 缩放 + 转 blobURL
   ============================================================ */
function isEncHost(u) { return ENC_HOSTS.some(re => re.test(u)); }

function imgMagic(b) {
  if (!b || b.length < 4) return null;
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return "image/jpeg";
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return "image/png";
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return "image/gif";
  if (b.length >= 12 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return "image/webp";
  return null;
}

/* img 标签：加密封面输出占位 + data-src，由 hydrateImages 接管 */
function imgAttrs(pic, w, lazy) {
  if (!pic) return ' src=""';
  if (isEncHost(pic)) {
    return ` class="pending" data-enc="1" data-src="${esc(pic)}" data-w="${w || 300}" alt=""`;
  }
  const attrs = lazy ? ' loading="lazy" decoding="async"' : ' decoding="async"';
  return ` src="${esc(pic)}"${attrs}`;
}

const imgBlobCache = new Map();
const imgQueue = [];
let imgActive = 0;
const IMG_CONCURRENCY = 4;
const IMG_CACHE_MAX = 260;

/* 缓存解码后的 blob URL；超上限时回收最早的，且在页面上仍在用的不回收 */
function cacheBlob(key, objUrl) {
  imgBlobCache.set(key, objUrl);
  if (imgBlobCache.size <= IMG_CACHE_MAX) return;
  const inUse = new Set();
  for (const im of document.images) inUse.add(im.src);
  for (const [k, u] of imgBlobCache) {
    if (imgBlobCache.size <= IMG_CACHE_MAX) break;
    if (k === key || inUse.has(u)) continue;
    imgBlobCache.delete(k);
    try { URL.revokeObjectURL(u); } catch (e) {}
  }
}

async function fetchDecodedBlob(url, wantW) {
  const r = await fetch(url, { cache: "force-cache", referrerPolicy: "no-referrer" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  let buf = new Uint8Array(await r.arrayBuffer());
  let mime = imgMagic(buf);
  if (!mime) {
    const dec = await aesCbcDecrypt(buf, MEDIA_KEY, MEDIA_IV);
    if (dec) {
      const m2 = imgMagic(dec);
      if (m2) { buf = dec; mime = m2; }
    }
  }
  if (!mime) throw new Error("not an image");
  /* 缩放，避免大图解码占用内存 */
  if (wantW && self.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(new Blob([buf], { type: mime }), { resizeWidth: wantW, resizeQuality: "medium" });
      let cnv;
      if (typeof OffscreenCanvas !== "undefined") cnv = new OffscreenCanvas(bmp.width, bmp.height);
      else { cnv = document.createElement("canvas"); cnv.width = bmp.width; cnv.height = bmp.height; }
      const ctx = cnv.getContext("2d");
      ctx.drawImage(bmp, 0, 0);
      if (bmp.close) bmp.close();
      let out = null;
      if (cnv.convertToBlob) out = await cnv.convertToBlob({ type: "image/webp", quality: 0.8 });
      else out = await new Promise(res => cnv.toBlob(res, "image/webp", 0.8));
      if (out && out.size) return out;
    } catch (e) {}
  }
  return new Blob([buf], { type: mime });
}

async function loadEncImg(img) {
  const url = img.dataset.src;
  if (!url) return;
  const key = url + "@" + (img.dataset.w || 300);
  if (imgBlobCache.has(key)) {
    img.src = imgBlobCache.get(key);
    img.classList.remove("pending");
    return;
  }
  try {
    const blob = await fetchDecodedBlob(url, parseInt(img.dataset.w) || 300);
    const objUrl = URL.createObjectURL(blob);
    cacheBlob(key, objUrl);
    img.src = objUrl;
    img.classList.remove("pending");
  } catch (e) {
    /* 加密封面无法直接当图片用，失败就保留骨架底色，不显示破图 */
    console.log("[cover]", e.message);
  }
}

function pumpImgQueue() {
  while (imgActive < IMG_CONCURRENCY && imgQueue.length) {
    const img = imgQueue.shift();
    imgActive++;
    loadEncImg(img).finally(() => { imgActive--; pumpImgQueue(); });
  }
}

const imgLazyObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          imgLazyObserver.unobserve(en.target);
          imgQueue.push(en.target);
          pumpImgQueue();
        }
      });
    }, { rootMargin: "400px" })
  : null;

function hydrateImages(root) {
  const nodes = (root || document).querySelectorAll('img[data-enc]:not([data-queued])');
  nodes.forEach(img => {
    img.dataset.queued = "1";
    if (imgLazyObserver) imgLazyObserver.observe(img);
    else { imgQueue.push(img); pumpImgQueue(); }
  });
}

/* ---------- 首页：精选推荐 / 最近上新（HTML） + AI 四分类（API） ---------- */
async function dataHome() {
  const [recHtml, nwHtml, ...apiMods] = await Promise.all([
    fetchText(`/${CATS[0].id}/`).then(t => t ? parseListHtml(htmlFromResults(t)) : null),
    fetchText(`/${CATS[1].id}/`).then(t => t ? parseListHtml(htmlFromResults(t)) : null),
    ...CATS.filter(c => c.mode === "api").map(c =>
      apiGetJSON(`/api/videos/category/${c.id}?sort=hot&page=1&size=12`).then(d => {
        const inner = (d && d.data && typeof d.data === "object") ? d.data : {};
        const items = Array.isArray(inner.items) ? inner.items : [];
        return { cat: c, list: items.map(toVod).filter(Boolean), total: (inner.pagination && Number(inner.pagination.total)) || 0 };
      })
    )
  ]);
  if (!recHtml && !nwHtml && apiMods.every(m => !m.list.length)) return { error: true, hero: [], modules: [] };
  const hero = (recHtml || []).slice(0, 6);
  const modules = [];
  if (recHtml && recHtml.length) modules.push({ code: CATS[0].id, title: CATS[0].name, total: 0, list: recHtml.slice(0, 12) });
  if (nwHtml && nwHtml.length) modules.push({ code: CATS[1].id, title: CATS[1].name, total: 0, list: nwHtml.slice(0, 12) });
  for (const m of apiMods) if (m.list.length) modules.push({ code: m.cat.id, title: m.cat.name, total: m.total, list: m.list });
  return { hero, modules };
}

async function dataCategory(catId, pg) {
  const cat = CATS.find(c => c.id === catId) || CATS[0];
  if (cat.mode === "api") {
    const d = await apiGetJSON(`/api/videos/category/${cat.id}?sort=hot&page=${pg}&size=${PAGE_SIZE}`);
    if (!d) return { error: true, list: [], total: 0, page: pg, pagecount: 1 };
    const inner = (d.data && typeof d.data === "object") ? d.data : {};
    const items = Array.isArray(inner.items) ? inner.items : [];
    const pgInfo = inner.pagination || {};
    const total = Number(pgInfo.total) || 0;
    const pages = Number(pgInfo.pages) || (total ? Math.ceil(total / PAGE_SIZE) : (items.length >= PAGE_SIZE ? pg + 1 : pg));
    return { list: items.map(toVod).filter(Boolean), total, page: pg, pagecount: Math.max(1, pages) };
  }
  const path = pg > 1 ? `/${cat.id}/${pg}/` : `/${cat.id}/`;
  const html = await fetchText(path);
  if (html === null) return { error: true, list: [], total: 0, page: pg, pagecount: 1 };
  const list = parseListHtml(htmlFromResults(html));
  /* HTML 分页没有总数：本页还有内容就允许翻下一页 */
  return { list, total: 0, page: pg, pagecount: list.length >= 12 ? pg + 1 : pg };
}

/* ---------- 详情 ---------- */
async function dataDetail(id) {
  if (!id) return { list: [] };
  const d = await apiGetJSON(`/api/videos/${id}`);
  const info = (d && d.data && typeof d.data === "object") ? d.data : null;
  if (!info || !info.title) return { error: true, list: [] };

  const playUrls = [];
  const eps = Array.isArray(info.episodes) ? info.episodes : [];
  eps.forEach((ep) => {
    if (ep.status !== undefined && ep.status !== 1) return;
    const n = String(ep.ep_num !== undefined ? ep.ep_num : (playUrls.length + 1));
    playUrls.push(`第${n}集$${id}:${n}`);
  });
  if (!playUrls.length) {
    const total = Math.max(1, parseInt(info.episode_count || info.total_episodes || 1) || 1);
    for (let i = 1; i <= total; i++) playUrls.push(`第${i}集$${id}:${i}`);
  }

  /* 标签中文名 → URL slug（详情页标签可点进标签列表页） */
  const tagLinks = {};
  if (Array.isArray(info.tag_links)) {
    for (const t of info.tag_links) {
      if (t && t.name && t.url) tagLinks[String(t.name)] = (String(t.url).match(/\/tag\/([^\/]+)\//) || [])[1] || "";
    }
  }

  const finished = info.is_finished === true || info.is_finished === 1;
  return {
    list: [{
      vod_id: String(info.id || id),
      vod_name: String(info.title).trim(),
      vod_pic: String(info.cover || "").trim(),
      vod_remarks: finished ? `全${playUrls.length}集` : `更新至${playUrls.length}集`,
      vod_content: String(info.description || "").trim(),
      vod_tags: Array.isArray(info.tags) ? info.tags.map(t => String(t).trim()).filter(Boolean).slice(0, 6) : [],
      vod_tag_links: tagLinks,
      vod_plays: (info.counts && info.counts.hot) ? fmtPlays(info.counts.hot) : "",
      vod_play_from: "黄果专线",
      vod_play_url: playUrls.join("#")
    }]
  };
}

/* ---------- 播放地址：视频页内嵌 JSON，实时解析（auth_key 短时效） ----------
   与 _worker.js 的解析口径对齐：
   - JSON 字段 videoSrc / videoUrl / playUrl / src 挨个取
   - 未命中时再查 epPlaySrcs[当前集数]（只兜底到“同集”，避免串集）
   - 页面正则 data-play-src / 裸 m3u8 兜底；ep 页取不到时回退视频主页面 */
function cleanPlayUrl(u) {
  let s = String(u || "").replace(/\\u0026/g, "&").replace(/&amp;/g, "&").trim();
  if (s.indexOf("//") === 0) s = "https:" + s;
  return s;
}

function extractPlayUrl(html, epNum) {
  if (!html) return "";
  const m = html.match(/<script id="videoInitialData" type="application\/json">([\s\S]*?)<\/script>/);
  if (m) {
    try {
      const data = JSON.parse(m[1]);
      let url = cleanPlayUrl(data.videoSrc || data.videoUrl || data.playUrl || data.src || "");
      if (!url && data.epPlaySrcs && typeof data.epPlaySrcs === "object") {
        const byEp = data.epPlaySrcs[String(epNum)];
        const vals = Object.values(data.epPlaySrcs);
        url = cleanPlayUrl(byEp || vals[0] || "");
      }
      if (url) return url;
    } catch (e) {}
  }
  const m2 = html.match(/data-play-src="(https?:\/\/[^"]+\.m3u8[^"]*)"/) ||
             html.match(/"(https?:\/\/[^"]+\.m3u8[^"]*)"/);
  return m2 ? cleanPlayUrl(m2[1]) : "";
}

async function dataPlay(id) {
  if (!id) return { parse: 1, url: "" };
  const parts = id.split(":");
  const vid = parts[0] || "";
  const epNum = parts[1] || "1";

  let url = extractPlayUrl(await fetchText(`/video/${vid}/ep-${epNum}/`), epNum);
  if (!url) url = extractPlayUrl(await fetchText(`/video/${vid}/`), epNum);
  if (url) return { parse: 0, url };

  /* 兜底：详情接口的直链（仅第一集） */
  if (String(epNum) === "1") {
    const d = await apiGetJSON(`/api/videos/${vid}`);
    const info = (d && d.data && typeof d.data === "object") ? d.data : null;
    const fb = info && (info.video_url || info.videoSrc) ? cleanPlayUrl(info.video_url || info.videoSrc) : "";
    if (fb) return { parse: 0, url: fb };
  }
  return { parse: 1, url: "" };
}

/* ---------- 播放清单获取与宣传片（诱饵）识别 ----------
   被黄果 CDN 拦截的来源（file://、GitHub Pages 等）拿到的是同一支 53 秒宣传片：
   分片目录固定为 853acaba…，与请求 URL 里的 32 位媒体 ID 不一致。
   获取通道按优先级依次尝试（本机同源中转 → 配置的在线中转 → 直连），
   验证结果："ok"=真实清单 / "decoy"=宣传片 / "unknown"=全部通道失败。 */
const DECOY_MEDIA_ID = "853acaba4721cceab535b64e6831f05a";

function isDecoyManifest(srcUrl, text) {
  if (!text || text.indexOf("#EXTM3U") < 0) return false;
  if (text.indexOf(DECOY_MEDIA_ID) >= 0) return true;
  const reqId = (String(srcUrl).match(/\/([0-9a-f]{32})\//i) || [])[1] || "";
  if (reqId) {
    const seg = (text.match(/^[^#\s][^\r\n]*/m) || [])[0] || "";
    const segId = (seg.match(/\/([0-9a-f]{32})\//i) || [])[1] || "";
    if (segId && segId.toLowerCase() !== reqId.toLowerCase()) return true;
  }
  const infs = text.match(/#EXTINF:([\d.]+)/g) || [];
  if (infs.length > 0 && infs.length <= 9) {
    const total = infs.reduce((a, s) => a + parseFloat(s.slice(8)), 0);
    if (total >= 45 && total <= 60) return true;
  }
  return false;
}

/* 清单通道（按优先级）：直连 / 本机服务 / 自定义中转 / 公共中转
   通道 build(u) 生成请求地址，pick(t) 从响应正文提取清单文本。 */
let goodManifestChannel = null; /* 上次成功的通道 */
let manifestCache = null;        /* 已取到的真清单 {src, text, name}：播放直接用，避免重复走中转 */
function manifestChannels() {
  const h = location.hostname;
  const httpPage = /^https?:$/.test(location.protocol);
  const loopback = h === "127.0.0.1" || h === "localhost" || h === "[::1]";
  const priv = httpPage && isLocalHostName(h);
  const direct = { key: "direct", name: "直连", build: (u) => u, pick: (t) => t };
  const same = { key: "same", name: "本机服务", build: (u) => "/hg-media?u=" + encodeURIComponent(u), pick: (t) => t };
  const custom = HG_MANIFEST_PROXIES.map((p, i) => ({ key: "cfg" + i, name: "自定义中转", build: (u) => p + encodeURIComponent(u), pick: (t) => t }));
  const pub = PUBLIC_PROXIES.map((p) => ({ key: "pub-" + p.name, name: p.name, build: p.build, pick: p.pick }));
  let list;
  if (priv && loopback) list = [direct, same].concat(custom, pub);   /* 本机：直连优先（白名单），其余兜底 */
  else if (priv) list = [same].concat(pub, custom, [direct]);        /* 局域网 IP：同源中转优先 */
  else list = pub.concat(custom, [direct]);                          /* 在线/文件：公共中转优先，最后直连 */
  if (goodManifestChannel) {
    const g = goodManifestChannel;
    list = [g].concat(list.filter((c) => c.key !== g.key));
  }
  return list;
}
/* 兜底：把清单里的相对地址补成绝对地址（当前黄果 CDN 返回的本就是绝对地址） */
function absolutizeManifest(text, baseUrl) {
  if (!text) return text;
  const abs = (u) => { try { return new URL(u, baseUrl).href; } catch (e) { return u; } };
  return text.split(/\r?\n/).map((line) => {
    const s = line.trim();
    if (!s) return line;
    if (s.charAt(0) === "#") {
      if (/^#EXT-X-(KEY|MAP|MEDIA)/i.test(s)) return s.replace(/URI="([^"]*)"/g, (m, u) => 'URI="' + abs(u) + '"');
      return line;
    }
    return abs(s);
  }).join("\n");
}
function manifestUrlFor(src) {
  return goodManifestChannel ? goodManifestChannel.build(src) : src;
}

async function verifyManifest(srcUrl) {
  const bust = srcUrl + (srcUrl.includes("?") ? "&" : "?") + "_hgv=" + Date.now();
  let sawDecoy = false;
  manifestCache = null;
  for (const c of manifestChannels()) {
    try {
      const raw = await fetchOnce(c.build(bust), 20000);
      const t = c.pick(raw);
      if (!t || t.indexOf("#EXTM3U") < 0) continue;
      if (isDecoyManifest(srcUrl, t)) { sawDecoy = true; continue; }
      goodManifestChannel = c;
      manifestCache = { src: srcUrl, text: absolutizeManifest(t, srcUrl), name: c.name };
      return "ok";
    } catch (e) {}
  }
  return sawDecoy ? "decoy" : "unknown";
}

/* 拿不到正片时的提示语（按打开方式区分） */
function playBlockMessage(vs) {
  const h = location.hostname;
  const httpPage = /^https?:$/.test(location.protocol);
  const localLike = httpPage && isLocalHostName(h);
  if (vs === "decoy") {
    if (localLike) return "视频被黄果 CDN 替换成了宣传片（本机中转未生效）。请确认“启动黄果短剧.bat”的窗口还开着，然后点重试。";
    return "视频被黄果 CDN 拦截成了宣传片，公共中转暂时失效。请稍等片刻后点重试。";
  }
  if (localLike) return "取不到视频清单（网络异常或本地服务已关闭），请点重试。";
  if (location.protocol === "file:") return "取不到视频清单（网络异常或中转暂不可用）。请点重试，或改用“启动黄果短剧.bat”打开。";
  return "取不到视频清单：网络异常或中转暂不可用，请检查网络后点重试。";
}

/* ---------- 搜索（SSR：/search/video/{关键词}/{页}/） ---------- */
async function dataSearch(wd, pg) {
  if (!wd) return { list: [], page: 1, pagecount: 1, total: 0 };
  const kw = encodeURIComponent(wd);
  const path = pg > 1 ? `/search/video/${kw}/${pg}/` : `/search/video/${kw}/`;
  const html = await fetchText(path);
  if (html === null) return { error: true, list: [], page: pg, pagecount: 1, total: 0 };
  const list = parseListHtml(htmlFromResults(html));
  /* 页面标注了“共 x 部”总数，能拿到就精确分页 */
  const totM = html.match(/<strong>([\d,]+)<\/strong>\s*部/);
  const total = totM ? (parseInt(totM[1].replace(/,/g, ""), 10) || 0) : 0;
  const pagecount = total ? Math.max(1, Math.ceil(total / Math.max(1, list.length))) : (list.length >= 12 ? pg + 1 : pg);
  return { list, total, page: pg, pagecount };
}

/* ---------- 标签列表（SSR：/tag/{slug}/page/{n}/） ---------- */
async function dataTag(slug, pg) {
  if (!slug) return { list: [], page: 1, pagecount: 1, total: 0 };
  const path = pg > 1 ? `/tag/${slug}/page/${pg}/` : `/tag/${slug}/`;
  const html = await fetchText(path);
  if (html === null) return { error: true, list: [], page: pg, pagecount: 1, total: 0 };
  const list = parseListHtml(htmlFromResults(html));
  return { list, total: 0, page: pg, pagecount: list.length >= 12 ? pg + 1 : pg };
}

/* ============================================================
   收藏 / 历史（localStorage）
   ============================================================ */
const LS_FAV = "hguo_fav_v1";
const LS_HIST = "hguo_hist_v1";

function lsGet(k, fb) {
  try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function getFav() { return lsGet(LS_FAV, []); }
function isFav(id) { return getFav().some(x => x.id === String(id)); }
function toggleFav(rec) {
  let fav = getFav();
  const id = String(rec.id);
  if (fav.some(x => x.id === id)) {
    lsSet(LS_FAV, fav.filter(x => x.id !== id));
    return false;
  }
  fav.unshift({ id, name: rec.name, pic: rec.pic, remark: rec.remark || "", tags: rec.tags || [], ts: Date.now() });
  if (fav.length > 300) fav.length = 300;
  lsSet(LS_FAV, fav);
  return true;
}
function removeFav(id) { lsSet(LS_FAV, getFav().filter(x => x.id !== String(id))); }

function getHist() { return lsGet(LS_HIST, []); }
function upsertHist(rec) {
  let h = getHist().filter(x => x.id !== String(rec.id));
  h.unshift(Object.assign({ ts: Date.now() }, rec, { id: String(rec.id) }));
  if (h.length > 100) h.length = 100;
  lsSet(LS_HIST, h);
}
function saveProgress(id, ep, epTitle, pos, dur) {
  const h = getHist();
  const item = h.find(x => x.id === String(id));
  if (!item) return;
  item.ep = ep; item.epTitle = epTitle || item.epTitle;
  item.pos = Math.floor(pos || 0); item.dur = Math.floor(dur || 0);
  item.ts = Date.now();
  lsSet(LS_HIST, h);
}
function removeHist(id) { lsSet(LS_HIST, getHist().filter(x => x.id !== String(id))); }

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + "分钟前";
  if (s < 86400) return Math.floor(s / 3600) + "小时前";
  if (s < 2592000) return Math.floor(s / 86400) + "天前";
  return new Date(ts).toLocaleDateString("zh-CN");
}
function fmtTime(sec) {
  sec = Math.floor(sec || 0);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

/* ---- 卡片 ---- */
function cardHtml(v, i, opts) {
  opts = opts || {};
  const rank = opts.rank;
  const badgeHtml = rank
    ? `<span class="badge-rank r${Math.min(rank, 3)}">${rank <= 3 ? "TOP" : ""}${rank}</span>`
    : (v.vod_badge === "new" ? '<span class="badge-new">新</span>'
      : (v.vod_badge === "hot" ? '<span class="badge-hot">热</span>' : ""));
  const tags = (v.vod_tags || []).slice(0, 2).map(t => {
    const slug = (v.vod_tag_slugs || {})[t] || "";
    return `<span class="ctag" data-tag="${esc(t)}"${slug ? ` data-slug="${esc(slug)}"` : ""}>${esc(t)}</span>`;
  }).join("");
  const del = opts.del ? `<span class="card-del${opts.delAlways ? " always" : ""}" data-del="1" title="移除">✕</span>` : "";
  const extra = opts.hist
    ? `<div class="hist-prog"><i style="width:${Math.min(100, Math.round((v.pos || 0) / (v.dur || 1) * 100))}%"></i></div>
       <div class="card-sub">${esc(v.epTitle || ("第" + (v.ep || 1) + "集"))} · ${fmtTime(v.pos || 0)}${v.dur ? " / " + fmtTime(v.dur) : ""}</div>`
    : (opts.sub ? `<div class="card-sub">${esc(opts.sub)}</div>` : "");
  return `
    <div class="card" data-i="${i}">
      <div class="thumb">
        ${badgeHtml}
        ${del}
        <img${imgAttrs(v.vod_pic, opts.w || 300, true)} alt="" referrerpolicy="no-referrer">
        ${(v.vod_plays || v.vod_remarks) ? `<div class="thumb-plays">
          ${v.vod_plays ? `<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>${esc(v.vod_plays)}` : ""}
          ${v.vod_remarks ? `<span class="rem">${esc(v.vod_remarks)}</span>` : ""}
        </div>` : ""}
      </div>
      <div class="card-title">${esc(v.vod_name)}</div>
      <div class="card-tags">${tags}</div>
      ${extra}
    </div>
  `;
}

function bindCards(gridEl, list, onOpen, onDel) {
  if (!gridEl) return;
  gridEl.querySelectorAll(".card").forEach(node => {
    node.onclick = (e) => {
      const i = +node.dataset.i;
      const tagEl = e.target.closest(".ctag");
      if (tagEl) {
        e.stopPropagation();
        goTag(tagEl.dataset.tag, tagEl.dataset.slug || "");
        return;
      }
      if (e.target.closest(".card-del")) {
        e.stopPropagation();
        if (onDel) onDel(list[i], i);
        return;
      }
      if (onOpen) onOpen(list[i], i);
    };
  });
}

};

function activeQuick() {
  if (state.mode === "detail") return state.backTo === "home" ? "" : state.backTo;
  return ["home", "fav", "hist"].includes(state.mode) ? state.mode : "";
}

function renderNav() {
  const favCnt = getFav().length, histCnt = getHist().length;
  const quick = [
    { key: "home", name: "首页", fn: "goHome()" },
    { key: "fav",  name: "我的收藏", fn: "goFav()", cnt: favCnt },
    { key: "hist", name: "观看历史", fn: "goHist()", cnt: histCnt },
  ];
  const act = activeQuick();
  const cntTxt = c => (c > 99 ? "99+" : c);

  document.getElementById("drawerQuick").innerHTML = quick.map(q => `
    <div class="nav-item ${act === q.key ? "active" : ""}" onclick="${q.fn}">
      <span style="display:flex;width:17px;height:17px;flex-shrink:0">${ICONS[q.key]}</span>
      <span>${q.name}</span>${q.cnt ? `<span class="cnt">${cntTxt(q.cnt)}</span>` : ""}
    </div>
  `).join("");

  document.getElementById("drawerGroups").innerHTML =
    `<div class="drawer-label">分类</div>` +
    CATS.map(c => {
      const on = state.mode === "category" && state.catId === c.id;
      return `<div class="nav-item ${on ? "active" : ""}" onclick="switchCategory('${c.id}','${esc(c.name)}')"><span>${esc(c.name)}</span></div>`;
    }).join("");

  document.getElementById("navrow").innerHTML = quick.map(q => `
    <span class="nlink ${act === q.key ? "active" : ""}" onclick="${q.fn}">${q.name}${q.cnt ? `（${cntTxt(q.cnt)}）` : ""}</span>
  `).join("");

  document.getElementById("bottomNav").innerHTML = quick.map(q => `
    <div class="bnav-item ${act === q.key ? "on" : ""}" onclick="${q.fn}">
      ${ICONS[q.key]}
      <span>${q.key === "fav" ? "收藏" : q.key === "hist" ? "历史" : q.name}</span>
      ${q.cnt ? `<span class="bdot">${cntTxt(q.cnt)}</span>` : ""}
    </div>
  `).join("");
}

function openDrawer() {
  document.getElementById("drawer").classList.add("show");
  document.getElementById("drawerMask").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("drawerMask").classList.remove("show");
  document.body.style.overflow = "";
}

/* ---- 视图 ---- */
function resetView() {
  saveCurrentProgress();
  destroyPlayer();
  closeSearch();
  closeDrawer();
  state.detail = null;
  state.episodes = [];
  state.resume = null;
}

function goHome() {
  resetView();
  state.mode = "home";
  state.backTo = "home";
  state.savedScrollY = 0;
  document.getElementById("wd").value = "";
  closeDrawer();
  renderNav();
  const hasCache = (state.modules || []).length > 0;
  if (hasCache) renderHome(); else renderSkeletonHome();
  window.scrollTo(0, 0);
  if (!hasCache) progress(true);
  api("/home").then(homeData => {
    if (homeData.error) {
      if (!hasCache) renderEmpty("加载失败，请稍后重试", "重试", "goHome()");
      return;
    }
    /* 保持源站推荐位顺序（Hero 上的「精选 TOPn」与推荐位一致） */
    state.heroList = (homeData.hero || []).slice(0, 6);
    state.modules = homeData.modules || [];
    if (!hasCache) renderHome();
  }).catch(() => {
    if (!hasCache) renderEmpty("加载失败，请稍后重试", "重试", "goHome()");
  }).finally(() => progress(false));
}

function goFav()   { resetView(); state.mode = "fav"; closeDrawer(); renderNav(); renderFav(); window.scrollTo(0, 0); }
function goHist()  { resetView(); state.mode = "hist"; closeDrawer(); renderNav(); renderHist(); window.scrollTo(0, 0); }

function switchCategory(catId, title) {
  resetView();
  state.mode = "category";
  state.backTo = "category";
  state.catId = catId || "recommend";
  state.catTitle = title || "分类";
  state.pg = 1;
  state.list = [];
  state.savedScrollY = 0;
  closeDrawer();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  loadListPage("category");
}

/* 点标签 → 标签列表页；无 slug 时退化为搜索该标签词 */
function goTag(tag, slug) {
  if (!tag) return;
  if (!slug) { doSearch(String(tag)); return; }
  resetView();
  state.mode = "tag";
  state.backTo = "tag";
  state.tagName = String(slug);
  state.tagDisplay = String(tag);
  state.pg = 1;
  state.list = [];
  state.total = 0;
  state.savedScrollY = 0;
  closeDrawer();
  closeSearch();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  loadListPage("tag");
}

async function loadListPage(apiPath) {
  if (state.loading) return;
  state.loading = true;
  progress(true);
  const wantPg = state.pg;
  try {
    const data = await api("/" + apiPath, { pg: wantPg });
    const got = data.list || [];
    if (data.error || (!got.length && wantPg > 1)) {
      if (wantPg > 1) state.pg = 1;
      state.list = [];
      state.total = 0;
      renderEmpty("加载失败，请重试", "重试", "loadListPageRetry()");
    } else {
      state.list = got;
      state.total = data.total || 0;
      state.pagecount = data.pagecount || 1;
      renderListPage(apiPath);
    }
  } catch (e) {
    renderEmpty("加载失败，请重试", "重试", "loadListPageRetry()");
  }
  state.loading = false;
  progress(false);
}
function loadListPageRetry() {
  renderListSkeleton();
  const m = state.mode;
  loadListPage(["search", "tag", "category"].includes(m) ? m : "category");
}

/* ---- 搜索弹层 ---- */
const LS_SEARCH = "hguo_search_v1";

function getRecentKeywords() {
  const v = lsGet(LS_SEARCH, []);
  return Array.isArray(v) ? v.slice(0, 10) : [];
}
function pushRecentKeyword(wd) {
  const list = getRecentKeywords().filter(k => k !== wd);
  list.unshift(wd);
  lsSet(LS_SEARCH, list.slice(0, 10));
}
function renderSearchHist() {
  const box = document.getElementById("spHist");
  const list = getRecentKeywords();
  if (!list.length) { box.classList.remove("show"); box.innerHTML = ""; return; }
  box.classList.add("show");
  box.innerHTML = `<span class="sp-label">最近搜索</span>` +
    list.map(k => `<span class="sp-chip" data-kw="${esc(k)}">${esc(k)}<i class="sp-x" data-del="${esc(k)}" title="删除">✕</i></span>`).join("");
  box.querySelectorAll(".sp-chip").forEach(chip => {
    chip.onclick = (e) => {
      if (e.target.closest(".sp-x")) {
        e.stopPropagation();
        const kw = e.target.closest(".sp-x").dataset.del;
        lsSet(LS_SEARCH, getRecentKeywords().filter(k => k !== kw));
        renderSearchHist();
        return;
      }
      document.getElementById("wd").value = chip.dataset.kw;
      doSearch();
    };
  });
}
function openSearch() {
  renderSearchHist();
  document.getElementById("searchPop").classList.add("show");
  document.getElementById("searchMask").classList.add("show");
  document.body.style.overflow = "hidden";
  const wd = document.getElementById("wd");
  setTimeout(() => { try { wd.focus(); wd.select(); } catch (e) {} }, 260);
}
function closeSearch() {
  document.getElementById("searchPop").classList.remove("show");
  document.getElementById("searchMask").classList.remove("show");
  document.body.style.overflow = "";
}

async function doSearch(kw) {
  const wd = (typeof kw === "string" ? kw : document.getElementById("wd").value).trim();
  if (!wd) return;
  pushRecentKeyword(wd);
  closeSearch();
  resetView();
  state.mode = "search";
  state.backTo = "search";
  state.keyword = wd;
  state.pg = 1;
  state.list = [];
  state.savedScrollY = 0;
  closeDrawer();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  progress(true);
  try {
    const data = await api("/search", { wd, pg: 1 });
    if (data.error) {
      renderEmpty("搜索失败，请重试", "重试", "doSearchRetry()");
    } else {
      state.list = data.list || [];
      state.pagecount = data.pagecount || 1;
      state.total = data.total || 0;
      renderListPage("search");
      if (!state.list.length) renderEmpty("未找到「" + esc(wd) + "」相关作品");
    }
  } catch (e) {
    renderEmpty("搜索失败，请重试", "重试", "doSearchRetry()");
  }
  progress(false);
}
function doSearchRetry() {
  renderListSkeleton();
  doSearch(state.keyword);
}
