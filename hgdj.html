/* ---- 列表页 ---- */
function renderListPage(apiPath) {
  const app = document.getElementById("app");
  if (!state.list.length) { renderEmpty("暂无内容"); return; }

  const isSearch = apiPath === "search";
  const isTag = apiPath === "tag";

  const cards = state.list.map((v, i) => cardHtml(v, i, { w: 300 })).join("");

  const pg = state.pg;
  const pagecount = Math.max(1, state.pagecount);
  const pagerHtml = pagecount > 1 ? `
    <div class="pager">
      <button id="pgFirst" ${pg <= 1 ? "disabled" : ""}>首页</button>
      <button id="pgPrev" ${pg <= 1 ? "disabled" : ""}>上一页</button>
      <div class="pg-info">第 <b>${pg}</b> ${state.total ? `/ ${pagecount} 页 · 共${state.total}部` : ""}</div>
      <button id="pgNext" ${pg >= pagecount ? "disabled" : ""}>下一页</button>
      <button id="pgLast" ${pg >= pagecount ? "disabled" : ""}>末页</button>
      <div class="goto"><input type="number" id="pgInput" min="1" max="${pagecount}" placeholder="页码"></div>
    </div>
  ` : (state.total ? `<div class="pager"><div class="pg-info">共 ${state.total} 部</div></div>` : "");

  const title = isSearch ? `搜索：${esc(state.keyword)}`
    : isTag ? `<span class="hash">#</span>${esc(state.tagDisplay)}`
    : esc(state.catTitle);

  app.innerHTML = `
    <div class="list-tools"><span class="bar"></span><div><h2>${title}</h2>${state.total ? `<div class="total">${isTag ? "该标签下共 " : "共 "}${state.total} 部作品</div>` : ""}</div></div>
    <div class="grid" id="listGrid">${cards}</div>
    ${pagerHtml}
  `;

  bindCards(document.getElementById("listGrid"), state.list, (v) => openDetail(v));

  const jumpTo = (p) => {
    p = Math.min(Math.max(1, p), pagecount);
    if (p === state.pg) return;
    state.pg = p;
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderListSkeleton();
    loadListPage(apiPath);
  };
  const $ = (id) => document.getElementById(id);
  if ($("pgFirst")) $("pgFirst").onclick = () => jumpTo(1);
  if ($("pgPrev")) $("pgPrev").onclick = () => jumpTo(pg - 1);
  if ($("pgNext")) $("pgNext").onclick = () => jumpTo(pg + 1);
  if ($("pgLast")) $("pgLast").onclick = () => jumpTo(pagecount);
  if ($("pgInput")) $("pgInput").onkeydown = (e) => {
    if (e.key === "Enter") { const v = parseInt($("pgInput").value); if (v) jumpTo(v); }
  };
}

/* ---- 详情 & 播放 ---- */
async function openDetail(item, resume, fromMode) {
  if (!item || !item.vod_id) return;
  if (state.mode !== "detail") state.savedScrollY = window.scrollY || 0;
  if (fromMode) state.backTo = fromMode;
  else if (state.mode !== "detail") state.backTo = state.mode;
  state.mode = "detail";
  state.detail = { ...item };
  state.episodes = [];
  state.currentEp = 0;
  state.resume = resume || null;
  destroyPlayer();
  renderNav();
  window.scrollTo(0, 0);
  renderDetailSkeleton();
  progress(true);
  try {
    const data = await api("/detail", { id: item.vod_id });
    const d = (data.list && data.list[0]) || null;
    if (d) {
      state.detail = d;
      state.episodes = parseEpisodes(d.vod_play_url);
      renderDetail();
    } else {
      renderEmpty("加载详情失败", "返回", "closePlayer()");
    }
  } catch (e) {
    console.log("detail error", e);
    renderEmpty("加载详情失败", "返回", "closePlayer()");
  }
  progress(false);
}

function parseEpisodes(playUrl) {
  if (!playUrl) return [];
  return playUrl.split("#").map(part => {
    const idx = part.indexOf("$");
    if (idx < 0) return null;
    return { title: part.slice(0, idx).trim(), playId: part.slice(idx + 1).trim() };
  }).filter(Boolean);
}

  document.getElementById("app").innerHTML = `
    <div class="player-toolbar">

    </div>
    <div class="player-wrap" id="playerWrap"><video id="video" controls playsinline preload="metadata"></video></div>
    <div class="detail-head">
      <div class="poster"></div>
      <div class="detail-info"><h1 style="color:var(--sub);font-size:15px">加载中…</h1></div>
    </div>
  `;
  document.getElementById("backBtn").onclick = closePlayer;
  document.getElementById("closeBtn").onclick = closePlayer;
}

function renderDetail() {

  const favOn = isFav(d.vod_id);

  let startEp = 0;
  if (state.resume && state.resume.ep) {
    const idx = state.episodes.findIndex(e => String(e.playId).split(":")[1] === String(state.resume.ep));
    if (idx >= 0) startEp = idx;
  }

  const epHtml = state.episodes.map((ep, i) => `
    <div class="ep ${i === startEp ? "on" : ""}" data-idx="${i}">${esc(ep.title)}</div>
  `).join("");

  app.innerHTML = `
    <div class="player-toolbar">
      <div class="back-btn" id="backBtn">← 返回</div>
      <div class="toolbar-right">
        <button class="fav-btn ${favOn ? "on" : ""}" id="favBtn">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span id="favBtnTxt">${favOn ? "已收藏" : "收藏"}</span>
        </button>
        <button class="close-btn" id="closeBtn" title="关闭">✕</button>
      </div>
    </div>
    <div class="player-wrap" id="playerWrap"><video id="video" controls playsinline preload="metadata"></video></div>
    <div class="detail-head">
      <div class="poster"><img${imgAttrs(pic, 400)} alt="" referrerpolicy="no-referrer"></div>
      <div class="detail-info">
        <h1>${esc(title)}</h1>
        <div class="tags">
          <span class="tag accent">黄果短剧</span>
          ${remark ? `<span class="tag">${esc(remark)}</span>` : ""}
          ${plays ? `<span class="tag">${esc(plays)}播放</span>` : ""}
          ${tags.slice(0, 6).map(t => {
            const slug = (d.vod_tag_links || {})[t] || "";
            return `<span class="tag tg" data-tag="${esc(t)}"${slug ? ` data-slug="${esc(slug)}"` : ""}>${esc(t)}</span>`;
          }).join("")}
        </div>
        ${desc ? `<div class="desc" id="descBox" title="点击展开/收起">${esc(desc)}</div>` : ""}
      </div>
    </div>
    <div class="ep-section-title">选集 · 共 ${state.episodes.length} 集</div>
    <div class="episodes">${epHtml || '<div style="color:var(--sub);font-size:13px">暂无剧集</div>'}</div>
  `;

  document.getElementById("backBtn").onclick = closePlayer;
  document.getElementById("closeBtn").onclick = closePlayer;
  const descBox = document.getElementById("descBox");
  if (descBox) descBox.onclick = () => descBox.classList.toggle("open");
  app.querySelectorAll(".tag.tg").forEach(tagEl => {
    tagEl.onclick = (e) => { e.stopPropagation(); goTag(tagEl.dataset.tag, tagEl.dataset.slug || ""); };
  });

  document.getElementById("favBtn").onclick = () => {
    const added = toggleFav({ id: d.vod_id, name: title, pic, remark, tags });
    document.getElementById("favBtn").classList.toggle("on", added);
    document.getElementById("favBtnTxt").textContent = added ? "已收藏" : "收藏";
    toast(added ? "已加入收藏 ♥" : "已取消收藏");
    renderNav();
  };

  app.querySelectorAll(".ep").forEach(node => {
    node.onclick = () => {
      const idx = parseInt(node.dataset.idx);
      if (idx !== state.currentEp) playEpisode(idx);
    };
  });
  if (state.episodes.length > 0) playEpisode(startEp);
}

function epNumOf(idx) {
  const ep = state.episodes[idx];
  return ep ? parseInt(String(ep.playId).split(":")[1] || (idx + 1)) : idx + 1;
}

async function playEpisode(idx) {
  if (idx < 0 || idx >= state.episodes.length) return;
  state.currentEp = idx;
  document.querySelectorAll(".ep").forEach((el, i) => el.classList.toggle("on", i === idx));
  const ep = state.episodes[idx];
  const num = epNumOf(idx);

  let seekPos = 0;
  if (state.resume && state.resume.ep && String(state.resume.ep) === String(num) && state.resume.pos > 8) {
    seekPos = state.resume.pos;
  }
  state.resume = null;

  const d = state.detail || {};
  upsertHist({
    id: d.vod_id, name: d.vod_name, pic: d.vod_pic, remark: d.vod_remarks,
    ep: num, epTitle: ep.title, pos: seekPos, dur: 0
  });

  showPlayerLoading(`正在加载第 ${num} 集…`);
  try {
    const data = await api("/play", { id: ep.playId });
    if (!data || !data.url) { showPlayerError("解析播放地址失败"); return; }
    /* 播放前验证清单：经可用通道取真清单；取不到就不播，避免播出宣传片 */
    const vs = await verifyManifest(data.url);
    if (vs !== "ok") { showPlayerError(playBlockMessage(vs)); return; }
    playVideo(data.url, seekPos);
  } catch (e) {
    showPlayerError("请求失败：" + (e.message || e));
  }
}

function closePlayer() {
  saveCurrentProgress();
  destroyPlayer();
  const back = state.backTo || "home";
  state.mode = back;
  state.detail = null;
  state.episodes = [];
  renderNav();
  window.scrollTo(0, state.savedScrollY || 0);
  if (back === "fav") renderFav();
  else if (back === "hist") renderHist();
  else if (back === "search") { if (state.list.length) renderListPage("search"); else doSearchBack(); }
  else if (back === "tag") { if (state.list.length) renderListPage("tag"); else goTag(state.tagDisplay, state.tagName); }
  else if (back === "category") { if (state.list.length) renderListPage("category"); else switchCategory(state.catId || "recommend", state.catTitle); }
  else goHome();
}
function doSearchBack() { state.pg = 1; loadListPage("search"); }

function destroyPlayer() {
  if (state.hls) { try { state.hls.destroy(); } catch (e) {} state.hls = null; }
  if (state.manifestBlobUrl) { try { URL.revokeObjectURL(state.manifestBlobUrl); } catch (e) {} state.manifestBlobUrl = null; }
  const v = document.getElementById("video");
  if (v) {
    try { v.pause(); } catch (e) {}
    try { v.removeAttribute("src"); v.load(); } catch (e) {}
    v.onended = null; v.ontimeupdate = null;
  }
}

function saveCurrentProgress() {
  const v = document.getElementById("video");
  const d = state.detail;
  if (!v || !d || !state.episodes.length || !v.currentTime) return;
  try {
    saveProgress(d.vod_id, epNumOf(state.currentEp), state.episodes[state.currentEp]?.title,
      v.currentTime, isFinite(v.duration) ? v.duration : 0);
  } catch (e) {}
}

function showPlayerLoading(msg) {
  const wrap = document.getElementById("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(n => n.remove());
  const div = document.createElement("div");
  div.className = "player-error";
  div.style.background = "rgba(0,0,0,.6)";
  div.innerHTML = `<div>${esc(msg)}</div>`;
  wrap.appendChild(div);
}
function showPlayerError(msg) {
  const wrap = document.getElementById("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(n => n.remove());
  const div = document.createElement("div");
  div.className = "player-error";
  div.innerHTML = `<div>⚠️ ${esc(msg)}</div><button id="retryPlay">重试</button>`;
  wrap.appendChild(div);
  div.querySelector("#retryPlay").onclick = () => { div.remove(); playEpisode(state.currentEp); };
}
function showPlayerLoadingHide() {
  const wrap = document.getElementById("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(n => n.remove());
}
function showFinishedOverlay() {
  const wrap = document.getElementById("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(n => n.remove());
  const div = document.createElement("div");
  div.className = "player-error";
  div.style.background = "rgba(0,0,0,.75)";
  div.innerHTML = `<div>🎉 已看完最后一集</div>`;
  wrap.appendChild(div);
}

function playVideo(src, seekTo) {
  destroyPlayer();
  const v = document.getElementById("video");
  if (!v) return;

  let lastSave = 0;
  v.ontimeupdate = () => {
    const now = Date.now();
    if (now - lastSave > 5000 && v.currentTime > 1) {
      lastSave = now;
      saveCurrentProgress();
    }
  };

  v.onended = () => {
    saveCurrentProgress();
    const next = state.currentEp + 1;
    if (next < state.episodes.length) {
      playEpisode(next);
      setTimeout(() => {
        const el = document.querySelector(`.ep[data-idx="${next}"]`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 100);
    } else showFinishedOverlay();
  };

  const doSeek = () => {
    if (seekTo > 0) {
      try { v.currentTime = seekTo; } catch (e) {}
      toast(`已从 ${fmtTime(seekTo)} 继续播放`);
    }
  };

  const isM3u8 = src.includes(".m3u8") || src.includes("mpegurl") || src.includes("playlist");

  if (isM3u8 && window.Hls && Hls.isSupported()) {
    const hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, enableWorker: true, lowLatencyMode: false });
    state.hls = hls;
    /* 优先用验证通过的清单（Blob 直供，避免再次走中转）；兜底再按通道地址加载 */
    let source = null;
    if (manifestCache && manifestCache.src === src) {
      try {
        if (state.manifestBlobUrl) URL.revokeObjectURL(state.manifestBlobUrl);
        state.manifestBlobUrl = URL.createObjectURL(new Blob([manifestCache.text], { type: "application/vnd.apple.mpegurl" }));
        source = state.manifestBlobUrl;
      } catch (e) { source = null; }
    }
    if (!source) source = manifestUrlFor(src);
    hls.loadSource(source);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      doSeek();
      showPlayerLoadingHide();
      v.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data && data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR: showPlayerError("网络错误，播放失败"); break;
          case Hls.ErrorTypes.MEDIA_ERROR: try { hls.recoverMediaError(); } catch (err) { showPlayerError("媒体解码失败"); } break;
          default: showPlayerError("播放失败：" + (data.details || "未知错误"));
        }
      }
    });
  } else {
    v.src = src;
    v.addEventListener("loadedmetadata", () => {
      doSeek();
      showPlayerLoadingHide();
      v.play().catch(() => {});
    }, { once: true });
    v.addEventListener("error", () => showPlayerError("播放失败"), { once: true });
  }
}

window.addEventListener("pagehide", saveCurrentProgress);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveCurrentProgress(); });

/* ---- 启动 ---- */
document.getElementById("menuBtn").onclick = openDrawer;
document.getElementById("drawerClose").onclick = closeDrawer;
document.getElementById("drawerMask").onclick = closeDrawer;
document.getElementById("themeBtn").onclick = toggleTheme;
document.getElementById("searchBtn").onclick = openSearch;
document.getElementById("searchCancel").onclick = closeSearch;
document.getElementById("searchMask").onclick = closeSearch;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (document.getElementById("searchPop").classList.contains("show")) closeSearch();
    else closeDrawer();
  }
});

/* 渲染出的加密封面统一由 MutationObserver 接管加载 */
new MutationObserver(() => hydrateImages(document.getElementById("app")))
  .observe(document.getElementById("app"), { childList: true, subtree: true });

renderNav();
goHome();
</script>
