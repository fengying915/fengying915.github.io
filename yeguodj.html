<script>
/* hls.js 多 CDN 依次回退加载；四个源文件字节一致，用同一份 SRI 校验防篡改 */
(function loadHls() {
  const HLS_SRI = "sha384-w6Gb3fXHb5e1LUYa/hYA5Q41bEDglN5ZPCG7Jvnoo8/X90oGnlPqBlBJCe38mEMm";
  const sources = [
    "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js",
    "https://registry.npmmirror.com/hls.js/1.5.13/files/dist/hls.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js",
    "https://unpkg.com/hls.js@1.5.13/dist/hls.min.js"
  ];
  let i = 0;
  (function next() {
    if (i >= sources.length) return;
    const s = document.createElement("script");
    s.src = sources[i++];
    s.integrity = HLS_SRI;
    s.crossOrigin = "anonymous";
    s.onerror = () => { s.remove(); next(); };
    document.head.appendChild(s);
  })();
})();
</script>
<style>
  :root {
    --accent: #f72d91;
    --accent-2: #ff5ea8;
    --accent-3: #b44bff;
    --accent-glow: rgba(247,45,145,.4);
    --accent-glow-2: rgba(180,75,255,.25);
    --rank-1: #ff4d6d; --rank-2: #ffa23a; --rank-3: #ffd166;
  }
  :root[data-theme="dark"] {
    --bg: #0e0e12;
    --bg-grad-1: #3a1030;
    --card: #17181d;
    --card-hi: #1e2027;
    --panel: #17181d;
    --panel-solid: #1a1b21;
    --line: rgba(255,255,255,.07);
    --line-hi: rgba(255,255,255,.16);
    --text: #f2f3f7;
    --text-dim: #b9bdcb;
    --sub: #7d8296;
    --hover: rgba(255,255,255,.06);
    --header-bg: rgba(14,14,18,.82);
    --drawer-bg: rgba(19,20,26,.94);
    --mask: rgba(0,0,0,.55);
    --sk-1: #16171c; --sk-2: #23242c;
    --shadow-md: 0 12px 32px rgba(0,0,0,.5);
    --shadow-lg: 0 24px 56px rgba(0,0,0,.6);
    --hero-mask: linear-gradient(180deg, rgba(0,0,0,.02) 20%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.92) 100%);
    --chip-bg: rgba(255,255,255,.06);
  }
  :root[data-theme="light"] {
    --bg: #f5f6fa;
    --bg-grad-1: #ffd9ec;
    --card: #ffffff;
    --card-hi: #ffffff;
    --panel: #ffffff;
    --panel-solid: #ffffff;
    --line: rgba(20,20,40,.08);
    --line-hi: rgba(20,20,40,.18);
    --text: #17181d;
    --text-dim: #3a3e4e;
    --sub: #6b7085;
    --hover: rgba(20,20,40,.05);
    --header-bg: rgba(255,255,255,.88);
    --drawer-bg: rgba(255,255,255,.98);
    --mask: rgba(30,30,50,.35);
    --sk-1: #eceef4; --sk-2: #f8f9fc;
    --shadow-md: 0 10px 30px rgba(90,95,140,.12);
    --shadow-lg: 0 20px 50px rgba(90,95,140,.16);
    --hero-mask: linear-gradient(180deg, rgba(0,0,0,.02) 20%, rgba(0,0,0,.45) 62%, rgba(0,0,0,.82) 100%);
    --chip-bg: rgba(20,20,40,.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    transition: background .4s ease, color .4s ease;
  }
  body::before {
    content: "";
    position: fixed; inset: -30% -30% auto -30%; height: 75vh;
    background:
      radial-gradient(50% 80% at 20% 0%, var(--bg-grad-1) 0%, transparent 60%),
      radial-gradient(45% 70% at 88% 5%, var(--accent-glow-2) 0%, transparent 60%);
    pointer-events: none; z-index: 0; opacity: .5;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  img.pending { opacity: 0; }
  img[data-enc] { transition: opacity .35s ease; }
  button { font-family: inherit; }

  /* 老内核不支持毛玻璃时改用不透明底色，避免半透明栏背面穿透看不清 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root[data-theme="dark"] {
      --header-bg: #0e0e12;
      --drawer-bg: #13141a;
      --mask: rgba(0,0,0,.72);
    }
    :root[data-theme="light"] {
      --header-bg: #ffffff;
      --drawer-bg: #ffffff;
      --mask: rgba(30,30,50,.45);
    }
  }

  /* ============ 顶栏 ============ */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
  }
  .top {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px 44px;
    align-items: center;
    gap: 12px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 13px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    padding: 0; position: relative; overflow: hidden;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 8px 22px var(--accent-glow); transform: translateY(-2px); }
  .icon-btn:active { transform: translateY(0) scale(.9); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .brand {
    display: flex; align-items: center; justify-content: flex-start;
    min-width: 0; cursor: pointer; user-select: none;
  }
  .brand .logo {
    font-size: 27px; font-weight: 900;
    background: linear-gradient(110deg, var(--accent) 0%, var(--accent-2) 40%, var(--accent-3) 70%, var(--accent) 100%);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 1.5px; white-space: nowrap;
    animation: logo-shine 4s linear infinite;
    line-height: 1.1;
  }
  @keyframes logo-shine { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }
  @media (max-width: 480px) {
    .brand .logo { font-size: 22px; letter-spacing: .5px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 11px; }
    .top { grid-template-columns: 40px minmax(0, 1fr) 40px 40px; gap: 8px; }
  }

  /* 桌面导航行 */
  .navrow { display: none; max-width: 1280px; margin: 10px auto 0; gap: 4px; }
  .navrow .nlink {
    padding: 7px 16px; border-radius: 20px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text-dim); cursor: pointer;
    transition: all .25s; white-space: nowrap;
  }
  .navrow .nlink:hover { color: var(--text); background: var(--hover); }
  .navrow .nlink.active { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px var(--accent-glow); }
  @media (min-width: 900px) { .navrow { display: flex; } }

  .theme-btn { position: relative; }
  .theme-btn .sun, .theme-btn .moon { position: absolute; transition: opacity .4s, transform .55s cubic-bezier(.34,1.56,.64,1); }
  :root[data-theme="dark"] .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(90deg) scale(.3); }
  :root[data-theme="light"] .theme-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.3); }
  :root[data-theme="light"] .theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }

  /* ============ 搜索（弹层） ============ */
  .search-pop {
    position: fixed; top: 0; left: 0; right: 0; z-index: 220;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px calc(14px + env(safe-area-inset-top));
    padding-top: calc(12px + env(safe-area-inset-top));
    transform: translateY(-102%);
    transition: transform .38s cubic-bezier(.34,1.2,.64,1);
    box-shadow: var(--shadow-lg);
  }
  .search-pop.show { transform: translateY(0); }
  .search-pop .sp-row {
    display: flex; align-items: center; gap: 10px;
    max-width: 1280px; margin: 0 auto;
  }
  .search-pop .search { flex: 1; }
  .search-cancel {
    background: transparent; border: none; color: var(--sub);
    font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 10px 4px; white-space: nowrap; flex-shrink: 0;
    transition: color .25s;
  }
  .search-cancel:hover { color: var(--accent); }
  .sp-hist {
    max-width: 1280px; margin: 12px auto 0;
    display: none; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .sp-hist.show { display: flex; }
  .sp-hist .sp-label { font-size: 12px; font-weight: 700; color: var(--sub); }
  .sp-hist .sp-chip {
    position: relative;
    padding: 5px 22px 5px 12px; border-radius: 16px;
    background: var(--chip-bg); border: 1px solid var(--line);
    color: var(--text-dim); font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all .22s; white-space: nowrap;
  }
  .sp-hist .sp-chip:hover { color: var(--text); border-color: var(--line-hi); }
  .sp-hist .sp-x {
    position: absolute; top: -5px; right: -5px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel-solid); border: 1px solid var(--line-hi);
    color: var(--sub); font-size: 9px; font-style: normal; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .sp-hist .sp-x:hover { background: #e5484d; color: #fff; border-color: transparent; transform: scale(1.15); }
  .sp-hist .sp-chip:hover .sp-x { opacity: 1; }
  @media (hover: hover) { .sp-hist .sp-x { opacity: .65; } .sp-hist .sp-chip:hover .sp-x { opacity: 1; } }
  .search-mask {
    position: fixed; inset: 0; z-index: 219;
    background: var(--mask);
    opacity: 0; pointer-events: none;
    transition: opacity .35s;
  }
  .search-mask.show { opacity: 1; pointer-events: auto; }

  .search {
    display: flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .3s, box-shadow .4s;
    min-width: 0;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); padding: 12px 15px; font-size: 14px; font-weight: 500; min-width: 0;
  }
  .search input::placeholder { color: var(--sub); }
  .search button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
    padding: 0 22px; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: .5px;
    transition: filter .3s;
    white-space: nowrap;
    display: flex; align-items: center; justify-content: center;
  }
  .search .sico { display: none; width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .search button:hover { filter: brightness(1.1); }
  .search button:active { filter: brightness(.94); transform: scale(.97); }

  /* ============ 抽屉 ============ */
  .drawer-mask {
    position: fixed; inset: 0; z-index: 200;
    background: var(--mask);
    opacity: 0; pointer-events: none;
    transition: opacity .4s;
  }
  .drawer-mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0; z-index: 201;
    width: 250px; max-width: 82vw;
    background: var(--drawer-bg);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-right: 1px solid var(--line);
    transform: translateX(calc(-100% - 16px));
    transition: transform .45s cubic-bezier(.34,1.2,.64,1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head {
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .drawer-head .info { flex: 1; min-width: 0; }
  .drawer-head .name {
    font-size: 15px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drawer-head .close {
    width: 28px; height: 28px; border-radius: 8px;
    background: transparent; border: none; color: var(--sub);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .3s; flex-shrink: 0;
  }
  .drawer-head .close:hover { background: var(--hover); color: var(--accent); transform: rotate(90deg); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
  .drawer-body::-webkit-scrollbar { width: 3px; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
  .drawer-label {
    font-size: 10px; font-weight: 800; letter-spacing: 1.6px;
    color: var(--sub); text-transform: uppercase;
    padding: 14px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 12px; border-radius: 10px;
    font-size: 13.5px; font-weight: 500;
    color: var(--text-dim); cursor: pointer;
    transition: all .25s; margin-bottom: 1px;
    position: relative;
  }
  .nav-item .nico { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 700;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .nav-item .cnt { margin-left: auto; font-size: 11px; color: var(--sub); font-weight: 600; }
  .nav-item.active .cnt { color: rgba(255,255,255,.85); }

  /* ============ 主内容 ============ */
  main {
    max-width: 1280px; margin: 0 auto;
    padding: 16px 16px 40px;
    position: relative; z-index: 1;
  }
  @media (max-width: 768px) {
    main { padding: 12px 12px calc(76px + env(safe-area-inset-bottom)); }
  }

  /* ============ Hero 轮播 ============ */
  .hero-scroll {
    display: flex; gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 4px 2px 16px;
    margin: 0 -2px 8px;
    scrollbar-width: none;
  }
  .hero-scroll::-webkit-scrollbar { display: none; }
  .hero-card {
    flex: 0 0 72%; max-width: 620px;
    scroll-snap-align: start;
    aspect-ratio: 16/8.2;
    border-radius: 18px; overflow: hidden; position: relative;
    background: var(--sk-1);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    cursor: pointer;
    transition: transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s;
    animation: hero-in .6s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  @keyframes hero-in { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
  .hero-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg), 0 0 0 1px var(--accent-glow); }
  @media (max-width: 640px) { .hero-card { flex: 0 0 90%; aspect-ratio: 16/10; border-radius: 14px; } }
  /* 老版安卓内核不支持 aspect-ratio，退化为固定高度，避免横版海报高度错乱 */
  @supports not (aspect-ratio: 16 / 8.2) {
    .hero-card { height: 300px; }
    @media (max-width: 640px) { .hero-card { height: 210px; } }
  }
  .hero-card img { transition: transform .9s cubic-bezier(.4,0,.2,1); }
  .hero-card:hover img { transform: scale(1.07); }
  .hero-card::after { content: ""; position: absolute; inset: 0; background: var(--hero-mask); pointer-events: none; }
  .hero-info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 18px 20px; color: #fff; z-index: 3;
    display: flex; flex-direction: column; gap: 7px;
  }
  @media (max-width: 640px) { .hero-info { padding: 12px 14px; } }
  .hero-badges { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .hero-rank {
    display: inline-flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 11px; font-weight: 800;
    padding: 4px 11px; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    letter-spacing: .5px;
  }
  .hero-chip {
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.22);
    color: #fff; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hero-title {
    font-size: 21px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 2px 14px rgba(0,0,0,.7);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (max-width: 640px) { .hero-title { font-size: 17px; } }
  .hero-desc {
    font-size: 12.5px; opacity: .9; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .hero-play {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; transition: all .3s;
  }
  .hero-play svg { width: 16px; height: 16px; margin-left: 2px; fill: currentColor; stroke: none; }
  .hero-card:hover .hero-play { background: var(--accent); border-color: transparent; transform: scale(1.08); box-shadow: 0 8px 22px var(--accent-glow); }
  .hero-dots { display: flex; justify-content: center; gap: 6px; margin: -4px 0 18px; }
  .hero-dots .dot-item {
    width: 6px; height: 6px; border-radius: 3px;
    background: var(--line-hi);
    transition: all .4s cubic-bezier(.34,1.56,.64,1); cursor: pointer;
  }
  .hero-dots .dot-item.on { width: 22px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent-glow); }

  /* ============ 继续观看 ============ */
  .cont-scroll {
    display: flex; gap: 12px;
    overflow-x: auto; padding: 2px 2px 12px;
    margin: 0 -2px 6px;
    scrollbar-width: none;
  }
  .cont-scroll::-webkit-scrollbar { display: none; }
  .cont-card { flex: 0 0 128px; cursor: pointer; animation: fade-up .45s cubic-bezier(.34,1.56,.64,1) backwards; }
  .cont-poster {
    position: relative;
    width: 128px; height: 171px;   /* 固定 3:4，兼容不支持 aspect-ratio 的内核 */
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
    background: var(--sk-1);
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .cont-poster .pbadge {
    position: absolute; top: 7px; left: 7px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 2;
  }
  .cont-poster .pmask { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.72)); }
  .cont-poster .presume {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    display: flex; align-items: center; gap: 6px;
    color: #fff; font-size: 11px; font-weight: 600;
  }
  .presume .picon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .presume .picon svg { width: 10px; height: 10px; fill: #fff; stroke: none; margin-left: 1px; }
  .cont-title {
    margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cont-sub { font-size: 11px; color: var(--sub); margin-top: 1px; }

  /* ============ 区块标题 ============ */
  .sec-head {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 2px 14px;
    animation: fade-up .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sec-head .bar {
    width: 4px; height: 19px; border-radius: 3px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .sec-head h2 { font-size: 17px; font-weight: 800; letter-spacing: .3px; color: var(--text); white-space: nowrap; }
  .sec-head .sub { font-size: 12px; color: var(--sub); white-space: nowrap; margin-top: 2px; }
  .sec-head .more {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--sub); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 3px;
    padding: 5px 10px; border-radius: 18px;
    transition: all .25s;
  }
  .sec-head .more:hover { color: var(--accent); background: var(--hover); }
  .sec-head .more svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }

  /* ============ 筛选条 ============ */
  .filters { display: flex; flex-direction: column; gap: 9px; margin: 4px 0 16px; }
  .frow { display: flex; align-items: center; gap: 8px; }
  .frow .flabel { font-size: 12px; font-weight: 700; color: var(--sub); flex-shrink: 0; width: 34px; }
  .frow .fchips {
    display: flex; gap: 7px;
    overflow-x: auto; scrollbar-width: none;
    padding: 2px 0;
  }
  .frow .fchips::-webkit-scrollbar { display: none; }
  .fchip {
    flex-shrink: 0;
    padding: 6px 13px; border-radius: 18px;
    background: var(--chip-bg);
    border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 500;
    color: var(--text-dim);
    cursor: pointer; user-select: none;
    transition: all .22s cubic-bezier(.34,1.4,.64,1);
    white-space: nowrap;
  }
  .fchip:hover { color: var(--text); border-color: var(--line-hi); transform: translateY(-1px); }
  .fchip.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 5px 16px var(--accent-glow);
  }

  /* ============ 卡片网格 ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  /* minmax(0,1fr)：避免长标题/标签把某一列撑宽导致卡片大小不一 */
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 18px; } }

  .card { background: transparent; cursor: pointer; position: relative; animation: card-in .5s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes card-in { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
  .card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.06s}
  .card:nth-child(4){animation-delay:.08s}.card:nth-child(5){animation-delay:.1s}.card:nth-child(6){animation-delay:.12s}
  .card:nth-child(7){animation-delay:.14s}.card:nth-child(8){animation-delay:.16s}.card:nth-child(9){animation-delay:.18s}
  .card:nth-child(n+10){animation-delay:.2s}
  .card:active { transform: scale(.97); }

  /* 封面框固定 3:4：用 padding 撑高（padding 百分比按卡片列宽计算），
     不依赖 aspect-ratio，老版安卓 WebView / X5 内核下尺寸同样一致 */
  .thumb {
    position: relative;
    height: 0;
    padding-top: 133.34%;
    background: var(--sk-1);
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
    transition: box-shadow .35s, border-color .35s, transform .35s cubic-bezier(.34,1.4,.64,1);
  }
  .thumb::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 55%;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.3) 50%, rgba(0,0,0,.78) 100%);
    pointer-events: none; z-index: 2;
  }
  .thumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .6s cubic-bezier(.34,1.2,.64,1);
  }
  @media (hover: hover) {
    .card:hover .thumb {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 38px rgba(0,0,0,.4), 0 0 0 1px var(--accent-glow), 0 0 34px var(--accent-glow);
      z-index: 4;
    }
    .card:hover .thumb img { transform: scale(1.08); }
    .card:hover .card-title { color: var(--accent); }
  }

  .badge-new, .badge-hot, .badge-rank {
    position: absolute; top: 8px; z-index: 3;
    font-size: 10.5px; font-weight: 800;
    padding: 3px 9px; border-radius: 14px;
    letter-spacing: .5px;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  .badge-new { left: 8px; background: linear-gradient(135deg, #22c55e, #4ade80); color: #fff; }
  .badge-hot { left: 8px; background: linear-gradient(135deg, #ff4d6d, #ff7a45); color: #fff; }
  .badge-rank {
    left: 8px; min-width: 26px; text-align: center;
    background: rgba(0,0,0,.62); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .badge-rank.r1 { background: linear-gradient(135deg, var(--rank-1), #ff8fa3); border: none; }
  .badge-rank.r2 { background: linear-gradient(135deg, var(--rank-2), #ffc46b); border: none; }
  .badge-rank.r3 { background: linear-gradient(135deg, var(--rank-3), #ffe3a3); border: none; color: #5c4300; }

  .thumb-plays {
    position: absolute; bottom: 8px; left: 9px; right: 9px; z-index: 3;
    display: flex; align-items: center; gap: 4px;
    color: #fff; font-size: 11px; font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .thumb-plays svg { width: 11px; height: 11px; fill: currentColor; stroke: none; flex-shrink: 0; }
  .thumb-plays .rem { margin-left: auto; font-size: 10.5px; opacity: .95; }

  .card-title {
    padding: 8px 2px 0;
    font-size: 13px; line-height: 1.42; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .25s; letter-spacing: .2px;
  }
  @media (max-width: 640px) { .card-title { font-size: 12px; } }
  /* 固定行高，保证有标签/无标签的卡片总高一致 */
  .card-tags { display: flex; gap: 5px; margin-top: 5px; overflow: hidden; min-height: 23px; }
  .ctag {
    flex-shrink: 0;
    font-size: 10.5px; font-weight: 600;
    padding: 2.5px 8px; border-radius: 10px;
    background: var(--chip-bg);
    color: var(--sub);
    border: 1px solid var(--line);
    white-space: nowrap;
    cursor: pointer;
    transition: all .2s;
  }
  .ctag:hover { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  @media (max-width: 640px) { .card-tags .ctag:nth-child(n+3) { display: none; } }

  .card-del {
    position: absolute; top: 6px; right: 6px; z-index: 5;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; line-height: 1;
    opacity: 0; transition: all .25s;
  }
  .card:hover .card-del, .card-del.always { opacity: 1; }
  .card-del:hover { background: #e5484d; transform: scale(1.1); }
  @media (hover: none) { .card-del { opacity: 1; } }

  .hist-prog { height: 4px; border-radius: 3px; background: var(--chip-bg); margin-top: 7px; overflow: hidden; }
  .hist-prog i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .card-sub { font-size: 11px; color: var(--sub); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .skel .thumb { background: linear-gradient(90deg, var(--sk-1), var(--sk-2), var(--sk-1)); background-size: 200% 100%; animation: sk 1.6s ease-in-out infinite; }
  .skel .card-title { background: var(--sk-1); color: transparent; border-radius: 5px; height: 16px; margin-top: 8px; }
  .skel .card-tags { visibility: hidden; }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ============ 分页 ============ */
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 26px 0 6px; flex-wrap: wrap;
  }
  .pager button, .pager .pg-info {
    min-width: 42px; height: 42px; padding: 0 15px;
    border-radius: 11px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text); font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all .28s;
    display: flex; align-items: center; justify-content: center;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); transform: translateY(-2px); }
  .pager button:active:not(:disabled) { transform: scale(.94); }
  .pager button:disabled { opacity: .3; cursor: not-allowed; }
  .pager .pg-info { background: transparent; border: none; cursor: default; color: var(--sub); font-weight: 500; }
  .pager .pg-info b { color: var(--accent); margin: 0 3px; font-size: 15px; font-weight: 800; }
  .pager .goto input {
    width: 62px; height: 42px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    color: var(--text); text-align: center;
    font-size: 13.5px; font-weight: 600; outline: none;
    transition: all .28s; font-family: inherit;
  }
  .pager .goto input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .pager .goto input::-webkit-outer-spin-button,
  .pager .goto input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ============ 列表页工具行 ============ */
  .list-tools {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 2px 14px;
    animation: fade-up .4s cubic-bezier(.34,1.56,.64,1);
  }
  .list-tools .bar { width: 4px; height: 19px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px var(--accent-glow); flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
  .list-tools h2 { font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  .list-tools .total { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .list-tools .act {
    margin-left: auto;
    padding: 7px 14px; border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--card); color: var(--sub);
    font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all .25s;
    white-space: nowrap;
  }
  .list-tools .act:hover { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 6px 18px var(--accent-glow); }

  /* ============ 详情 & 播放器 ============ */
  .player-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 10px;
    animation: fade-up .4s cubic-bezier(.34,1.56,.64,1);
  }
  .toolbar-right { display: flex; gap: 8px; align-items: center; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    padding: 9px 15px; cursor: pointer; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    transition: all .28s;
    white-space: nowrap;
  }
  .back-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateX(-3px); box-shadow: 0 6px 18px var(--accent-glow); }
  .fav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text-dim); cursor: pointer; transition: all .28s;
    white-space: nowrap;
  }
  .fav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fav-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); }
  .fav-btn.on { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  .fav-btn.on svg { fill: var(--accent); stroke: var(--accent); }
  .close-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--card); color: var(--sub);
    border: 1px solid var(--line);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .35s; padding: 0; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--hover); color: var(--accent); border-color: var(--accent); transform: rotate(90deg) scale(1.08); }

  .player-wrap {
    position: relative; width: 100%;
    background: #000;
    border-radius: 18px; overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow-lg), 0 0 50px var(--accent-glow-2);
    border: 1px solid var(--line);
    animation: fade-up .45s cubic-bezier(.34,1.56,.64,1);
  }
  video { width: 100%; display: block; background: #000; max-height: 76vh; }

  .detail-head {
    display: flex; gap: 16px;
    margin-bottom: 18px;
    animation: fade-up .5s cubic-bezier(.34,1.56,.64,1) backwards;
    animation-delay: .08s;
  }
  .detail-head .poster {
    width: 128px; height: 171px; flex-shrink: 0;
    border-radius: 16px; overflow: hidden;
    background: var(--sk-1); border: 1px solid var(--line);
    box-shadow: var(--shadow-md), 0 0 26px var(--accent-glow-2);
  }
  @media (max-width: 560px) { .detail-head .poster { width: 100px; height: 133px; } .detail-head { gap: 12px; } }
  .detail-info { min-width: 0; padding-top: 2px; }
  .detail-info h1 { font-size: 19px; line-height: 1.38; margin-bottom: 10px; font-weight: 800; letter-spacing: .3px; }
  @media (max-width: 560px) { .detail-info h1 { font-size: 16.5px; } }
  .detail-info .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .tag {
    font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 20px;
    background: var(--chip-bg); color: var(--sub);
    border: 1px solid var(--line);
  }
  .tag.tg { cursor: pointer; transition: all .22s; }
  .tag.tg:hover {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    box-shadow: 0 5px 16px var(--accent-glow);
    transform: translateY(-1px);
  }
  .hash { color: var(--accent); font-weight: 900; }
  .tag.accent {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .desc {
    font-size: 12.5px; line-height: 1.75; color: var(--sub);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer; transition: color .25s;
    white-space: pre-line;
  }
  .desc.open { display: block; }
  .desc:hover { color: var(--text-dim); }

  .ep-section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 800;
    margin: 20px 0 12px; letter-spacing: .3px;
  }
  .ep-section-title::before {
    content: ""; width: 4px; height: 17px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px var(--accent-glow); flex-shrink: 0;
  }
  .episodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 9px; }
  @media (max-width: 640px) { .episodes { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; } }
  .ep {
    background: var(--panel-solid);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 5px;
    font-size: 12px; font-weight: 600;
    color: var(--sub); text-align: center;
    cursor: pointer; transition: all .25s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    user-select: none;
  }
  .ep:hover { color: var(--text); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 16px var(--accent-glow); }
  .ep.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 800;
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  .empty { text-align: center; padding: 80px 20px; color: var(--sub); font-size: 14px; font-weight: 500; }
  .empty .ico { font-size: 50px; margin-bottom: 16px; opacity: .45; }
  .empty .eact {
    display: inline-block; margin-top: 16px;
    padding: 9px 22px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 22px var(--accent-glow);
    transition: transform .25s;
  }
  .empty .eact:hover { transform: translateY(-2px); }

  .player-error {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.82);
    color: #fff; gap: 16px;
    font-size: 14px; font-weight: 500;
    padding: 24px; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 5;
  }
  .player-error button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
    padding: 11px 26px; border-radius: 11px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 26px var(--accent-glow);
    transition: all .3s;
  }
  .player-error button:hover { transform: translateY(-2px) scale(1.04); }

  .topbar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    background-size: 200% 100%;
    width: 0; z-index: 999;
    transition: width .3s cubic-bezier(.34,1.4,.64,1);
    box-shadow: 0 0 14px var(--accent-glow);
    border-radius: 0 3px 3px 0;
    animation: topbar-shine 2s linear infinite;
  }
  @keyframes topbar-shine { 0%{background-position:0% 0} 100%{background-position:200% 0} }

  /* ============ 手机底部导航 ============ */
  .bottom-nav {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0; z-index: 150;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .bnav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    padding: 5px 2px;
    color: var(--sub); font-size: 10.5px; font-weight: 600;
    cursor: pointer; user-select: none;
    border-radius: 12px;
    transition: color .25s, background .25s;
    position: relative;
  }
  .bnav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .bnav-item.on { color: var(--accent); }
  .bnav-item.on svg { transform: translateY(-1.5px) scale(1.12); }
  .bnav-item:active svg { transform: scale(.85); }
  .bnav-item .bdot {
    position: absolute; top: 2px; right: 50%; margin-right: -24px;
    min-width: 16px; height: 15px; padding: 0 4px;
    border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 9.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  @media (max-width: 768px) { .bottom-nav { display: flex; } }

  /* toast */
  .toast {
    position: fixed;
    left: 50%; bottom: calc(90px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-solid);
    color: var(--text);
    border: 1px solid var(--line-hi);
    box-shadow: var(--shadow-lg);
    padding: 10px 18px; border-radius: 13px;

<script>
/* ============================================================
   数据层：直连野果短剧 API（服务端已开启 CORS，无需代理）
   ============================================================ */
const API_BASE = "https://www.yeguodj.com/api.php";

const API_KEY = new TextEncoder().encode("2acf7e91e9864673");
const API_IV  = new TextEncoder().encode("1c29882d3ddfcfd6");

/* 封面图密钥：加密封面（Content-Type 为 octet-stream）必须解密后才能显示，
   与原 Worker 的 /proxy 逻辑一致 */
const MEDIA_KEY = new TextEncoder().encode("f5d965df75336270");
const MEDIA_IV  = new TextEncoder().encode("97b60394abc2fbe1");

/* 已知加密封面主机（图床域名会随站点换，均为 octet-stream 加密流，密钥相同） */
const ENC_HOSTS = [/pic\.sugfew\.cn/, /pic\.jtzatly\.cn/];

/* 分类筛选（值来自 exploreList 的 filters 接口） */
const FILTERS = [
  { key: "recommend",  title: "排序", options: [[1, "最新"], [2, "最热"]] },
  { key: "theme",      title: "主题", options: [[7, "野果原创"], [8, "真人短剧"], [9, "魔改漫剧"], [10, "网红改编"], [11, "PMV裸舞"]] },
  { key: "background", title: "背景", options: [[39, "校园"], [40, "都市"], [41, "年代"], [43, "古代"], [44, "玄幻"], [45, "末世"], [46, "灵异"]] },
  { key: "setting",    title: "设定", options: [[23, "禁忌伦理"], [24, "职场反差"], [25, "改造调教"], [26, "出轨绿帽"], [27, "高H剧情"], [28, "后宫多人"], [29, "逆袭系统"]] },
  { key: "time",       title: "时间", options: [[1, "7天内"], [2, "14天内"], [3, "30天内"], [4, "90天内"]] },
];

/* 首页模块 → 查看更多 的筛选取值 */
const MODULE_LINK = {
  "rec-sweet-romance":  { theme: 7 },
  "rec-hot-drama":      { recommend: 2 },
  "rec-urban-emotion":  { background: 40 },
  "rec-rebirth-rise":   { setting: 29 },
  "rec-ancient-travel": { background: 43 },
  "rec-campus-youth":   { background: 39 },
};

function base64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function aesCbcDecrypt(cipherBytes, keyBytes, ivBytes) {
  try {
    const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
    const dec = await crypto.subtle.decrypt({ name: "AES-CBC", iv: ivBytes }, key, cipherBytes);
    return new Uint8Array(dec);
  } catch (e) { return null; }
}

/* 该接口偶发网络失败，做 3 次尝试再放弃 */
async function apiPost(path, body, attempt) {
  attempt = attempt || 0;
  try {
    const r = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json;charset=UTF-8" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); } catch (e) { throw new Error("bad json"); }
    if (typeof d.data === "string" && d.data.length > 20) {
      try {
        const cipher = base64ToBytes(d.data);
        const dec = await aesCbcDecrypt(cipher, API_KEY, API_IV);
        if (dec) d.data = JSON.parse(new TextDecoder("utf-8", { fatal: false }).decode(dec));
      } catch (e) {}
    }
    return d;
  } catch (e) {
    if (attempt < 2) {
      await new Promise(s => setTimeout(s, 400 * (attempt + 1)));
      return apiPost(path, body, attempt + 1);
    }
    console.log("[apiPost]", path, e.message);
    return null;
  }
}

function unwrap(d) {
  if (!d) return {};
  let x = (d.data !== undefined && d.data !== null) ? d.data : d;
  if (x && typeof x === "object" && !Array.isArray(x) && x.data && typeof x.data === "object") return x.data;
  return x;
}

function fmtPlays(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "亿";
  if (n >= 10000) return Math.round(n / 10000) + "W";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}

function toVod(it) {
  if (!it) return null;
  let vid = it.video_id !== undefined && it.video_id !== null ? it.video_id : (it.id || "");
  vid = String(vid).trim();
  if (!vid) return null;

  const title = String(it.title || it.video_title || it.name || vid).trim();
  const rawPic = String(it.cover || it.cover_img || it.pic || "").trim();
  const plays = it.play_count_text || (it.play_count ? fmtPlays(it.play_count) : "");
  let remark = String(it.serialize_status_text || it.update_status || "").trim();
  if (!remark) {
    const ep = it.episode_count || it.total_serial || "";
    if (ep) remark = `更新至${ep}集`;
  }
  const badgeTxt = String((it.badge && it.badge.text) || "").trim();
  const badge = badgeTxt === "新" ? "new" : ((it.show_hot_badge || badgeTxt === "热") ? "hot" : "");

  const tags = Array.isArray(it.tags)
    ? it.tags.slice(0, 3).map(t => String(t).trim()).filter(Boolean)
    : [];

  return {
    vod_id: vid,
    vod_name: title,
    vod_pic: rawPic,
    vod_remarks: remark,
    vod_plays: plays,
    vod_badge: badge,
    vod_tags: tags,
    vod_intro: String(it.intro || it.description || "").trim()
  };
}

function listFromPayload(d) {
  const inner = unwrap(d);
  let arr = [];
  if (Array.isArray(inner)) arr = inner;
  else if (inner && typeof inner === "object") arr = inner.list || inner.top_list || [];
  const out = [];
  for (const it of arr) {
    const v = toVod(it);
    if (v) out.push(v);
  }
  return { list: out, total: (inner && Number(inner.total)) || 0 };
}

/* ============================================================
   封面加载：按主机分流
   1) pic.sugfew.cn / pic.jtzatly.cn —— AES 加密图，取回后解密 + 缩放 + 转 blobURL
   2) imgpublic.ycomesc.live —— 原图 1MB+ 的 PNG，走 wsrv.nl 压成 webp（约 18KB）
   3) 其它 —— 直接加载
   ============================================================ */
function isEncHost(u) { return ENC_HOSTS.some(re => re.test(u)); }

function imgMagic(b) {
  if (!b || b.length < 4) return null;
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return "image/jpeg";
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return "image/png";
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return "image/gif";
  if (b.length >= 12 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return "image/webp";
  return null;
}

function coverUrl(u, w) {
  if (!u) return "";
  if (/imgpublic\.ycomesc\.live/.test(u)) {
    const h = Math.round(w * 4 / 3);
    return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=${w}&h=${h}&fit=cover&output=webp&q=72`;
  }
  return u;
}

/* img 标签：加密封面输出占位 + data-src，由 hydrateImages 接管 */
function imgAttrs(pic, w, lazy) {
  if (!pic) return ' src=""';
  if (isEncHost(pic)) {
    return ` class="pending" data-enc="1" data-src="${esc(pic)}" data-w="${w || 300}" alt=""`;
  }
  const src = coverUrl(pic, w);
  const attrs = lazy ? ' loading="lazy" decoding="async"' : ' decoding="async"';
  if (src !== pic) {
    return ` src="${esc(src)}" data-fb="${esc(pic)}" onerror="if(this.dataset.fb){this.onerror=null;this.src=this.dataset.fb}"${attrs}`;
  }
  return ` src="${esc(pic)}"${attrs}`;
}

const imgBlobCache = new Map();
const imgQueue = [];
let imgActive = 0;
const IMG_CONCURRENCY = 4;
const IMG_CACHE_MAX = 260;

/* 缓存解码后的 blob URL；超上限时回收最早的，且在页面上仍在用的不回收 */
function cacheBlob(key, objUrl) {
  imgBlobCache.set(key, objUrl);
  if (imgBlobCache.size <= IMG_CACHE_MAX) return;
  const inUse = new Set();
  for (const im of document.images) inUse.add(im.src);
  for (const [k, u] of imgBlobCache) {
    if (imgBlobCache.size <= IMG_CACHE_MAX) break;
    if (k === key || inUse.has(u)) continue;
    imgBlobCache.delete(k);
    try { URL.revokeObjectURL(u); } catch (e) {}
  }
}

async function fetchDecodedBlob(url, wantW) {
  const r = await fetch(url, { cache: "force-cache" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  let buf = new Uint8Array(await r.arrayBuffer());
  let mime = imgMagic(buf);
  if (!mime) {
    const dec = await aesCbcDecrypt(buf, MEDIA_KEY, MEDIA_IV);
    if (dec) {
      const m2 = imgMagic(dec);
      if (m2) { buf = dec; mime = m2; }
    }
  }
  if (!mime) throw new Error("not an image");
  /* 缩放，避免大图解码占用内存 */
  if (wantW && self.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(new Blob([buf], { type: mime }), { resizeWidth: wantW, resizeQuality: "medium" });
      let cnv;
      if (typeof OffscreenCanvas !== "undefined") cnv = new OffscreenCanvas(bmp.width, bmp.height);
      else { cnv = document.createElement("canvas"); cnv.width = bmp.width; cnv.height = bmp.height; }
      const ctx = cnv.getContext("2d");
      ctx.drawImage(bmp, 0, 0);
      if (bmp.close) bmp.close();
      let out = null;
      if (cnv.convertToBlob) out = await cnv.convertToBlob({ type: "image/webp", quality: 0.8 });
      else out = await new Promise(res => cnv.toBlob(res, "image/webp", 0.8));
      if (out && out.size) return out;
    } catch (e) {}
  }
  return new Blob([buf], { type: mime });
}

async function loadEncImg(img) {
  const url = img.dataset.src;
  if (!url) return;
  const key = url + "@" + (img.dataset.w || 300);
  if (imgBlobCache.has(key)) {
    img.src = imgBlobCache.get(key);
    img.classList.remove("pending");
    return;
  }
  try {
    const blob = await fetchDecodedBlob(url, parseInt(img.dataset.w) || 300);
    const objUrl = URL.createObjectURL(blob);
    cacheBlob(key, objUrl);
    img.src = objUrl;
    img.classList.remove("pending");
  } catch (e) {
    /* 加密封面无法直接当图片用，失败就保留骨架底色，不显示破图 */
    console.log("[cover]", e.message);
  }
}

function pumpImgQueue() {
  while (imgActive < IMG_CONCURRENCY && imgQueue.length) {
    const img = imgQueue.shift();
    imgActive++;
    loadEncImg(img).finally(() => { imgActive--; pumpImgQueue(); });
  }
}

const imgLazyObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          imgLazyObserver.unobserve(en.target);
          imgQueue.push(en.target);
          pumpImgQueue();
        }
      });
    }, { rootMargin: "400px" })
  : null;

function hydrateImages(root) {
  const nodes = (root || document).querySelectorAll('img[data-enc]:not([data-queued])');
  nodes.forEach(img => {
    img.dataset.queued = "1";
    if (imgLazyObserver) imgLazyObserver.observe(img);
    else { imgQueue.push(img); pumpImgQueue(); }
  });
}

async function dataHome() {
  const d = await apiPost("/api/home/homePage", {});
  if (!d) return { error: true, hero: [], modules: [] };
  const inner = unwrap(d);
  const hero = (Array.isArray(inner.top_list) ? inner.top_list : []).map(toVod).filter(Boolean);
  const modules = [];
  const mods = (inner.modules && inner.modules.list) || [];
  for (const m of mods) {
    if (!m || !Array.isArray(m.items) || m.items.length === 0) continue;
    const list = m.items.map(toVod).filter(Boolean);
    if (list.length) modules.push({ code: m.code || "", title: m.title || "推荐", total: m.item_total || list.length, list });
  }
  return { hero, modules };
}

async function dataCategory(filters, pg) {
  const body = Object.assign({ page: pg, limit: 24 }, filters || {});
  if (body.recommend === undefined) body.recommend = 1;
  const d = await apiPost("/api/theater/exploreList", body);
  if (!d) return { error: true, list: [], total: 0, page: pg, pagecount: 1 };
  const r = listFromPayload(d);
  const total = r.total || 0;
  return {
    list: r.list,
    total,
    page: pg,
    pagecount: total ? Math.ceil(total / 24) : (r.list.length >= 24 ? pg + 1 : pg)
  };
}

async function dataRank(pg) {
  const d = await apiPost("/api/theater/videoRank", { page: pg, limit: 24 });
  if (!d) return { error: true, list: [], total: 0, page: pg, pagecount: 1 };
  const r = listFromPayload(d);
  const total = r.total || 0;
  return {
    list: r.list,
    total,
    page: pg,
    pagecount: total ? Math.ceil(total / 24) : (r.list.length >= 24 ? pg + 1 : pg)
  };
}

async function dataDetail(id) {
  if (!id) return { list: [] };
  const vid = /^\d+$/.test(id) ? parseInt(id) : id;
  const d = await apiPost("/api/playlet/detail", { video_id: vid });
  let info = unwrap(d);
  if (info && typeof info === "object" && info.video_id === undefined && info.data && typeof info.data === "object") info = info.data;
  if (!info || typeof info !== "object") info = {};

  const title = String(info.title || id).trim();
  const rawPic = String(info.cover || info.cover_img || "").trim();
  const rawDesc = String(info.description || info.intro || "").trim();
  const tags = Array.isArray(info.tags) ? info.tags.map(t => String(t).trim()).filter(Boolean).slice(0, 6) : [];
  const plays = info.play_count_text || (info.play_count ? fmtPlays(info.play_count) : "");

  const eps = Array.isArray(info.episodes) ? info.episodes : [];
  const playUrls = [];

  if (eps.length > 0) {
    eps.forEach((ep, idx) => {
      const n = String(
        ep.sort !== undefined ? ep.sort :
        (ep.episode !== undefined ? ep.episode :
        (ep.index !== undefined ? ep.index : (idx + 1)))
      ).trim();
      let realId = "";
      if (ep.id !== undefined && ep.id !== null) realId = String(ep.id);
      else if (ep.episode_id !== undefined && ep.episode_id !== null) realId = String(ep.episode_id);
      else if (ep.video_episode_id !== undefined && ep.video_episode_id !== null) realId = String(ep.video_episode_id);
      else if (ep.nid !== undefined && ep.nid !== null) realId = String(ep.nid);
      const epUrl = String(ep.video_url || ep.url || ep.play_url || "").trim();
      let tName = String(ep.title || `第${n}集`).trim();
      tName = tName.replace(/\$/g, "").replace(/#/g, "");
      const parts = [id, n, realId, epUrl ? encodeURIComponent(epUrl) : ""];
      playUrls.push(`${tName}$${parts.join(":")}`);
    });
  } else {
    const total = parseInt(info.episode_count || info.total_serial || 1);
    const n = Math.max(1, total);
    for (let i = 1; i <= n; i++) playUrls.push(`第${i}集$${id}:${i}::`);
  }

  return {
    list: [{
      vod_id: id,
      vod_name: title,
      vod_pic: rawPic,
      vod_actor: "",
      vod_director: "",
      vod_remarks: `全${playUrls.length}集`,
      vod_content: rawDesc,
      vod_tags: tags,
      vod_plays: plays,
      vod_play_from: "野果专线",
      vod_play_url: playUrls.join("#")
    }]
  };
}

async function dataPlay(id) {
  if (!id) return { parse: 1, url: "" };
  const parts = id.split(":");
  const vid = parts[0] || "";
  const epStr = parts[1] || "1";
  const epRealId = parts[2] || "";
  const epUrlEnc = parts[3] || "";

  const vNum = /^\d+$/.test(vid) ? parseInt(vid) : vid;
  const epNum = /^\d+$/.test(epStr) ? parseInt(epStr) : epStr;
  const rid = epRealId ? (/^\d+$/.test(epRealId) ? parseInt(epRealId) : epRealId) : null;

  if (epUrlEnc) {
    try {
      const cachedUrl = decodeURIComponent(epUrlEnc);
      if (cachedUrl) return { parse: 0, url: cachedUrl };
    } catch (e) {}
  }

  const reqBody = { video_id: vNum, vid: vNum, ep: epNum, sort: epNum, episode: epNum, index: epNum, page: epNum };
  if (rid !== null) {
    reqBody.episode_id = rid; reqBody.epid = rid; reqBody.eid = rid;
    reqBody.nid = rid; reqBody.id = rid; reqBody.video_episode_id = rid;
  }

  const d = await apiPost("/api/playlet/play", reqBody);
  let info = unwrap(d);
  if (info && typeof info === "object" && info.video_url === undefined && info.data && typeof info.data === "object") info = info.data;
  if (!info || typeof info !== "object") info = {};

  let videoUrl = "";
  if (Array.isArray(info.episodeAll)) {
    for (const e of info.episodeAll) {
      const s = String(e.sort !== undefined ? e.sort : (e.index !== undefined ? e.index : (e.episode !== undefined ? e.episode : "")));
      if (s === String(epNum)) { videoUrl = String(e.video_url || e.url || e.play_url || "").trim(); if (videoUrl) break; }
    }
    if (!videoUrl && rid !== null) {
      for (const e of info.episodeAll) {
        const eid = String(e.id !== undefined ? e.id : (e.episode_id !== undefined ? e.episode_id : (e.nid !== undefined ? e.nid : "")));
        if (eid === String(rid)) { videoUrl = String(e.video_url || e.url || e.play_url || "").trim(); if (videoUrl) break; }
      }
    }
    if (!videoUrl) {
      const idx = Number(epNum) - 1;
      if (idx >= 0 && idx < info.episodeAll.length) {
        const e = info.episodeAll[idx];
        videoUrl = String(e.video_url || e.url || e.play_url || "").trim();
      }
    }
  }
  if (!videoUrl) videoUrl = String(info.video_url || info.url || info.play_url || "").trim();
  if (!videoUrl) return { parse: 1, url: "" };
  return { parse: 0, url: videoUrl };
}

async function dataSearch(wd, pg) {
  if (!wd) return { list: [], page: 1, pagecount: 1, total: 0 };
  const limit = 30;
  const d = await apiPost("/api/search/result", { keyword: wd, page: pg, limit });
  if (!d) return { error: true, list: [], page: pg, pagecount: 1, total: 0 };
  const inner = unwrap(d);
  const r = listFromPayload(d);
  const total = Number(inner.total) || r.total || 0;
  const pagecount = total ? Math.max(1, Math.ceil(total / limit)) : (inner.has_more ? pg + 1 : pg);
  return { list: r.list, page: pg, pagecount, total };
}

/* 标签列表：/api/theater/tagList（如「多人」共 189 部） */
async function dataTag(tag, pg) {
  if (!tag) return { list: [], page: 1, pagecount: 1, total: 0 };
  const limit = 24;
  const d = await apiPost("/api/theater/tagList", { tag, page: pg, limit });
  if (!d) return { error: true, list: [], page: pg, pagecount: 1, total: 0 };
  const inner = unwrap(d);
  const r = listFromPayload(d);
  const total = Number(inner.total) || r.total || 0;
  const pagecount = Number(inner.total_pages) || (total ? Math.max(1, Math.ceil(total / limit)) : (inner.has_more ? pg + 1 : pg));
  return { list: r.list, page: pg, pagecount, total };
}

/* ============================================================
   收藏 / 历史（localStorage）
   ============================================================ */
const LS_FAV = "yguo_fav_v1";
const LS_HIST = "yguo_hist_v1";

function lsGet(k, fb) {
  try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function getFav() { return lsGet(LS_FAV, []); }
function isFav(id) { return getFav().some(x => x.id === String(id)); }
function toggleFav(rec) {
  let fav = getFav();
  const id = String(rec.id);
  if (fav.some(x => x.id === id)) {
    lsSet(LS_FAV, fav.filter(x => x.id !== id));
    return false;
  }
  fav.unshift({ id, name: rec.name, pic: rec.pic, remark: rec.remark || "", tags: rec.tags || [], ts: Date.now() });
  if (fav.length > 300) fav.length = 300;
  lsSet(LS_FAV, fav);
  return true;
}
function removeFav(id) { lsSet(LS_FAV, getFav().filter(x => x.id !== String(id))); }

function getHist() { return lsGet(LS_HIST, []); }
function upsertHist(rec) {
  let h = getHist().filter(x => x.id !== String(rec.id));
  h.unshift(Object.assign({ ts: Date.now() }, rec, { id: String(rec.id) }));
  if (h.length > 100) h.length = 100;
  lsSet(LS_HIST, h);
}
function saveProgress(id, ep, epTitle, pos, dur) {
  const h = getHist();
  const item = h.find(x => x.id === String(id));
  if (!item) return;
  item.ep = ep; item.epTitle = epTitle || item.epTitle;
  item.pos = Math.floor(pos || 0); item.dur = Math.floor(dur || 0);
  item.ts = Date.now();
  lsSet(LS_HIST, h);
}
function removeHist(id) { lsSet(LS_HIST, getHist().filter(x => x.id !== String(id))); }

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + "分钟前";
  if (s < 86400) return Math.floor(s / 3600) + "小时前";
  if (s < 2592000) return Math.floor(s / 86400) + "天前";
  return new Date(ts).toLocaleDateString("zh-CN");
}
function fmtTime(sec) {
  sec = Math.floor(sec || 0);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

  const p = Object.assign({}, params || {});

function esc(s) {

}

function cardHtml(v, i, opts) {
  opts = opts || {};
  const rank = opts.rank;
  const badgeHtml = rank
    ? `<span class="badge-rank r${Math.min(rank, 3)}">${rank <= 3 ? "TOP" : ""}${rank}</span>`
    : (v.vod_badge === "new" ? '<span class="badge-new">新</span>'
      : (v.vod_badge === "hot" ? '<span class="badge-hot">热</span>' : ""));
  const tags = (v.vod_tags || []).slice(0, 2).map(t => `<span class="ctag" data-tag="${esc(t)}">${esc(t)}</span>`).join("");
  const del = opts.del ? `<span class="card-del${opts.delAlways ? " always" : ""}" data-del="1" title="移除">✕</span>` : "";
  const extra = opts.hist
    ? `<div class="hist-prog"><i style="width:${Math.min(100, Math.round((v.pos || 0) / (v.dur || 1) * 100))}%"></i></div>
       <div class="card-sub">${esc(v.epTitle || ("第" + (v.ep || 1) + "集"))} · ${fmtTime(v.pos || 0)}${v.dur ? " / " + fmtTime(v.dur) : ""}</div>`
    : (opts.sub ? `<div class="card-sub">${esc(opts.sub)}</div>` : "");
  return `
    <div class="card" data-i="${i}">
      <div class="thumb">
        ${badgeHtml}
        ${del}
        <img${imgAttrs(v.vod_pic, opts.w || 300, true)} alt="" referrerpolicy="no-referrer">
        ${(v.vod_plays || v.vod_remarks) ? `<div class="thumb-plays">
          ${v.vod_plays ? `<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>${esc(v.vod_plays)}` : ""}
          ${v.vod_remarks ? `<span class="rem">${esc(v.vod_remarks)}</span>` : ""}
        </div>` : ""}
      </div>
      <div class="card-title">${esc(v.vod_name)}</div>
      <div class="card-tags">${tags}</div>
      ${extra}
    </div>
  `;
}

function bindCards(gridEl, list, onOpen, onDel) {
  if (!gridEl) return;
  gridEl.querySelectorAll(".card").forEach(node => {
    node.onclick = (e) => {
      const i = +node.dataset.i;
      const tagEl = e.target.closest(".ctag");
      if (tagEl) {
        e.stopPropagation();
        goTag(tagEl.dataset.tag);
        return;
      }
      if (e.target.closest(".card-del")) {
        e.stopPropagation();
        if (onDel) onDel(list[i], i);
        return;
      }
      if (onOpen) onOpen(list[i], i);
    };
  });
}

function switchFilter(key, val) {
  const filters = Object.assign({}, state.filters);
  if (filters[key] === val) delete filters[key];
  else filters[key] = val;
  delete filters.recommend; delete filters.time;
  let title = "全部片库";
  for (const f of FILTERS) {
    if (filters[f.key] !== undefined && f.key !== "recommend" && f.key !== "time") {
      const opt = f.options.find(o => o[0] === filters[f.key]);
      if (opt) { title = opt[1]; break; }
    }
  }
  state.filters = filters;
  state.catTitle = title;
  state.pg = 1;
  renderNav();
  closeDrawer();
  renderListSkeleton();
  window.scrollTo(0, 0);

async function loadListPage(apiPath) {
  if (state.loading) return;
  state.loading = true;
  progress(true);
  const wantPg = state.pg;
  try {
    const data = await api("/" + apiPath, { pg: wantPg });
    const got = data.list || [];
    if (data.error || (!got.length && wantPg > 1)) {
      if (wantPg > 1) state.pg = 1;
      state.list = [];
      state.total = 0;
      renderEmpty("加载失败，请重试", "重试", "loadListPageRetry()");
    } else {
      state.list = got;
      state.total = data.total || 0;
      state.pagecount = data.pagecount || 1;
      renderListPage(apiPath);
    }
  } catch (e) {
    renderEmpty("加载失败，请重试", "重试", "loadListPageRetry()");
  }
  state.loading = false;
  progress(false);
}
function loadListPageRetry() {
  renderListSkeleton();
  const m = state.mode;
  loadListPage(["rank", "search", "tag", "category"].includes(m) ? m : "category");
}

function getRecentKeywords() {
  const v = lsGet(LS_SEARCH, []);

}
function pushRecentKeyword(wd) {
  const list = getRecentKeywords().filter(k => k !== wd);
  list.unshift(wd);
  lsSet(LS_SEARCH, list.slice(0, 10));
}
function renderSearchHist() {
  const box = document.getElementById("spHist");
  const list = getRecentKeywords();
  if (!list.length) { box.classList.remove("show"); box.innerHTML = ""; return; }
  box.classList.add("show");
  box.innerHTML = `<span class="sp-label">最近搜索</span>` +
    list.map(k => `<span class="sp-chip" data-kw="${esc(k)}">${esc(k)}<i class="sp-x" data-del="${esc(k)}" title="删除">✕</i></span>`).join("");
  box.querySelectorAll(".sp-chip").forEach(chip => {
    chip.onclick = (e) => {
      if (e.target.closest(".sp-x")) {
        e.stopPropagation();
        const kw = e.target.closest(".sp-x").dataset.del;
        lsSet(LS_SEARCH, getRecentKeywords().filter(k => k !== kw));
        renderSearchHist();
        return;

      doSearch();
    };

async function doSearch(kw) {
  const wd = (typeof kw === "string" ? kw : document.getElementById("wd").value).trim();
  if (!wd) return;
  pushRecentKeyword(wd);
  closeSearch();
  resetView();
  state.mode = "search";
  state.backTo = "search";
  state.keyword = wd;
  state.pg = 1;
  state.list = [];
  state.savedScrollY = 0;
  closeDrawer();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  progress(true);
  try {
    const data = await api("/search", { wd, pg: 1 });
    if (data.error) {
      renderEmpty("搜索失败，请重试", "重试", "doSearchRetry()");
    } else {
      state.list = data.list || [];
      state.pagecount = data.pagecount || 1;
      state.total = data.total || 0;
      renderListPage("search");
      if (!state.list.length) renderEmpty("未找到「" + esc(wd) + "」相关作品");
    }
  } catch (e) {
    renderEmpty("搜索失败，请重试", "重试", "doSearchRetry()");
  }
  progress(false);
}
function doSearchRetry() {
  renderListSkeleton();
  doSearch(state.keyword);
}

    ${heroes.length ? `<div class="hero-scroll" id="heroScroll">${heroCards}</div><div class="hero-dots" id="heroDots">${dots}</div>` : ""}
    ${contHtml}
    ${moduleHtml || '<div class="empty"><div class="ico">🎬</div><div>暂无内容</div></div>'}
  `;

  if (heroes.length) {
    app.querySelectorAll(".hero-card").forEach(node => {
      node.onclick = () => openDetail(heroes[+node.dataset.i], null, "home");
    });
    const scroll = document.getElementById("heroScroll");
    const dotsEl = document.getElementById("heroDots");
    scroll.addEventListener("scroll", () => {
      const cardW = scroll.querySelector(".hero-card")?.offsetWidth || 1;
      const idx = Math.round(scroll.scrollLeft / (cardW + 14));
      dotsEl.querySelectorAll(".dot-item").forEach((d, i) => d.classList.toggle("on", i === idx));
    }, { passive: true });
    dotsEl.querySelectorAll(".dot-item").forEach((d, i) => {
      d.onclick = () => {
        const card = scroll.querySelectorAll(".hero-card")[i];
        if (card) card.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
      };
    });
  }

  app.querySelectorAll(".cont-card").forEach(node => {
    node.onclick = () => {
      const h = hist[+node.dataset.i];
      openDetail({ vod_id: h.id, vod_name: h.name, vod_pic: h.pic, vod_remarks: h.remark, vod_tags: [] },
        { ep: h.ep, pos: h.pos }, "home");
    };
  });

  (state.modules || []).forEach(m => {
    bindCards(app.querySelector(`[data-mod-grid="${CSS.escape(m.code)}"]`), m.list, (v) => openDetail(v, null, "home"));
    const more = app.querySelector(`.more[data-mod="${CSS.escape(m.code)}"]`);
    if (more) more.onclick = () => {
      state.filters = Object.assign({}, MODULE_LINK[m.code]);
      state.catTitle = m.title;
      renderNav();
      switchCategory(Object.assign({}, MODULE_LINK[m.code]), m.title);
    };
  });
}

/* ---- 列表页 ---- */
function renderListPage(apiPath) {
  const app = document.getElementById("app");
  if (!state.list.length) { renderEmpty("暂无内容"); return; }

  const isRank = apiPath === "rank";
  const isSearch = apiPath === "search";
  const isTag = apiPath === "tag";
  const offset = (state.pg - 1) * (isRank ? 24 : isSearch ? 30 : 24);

  let filtersHtml = "";
  if (state.mode === "category") {
    filtersHtml = `<div class="filters">${FILTERS.map(f => `
      <div class="frow"><span class="flabel">${esc(f.title)}</span><div class="fchips">
        ${f.options.map(([val, name]) =>
          `<span class="fchip ${String(state.filters[f.key]) === String(val) ? "on" : ""}" data-fk="${f.key}" data-fv="${val}">${esc(name)}</span>`
        ).join("")}
      </div></div>
    `).join("")}</div>`;
  }

  const cards = state.list.map((v, i) => cardHtml(v, i, { w: 300, rank: isRank ? offset + i + 1 : 0 })).join("");

  const pg = state.pg;
  const pagecount = Math.max(1, state.pagecount);
  const pagerHtml = pagecount > 1 ? `
    <div class="pager">
      <button id="pgFirst" ${pg <= 1 ? "disabled" : ""}>首页</button>
      <button id="pgPrev" ${pg <= 1 ? "disabled" : ""}>上一页</button>
      <div class="pg-info">第 <b>${pg}</b> / ${pagecount} 页${state.total ? ` · 共${state.total}部` : ""}</div>
      <button id="pgNext" ${pg >= pagecount ? "disabled" : ""}>下一页</button>
      <button id="pgLast" ${pg >= pagecount ? "disabled" : ""}>末页</button>
      <div class="goto"><input type="number" id="pgInput" min="1" max="${pagecount}" placeholder="页码"></div>
    </div>
  ` : (state.total ? `<div class="pager"><div class="pg-info">共 ${state.total} 部</div></div>` : "");

  const title = isSearch ? `搜索：${esc(state.keyword)}`
    : isTag ? `<span class="hash">#</span>${esc(state.tagName)}`
    : esc(state.catTitle);

  app.innerHTML = `
    <div class="list-tools"><span class="bar"></span><div><h2>${title}</h2>${state.total ? `<div class="total">${isTag ? "该标签下共 " : "共 "}${state.total} 部作品</div>` : ""}</div></div>
    ${filtersHtml}
    <div class="grid" id="listGrid">${cards}</div>
    ${pagerHtml}
  `;

  if (state.mode === "category") {
    app.querySelectorAll(".fchip").forEach(chip => {
      chip.onclick = () => {
        const fk = chip.dataset.fk, fv = parseInt(chip.dataset.fv);
        const filters = Object.assign({}, state.filters);
        let title2;
        if (filters[fk] === fv) {
          delete filters[fk];
          title2 = "全部片库";
          for (const f of FILTERS) {
            if (filters[f.key] !== undefined && f.key !== "recommend" && f.key !== "time") {
              const opt = f.options.find(o => o[0] === filters[f.key]);
              if (opt) { title2 = opt[1]; break; }
            }
          }
        } else {
          filters[fk] = fv;
          title2 = chip.textContent.trim();
        }
        state.filters = filters;
        state.catTitle = title2;
        state.pg = 1;
        renderNav();
        renderListSkeleton();
        window.scrollTo(0, 0);
        loadListPage("category");
      };
    });
  }

  bindCards(document.getElementById("listGrid"), state.list, (v) => openDetail(v));

  const jumpTo = (p) => {
    p = Math.min(Math.max(1, p), pagecount);
    if (p === state.pg) return;
    state.pg = p;
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderListSkeleton();
    loadListPage(apiPath);
  };
  const $ = (id) => document.getElementById(id);
  if ($("pgFirst")) $("pgFirst").onclick = () => jumpTo(1);
  if ($("pgPrev")) $("pgPrev").onclick = () => jumpTo(pg - 1);
  if ($("pgNext")) $("pgNext").onclick = () => jumpTo(pg + 1);
  if ($("pgLast")) $("pgLast").onclick = () => jumpTo(pagecount);
  if ($("pgInput")) $("pgInput").onkeydown = (e) => {
    if (e.key === "Enter") { const v = parseInt($("pgInput").value); if (v) jumpTo(v); }
  };
}

/* ---- 收藏 ---- */
function renderFav() {
  const app = document.getElementById("app");
  const fav = getFav();
  if (!fav.length) {
    app.innerHTML = `<div class="empty"><div class="ico">💖</div><div>还没有收藏<br>播放页点「收藏」即可加入</div><span class="eact" onclick="goHome()">去逛逛</span></div>`;
    return;
  }
  const list = fav.map(f => ({
    vod_id: f.id, vod_name: f.name, vod_pic: f.pic,
    vod_remarks: f.remark, vod_tags: f.tags || [], vod_plays: "", vod_badge: ""
  }));
  app.innerHTML = `
    <div class="list-tools"><span class="bar"></span><div><h2>我的收藏</h2><div class="total">共 ${list.length} 部</div></div>
      <span class="act" id="favClear">清空全部</span></div>
    <div class="grid" id="favGrid">${list.map((v, i) => cardHtml(v, i, { w: 300, del: true, delAlways: true, sub: timeAgo(fav[i].ts) })).join("")}</div>
  `;
  bindCards(document.getElementById("favGrid"), list, (v) => openDetail(v, null, "fav"), (v) => {
    removeFav(v.vod_id);
    toast("已取消收藏");
    renderFav(); renderNav();
  });
  document.getElementById("favClear").onclick = () => {
    if (confirm(`确定清空全部 ${list.length} 部收藏？`)) {
      lsSet(LS_FAV, []);
      renderFav(); renderNav();
      toast("已清空收藏");
    }
  };
}

/* ---- 历史 ---- */
function renderHist() {
  const app = document.getElementById("app");
  const hist = getHist();
  if (!hist.length) {
    app.innerHTML = `<div class="empty"><div class="ico">🕐</div><div>暂无观看记录</div><span class="eact" onclick="goHome()">去看剧</span></div>`;
    return;
  }
  const list = hist.map(h => ({
    vod_id: h.id, vod_name: h.name, vod_pic: h.pic, vod_remarks: h.remark,

    ep: h.ep, epTitle: h.epTitle, pos: h.pos, dur: h.dur
  }));
  app.innerHTML = `
    <div class="list-tools"><span class="bar"></span><div><h2>观看历史</h2><div class="total">共 ${list.length} 条</div></div>
      <span class="act" id="histClear">清空全部</span></div>
    <div class="grid" id="histGrid">${list.map((v, i) => cardHtml(v, i, { w: 300, del: true, delAlways: true, hist: true })).join("")}</div>
  `;
