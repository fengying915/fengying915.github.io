  async function dataDetail(id) {
    const d = await apiGet("/api/videos/" + id);
    const info = (d && d.data && typeof d.data === "object") ? d.data : null;
    if (!info || !info.title) return null;
    const episodes = [];
    (Array.isArray(info.episodes) ? info.episodes : []).forEach((ep) => {
      if (ep.status !== undefined && ep.status !== 1) return;
      const n = String(ep.ep_num != null ? ep.ep_num : episodes.length + 1);
      episodes.push({ title: "第" + n + "集", num: num(n), playId: id + ":" + n });
    });
    if (!episodes.length) {
      const total = Math.max(1, num(info.episode_count || info.total_episodes, 1));
      for (let i = 1; i <= total; i++) episodes.push({ title: "第" + i + "集", num: i, playId: id + ":" + i });
    }
    const fin = info.is_finished === true || info.is_finished === 1;
    const vod = makeVod({
      id, name: info.title,
      pic: info.cover,
      remark: fin ? "全" + episodes.length + "集" : "更新至" + episodes.length + "集",
      plays: info.counts && info.counts.hot ? fmtPlays(info.counts.hot) : "",
      tags: info.tags || [],
      intro: info.description || ""
    });

  function extractPlayUrl(html, epNum) {
    if (!html) return "";
    const m = html.match(/<script id="videoInitialData" type="application\/json">([\s\S]*?)<\/script>/);
    if (m) {
      try {
        const data = JSON.parse(m[1]);
        let url = fixUrl(data.videoSrc || data.videoUrl || data.playUrl || data.src || "");
        if (!url && data.epPlaySrcs && typeof data.epPlaySrcs === "object") {
          const byEp = data.epPlaySrcs[String(epNum)];
          url = fixUrl(byEp || Object.values(data.epPlaySrcs)[0] || "");
        }
        if (url) return url;
      } catch (e) {}
    }
    const m2 = html.match(/data-play-src="(https?:\/\/[^"]+\.m3u8[^"]*)"/) || html.match(/"(https?:\/\/[^"]+\.m3u8[^"]*)"/);
    return m2 ? fixUrl(m2[1]) : "";
  }

  async function dataPlay(playId) {
    const parts = String(playId || "").split(":");
    const vid = parts[0] || "";
    const ep = parts[1] || "1";
    if (!vid) return { url: "" };
    let url = extractPlayUrl(await fetchPage("/video/" + vid + "/ep-" + ep + "/"), ep);
    if (!url) url = extractPlayUrl(await fetchPage("/video/" + vid + "/"), ep);
    if (!url && String(ep) === "1") {
      const d = await apiGet("/api/videos/" + vid);
      const info = (d && d.data && typeof d.data === "object") ? d.data : null;
      if (info) url = fixUrl(info.video_url || info.videoSrc || "");
    }
    return { url };
  }

  /* ---- 清单校验：黄果 CDN 会把非法请求替换成宣传片，需要识别 ---- */
  const DECOY_ID = "853acaba4721cceab535b64e6831f05a";
  function isDecoy(srcUrl, text) {
    if (!text || text.indexOf("#EXTM3U") < 0) return false;
    if (text.indexOf(DECOY_ID) >= 0) return true;
    const reqId = (String(srcUrl).match(/\/([0-9a-f]{32})\//i) || [])[1] || "";
    if (reqId) {
      const seg = (text.match(/^[^#\s][^\r\n]*/m) || [])[0] || "";
      const segId = (seg.match(/\/([0-9a-f]{32})\//i) || [])[1] || "";
      if (segId && segId.toLowerCase() !== reqId.toLowerCase()) return true;
    }
    const infs = text.match(/#EXTINF:([\d.]+)/g) || [];
    if (infs.length > 0 && infs.length <= 9) {
      const total = infs.reduce((a, s) => a + parseFloat(s.slice(8)), 0);
      if (total >= 45 && total <= 60) return true;
    }
    return false;
  }
  let goodChannel = null;
  const manifest = makeManifestStore();

  /** 备用文字中转：只在直连与代理全灭时才排队去试，不参与首轮竞速 */
  function relayChannels() {
    return PUBLIC_RELAYS.map((r) => ({ key: "pub-" + r.name, name: r.name, build: r.build }));
  }

  async function verify(srcUrl) {
    manifest.clear();
    const bust = srcUrl + (srcUrl.indexOf("?") >= 0 ? "&" : "?") + "_v=" + Date.now();
    const accept = (t) => !isDecoy(srcUrl, t);
    let r = await raceManifest(bust, { first: goodChannel, accept: accept });
    if (!r.chan) {
      // 首轮全灭：再挨个试文字中转（r.jina.ai 这类解析较慢，不适合放进首轮）
      for (const c of relayChannels()) {
        try {
          const raw = await ProxyPool.raw(c.build(bust), 9000);
          if (raw && raw.indexOf("#EXTM3U") >= 0 && accept(raw)) {
            r = { chan: c, text: raw, decoy: r.decoy };
            break;
          }
          if (raw && raw.indexOf("#EXTM3U") >= 0) r.decoy = true;
        } catch (e) { /* 换下一个 */ }
      }
    }
    if (!r.chan) return r.decoy ? "decoy" : "unknown";
    goodChannel = r.chan;
    manifest.set(srcUrl, hlsAbsolutize(r.text, srcUrl));
    return "ok";

      const linkRe = /href="\/t\/([^"?#/]+)/g;
      let lk;
      while ((lk = linkRe.exec(chunk)) !== null) {
        let name = "";
        try { name = decodeURIComponent(lk[1]); } catch (e) { name = lk[1]; }
        if (!name || seen.has(name)) continue;
        seen.add(name);
        children.push({ id: name, name });
      }
      if (children.length) groups.push({ id: "g:" + groups.length, name: title, children });
    });
    return groups;
  }
  async function loadCats() {
    if (catCache) return catCache;
    const saved = lsGet(LS_CATS, null);
    if (saved && Array.isArray(saved.v) && saved.v.length && Date.now() - num(saved.t) < 86400000) {
      catCache = saved.v;
      return catCache;
    }
    try {
      const html = await fetchHtml("/cat");
      if (html) {
        const groups = parseCatPage(html);
        if (groups.length) {
          catCache = groups;
          lsSet(LS_CATS, { t: Date.now(), v: groups });
          return catCache;
        }
      }
    } catch (e) { /* 走兜底 */ }
    catCache = [{ id: "g:base", name: "分类", children: CATS.map((c) => ({ id: c, name: c })) }];
    return catCache;
  }
  /** 解析列表要用的分类名：子分类优先，父分组则取第一个子分类 */
  function tagOf(parent, sel) {
    if (sel && sel.length) return sel[0];
    const p = String(parent || "");
    if (p && p.indexOf("g:") !== 0) return p;
    const g = catCache && catCache.find((x) => String(x.id) === p);
    if (g && g.children && g.children.length) return g.children[0].id;
    return "";
  }

  return {
    id: "rou",
    name: "肉视频",
    short: "肉视",
    desc: "页面直抓 · PNG 包裹 HLS 解码",
    color: "#ff3b5c",
    color2: "#ff7a45",
    theme: "rou",
    adult: true,
    features: { rank: true },
    rankLabel: "热门",
    noSub: true,
    async cats() {
      const groups = await loadCats();
      return [{ id: "", name: "全部", children: [] }].concat(groups);
    },
    api: {
      /**
       * 首页。/home 一次 SSR 吐出 100+ 条、426KB，走公共代理要 40s 以上
       * （实测 42~48s，管道只有十几 KB/s），等它不如用分类页拼。
       * 分类页 110KB / 3~13s，几页并行还能按分类分模块。
       * 只有拼装全空时才退回 /home 老路径。
       */
      async home() {
        const tags = homeTags();
        // 不等最慢的那一页：第一页回来后再给 2s 宽限，其余的就不管了，
        // 否则一条通道被限流会拖住整个首页（实测能差出 7s 以上）。
        const parts = await collect(
          tags.map((t) => list("/t/" + encodeURIComponent(t)).catch(() => ({ items: [] }))),
          2000
        );
        const seen = new Set();
        const modules = [];
        parts.forEach((d, i) => {
          const items = ((d && d.items) || []).filter((v) => {
            if (!v || seen.has(v.id)) return false;
            seen.add(v.id);
            return true;
          });
          if (!items.length) return;
          modules.push({
            code: "rou_" + i,
            title: tags[i],
            list: items.slice(0, 12),
            total: items.length,
            open: { parent: tags[i], sel: [], title: tags[i] }
          });
        });
        if (modules.length) {
          return { hero: modules[0].list.slice(0, 6), modules };
        }
        const d = await list("/home");
        return {
          hero: d.items.slice(0, 6),
          modules: [{ code: "recommend", title: "推荐", list: d.items.slice(0, 12), total: d.items.length, open: { parent: "", title: "推荐" } }]
        };
      },
      list: ({ parent, sel, page }) => {
        // 「全部」没有分类名时也不再落到 /home（426KB / 40s），
        // 退到第一个分类的列表页，体积小一个数量级。
        const tag = tagOf(parent, sel) || homeTags()[0] || "日本";
        return list("/t/" + encodeURIComponent(tag) + "?order=createdAt&page=" + (page || 1));
      },
      // 热门榜同样避开 /home（426KB）：用当前第一个分类按点赞排序，
      // 页面 110KB 上下，出榜快得多。
      rank: () => list("/t/" + encodeURIComponent(homeTags()[0] || "日本") + "?order=likeCount").then((d) => {
        d.items = d.items.map((v, i) => Object.assign({}, v, { rank: i + 1, metric: parseViews(v.plays), metricLabel: "观看" }));
        d.rows = true;
        return d;
      }),
      search: (kw, page) => list("/search?q=" + encodeURIComponent(kw) + "&page=" + (page || 1)),
      async detail(id, seed) {
        const html = await fetchHtml("/v/" + id);
        if (!html) return null;
        const d = doc(html);
        const og = d.querySelector("meta[property='og:image']");
        const cover = og ? og.getAttribute("content") || "" : (seed && seed.pic) || "";
        const h1 = d.querySelector("h1");
        const name = clean(h1 ? h1.textContent : "") || (seed && seed.name) || "作品";
        const dm = d.querySelector("meta[property='og:description'], meta[name='description']");
        let episodes = parseEpisodes(d);
        if (!episodes.length) episodes = [{ playId: id, num: 1, title: "第 1 集" }];
        return {
          vod: makeVod({ id, name, pic: cover, intro: dm ? dm.getAttribute("content") || "" : "", remark: episodes.length > 1 ? "全 " + episodes.length + " 集" : "" }),
          routes: [{ name: "肉视专线", episodes }]
        };
      },
      play: (epId) => ({ url: ORIGIN + "/api/hls/" + epId })
    },
    forceHls: () => true,
    makeLoader,
    hlsSource: (s) => s
  };
})();

/* ------------------------------------------------------------
 * 6.5 采集源（苹果CMS V10 通用适配器）
 * ---------------------------------------------------------- */
/** 没填说明时的默认文案：采集接口 · 域名 */
function cmsHostOf(api) {
  try { return "采集接口 · " + new URL(api).host; } catch (e) { return "采集接口 · CMS"; }
}

function createCmsSite(cfg) {
  const id = "cms_" + hashStr(cfg.api);
  const NAME = cfg.name || "采集源";
  const base = cfg.api;
  let classCache = null;
  let classAt = 0;
  let clsWeak = false;      // 当前分类是从列表条目推出来的（扁平），可以被接口的分类树覆盖
  let clsUpAt = 0;          // 最近一次后台升级的时间
  let proxyMode = false;
  const manifest = makeManifestStore();

  function withQuery(qs) {
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + qs;
  }

  /* ------------------------------------------------------------
   * 文章接口（小说 / 图片库）
   * ------------------------------------------------------------
   * 苹果CMS 的「小说」「图片」不是 vod 内容，而是文章模型，
   * 走同一个采集接口的 provide/art：…/api.php/provide/art?ac=list&pg=N&t=分类
   * vod 的分类表里往往只留下「精品小说 / 精品美图」这种空壳父分类，
   * 点进去没有数据（因为内容压根不在 vod 里）。这里把 art 的分类树接进来，
   * 让这些分类真的能出内容，并变成可阅读的文章页。
   */
  let artCache = null;      // art 分类树
  let artAt = 0;            // 最近一次尝试时间（失败也记，避免每页都白撞一次）
  const ART_TTL = 10 * 60000;
  const ART_HINT = /小说|图片|美图|图集|漫画|文章|图文|写真|阅读|书/i;

  /** 把 …/provide/vod 换成 …/provide/art；不含 vod 段的自定义接口不启用 */
  function artBase() {
    const b = String(base || "").split("?")[0].replace(/\/+$/, "");
    if (/\/vod$/i.test(b)) return b.slice(0, -3) + "art";
    if (/\/vod\//i.test(b)) return b.replace(/\/vod\//i, "/art/");
    return "";
  }
  function artUrl(qs) {
    const b = artBase();
    if (!b) return "";
    return b + (b.indexOf("?") >= 0 ? "&" : "?") + qs;
  }

  /** 读取 art 分类树；该源没有文章接口时静默返回空数组 */
  async function loadArtClasses(force) {
    if (!artBase()) return [];
    if (!force && artAt && Date.now() - artAt < ART_TTL) return artCache || [];
    artAt = Date.now();
    try {
      const d = await apiJSON(artUrl("ac=list"), { timeout: 14000 });
      const cls = normClasses(d);
      if (cls.length) artCache = cls;
    } catch (e) { /* 没有 art 接口或暂时不可用：不影响影视功能 */ }
    return artCache || [];
  }

  /** art 条目 → 统一卡片结构；id 加 a: 前缀，与 vod 的 id 区分 */
  function toArt(it) {
    if (!it) return null;
    const aid = String(it.art_id != null ? it.art_id : "").trim();
    const name = String(it.art_name || "").trim();
    if (!aid || !name) return null;
    // 「[db:图片]」是苹果CMS 未填图时的占位宏，直接当没图处理
    let pic = String(it.art_pic || "").trim();
    if (/^\[db:/i.test(pic)) pic = "";
    const tags = [];
    String(it.type_name || "").split(/[,，\/|]/).forEach((t) => {
      t = t.trim();
      if (t && tags.indexOf(t) < 0 && tags.length < 3) tags.push(t);
    });
    return makeVod({
      id: "a:" + aid, name,
      pic: fixUrl(pic),
      remark: it.art_remarks || (it.art_time ? String(it.art_time).slice(0, 10) : ""),
      plays: it.art_hits ? fmtPlays(it.art_hits) : "",
      tags,
      intro: it.art_blurb || "",
      type: it.type_name || "",
      extra: { time: it.art_time || "", art: true }
    });
  }
  const isArtId = (v) => String(v || "").indexOf("a:") === 0;
  const artIdOf = (v) => String(v || "").replace(/^a:t:/, "").replace(/^a:/, "");

  /** art 详情 → 文章块（文字 / 图片），供阅读页渲染 */
  async function artDetail(aid, seed) {
    const d = await apiJSON(artUrl("ac=detail&ids=" + encodeURIComponent(aid)), { timeout: 16000 });
    const it = d && Array.isArray(d.list) ? d.list[0] : null;
    if (!it) return null;
    const vod = toArt(Object.assign({}, it, { art_id: aid })) ||
      makeVod({ id: "a:" + aid, name: (seed && seed.name) || "文章" });
    const blocks = htmlToBlocks(it.art_content || "", 400);
    let intro = plainText(it.art_blurb || "", 160);
    // 苹果CMS 的 art_blurb 通常就是正文开头，正文已有就不重复显示导语
    const first = blocks.length && blocks[0].kind === "text" ? blocks[0].val : "";
    if (intro && first && first.slice(0, 24).indexOf(intro.slice(0, 12)) >= 0) intro = "";
    const meta = [it.type_name, it.art_author, (it.art_time || "").slice(0, 10),
      it.art_hits ? fmtPlays(it.art_hits) + "阅读" : ""].filter(Boolean).join(" · ");
    return {
      vod,
      article: {
        name: vod.name,
        meta,
        intro,
        blocks: blocks.length ? blocks : (it.art_blurb ? [{ kind: "text", val: plainText(it.art_blurb, 3000) }] : []),
        tags: vod.tags || [],
        chip: "阅读"
      }
    };
  }
  function normClasses(d) {
    if (!d) return [];
    let arr = d.class || d.classes || d.type || [];
    if (!Array.isArray(arr) && typeof arr === "object") arr = Object.values(arr);
    if (!Array.isArray(arr)) return [];
    const seen = new Set();
    const out = [];
    arr.forEach((c) => {
      if (!c) return;
      const tid = c.type_id != null ? c.type_id : c.id;
      const name = String(c.type_name || c.name || "").trim();
      if (tid == null || !name) return;
      const key = String(tid);
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ id: key, name, pid: String(c.type_pid != null ? c.type_pid : (c.pid != null ? c.pid : "0")) });
    });
    return out;
  }

  /* 分类表落盘缓存：同一采集源再次进入时立即出分类，避免每次等接口 */
  const LS_CLS = "dj_cms_cls_v1";
  const CLS_TTL = 12 * 3600 * 1000;
  function clsStore() {
    const v = lsGet(LS_CLS, null);
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  }
  function clsCacheRead() {
    const hit = clsStore()[base];
    if (!hit || !Array.isArray(hit.v) || !hit.v.length) return null;
    if (Date.now() - num(hit.t) > CLS_TTL) return null;
    return hit.v;
  }
  function clsCacheWrite(cls) {
    const all = clsStore();
    all[base] = { t: Date.now(), v: cls };
    const keys = Object.keys(all);
    if (keys.length > 40) keys.slice(0, keys.length - 40).forEach((k) => { delete all[k]; });
    lsSet(LS_CLS, all);
  }

  /**
   * 从任意影视响应里顺手捡分类。
   * 苹果CMS 的 ac=videolist 响应不一定带 class，但每条都带 type_id / type_name，
   * 整页扫一遍就能拼出扁平分类表 —— 省掉一次 ac=list 往返，切源快一半。
   * 这样得来的分类没有父子层级，记作「弱分类」：先用着，后台再换成接口给的完整分类表。
   */
  function learnClassesFrom(d) {
    const cls = normClasses(d);
    if (cls.length) {
      setClasses(cls, false);
      return cls;
    }
    const list = (d && Array.isArray(d.list)) ? d.list : [];
    if (!list.length || (classCache && classCache.length)) return null;
    const seen = new Map();
    list.forEach((it) => {
      if (!it) return;
      const tid = it.type_id != null ? it.type_id : (it.type != null ? it.type : null);
      const name = String(it.type_name || "").trim();
      if (tid == null || !name || seen.has(String(tid))) return;
      seen.set(String(tid), { id: String(tid), name: name, pid: "0" });
    });
    if (!seen.size) return null;
    setClasses(Array.from(seen.values()), true);
    return classCache;
  }

  function setClasses(cls, weak) {
    classCache = cls;
    classAt = Date.now();
    clsWeak = !!weak;
    if (!weak) clsCacheWrite(cls);      // 弱分类不落盘，下次照样问接口
  }

  /** 后台把弱分类换成完整分类树（不阻塞任何界面） */
  async function upgradeClasses() {
    if (!clsWeak || Date.now() - clsUpAt < 120000) return;
    clsUpAt = Date.now();
    const cls = await fetchClasses();
    if (!cls || !cls.length) return;
    setClasses(cls, false);
    if (state.site === id && state.mode !== "detail") ensureCats(true).catch(() => {});
  }

  /** 接口取分类：第一个变体先跑，没结果时剩下的错峰跟上，谁先出用谁 */
  let clsReq = null;
  function fetchClasses() {
    if (clsReq) return clsReq;          // 并发调用（切源时首页和导航同时要）合并成一次
    const queries = ["ac=list", "ac=list&pg=1", "ac=list&limit=20"];
    clsReq = new Promise((resolve) => {
      let done = false;
      const put = (cls) => { if (!done && cls && cls.length) { done = true; resolve(cls); } };
      queries.forEach((q, i) => {
        setTimeout(() => {
          if (done) return;
          apiJSON(withQuery(q), { timeout: 8000 })
            .then((d) => put(normClasses(d)), () => {})
            .catch(() => {});
        }, i * 700);
      });
      setTimeout(() => { if (!done) { done = true; resolve(null); } }, 11000);
    }).finally(() => { clsReq = null; });
    return clsReq;
  }

  /** 读取采集源分类：内存 → 落盘缓存 → 接口 */
  async function loadClasses(force) {
    if (!force && classCache && Date.now() - classAt < 600000) {
      if (clsWeak) upgradeClasses();          // 先用扁平分类顶着，后台换完整分类树
      return classCache;
    }
    if (!force) {
      const hit = clsCacheRead();
      if (hit) { setClasses(hit, false); return classCache; }
    }
    const hit = await fetchClasses();
    if (hit) {
      setClasses(hit, false);
      return classCache;
    }
    return classCache || [];
  }
  function typeIdOf(groupId) {
    return String(groupId || "").indexOf("t:") === 0 ? String(groupId).slice(2) : "";
  }

  /**
   * 分类导航：完全按该采集源自己的分类表生成
   *  - 有父子层级 → 父分类 = 一级分类（可整体浏览），子分类 = 二级分类（筛选）
   *  - 全部扁平    → 用主线分类体系归组，保证同样是两层结构
   * 之后再挂上文章接口（小说 / 图片）的分类，见 mergeArtGroups。
   */
  async function cats() {
    const groups = await catsVod();
    if (artCache) return mergeArtGroups(groups, artCache);
    // 文章分类不参与首屏：先给影视分类，探到小说/图片分类后再补一次导航
    loadArtClasses().then((cls) => {
      if (!cls || !cls.length) return;
      if (state.site === id && state.mode !== "detail") ensureCats(true).catch(() => {});
    }).catch(() => {});
    return groups;
  }

  /** 把 art 顶层分类做成一个导航组；父分类多数不可直接查，落到第一个子分类 */
  function artGroupOf(t, artCls) {
    const kids = artCls.filter((c) => c.pid === t.id).map((c) => ({ id: "a:t:" + c.id, name: c.name }));
    return {
      id: "a:t:" + t.id,
      name: t.name,
      children: kids.length ? kids : [{ id: "a:t:" + t.id, name: t.name }]
    };
  }

  /**
   * 合并文章分类
   * ------------------------------------------------------------
   * 只接管两类 art 顶层：
   *   1) vod 分类表里同 id 的顶层是个空壳（没有子分类）——内容其实在 art 里
   *   2) 名称明显是小说 / 图片 / 美图 / 漫画，且没在 vod 里当过子分类
   * 其余 art 分类原样不管，避免把正常影视分类换掉。
   */
  function mergeArtGroups(groups, artCls) {
    if (!artCls || !artCls.length) return groups;
    const tops = artCls.filter((c) => !c.pid || c.pid === "0");
    if (!tops.length) return groups;
    const take = tops.filter((t) => {
      const vodTop = groups.find((g) => String(g.id) === "t:" + t.id);
      const vodShell = vodTop && (!vodTop.children || !vodTop.children.length);
      const hinted = ART_HINT.test(t.name);
      const inVodChild = groups.some((g) => (g.children || []).some((c) => String(c.id) === "t:" + t.id));
      return vodShell || (hinted && !inVodChild);
    });
    if (!take.length) return groups;
    const out = [];
    groups.forEach((g) => {
      const t = take.find((x) => String(g.id) === "t:" + x.id);
      out.push(t ? artGroupOf(t, artCls) : g);   // 原位替换空壳分类，保持顺序
    });
    take.forEach((t) => {
      if (!out.some((g) => String(g.id) === "a:t:" + t.id)) out.push(artGroupOf(t, artCls));
    });
    return out;
  }

  /** 分类表 → 导航分组（纯计算，缓存命中时可同步拿到） */
  function groupsFromClasses(cls) {
    const groups = [{ id: "", name: "全部", children: [] }];
    if (!cls || !cls.length) return groups;
    const ids = new Set(cls.map((c) => c.id));
    const tops = cls.filter((c) => !c.pid || c.pid === "0");
    const hasTree = cls.some((c) => c.pid && c.pid !== "0" && ids.has(c.pid));

    if (hasTree) {
      tops.forEach((p) => {
        const children = cls.filter((c) => c.pid === p.id).map((c) => ({ id: "t:" + c.id, name: c.name }));
        // 多数苹果CMS只支持叶子分类查询，父分类点击后自动落到第一个子分类
        groups.push({ id: "t:" + p.id, name: p.name, children });
      });
      // 父级缺失的孤儿子类统一收进「其他」，避免分类丢失
      const orphans = cls.filter((c) => c.pid && c.pid !== "0" && !ids.has(c.pid));
      if (orphans.length) {
        groups.push({ id: "g:other", name: "其他", children: orphans.map((c) => ({ id: "t:" + c.id, name: c.name })) });
      }
      return groups;
    }

    // 扁平结构（站点没给父子关系）→ 每个分类本身就是一级分类，点哪个查哪个
    // 不再按硬编码词表猜分组：各源分类名差异太大，猜出来的父子关系大多是错的
    cls.forEach((c) => groups.push({ id: "t:" + c.id, name: c.name, children: [] }));
    return groups;
  }

  async function catsVod() {
    return groupsFromClasses(await loadClasses());
  }

  function toVod(it) {
    if (!it) return null;
    const vid = String(it.vod_id != null ? it.vod_id : it.id || "").trim();
    const name = String(it.vod_name || it.name || "").trim();
    if (!vid || !name) return null;
    const tags = [];
    String(it.vod_class || it.type_name || "").split(/[,，\/|]/).forEach((t) => {
      t = t.trim();
      if (t && tags.indexOf(t) < 0 && tags.length < 3) tags.push(t);
    });
    return makeVod({
      id: vid, name,
      pic: fixUrl(it.vod_pic || it.pic || ""),
      remark: it.vod_remarks || it.vod_note || "",
      plays: it.vod_hits ? fmtPlays(it.vod_hits) : "",
      tags,
      intro: it.vod_content || it.vod_blurb || "",
      type: it.type_name || "",
      extra: { time: it.vod_time || "" }
    });
  }

  /** 首页模块要用的分类：影视分类（文章分类 / 其他 不属于影视，跳过） */
  function modulePicks(groups) {
    return (groups || [])
      .filter((g) => g.id && g.id !== "g:other" && String(g.id).indexOf("a:") !== 0)
      .slice(0, 5);
  }
  /** 分类 → 查询用的 leaf 分类 id（父分类多数不可查，落到第一个子分类） */
  function pickTypeId(g) {
    return typeIdOf(g.children && g.children.length ? g.children[0].id : g.id);
  }
  const modulePage = (g) =>
    apiJSON(withQuery("ac=videolist&pg=1&t=" + encodeURIComponent(pickTypeId(g))), { timeout: 12000 }).catch(() => null);

  async function home() {
    /**
     * 首屏只等一次往返：分类表有缓存时，各分类首屏和「最新更新」一起发。
     * 冷启动则从这一页条目里现学分类（见 learnClassesFrom），再补一轮分类模块。
     */
    const warm = classCache || clsCacheRead() || null;
    let picks = warm ? modulePicks(groupsFromClasses(warm)) : [];
    let extraReqs = picks.map(modulePage);
    const d = await apiJSON(withQuery("ac=videolist&pg=1"), { timeout: 14000 });
    const list = ((d && d.list) || []).map(toVod).filter(Boolean);
    if (!list.length) return { error: true, hero: [], modules: [] };
    learnClassesFrom(d);
    if (!picks.length) {
      const groups = (await cats().catch(() => []));
      picks = modulePicks(groups);
      extraReqs = picks.map(modulePage);
    }
    const modules = [{ code: "all", title: "最新更新", list: list.slice(0, 12), total: num(d && d.total), open: { parent: "", title: "最新更新" } }];
    const extra = await Promise.all(extraReqs);
    extra.forEach((d2, i) => {
      const l = ((d2 && d2.list) || []).map(toVod).filter(Boolean);
      if (l.length >= 4) {
        const g = picks[i];
        modules.push({ code: "g:" + g.id, title: g.name + "精选", list: l.slice(0, 12), total: num(d2.total), open: { parent: g.id, title: g.name } });
      }
    });
    return { hero: list.slice(0, 6), modules };
  }

  /**
   * 列表数据：分类选择可能是父分类（t:父ID）或子分类（t:子ID）
   * 子分类优先；部分苹果CMS只支持叶子分类（父ID查不到数据），
   * 这时自动回退到该父分类的第一个子分类，避免出现空列表。
   */
  async function listData({ parent, sel, page }) {
    const picked = (sel && sel.length ? sel[0] : "") || parent;
    // 文章分类（小说 / 图片）走 art 接口，与影视的 videolist 完全分开
    if (String(picked).indexOf("a:t:") === 0) return artList(picked, page);
    const tid = typeIdOf(picked);
    const qs = "ac=videolist&pg=" + (page || 1) + (tid ? "&t=" + encodeURIComponent(tid) : "");
    const d = await apiJSON(withQuery(qs), { timeout: 16000 });
    if (!d) return { error: true, items: [], page: page || 1, pages: 1, total: 0 };
    let items = (d.list || []).map(toVod).filter(Boolean);
    let total = num(d.total);
    let pages = num(d.pagecount) || (total ? Math.ceil(total / Math.max(1, items.length)) : (items.length >= 20 ? page + 1 : page));
    if (!items.length && tid && !(sel && sel.length)) {
      const g = (await cats().catch(() => [])).find((x) => String(x.id) === "t:" + tid);
      const child = g && g.children && g.children[0];
      if (child) return listData({ parent: child.id, sel: [], page: page });
    }
    return { items, total, page: num(d.page, page), pages: Math.max(1, pages) };
  }

  /**
   * 文章分类列表（小说 / 图片库）
   * 苹果CMS 的 art 接口只认叶子分类，父分类查出来是 0 条，
   * 所以空结果时自动落到它的第一个子分类（只回退一层，防止来回打转）。
   */
  async function artList(picked, page, depth) {
    if (!artBase()) return { error: true, items: [], page: page || 1, pages: 1, total: 0 };
    const tid = artIdOf(picked);
    const qs = "ac=list&pg=" + (page || 1) + (tid ? "&t=" + encodeURIComponent(tid) : "");
    const d = await apiJSON(artUrl(qs), { timeout: 16000 });
    if (!d) return { error: true, items: [], page: page || 1, pages: 1, total: 0 };
    const items = (d.list || []).map(toArt).filter(Boolean);
    const total = num(d.total);
    const pages = num(d.pagecount) || (total ? Math.ceil(total / Math.max(1, items.length || 20)) : page);
    if (!items.length && tid && !depth) {
      const kid = (artCache || []).find((c) => c.pid === tid);
      if (kid) return artList("a:t:" + kid.id, page, 1);
    }
    return { items, total, page: num(d.page, page), pages: Math.max(1, pages) };
  }

  /* ------------------------------------------------------------
   * 采集源排行榜
   * ------------------------------------------------------------
   * 苹果CMS 没有榜单接口，只有按时间倒序的列表。
   * 这里把「最新更新」当作排行榜：并发取前 3 页（多数源每页 20 条），
   * 按 vod_time 再排一次、去重后取前 50 部，作为该源的榜单。
   */
  const RANK_SIZE = 50;
  let rankCache = null, rankAt = 0;
  const RANK_TTL = 3 * 60000;              // 榜单 3 分钟内复用，避免反复进页发 3 个请求
  async function rankData() {
    if (rankCache && Date.now() - rankAt < RANK_TTL) return rankCache;
    const pages = [1, 2, 3];
    const res = await Promise.all(pages.map((pg) =>
      apiJSON(withQuery("ac=videolist&pg=" + pg), { timeout: 16000 }).catch(() => null)
    ));
    const seen = new Set();
    const items = [];
    res.forEach((d) => {
      ((d && d.list) || []).forEach((it) => {
        const v = toVod(it);
        if (!v || seen.has(v.id)) return;
        seen.add(v.id);
        items.push(v);
      });
    });
    if (!items.length) return { error: true, items: [], page: 1, pages: 1, total: 0 };
    // 跨页合并后按更新时间倒序（缺时间的排到最后），再截前 50
    const t = (v) => String((v.extra && v.extra.time) || "");
    items.sort((a, b) => t(b).localeCompare(t(a)));
    const list = items.slice(0, RANK_SIZE);
    list.forEach((v, i) => { v.rank = i + 1; });
    rankCache = { items: list, page: 1, pages: 1, total: list.length, rows: false };
    rankAt = Date.now();
    return rankCache;
  }

  async function detail(vid, seed) {
    // 文章：没有播放源，直接返回可阅读的正文
    if (isArtId(vid)) return artDetail(artIdOf(vid), seed);
    /**
     * 详情两次尝试，兜住两类常见站：
     *   1) ac=detail 偶发超时 —— 第二次先 ProxyPool.forget()，别吊死在同一个粘性代理上；
     *   2) 老站只认 ac=videolist&ids=，ac=detail 返回 list 但没有 vod_play_url。
     * 第一次拿到带播放地址的就直接结束，多数站还是 1 次请求。
     */
    const tries = [
      { q: "ac=detail&ids=", timeout: 12000 },
      { q: "ac=videolist&ids=", timeout: 8000 }
    ];
    let item = null;
    let fallback = null;              // 有数据但没播放地址的那份，最后兜底提示「暂无播放源」
    for (let i = 0; i < tries.length; i++) {
      if (i) ProxyPool.forget();
      let d = null;
      try {
        d = await apiJSON(withQuery(tries[i].q + encodeURIComponent(vid)), { timeout: tries[i].timeout });
      } catch (e) { d = null; }
      const it = d && Array.isArray(d.list) ? d.list[0] : null;
      if (!it) continue;
      // videolist 可能忽略 ids 参数返回别的条目，必须对得上 id 才算数
      const same = String(it.vod_id == null ? "" : it.vod_id) === String(vid);
      if (same && String(it.vod_play_url || "").trim()) { item = it; break; }
      if (!fallback) fallback = it;
    }
    item = item || fallback;
    if (!item) return null;
    const vod = toVod(item) || makeVod({ id: vid, name: seed && seed.name });
    vod.intro = plainText(item.vod_content || item.vod_blurb || vod.intro, 1200);
    const froms = String(item.vod_play_from || "").split("$$$");
    const urls = String(item.vod_play_url || "").split("$$$");
    const routes = [];
    urls.forEach((raw, i) => {
      const eps = parseEpisodes(raw).map((e, k) => ({ title: e.title || "第" + (k + 1) + "集", num: k + 1, playId: e.playId }));
      if (eps.length) routes.push({ name: (froms[i] || "线路" + (i + 1)).trim() || "线路" + (i + 1), episodes: eps });
    });
    if (!routes.length) return null;
    // 直链线路（.m3u8/.mp4）排在前面，分享页线路靠后，用户点开即可播
    routes.forEach((r) => { r._score = isMediaUrl(r.episodes[0].playId) ? 0 : 1; });
    routes.sort((a, b) => a._score - b._score);
    routes.forEach((r) => { delete r._score; });
    return { vod, routes };
  }

  /* ---- 播放：直链直接用；分享页/播放页则先解析出真实 m3u8 ---- */
  function proxyBase() {
    const win = ProxyPool.win();
    // 记着的那条要是正被限流，就别拿它拼地址（pool() 已把失效的排到后面）
    if (win && !ProxyPool.badNow(win)) return win;
    return ProxyPool.pool().find((p) => !ProxyPool.isParam(p)) || ProxyPool.pool()[0] || "";
  }
  /**
   * 采集源的 vod_play_url 里常见三种形态：
   *   1) 直接 .m3u8 / .mp4      → 直接播
   *   2) 站内分享页 /share/xxx  → 抓页面提取 var main="...m3u8"
   *   3) 站内播放页 /play/xxx   → 同上
   */
  /**
   * 清单预取：直连与代理同时试，短超时。
   * hls.js 自己去拿清单时用的是它的长超时（挂住的直连要等满 10 秒），
   * 这里换成我们自己的竞速，拿到就转成 blob 交给播放器，起播快很多；
   * 顺带把相对地址补全，分片就不会按 blob: 去解析。
   */
  async function preloadManifest(u) {
    try {
      // 8000 而不是 6000：直连第一次要等 DNS 解析，冷启动能到 5~7s，
      // 预取成功就能省掉 hls.js 自己再摸一遍的时间（那一段是要用户干等的）。
      const r = await raceManifest(u, { timeout: 8000 });
      if (!r.chan || !r.text) return false;
      manifest.set(u, hlsAbsolutize(r.text, u));
      return true;
    } catch (e) { return false; }
  }

  async function resolvePlay(raw) {
    const u = fixUrl(raw);
    if (!u) throw new Error("未获取到播放地址");
    if (isMediaUrl(u)) {
      await preloadManifest(u);          // 失败就让 hls.js 自己取，不影响播放
      return { url: u };
    }
    if (!/^https?:\/\//i.test(u)) return { url: u };
    try {
      const html = await apiText(u, {
        timeout: 14000,
        validate: (t) => !!t && t.length > 120 && t.indexOf("<html") >= 0
      });
      if (html) {
        const m = pickMediaFromHtml(html, u);
        if (m) { await preloadManifest(m); return { url: m, from: "resolved" }; }
      }
    } catch (e) { /* 解析失败则回退原地址 */ }
    return { url: u };
  }
  function makeLoader() {
    return makeProxyLoader((orig) => {
      if (!proxyMode) return "";
      const b = proxyBase();
      return b ? ProxyPool.build(b, orig) : "";
    });
  }

  return {
    id, name: NAME, short: (NAME || "采集").slice(0, 2),
    desc: String(cfg.desc || "").trim() || cmsHostOf(base),
    logo: String(cfg.logo || "").trim(),      // 在线图标地址，空则用渐变底 + 首字
    url: String(cfg.url || "").trim(),        // 源官网，空则不显示链接
    color: "#7c9bff", color2: "#a06bff", theme: "cms",
    adult: !!cfg.adult,
    features: { rank: true },
    /* 采集源没有真榜单：以「最新更新」的前 50 部作为排行榜 */
    rankTabs: [{ id: "new", name: "最新更新", desc: "按更新时间排序 · 前 50 部" }],
    cmsApi: base,
    canProxy: true,
    enableProxy() { proxyMode = true; },
    proxyMode() { return proxyMode; },
    async cats() { try { return await cats(); } catch (e) { return [{ id: "", name: "全部", children: [] }]; } },
    api: {
      home,
      list: listData,
      rank: rankData,
      search: (kw, page) => {
        const qs = "ac=videolist&wd=" + encodeURIComponent(kw) + "&pg=" + (page || 1);
        return apiJSON(withQuery(qs), { timeout: 16000 }).then((d) => {
          if (!d) return { error: true, items: [], page: page || 1, pages: 1, total: 0 };
          const items = (d.list || []).map(toVod).filter(Boolean);
          const total = num(d.total);
          const pages = num(d.pagecount) || (total ? Math.ceil(total / 20) : (items.length >= 20 ? page + 1 : page));
          return { items, total, page: num(d.page, page), pages: Math.max(1, pages) };
        });
      },
      detail,
      play: resolvePlay
    },
    makeLoader,
    hlsSource: (s) => manifest.take(s)
  };
}

 * ---------------------------------------------------------- */
const SITES = { hg: HG, jg: JG, yg: YG, rou: ROU };
const MAIN_SITES = ["hg", "jg", "yg", "rou"];

/** 默认采集源 → 存储结构（[名称, 接口, 说明, 图标, 官网, 是否成人站]） */
function defaultCmsList() {
  return DEFAULT_CMS.map(([name, api, desc, logo, url, adult]) => ({
    id: "cms_" + hashStr(api),
    name: name,
    api: api,
    adult: !!adult,
    desc: String(desc || ""),
    logo: String(logo || ""),
    url: String(url || "")
  }));
}

/** 名称里的 18+ 标记：命中即判为成人站，同时从名称里抹掉 */
const ADULT_RE = /🔞|18\+|18禁/;
function cmsNameClean(name) {
  return String(name || "").replace(/🔞|18\+|18禁/g, "").trim() || "采集源";
}
/**
 * 采集源的展示字段规整：图标/官网只收 http(s)，说明截 60 字，空值不写进存储。
 * old 为空表示新增；否则 patch 里 undefined 的字段沿用旧值。
 */
function cmsShowFields(patch, old) {
  const pick = (k) => (patch[k] === undefined && old ? old[k] : patch[k]);
  const out = {};
  const logo = String(pick("logo") || "").trim();
  const url = String(pick("url") || "").trim();
  const desc = String(pick("desc") || "").trim().slice(0, 60);
  if (/^https?:\/\//i.test(logo)) out.logo = logo;
  if (/^https?:\/\//i.test(url)) out.url = url;
  if (desc) out.desc = desc;
  return out;
}

const CmsStore = {
  /** 读取采集源列表；还没有存储时直接用内置清单 */
  load() {
    const saved = lsGet(LS.cms, null);
    return Array.isArray(saved) && saved.length ? saved : defaultCmsList();
  },
  /** 把列表里的采集源注册进 SITES（幂等；不调用 all()，避免递归） */
  ensure(list) {
    (list || []).forEach((cfg) => {
      const id = "cms_" + hashStr(cfg.api);
      if (!SITES[id] || SITES[id].cmsApi !== cfg.api) {
        SITES[id] = createCmsSite({ id, name: cfg.name, api: cfg.api, adult: cfg.adult });
      }
      SITES[id].id = id;
      SITES[id].name = cfg.name;
      SITES[id].short = String(cfg.name || "采集").slice(0, 2);
      SITES[id].adult = !!cfg.adult;
      // 图标 / 说明 / 官网每次同步，改完不用重启
      SITES[id].logo = String(cfg.logo || "").trim();
      SITES[id].desc = String(cfg.desc || "").trim() || cmsHostOf(cfg.api);
      SITES[id].url = String(cfg.url || "").trim();
    });
  },
  /** 列表 + 顺手注册，保证调用方一定能拿到对应的 SITES 实例 */
  all() {
    const list = this.load();
    this.ensure(list);
    return list;
  },
  save(list) {
    // id 统一由接口地址推导，保证 update / remove 能按 id 直接命中
    const rows = (list || []).map((x) => Object.assign({}, x, { id: "cms_" + hashStr(x.api) }));
    lsSet(LS.cms, rows);
    this.ensure(rows);
    return rows;
  },
  /**
   * 新增采集源。
   * extra 可选：{ logo, desc, url } —— 图标地址、源说明、源官网，都只收 http(s)。
   */
  add(name, api, adult, extra) {
    api = String(api || "").trim();
    if (!/^https?:\/\//i.test(api)) return { ok: false, msg: "请输入以 http(s):// 开头的接口地址" };
    const list = this.all();
    if (list.some((x) => x.api === api)) return { ok: false, msg: "该接口已存在" };
    const item = Object.assign(
      {
        id: "cms_" + hashStr(api),
        name: cmsNameClean(name),
        api,
        adult: adult === undefined ? ADULT_RE.test(String(name || "")) : !!adult
      },
      cmsShowFields(extra || {}, null)
    );
    list.push(item);
    this.save(list);
    return { ok: true, item };
  },
  /**
   * 修改采集源的展示字段（名称 / 图标 / 说明 / 官网 / 18+）。
   * 接口地址刻意不允许改：id 由 api 哈希得来，改了等于换源，历史与进度会全部对不上。
   * patch 里字段为 undefined 表示保持原值，传空串表示清空。
   */
  update(id, patch) {
    const list = this.all();
    const i = list.findIndex((x) => x.id === id);
    if (i < 0) return { ok: false, msg: "采集源不存在" };
    const old = list[i];
    const x = patch || {};
    const name = cmsNameClean(x.name === undefined ? old.name : x.name);
    const item = Object.assign(
      {
        id: old.id,
        name,
        api: old.api,
        adult: x.adult === undefined ? (ADULT_RE.test(String(x.name || "")) || !!old.adult) : !!x.adult
      },
      cmsShowFields(x, old)
    );
    list[i] = item;
    this.save(list);
    return { ok: true, item };
  },
  remove(id) {
    this.save(this.all().filter((x) => x.id !== id));
  }
};

/** 全部站源（主站 + 采集源） */
function allSites() {
  const main = MAIN_SITES.map((id) => SITES[id]);
  const cms = CmsStore.all().map((c) => SITES["cms_" + hashStr(c.api)]).filter(Boolean);
  return main.concat(cms);
}
function getSite(id) {
  if (SITES[id]) return SITES[id];
  if (id && id.indexOf("cms_") === 0) {
    const cfg = CmsStore.all().find((c) => "cms_" + hashStr(c.api) === id);
    if (cfg) {
      SITES[id] = createCmsSite({ id, name: cfg.name, api: cfg.api, adult: cfg.adult });
      return SITES[id];
    }
  }
  return HG;
}
function currentSite() { return getSite(state.site); }

/**
 * 顶部分类条
 * ------------------------------------------------------------
 * 分类原本只在抽屉里，切一次要「打开抽屉 → 找分类 → 点」三步；
 * 这里把当前站源的顶层分类直接铺在页头下方，横向滚动一步直达。
 * 只在首页 / 列表页出现，详情、播放、设置等页面自动收起。
 */
function renderCatNav() {
  const el = $("catnav");
  if (!el) return;
  const cats = state.cats || [];
  const mode = state.mode;
  const show = cats.length > 0 && (mode === "home" || mode === "list");
  el.style.display = show ? "flex" : "none";
  // 整行联动：没有分类条时移动端收起整行，桌面只保留「首页」胶囊
  const sub = el.parentElement;
  if (sub) sub.classList.toggle("bare", !show);
  if (!show) { el.innerHTML = ""; return; }   // 切源后清掉上一个站的分类，避免隐藏容器里留旧内容

  const cur = mode === "list" ? String(state.list.parent) : "";
  el.innerHTML = cats.map((g) => {
    // 「全部」的 id 是空串：列表页按 parent 判断，首页则让它保持高亮（表示未筛选）
    const on = mode === "list" ? String(g.id) === cur : String(g.id) === "";
    return '<span class="clink ' + (on ? "on" : "") + '" data-act="cat" data-id="' + esc(g.id) + '">' +
      esc(g.name) + "</span>";
  }).join("");

  // 当前分类可能滚出屏幕，切站源/回列表时把它带回可视区
  const on = el.querySelector(".clink.on");
  if (on && el.scrollWidth > el.clientWidth) {
    const left = on.offsetLeft - (el.clientWidth - on.offsetWidth) / 2;
    el.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
  }
}

/** 加载当前站源的分类导航 */
async function ensureCats(force) {
  const site = currentSite();
  const sid = site.id;
  if (!force && state.catsKey === sid && state.cats.length) return state.cats;
  let groups = null;
  if (typeof site.cats === "function") {
    try { groups = await site.cats(); } catch (e) { groups = null; }
  }
  // 拿到结果前用户已经切了站：这份分类属于旧站，直接丢掉
  if (state.site !== sid) return state.cats || [];
  state.cats = Array.isArray(groups) && groups.length ? groups : [{ id: "", name: "全部", children: [] }];
  state.catsKey = sid;
  if (!state.cats.some((g) => String(g.id) === String(state.list.parent))) {
    state.list.parent = state.cats[0].id;
    state.list.sel = [];
  }
  renderCatNav();      // 分类是异步来的，拿到后补一次顶部条
  return state.cats;
}

/** 若传入的是子分类 id，自动映射成「父分类 + 选中该子分类」 */
function normalizeListParent() {
  const cats = state.cats || [];
  if (!cats.length) return;
  const pid = String(state.list.parent);
  const self = cats.find((g) => String(g.id) === pid);
  if (self) {
    // 父分类下有子分类、且当前没有任何筛选 → 自动落到第一个子分类，避免空列表
    if (!self.container && self.children && self.children.length && !state.list.sel.length) {
      state.list.sel = [self.children[0].id];
    }
    return;
  }
  for (const g of cats) {
    const hit = (g.children || []).find((c) => String(c.id) === pid);
    if (hit) {
      state.list.parent = g.id;
      if (!state.list.sel.length) state.list.sel = [hit.id];
      return;
    }
  }
  state.list.parent = cats[0].id;
  state.list.sel = [];
}

function resetViewState() {

  state.backTo = "home";
  state.detail = null;
  state.routes = [];
  state.episodes = [];
  state.curEp = 0;

  state.list = { kind: "category", title: "", items: [], page: 1, pages: 1, total: 0, parent: "", sel: [], sort: "", keyword: "", tagSlug: "", slug: "", sub: "", subs: [], view: "" };
  state.listSeq = (state.listSeq || 0) + 1;      // 作废尚未返回的列表请求

function setSite(id, opts) {
  opts = opts || {};
  const site = getSite(id);
  if (!site) return;
  closeSheet();
  if (id === state.site && !opts.force) { closeDrawer(); return; }
  warmStop();                    // 已经选定了，别再让预热请求占通道
  resetViewState();

  try { localStorage.setItem(LS.site, id); } catch (e) {}
  // 切到有域名清单的站源（黄果）时后台刷新一次可用域名
  if (site.warm) { try { site.warm(); } catch (e) {} }

/* ------------------------------------------------------------

 * ------------------------------------------------------------
 * 黄果 / 禁果 / 野果 站点各有「标签页」，标签点击可直达该标签的片单；
 * 肉视频与采集源没有标签页，标签只作展示（不可点）。
 * ---------------------------------------------------------- */
function taggable(site) {
  const s = site || currentSite();
  return !!(s && s.api && typeof s.api.tag === "function");
}
function tagChipHtml(tag, v, cls) {
  cls = cls || "ctag";
  const site = currentSite();
  const sameSite = !v || !v.site || v.site === site.id;
  if (!taggable(site) || !sameSite) return '<span class="' + cls + ' plain">' + esc(tag) + "</span>";
  const slug = (v && v.tagRefs && v.tagRefs[tag]) || "";
  return '<span class="' + cls + '" data-act="tagOpen" data-kw="' + esc(tag) + '"' +
    (slug ? ' data-slug="' + esc(slug) + '"' : "") + ">" + esc(tag) + "</span>";
}

function heroHtml(list, clone) {
  const site = currentSite();
  return list.map((v, i) => {
    const desc = site.heroDesc ? site.heroDesc(v) : (v.intro || v.tags.join(" / "));
    return '<div class="hero-card" data-act="open" data-i="' + i + '" data-src="hero"' + (clone ? ' data-clone="1"' : "") + ">" +
      "<img " + imgAttrs(v.pic, 760, clone || i > 0, !clone && i === 0) + ">" +
      '<span class="hero-play">' + ICONS.play + "</span>" +
      '<div class="hero-info"><div class="hero-badges">' +
        '<span class="hero-rank">🔥 ' + esc(site.heroLabel || "推荐") + " TOP" + (i + 1) + "</span>" +
        (v.remark ? '<span class="hero-chip">' + esc(v.remark) + "</span>" : "") +
        v.tags.slice(0, 3).map((t) => tagChipHtml(t, v, "hero-chip")).join("") +
      "</div>" +
      '<div class="hero-title">' + esc(v.name) + "</div>" +
      (desc ? '<div class="hero-desc">' + esc(plainText(desc, 80)) + "</div>" : "") +
      "</div></div>";
  }).join("");
}

/**
 * 卡片右上角的分类名
 * ------------------------------------------------------------
 * 规则：当前选中了某个子分类 → 显示该子分类名；
 *       没选子分类（或该分类本身没有子分类）→ 显示父分类名；
 *       首页 / 搜索 / 标签 / 榜单等没有「当前分类」的场景 → 用条目自带的分类（采集源的 type_name）。
 */
function catLabelOf(v) {
  const l = state.list || {};
  const own = String((v && v.type) || "").trim();
  if (state.mode === "list" && l.kind === "category") {
    const group = (state.cats || []).find((g) => String(g.id) === String(l.parent));
    const sel = (l.sel || []).map(String);
    if (sel.length === 1 && group && group.children) {
      const c = group.children.find((x) => String(x.id) === sel[0]);
      if (c && c.name) return c.name;
    }
    if (own) return own;
    // 「全部」和野果/肉这类多选筛选维度（排序、主题、时间…）不是真分类，不打角标
    if (!group || !group.name || String(group.id) === "" || String(group.name) === "全部") return "";
    const site = currentSite();
    if (site && site.multiSel) return "";
    return String(group.name);
  }
  return own;
}

function cardHtml(v, idx, opts) {
  opts = opts || {};
  const badge = v.rank
    ? '<span class="badge rank r' + Math.min(v.rank, 3) + '">' + (v.rank <= 3 ? "TOP" : "") + v.rank + "</span>"
    : (v.badge === "new" ? '<span class="badge new">新</span>'
      : v.badge === "vip" ? '<span class="badge vip">VIP</span>'
      : v.badge === "hot" ? '<span class="badge hot">热</span>' : "");
  // 右上角分类标签：收藏/历史卡右上角是删除按钮，让位不显示
  const cat = (opts.del || opts.hist) ? "" : catLabelOf(v);
  const catBadge = cat ? '<span class="badge cat" title="' + esc(cat) + '">' + esc(cat) + "</span>" : "";
  const tags = v.tags.slice(0, 3).map((t) => tagChipHtml(t, v, "ctag")).join("");
  const del = opts.del ? '<span class="card-del' + (opts.delAlways ? " always" : "") + '" data-act="' + (opts.delAct || "del") + '" data-i="' + idx + '" title="移除">✕</span>' : "";
  const sub = opts.hist
    ? '<div class="hist-prog"><i style="width:' + clamp(Math.round(num(v.pos) / Math.max(1, num(v.dur)) * 100), 0, 100) + '%"></i></div>' +
      '<div class="card-sub">' + esc(v.epTitle || ("第" + (num(v.ep, 1)) + "集")) + " · " + fmtTime(v.pos) + (v.dur ? " / " + fmtTime(v.dur) : "") + "</div>"
    : (opts.sub ? '<div class="card-sub">' + esc(opts.sub) + "</div>" : "");
  const noPic = !String(v.pic || "").trim();
  return '<div class="card" data-act="' + (opts.act || "open") + '" data-i="' + idx + '" data-src="' + (opts.src || "list") + '">' +
    '<div class="thumb">' + badge + catBadge + del +
      (noPic
        ? '<div class="thumb-ph"><span>' + esc(String(v.name || "?").slice(0, 1)) + "</span></div>"
        : "<img " + imgAttrs(v.pic, 300, true) + ">") +
      ((v.plays || v.remark) ? '<div class="thumb-meta">' +
        (v.plays ? ICONS.play + esc(v.plays) : "") +
        (v.remark ? '<span class="rem">' + esc(v.remark) + "</span>" : "") + "</div>" : "") +
    "</div>" +
    '<div class="card-title">' + esc(v.name) + "</div>" +
    '<div class="card-tags">' + tags + "</div>" + sub + "</div>";
}

      (m.open ? '<span class="more" data-act="modMore" data-i="' + mi + '">查看更多<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>' : "") +
      "</div>" +
      '<div class="grid">' + m.list.map((v, i) =>
        '<div class="card" data-act="openMod" data-m="' + mi + '" data-i="' + i + '">' +
        '<div class="thumb">' + (v.badge === "new" ? '<span class="badge new">新</span>' : v.badge === "hot" ? '<span class="badge hot">热</span>' : v.badge === "vip" ? '<span class="badge vip">VIP</span>' : "") +
        "<img " + imgAttrs(v.pic, 300, true) + ">" +
        ((v.plays || v.remark) ? '<div class="thumb-meta">' + (v.plays ? ICONS.play + esc(v.plays) : "") + (v.remark ? '<span class="rem">' + esc(v.remark) + "</span>" : "") + "</div>" : "") +
        "</div>" +
        '<div class="card-title">' + esc(v.name) + "</div>" +

/* ------------------------------------------------------------
 * 7.2.1 Hero 自动轮播
 * ------------------------------------------------------------
 * · 单定时器驱动：每 4.6s 前进一步，位移 = 卡片宽 + gap，behavior:smooth
 * · 末张回到首张形成循环；hover / 触摸 / 滚轮 / 手动拖动时暂停，1.2s 后恢复
 * · 视图被替换（sc 脱离文档）或切到后台时自动停表，避免空转与误滚动
 * · 受设置页「首页轮播自动播放」开关控制（Prefs.heroAuto）
 * ---------------------------------------------------------- */
const HeroAuto = {
  DELAY: 3000,
  timer: 0,
  paused: false,
  resumeT: 0,
  stop() {
    if (this.timer) clearInterval(this.timer);
    if (this.resumeT) clearTimeout(this.resumeT);
    this.timer = 0; this.resumeT = 0; this.paused = false;
  },
  step(sc) {
    const cards = sc.querySelectorAll(".hero-card");
    if (cards.length < 2) return;
    const total = (state.home.hero || []).length || cards.length;
    const w = cards[0].offsetWidth + 14;            // 14 = .hero 的 gap
    const cur = Math.round(sc.scrollLeft / w);
    const next = cur + 1;
    const max = sc.scrollWidth - sc.clientWidth;
    if (next * w > max + 2) { sc.scrollLeft = 0; return; }   // 极端情况兜底，保证继续循环
    sc.scrollTo({ left: next * w, behavior: "smooth" });
  },
  start(sc) {
    this.stop();
    if (!sc || !Prefs.d.heroAuto) return;
    this.timer = setInterval(() => {
      if (!sc.isConnected || state.mode !== "home") { this.stop(); return; }
      if (this.paused || document.hidden) return;
      this.step(sc);
    }, this.DELAY);

    const hold = () => {
      this.paused = true;
      if (this.resumeT) clearTimeout(this.resumeT);
      this.resumeT = 0;
    };
    const resume = () => {
      if (this.resumeT) clearTimeout(this.resumeT);
      this.resumeT = setTimeout(() => { this.paused = false; this.resumeT = 0; }, 1200);
    };
    sc.addEventListener("pointerenter", hold);
    sc.addEventListener("pointerleave", resume);
    sc.addEventListener("touchstart", hold, { passive: true });
    sc.addEventListener("touchend", resume, { passive: true });
    sc.addEventListener("wheel", () => { hold(); resume(); }, { passive: true });
  }
};

function bindHero() {
  HeroAuto.stop();
  const sc = $("heroScroll");
  if (!sc) return;
  const dots = $("heroDots");
  const total = (state.home.hero || []).length;
  let settleT = 0;
  sc.addEventListener("scroll", () => {
    const card = sc.querySelector(".hero-card");
    if (!card) return;
    const w = card.offsetWidth + 14;
    const idx = Math.round(sc.scrollLeft / w) % Math.max(1, total);
    if (dots) $$("i", dots).forEach((d, i) => d.classList.toggle("on", i === idx));
    // 滚动停下后再归一化：进入克隆区就瞬移回真实区（两段内容完全一致，视觉无缝）
    if (settleT) clearTimeout(settleT);
    settleT = setTimeout(() => {
      if (!card.isConnected || total < 2) return;
      const w2 = card.offsetWidth + 14;
      if (sc.scrollLeft >= total * w2 - 40) sc.scrollLeft = Math.max(0, sc.scrollLeft - total * w2);
    }, 170);
  }, { passive: true });
  HeroAuto.start(sc);
}

async function loadHome(force) {
  // 只在首页画首页：切源 / 点详情之后迟到的响应，绝不能把当前页面盖掉
  if (state.mode !== "home") return;
  const site = currentSite();
  const sid = site.id;
  const alive = () => state.mode === "home" && state.site === sid;
  const show = (data) => {
    if (!alive()) return false;
    state.home = data;
    renderHome();
    return true;
  };

  const hit = HomeCache.get(sid);
  if (hit && !force) {
    show(hit.data);
    // 缓存过旧：先把旧内容留在屏幕上，后台换一份新的存着，下次进来就是新的
    if (!hit.fresh) {
      site.api.home().then((d) => {
        if (!d || d.error || ((!d.modules || !d.modules.length) && !(d.hero || []).length)) return;
        HomeCache.set(sid, { hero: (d.hero || []).slice(0, 6), modules: d.modules || [] });
      }).catch(() => {});
    }
    return;
  }

  if (!alive()) return;
  state.home = { hero: [], modules: [] };    // 先清掉上一站的内容，避免串台
  renderHomeSkeleton();
  progress(true);
  let slow = setTimeout(() => {
    if (state.mode === "home" && !(state.home.modules || []).length) {
      const app = $("app");
      if (app && app.querySelector(".skel-card")) {
        app.insertAdjacentHTML("afterbegin", '<div style="text-align:center;color:var(--sub);font-size:12px;padding:0 0 12px">站源响应较慢，正在竞速重试…</div>');
      }
    }
  }, 6000);
  try {
    const data = await site.api.home();
    if (!alive()) return;
    if (!data || data.error || ((!data.modules || !data.modules.length) && !(data.hero || []).length)) {
      renderEmpty("加载失败，站点暂无响应", "重试", "reloadHome");
      return;
    }
    const next = { hero: (data.hero || []).slice(0, 6), modules: data.modules || [] };
    HomeCache.set(sid, next);
    show(next);
  } catch (e) {
    if (alive()) renderEmpty("加载失败：" + esc((e && e.message) || "网络错误"), "重试", "reloadHome");
  } finally {
    clearTimeout(slow);
    progress(false);
  }
}

function goHome() {
  Player.close(true);
  state.mode = "home";
  state.backTo = "home";
  state.detail = null;
  closeSearch();
  closeDrawer();
  renderNav();
  window.scrollTo(0, 0);
  // 分类和首页各走各的：分类晚到只补一下导航，不让首页等它
  ensureCats().then(renderNav, () => {});
  loadHome(false);
}

/* ------------------------------------------------------------
 * 7.3 列表（分类 / 搜索）
 * ---------------------------------------------------------- */
function catBarHtml() {
  const site = currentSite();
  const cats = state.cats || [];
  if (!cats.length) return "";
  const parentId = String(state.list.parent);
  const group = cats.find((g) => String(g.id) === parentId) || cats[0];
  // 父分类已经上提到顶部导航条，这里不再重复一遍；
  // 只保留「子分类筛选」和「排序」，两者都没有时整块不渲染，避免留白。
  const hasChildren = !!(group && group.children && group.children.length);
  if (!hasChildren && !site.sorts) return "";
  let html = '<div class="catbar">';
  if (hasChildren) {
    html += '<div class="catrow"><span class="clabel">' + (group.container ? esc(group.name) : "筛选") + '</span><div class="cscroll">' +
      (site.multiSel && state.list.sel.length ? '<span class="chip" data-act="clearSel">清空 ✕</span>' : "") +
      group.children.map((c) => '<span class="chip sub ' + (state.list.sel.indexOf(c.id) >= 0 ? "on" : "") + '" data-act="pickChild" data-id="' + esc(c.id) + '">' + esc(c.name) + "</span>").join("") +
      "</div></div>";
  }
  if (site.sorts) {
    html += '<div class="catrow"><span class="clabel">排序</span><div class="cscroll">' +
      site.sorts.map((s) => '<span class="chip ' + (state.list.sort === s.id ? "on" : "") + '" data-act="pickSort" data-id="' + esc(s.id) + '">' + esc(s.name) + "</span>").join("") +
      "</div></div>";
  }
  html += "</div>";
  return html;
}

/**
 * 子栏目页签（吃瓜：全部 / 热门吃瓜 / AI原创）
 * 只有站源在数据里给出 tabs 时才渲染，其它站源完全不受影响。
 * 高亮以 state.list.sub 为准（解析出来的 is-active 只作参考）。
 */
function subTabsHtml() {
  const l = state.list;
  const tabs = l.subs || [];
  if (!tabs.length) return "";
  const cur = l.sub || "";
  return '<div class="subtabs">' + tabs.map((t) =>

/** 子栏目页签 + 子分类筛选打包成一块吸顶条；两者都没有时返回空串，不留白 */
function stickyCatHtml(inner) {
  return inner ? '<div class="stickycat">' + inner + "</div>" : "";
}

/**
 * 换栏目 / 换筛选后的回顶
 * 只调一次 window.scrollTo(0,0) 并不够稳：列表重绘会改变文档高度，
 * 浏览器会把滚动位置重新夹到新高度上（吃完瓜第 3 页点「热门吃瓜」就还停在半截），
 * 所以这里先记一个待回顶标记，真正的归零放到重绘之后（骨架页 / 列表页）再确认一次。
 */
function listTop() {
  state.listTop = true;
  window.scrollTo(0, 0);
}
function flushListTop() {
  if (!state.listTop) return;
  state.listTop = false;
  window.scrollTo(0, 0);
}

function renderListSkeleton() {
  $("app").innerHTML = '<div class="tools"><span class="bar"></span><div><h2>加载中…</h2></div></div>' +
    stickyCatHtml(subTabsHtml()) + skelCards(12, state.list.view);
  flushListTop();
}

/* ------------------------------------------------------------
 * 分页器：两种形态由设置页开关决定
 *   · pager（默认）：首页 / 上一页 / 页码 / 下一页 / 末页 / 跳转
 *   · auto：底部加载器，触底自动加载下一页（按钮可手动兜底）
 * infinite 显式传入时优先级最高（排行榜固定用页码分页）
 * ---------------------------------------------------------- */
function pagerHtml(pg, pages, total, unit, infinite) {
  pg = Math.max(1, pg); pages = Math.max(1, pages);
  const auto = infinite === undefined ? Prefs.autoPage() : !!infinite;
  const unitTxt = unit || "部";

  if (auto) {
    if (pg >= pages) {
      return '<div class="loadmore done"><span class="lm-done">已到底部' + (total ? " · 共 " + total + " " + unitTxt : "") + "</span></div>";
    }
    return '<div class="loadmore" id="loadMore">' +
      '<button class="lm-btn" data-act="moreList">加载更多 · 第 ' + (pg + 1) + " 页</button>" +
      '<span class="lm-hint">触底自动加载，共 ' + pages + " 页" + (total ? " · " + total + " " + unitTxt : "") + "</span>" +
      "</div>";
  }

  if (pages <= 1) {
    return total ? '<div class="pager"><div class="pinfo">共 ' + total + " " + unitTxt + "</div></div>" : "";
  }
  return '<div class="pager">' +
    '<button data-act="page" data-p="1" ' + (pg <= 1 ? "disabled" : "") + ">首页</button>" +
    '<button data-act="page" data-p="' + (pg - 1) + '" ' + (pg <= 1 ? "disabled" : "") + ">上一页</button>" +
    '<div class="pinfo">第 <b>' + pg + "</b>/" + pages + (total ? " · 共" + total + unitTxt : "") + "</div>" +
    '<button data-act="page" data-p="' + (pg + 1) + '" ' + (pg >= pages ? "disabled" : "") + ">下一页</button>" +
    '<button data-act="page" data-p="' + pages + '" ' + (pg >= pages ? "disabled" : "") + ">末页</button>" +
    '<div class="jump"><input id="pgInput" type="number" min="1" max="' + pages + '" placeholder="页码"></div>' +
    "</div>";
}

/** 自动加载模式的底部状态切换（loading / error），不重建列表 */
function setLoadMoreState(st) {
  const box = $("loadMore");
  if (!box) return;
  const btn = box.querySelector(".lm-btn");
  const hint = box.querySelector(".lm-hint");
  if (!btn) return;
  if (st === "loading") {
    btn.disabled = true;
    btn.innerHTML = '<span class="lm-spin"></span>加载中…';
    if (hint) hint.textContent = "正在获取下一页…";
  } else if (st === "error") {
    btn.disabled = false;
    btn.textContent = "加载失败，点击重试";
    if (hint) hint.textContent = "网络异常或该站源响应超时";
  }
}

/** 触底观察器：哨兵进入视口前 300px 即预加载下一页 */
let listIO = null;
function bindInfinite() {
  if (listIO) { listIO.disconnect(); listIO = null; }
  const box = $("loadMore");
  if (!box || typeof IntersectionObserver === "undefined") return;
  listIO = new IntersectionObserver((ents) => {
    if (ents.some((en) => en.isIntersecting)) loadList({ append: true });
  }, { rootMargin: "300px 0px" });
  listIO.observe(box);
}

function renderList() {
  const app = $("app");
  const l = state.list;
  const view = l.view || "";

  const plainTitle = l.kind === "search" ? "搜索：" + l.keyword

      : l.kind === "topic" ? "专题：" + (l.title || "")
        : (l.title || "列表");
  // 专题内页与栏目页不需要分类条

      '<span class="act" data-act="backHome">回首页</span></div>' +
      stickyCatHtml(subTabsHtml() + (showCatBar ? catBarHtml() : "")) +
      '<div class="empty"><div class="ico">🎬</div><div>暂无内容</div></div>';

  }

      ? '标签：<span class="hash" style="color:var(--accent)">' + esc(l.title || l.keyword) + "</span>"
      : l.kind === "topic"
        ? '专题：<span class="hash" style="color:var(--accent)">' + esc(l.title || "") + "</span>"
        : esc(l.title || "列表");
  const gridHtml = view === "topics"
    ? l.items.map((v, i) => topicCardHtml(v, i)).join("")
    : view === "posts"
      ? l.items.map((v, i) => postCardHtml(v, i)).join("")
      : l.items.map((v, i) => cardHtml(v, i, { src: "list" })).join("");
  // 专题 / 吃瓜是横版卡片，容器换成宽列网格；普通剧集仍是竖版海报网格
  const gridCls = view === "topics" ? "topic-grid" : view === "posts" ? "post-grid" : "grid";
  app.innerHTML =
    '<div class="tools"><span class="bar"></span><div><h2>' + title + "</h2>" +
      (l.total ? '<div class="total">共 ' + l.total + " " + unit + (view ? "" : "作品") + "</div>" : (l.items.length ? '<div class="total">第 ' + l.page + " 页</div>" : "")) +
    "</div>" +
    '<span class="act" data-act="backHome">回首页</span></div>' +
    stickyCatHtml(subTabsHtml() + (showCatBar ? catBarHtml() : "")) +

}

/* ------------------------------------------------------------
 * 7.3.0 列表缓存 / 并发合并 / 增量渲染
 * ------------------------------------------------------------
 * 三个工具分别解决三类卡顿：
 *   ListCache    同一条件 90s 内复用结果（翻页回退、来回切分类秒开）
 *   listOnce     相同条件的并发请求合并成一次（连点不会打出多个请求）
 *   appendCards  自动加载时只插入新卡片并替换底部，不再整页重绘
 * ---------------------------------------------------------- */
const ListCache = {
  map: new Map(),
  TTL: 90000,
  get(k) {
    const it = this.map.get(k);
    if (!it) return null;
    if (Date.now() - it.ts > this.TTL) { this.map.delete(k); return null; }
    return it.data;
  },
  set(k, v) {
    this.map.set(k, { ts: Date.now(), data: v });
    if (this.map.size > 80) this.map.delete(this.map.keys().next().value);
  },
  clear() { this.map.clear(); }
};
const ListInflight = new Map();
function listOnce(key, fn) {
  const hit = ListInflight.get(key);
  if (hit) return hit;
  const p = Promise.resolve().then(fn).finally(() => ListInflight.delete(key));
  ListInflight.set(key, p);
  return p;
}

/* ------------------------------------------------------------
 * 详情预取：手指按下 / 鼠标悬停卡片时就先把详情接口跑起来，
 * 真正点开时多半已经拿到数据，详情页几乎瞬开。
 * ---------------------------------------------------------- */
const DetailCache = {
  map: new Map(),
  TTL: 120000,
  MAX: 24,
  key(siteId, id) { return siteId + "|" + id; },
  get(k) {
    const it = this.map.get(k);
    if (!it) return null;
    if (Date.now() - it.ts > this.TTL) { this.map.delete(k); return null; }
    return it.data;
  },
  set(k, v) {
    this.map.set(k, { ts: Date.now(), data: v });
    if (this.map.size > this.MAX) this.map.delete(this.map.keys().next().value);
  },
  clear() { this.map.clear(); }
};
const DetailInflight = new Map();
/** 预热某部作品的详情（幂等：已有缓存或正在请求时直接返回） */
function prefetchDetail(item) {
  if (!item || !item.id) return;
  const site = currentSite();
  if (!site || item.site && item.site !== site.id) return;      // 跨站记录不预热
  const key = DetailCache.key(site.id, item.id);
  if (DetailCache.get(key) || DetailInflight.has(key)) return;
  const p = Promise.resolve()
    .then(() => site.api.detail(item.id, item))
    .then((d) => { if (d && d.routes && d.routes.length) DetailCache.set(key, d); return d; })
    .catch(() => null)
    .finally(() => DetailInflight.delete(key));
  p.__t = Date.now();                 // 记录发起时间，点击时只按「剩余预算」等它
  DetailInflight.set(key, p);
}

/** 追加渲染：仅插入新卡片 + 换掉底部加载器，保留已有卡片的图片与滚动位置 */
function appendCards(items, startIdx) {
  const app = $("app");
  const grid = app && app.querySelector(".grid");
  const l = state.list;
  // 专题 / 吃瓜是栏目卡片，构造方式不同，直接整页重绘更稳妥
  if (!app || !grid || !items.length || l.view) { renderList(); return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = items.map((v, k) => cardHtml(v, startIdx + k, { src: "list" })).join("");
  const frag = document.createDocumentFragment();
  while (tmp.firstChild) frag.appendChild(tmp.firstChild);
  grid.appendChild(frag);
  hydrateImages(grid);

  const holder = document.createElement("div");
  holder.innerHTML = pagerHtml(l.page, l.pages, l.total, "部");
  const fresh = holder.firstElementChild;
  if (fresh) {
    const old = app.querySelector(".loadmore") || app.querySelector(".pager");
    if (old) old.replaceWith(fresh);
    else app.appendChild(fresh);
  }
  const tot = app.querySelector(".tools .total");
  if (tot && l.total) tot.textContent = "共 " + l.total + " 部作品";
  if (Prefs.autoPage()) bindInfinite();
}

/**
 * 列表加载
 * @param {{append?:boolean}} opt append=true 表示「自动加载下一页」，
 *        保留已有 items 并把新一页拼接在后面（不跳回顶部）
 */
async function loadList(opt) {
  opt = opt || {};
  const append = !!opt.append;
  const site = currentSite();
  const l = state.list;

  // 追加模式的前置拦截：加载中 / 非列表视图 / 已是最后一页
  if (append && (state.loading || state.mode !== "list" || l.page >= l.pages)) return;

  const page = append ? l.page + 1 : l.page;
  const queryKey = l.kind === "search" ? "s:" + l.keyword
    : l.kind === "tag" ? "t:" + (l.tagSlug || "") + ":" + l.keyword
      : l.kind === "topic" ? "tp:" + l.slug
        : "c:" + l.parent + ":" + l.sel.join(",") + ":" + l.sort + ":" + (l.sub || "");
  const cacheKey = site.id + "|" + queryKey + "|" + page;

  // 请求序号：快速连续翻页时只认最后一次请求，避免旧响应覆盖新页面
  const seq = (state.listSeq = (state.listSeq || 0) + 1);

  // 命中缓存直接渲染：不闪骨架、不发请求
  const cached = ListCache.get(cacheKey);
  if (cached) {
    if (state.mode !== "list") return;
    const items = cached.items || [];
    l.page = num(cached.page, page) || page;
    l.pages = Math.max(1, num(cached.pages, 1));
    l.view = cached.view || l.view || "";
    // 子分类页签跟着「当前栏目」走：非追加（换栏目）时以本次结果为准，没有就清空，
    // 否则上一栏（如吃瓜）的子分类条会一直粘在别的分类上
    if (!append) l.subs = Array.isArray(cached.tabs) ? cached.tabs : [];
    if (num(cached.total)) l.total = num(cached.total);
    else if (!append) l.total = 0;
    if (append) {
      const start = l.items.length;
      l.items = l.items.concat(items);
      appendCards(items, start);
    } else {
      if (!items.length && l.page > 1) { l.page = 1; return loadList(); }
      l.items = items;
      renderList();
    }
    return;
  }

  state.loading = true;
  progress(true);
  if (append) setLoadMoreState("loading");
  else if (!l.items.length) renderListSkeleton();

  try {
    // 分类页依赖分类导航：首次进入时先取分类，保证父/子分类条完整
    if (l.kind === "category") {
      if (!state.cats.length) await ensureCats();
      normalizeListParent();
    }
    const reqKey = site.id + "|" + queryKey + "|" + page;   // 与 cacheKey 同构，仅用于合并并发
    const res = await listOnce(reqKey, () => (l.kind === "search"
      ? site.api.search(l.keyword, page)
      : l.kind === "tag"
        ? site.api.tag({ name: l.keyword, slug: l.tagSlug, page })
        : l.kind === "topic"
          ? site.api.topic({ slug: l.slug, page })
          : site.api.list({ parent: l.parent, sel: l.sel, sort: l.sort, page, sub: l.sub })));
    if (state.mode !== "list" || seq !== state.listSeq) return;
    if (!res || res.error) {
      if (append) { setLoadMoreState("error"); return; }
      renderEmpty("加载失败，请重试", "重试", "reloadList");
      return;
    }

    const items = res.items || [];
    const keepY = window.scrollY;
    l.page = num(res.page, page) || page;
    l.pages = Math.max(1, num(res.pages, 1));
    l.view = res.view || "";                 // topics / posts：栏目卡片形态
    if (!append) l.subs = Array.isArray(res.tabs) ? res.tabs : [];   // 换栏目时同步页签，空则清空
    if (append) { if (num(res.total)) l.total = num(res.total); }
    else l.total = num(res.total) || 0;      // 换栏目时清掉上一个栏目的总数
    ListCache.set(reqKey, res);

    if (append) {
      // 追加：只插新卡片，滚动位置天然保持
      const start = l.items.length;
      l.items = l.items.concat(items);
      if (!items.length) l.pages = Math.min(l.pages, l.page);   // 空页视为到底，避免死循环
      appendCards(items, start);
      if (keepY) window.scrollTo(0, keepY);
    } else {
      l.items = items;
      if (!l.items.length && l.page > 1) { l.page = 1; state.loading = false; return loadList(); }
      renderList();
    }
  } catch (e) {
    if (state.mode !== "list" || seq !== state.listSeq) return;
    if (append) setLoadMoreState("error");
    else renderEmpty("加载失败：" + esc((e && e.message) || "网络错误"), "重试", "reloadList");
  } finally {
    if (seq === state.listSeq) state.loading = false;
    progress(false);
  }
}

function goList(opts) {
  opts = opts || {};
  Player.close(true);
  state.mode = "list";
  state.backTo = "home";
  state.list.kind = opts.kind || "category";   // category | topic（专题内页）
  state.list.slug = opts.slug || "";
  state.list.view = opts.view || "";
  state.list.sub = opts.sub || "";
  state.list.subs = [];
  state.list.title = opts.title || "";
  state.list.page = 1;
  state.list.items = [];
  state.list.total = 0;
  if (opts.parent !== undefined) state.list.parent = opts.parent;
  if (opts.sel) state.list.sel = opts.sel.slice();
  if (opts.sort) state.list.sort = opts.sort;
  if (!state.list.parent && state.cats.length) state.list.parent = state.cats[0].id;
  closeDrawer();
  closeSearch();
  renderNav();
  window.scrollTo(0, 0);
  loadList();
}

/** 打开某个专题（黄果 /topics/{slug}/） */
function openTopic(slug, name) {
  if (!slug) return;
  goList({ kind: "topic", slug, title: name || "专题" });
}

/** 回到列表（吃瓜文章返回时用，保留原栏目与页码） */
function backToList() {
  if (state.list.items && state.list.items.length) {
    state.mode = "list";
    renderNav();
    window.scrollTo(0, state.scrollY || 0);
    renderList();
    return;
  }
  goHome();
}

/* ------------------------------------------------------------
 * 7.3.1 标签页（黄果 / 禁果 / 野果）
 * ------------------------------------------------------------
 * 三个主站源各有标签页，点击卡片标签即按该标签出片单：
 *   黄果 → /tag/{slug}/ 页面抓取
 *   野果 → /api/theater/tagList 接口
 *   禁果 → 全量片库本地筛选（与官方站一致）
 * 肉视频与采集源没有标签页，标签仅展示、不可点击。
 * ---------------------------------------------------------- */
function goTag(name, slug) {
  const tag = String(name || "").trim();
  if (!tag) return;
  if (!taggable()) { toast("当前站源暂不支持标签页", 1400); return; }
  Player.close(true);
  state.mode = "list";
  state.backTo = "home";
  state.detail = null;
  state.list.kind = "tag";
  state.list.title = tag;
  state.list.keyword = tag;
  state.list.tagSlug = slug || "";
  state.list.sub = "";
  state.list.subs = [];
  state.list.page = 1;
  state.list.items = [];
  closeDrawer();
  closeSearch();
  renderNav();
  window.scrollTo(0, 0);
  loadList();
}

function pickParent(id) {
  const group = (state.cats || []).find((g) => String(g.id) === String(id));
  state.list.kind = "category";           // 从专题内页切回普通分类
  state.list.view = "";
  state.list.slug = "";
  state.list.sub = "";                    // 换分类就脱离原子栏目（如吃瓜的热门/AI原创）
  state.list.subs = [];
  state.list.parent = id;
  state.list.page = 1;
  state.list.items = [];
  state.list.total = 0;
  if (state.mode !== "list") {
    goList({ parent: id, title: group ? group.name : "" });
    return;
  }
  if (group && group.children && group.children.length) {
    if (!group.container) {
      // 主线分组：自动选中第一个子分类，避免空白列表
      state.list.sel = [group.children[0].id];
      state.list.title = group.children[0].name;
    } else {
      // 父分类本身可整体浏览：清空筛选，展示该父分类下的全部内容
      state.list.sel = [];
      state.list.title = group.name;
    }
  } else {
    state.list.sel = [];
    state.list.title = group ? group.name : "";
  }
  renderNav();
  listTop();
  loadList();
}

function pickChild(id) {
  const site = currentSite();
  const group = (state.cats || []).find((g) => String(g.id) === String(state.list.parent));
  const label = (group && group.children.find((c) => c.id === id) || {}).name || "";
  if (site.multiSel) {
    const i = state.list.sel.indexOf(id);
    if (i >= 0) state.list.sel.splice(i, 1);
    else {
      // 同一维度（冒号前缀相同）只保留一个
      const prefix = id.indexOf(":") >= 0 ? id.slice(0, id.indexOf(":")) : "";
      if (prefix) state.list.sel = state.list.sel.filter((s) => !(s.indexOf(prefix + ":") === 0));
      state.list.sel.push(id);
    }
  } else {
    state.list.sel = state.list.sel.indexOf(id) >= 0 ? [] : [id];
  }
  state.list.title = state.list.sel.length ? (label || state.list.title) : (group ? group.name : state.list.title);
  state.list.page = 1;
  state.list.items = [];
  listTop();
  loadList();
}

function pickSort(id) {
  state.list.sort = id;
  state.list.page = 1;
  state.list.items = [];
  listTop();
  loadList();
}

/* ------------------------------------------------------------
 * 7.4 排行榜
 * ---------------------------------------------------------- */
function renderRankUnsupported() {
  const site = currentSite();
  $("app").innerHTML =
    '<div class="tools"><span class="bar"></span><div><h2>排行榜</h2><div class="total">当前为采集源</div></div></div>' +
    '<div class="empty"><div class="ico">📊</div>' +
      "<div><b>" + esc(site.name) + "</b> 为采集源，不提供排行榜<br>可切换到主站源查看热播榜单</div>" +
      '<span class="eact" data-act="openSheet">切换数据源</span>' +
      '<div style="margin-top:14px"><span class="mini-btn" data-act="nav" data-id="home">先去逛逛</span></div>' +
    "</div>";
}

async function loadRank() {
  const site = currentSite();
  const r = state.rank;
  const tabs = site.rankTabs || [{ id: "hot", name: "热门", desc: "热门作品" }];
  if (!r.tab || !tabs.some((t) => t.id === r.tab)) r.tab = tabs[0].id;
  $("app").innerHTML = '<div class="tools"><span class="bar"></span><div><h2>排行榜</h2><div class="total">加载中…</div></div></div>' +
    '<div class="seg">' + tabs.map((t) => '<span class="seg-item ' + (t.id === r.tab ? "on" : "") + '" data-act="rankTab" data-id="' + t.id + '">' + esc(t.name) + "</span>").join("") + "</div>" +
    (site.theme === "cms"
      ? skelCards(12, "")   // 采集源是卡片网格榜单，骨架直接用卡片，避免「行式骨架 → 网格」闪一下
      : '<div class="rank-list">' + new Array(8).fill('<div class="rank-row"><div class="rank-no">·</div><div class="rank-cover sk"></div><div class="rank-main"><div class="card-title">加载中…</div></div></div>').join("") + "</div>");
  progress(true);
  try {
    const data = await site.api.rank({ tab: r.tab, page: 1 });
    if (state.mode !== "rank") return;
    if (!data || data.error || !(data.items || []).length) {
      renderEmpty("榜单暂无数据", "重试", "reloadRank");
      return;
    }
    state.rank.items = data.items;
    state.rank.rows = !!data.rows;
    state.rank.page = 1;

/** 串行预热：一个接一个，不并发打满代理；真正切源时立刻停，别抢通道 */
let warmTimer = 0;
let warmQueue = [];
function warmStop() {
  clearTimeout(warmTimer);
  warmTimer = 0;
  warmQueue = [];
}
function warmSitesLazy(list) {
  warmStop();
  warmQueue = (list || []).slice();
  const step = () => {
    const next = warmQueue.shift();
    if (!next) return;
    const hit = HomeCache.get(next.id);
    if (hit && hit.fresh) { step(); return; }
    SiteWarm(next);
    warmTimer = setTimeout(step, 1200);
  };
  warmTimer = setTimeout(step, 300);
}

/**
 * 视图切换的水位线：刚画完详情页的 400ms 内忽略「返回」。
 * 手指连点卡片时，第二下往往正好落在新出现的返回按钮上，
 * 表现就是「点进详情又自己弹回首页」。
 */
let viewAt = 0;
function markView() { viewAt = Date.now(); }

async function openDetail(item, opts) {
  opts = opts || {};
  if (!item || !item.id) return;
  if (state.mode !== "detail") state.scrollY = window.scrollY || 0;
  state.backTo = opts.from || (state.mode === "detail" ? state.backTo : state.mode);
  state.mode = "detail";
  markView();
  state.detail = item;
  state.article = null;
  state.routes = [];
  state.episodes = [];
  state.curEp = 0;
  state.resume = opts.resume || null;
  closeDrawer();
  closeSearch();
  if (Player.isActive()) Player.close(true);
  renderNav();
  window.scrollTo(0, 0);
  // 立即切到详情页：有缓存直接渲染，只有「进行中的预热」时先出骨架屏。
  // 以前命中预热会一直停在列表页干等，接口慢时就像点了没反应。
  const site = currentSite();
  let skTimer = 0;
  const ck = DetailCache.key(site.id, item.id);
  const cached = DetailCache.get(ck);
  const warm = cached || DetailInflight.get(ck) || null;
  if (!cached) {
    renderDetailSkeleton();
    progress(true);
    // 接口慢的时候别让用户对着一句「加载中…」干等，6 秒后换个说法
    skTimer = setTimeout(() => {
      const h = $("dSkTxt");
      if (h) { h.textContent = "接口响应较慢，仍在加载…"; h.style.color = "var(--dim)"; }
    }, 6000);
  }
  try {
    let data = cached || null;
    if (!data && warm) {
      // 预取只在「指针按下 / 悬停」时触发，这里给它一点剩余预算：
      // 已经跑了一段时间就少等，绝不为了复用预热而让用户干等。
      const started = warm.__t || Date.now();
      const budget = Math.max(250, 1200 - (Date.now() - started));
      data = await Promise.race([
        warm.catch(() => null),
        new Promise((r) => setTimeout(() => r(null), budget))
      ]);
    }
    if (!data) data = await site.api.detail(item.id, item);
    if (state.mode !== "detail") return;
    if (!data) {
      // 取不到数据：多数是接口超时或该条目在源站被删，把源名带上便于判断是不是这个站的问题
      renderDetailError("「" + site.name + "」详情加载失败：接口没响应或超时，可点下方重试，或返回换个源");
      return;
    }
    // 文章型内容（采集源的小说 / 图片库）：没有播放源，直接进阅读页
    if (data.article) {
      DetailCache.set(ck, data);
      state.article = data.article;
      state.detail = Object.assign({}, item, data.vod || {});
      renderArticle();
      return;
    }
    if (!data.routes || !data.routes.length) { renderDetailError("该作品暂无可用播放源"); return; }
    DetailCache.set(ck, data);
    state.detail = Object.assign({}, item, data.vod || {});
    state.routes = data.routes;
    state.routeIdx = 0;
    state.episodes = data.routes[0].episodes;
    renderDetail();
    // 顺手把第一集的播放地址取回来（用户十有八九会点播放）
    setTimeout(() => {
      if (state.mode === "detail" && state.detail && state.detail.id === item.id) {
        prefetchPlay(site, state.episodes[0]);
      }
    }, 350);
  } catch (e) {
    if (state.mode === "detail") renderDetailError("详情加载失败：" + ((e && e.message) || "网络错误"));
  } finally {
    clearTimeout(skTimer);
    progress(false);
  }
}

function backDetail() {
  if (Date.now() - viewAt < 400) return;      // 连点穿透保护
  Player.close(true);            // 离开详情页先停播并保存进度，避免内联播放器在后台继续出声
  const back = state.backTo || "home";
  state.mode = back;
  state.detail = null;
  state.article = null;
  state.routes = [];
  state.episodes = [];
  state.resume = null;
  renderNav();
  window.scrollTo(0, state.scrollY || 0);
  if (back === "fav") renderFav();
  else if (back === "hist") renderHist();
  else if (back === "list") { if (state.list.items.length) renderList(); else loadList(); }
  else if (back === "rank") { if (state.rank.items.length) renderRank(); else loadRank(); }
  else if (back === "post") { if (state.post) renderPost(); else backToList(); }
  else goHome();
}

function toggleDetailFav() {
  const d = state.detail;
  if (!d) return;
  const added = Fav.toggle({ id: d.id, name: d.name, pic: d.pic, remark: d.remark, tags: d.tags });
  toast(added ? "已加入收藏 ♥" : "已取消收藏");
  renderNav();
  // 只更新按钮状态，不重绘详情页（避免打断内联播放）
  const btn = document.querySelector(".detail-bar .fav-btn");
  if (btn) {
    btn.classList.toggle("on", added);
    const label = btn.querySelector("span");
    if (label) label.textContent = added ? "已收藏" : "收藏";
  }
  if (Player.isActive()) Player.syncFav();
}

function pickRoute(i) {
  if (state.routeIdx === i) return;
  state.routeIdx = i;
  state.episodes = state.routes[i].episodes;
  state.curEp = 0;
  // 内联播放中切线路：不整页重绘，直接换集续播，播放器不被打断
  if (Player.isActive() && Player.isInline()) {
    syncDetailChips();
    Player.jump(0);
  } else {
    renderDetail();
  }
  toast("已切换线路：" + (state.routes[i].name || "线路" + (i + 1)));
}

function siteFilterHtml(cur, counts, act) {
  const opts = [{ id: "all", name: "全部" }].concat(
    Object.keys(counts).filter((k) => counts[k]).map((k) => ({ id: k, name: (getSite(k).short || "站源") + " " + counts[k] }))
  );
  if (opts.length <= 1) return "";
  return '<div class="seg">' + opts.map((o) =>
    '<span class="seg-item ' + (cur === o.id ? "on" : "") + '" data-act="' + act + '" data-id="' + esc(o.id) + '">' + esc(o.name) + "</span>"
  ).join("") + "</div>";
}

function renderFav() {
  const app = $("app");
  const all = Fav.all();
  if (!all.length) {
    app.innerHTML = '<div class="empty"><div class="ico">💖</div><div>还没有收藏<br>在详情页点「收藏」即可加入</div>' +
      '<span class="eact" data-act="nav" data-id="home">去逛逛</span></div>';
