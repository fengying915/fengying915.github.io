<script>
"use strict";
/* ============================================================
 * 全剧聚合 · 单文件应用
 * ------------------------------------------------------------
 * 架构分层：
 *   1  基础工具        纯函数，无副作用
 *   2  本地存储        收藏 / 历史 / 搜索记录 / 配置
 *   3  网络层          CORS 代理池 + 直连优先的竞速请求
 *   4  封面解密        部分站源封面经 AES 加密 / JS 加载
 *   5  站源适配器      hg / jg / yg / rou / CMS 采集源
 *   6  分类体系        主线分类（父分类 + 子分类）
 *   7  路由与视图      首页 / 列表 / 排行 / 收藏 / 历史 / 设置 / 详情
 *   8  播放器          多线路、选集、倍速、手势、记忆播放
 *   9  弹幕引擎        自绘轨道 + 弹幕源匹配 + 本地发送
 *   10 启动引导
 * ============================================================ */

/* ============================================================
 * 1. 基础工具
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

/** HTML 转义，渲染用户/接口文本时统一调用 */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
/** 安全转数字 */
function num(v, d) {
  const n = Number(v);
  return isFinite(n) ? n : (d === undefined ? 0 : d);
}
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

/**
 * 限并发 map：同时最多跑 n 个任务，结果顺序与入参一致。
 * 首页要同时拉 8 个栏目，全发会把同一后端的并发打到限流（429），
 * 一失败就又退到公共代理，反而更慢。
 */
async function mapLimit(arr, n, fn) {
  const out = new Array(arr.length);
  let idx = 0;
  const step = async () => {
    while (idx < arr.length) {
      const i = idx++;
      out[i] = await fn(arr[i], i);
    }
  };
  const workers = [];
  for (let k = 0; k < Math.min(Math.max(1, n), arr.length); k++) workers.push(step());
  await Promise.all(workers);
  return out;
}

/** 播放量/热度缩写：12345 → 1.2W */
function fmtPlays(n) {
  n = num(n);
  if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "亿";
  if (n >= 1e4) return Math.round(n / 1e4) + "W";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
/** 秒 → mm:ss / h:mm:ss */
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(num(sec)));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}
/** 时间戳 → 相对时间 */
function timeAgo(ts) {
  const s = Math.floor((Date.now() - num(ts)) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + "分钟前";
  if (s < 86400) return Math.floor(s / 3600) + "小时前";
  if (s < 2592000) return Math.floor(s / 86400) + "天前";
  return new Date(num(ts)).toLocaleDateString("zh-CN");
}
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
/** 统一文本清洗（去标签 / 折叠空白） */
function plainText(s, max) {
  let t = String(s || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ");
  t = t.replace(/[\t\r]+/g, " ").replace(/ {2,}/g, " ").replace(/\n{3,}/g, "\n\n").trim();
  if (max && t.length > max) t = t.slice(0, max) + "…";
  return t;
}

/**
 * 富文本正文 → 有序的「文字 / 图片」块
 * ------------------------------------------------------------
 * 采集源的文章正文（art_content）常是 HTML + <br> 混排，直接 innerHTML 注入不安全，
 * 这里只保留图片地址与纯文本，按原文出现顺序重排成块，交给阅读页逐块渲染。
 * limit 为最多保留的块数（默认 120），防止超长小说把 DOM 撑爆。
 */
function htmlToBlocks(raw, limit) {
  const max = limit || 120;
  let html = String(raw || "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<noscript[\s\S]*?<\/noscript>/gi, "");
  if (!html.trim()) return [];
  // 先删掉行内事件属性：采集源的图片常写成
  //   <img src="…" onclick="window.open('…')" onload="if(this.width>'1024')this.width='1024';">
  // 引号里的 '>' 会把标签提前截断，导致图片抓不到、属性值漏成正文文字。
  html = html.replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|`[^`]*`)/gi, "")
    .replace(/\sstyle\s*=\s*("[^"]*"|'[^']*')/gi, "");
  const parts = [];
  let m;
  const imgRe = /<img\b[^>]*>/gi;
  while ((m = imgRe.exec(html)) !== null) {
    const tag = m[0];
    const src = (tag.match(/data-src="([^"]+)"/) || tag.match(/data-original="([^"]+)"/) ||
      tag.match(/src="([^"]+)"/) || [])[1] || "";
    if (src && !/^data:/i.test(src)) parts.push({ i: m.index, kind: "img", val: src });
  }
  // 段落 / 标题 / 引用按块取；没有标签的纯文本（大量小说正文）按 <br> 或换行切
  const pRe = /<(p|h[1-6]|blockquote|div)\b[^>]*>([\s\S]*?)<\/\1>/gi;
  let hasP = false;
  while ((m = pRe.exec(html)) !== null) {
    const txt = plainText(m[2], 4000);
    if (txt) { parts.push({ i: m.index, kind: "text", val: txt }); hasP = true; }
  }
  if (!hasP) {
    const flat = html.replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
    flat.split(/\n{1,}/).forEach((line, k) => {
      const txt = plainText(line, 4000);
      if (txt) parts.push({ i: k, kind: "text", val: txt });
    });
  }
  parts.sort((a, b) => a.i - b.i);
  const out = [];
  parts.forEach((p) => {
    const last = out[out.length - 1];
    if (last && last.kind === p.kind && last.val === p.val) return;   // 去重（<p> 里重复的 <br> 文本）
    out.push(p);
  });
  return out.slice(0, max);
}

let _toastTimer = 0;
function toast(msg, ms) {
  const el = $("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove("show"), ms || 2000);
}
/** 顶部加载进度 */
function progress(on) {
  const bar = $("topbar");
  if (!bar) return;
  if (on) {
    bar.style.opacity = "1";
    bar.style.width = "70%";
  } else {
    bar.style.width = "100%";
    setTimeout(() => { bar.style.opacity = "0"; bar.style.width = "0"; }, 280);
  }
}

/* ============================================================
 * 2. 本地存储
 * ============================================================ */
const LS = {
  site: "dj_site_v1",
  theme: "dj_theme_v1",
  fav: "dj_fav_v1",
  hist: "dj_hist_v1",
  search: "dj_search_v1",
  proxy: "dj_proxy_v1",
  cms: "dj_cms_v1",
  dmCfg: "dj_dm_cfg_v1",
  dmLocal: "dj_dm_local_v1",
  dmApi: "dj_dm_api_v1",
  host: "dj_host_v1",
  hostList: "dj_host_list_v1",     // 黄果：探测学到的可用域名（带 TTL）
  pref: "dj_pref_v1"          // 功能开关偏好（轮播自动播放 / 列表分页方式）
};

function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function lsDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

/* ------------------------------------------------------------
 * 2.1 全局功能偏好（设置页开关）
 * ------------------------------------------------------------
 * heroAuto : 首页轮播是否自动播放（默认开启）
 * pageMode : 列表分页形态，"pager" 点页码 / 下一页；"auto" 触底自动加载
 * ---------------------------------------------------------- */
const Prefs = {
  d: { heroAuto: true, pageMode: "pager" },
  load() {
    const o = lsGet(LS.pref, null);
    if (!o || typeof o !== "object") return;
    if (typeof o.heroAuto === "boolean") this.d.heroAuto = o.heroAuto;
    if (o.pageMode === "auto" || o.pageMode === "pager") this.d.pageMode = o.pageMode;
  },
  save() { lsSet(LS.pref, this.d); },
  set(k, v) { this.d[k] = v; this.save(); },
  autoPage() { return this.d.pageMode === "auto"; }
};
Prefs.load();

/** 收藏：跨站源统一存储，按 site 区分 */
const Fav = {
  all() { const v = lsGet(LS.fav, []); return Array.isArray(v) ? v : []; },
  of(site) { return site ? this.all().filter((x) => x.site === site) : this.all(); },
  has(id, site) { return this.all().some((x) => x.site === (site || state.site) && String(x.id) === String(id)); },
  toggle(rec) {
    const site = rec.site || state.site;
    const id = String(rec.id);
    const all = this.all();
    const idx = all.findIndex((x) => x.site === site && String(x.id) === id);
    if (idx >= 0) {
      all.splice(idx, 1);
      lsSet(LS.fav, all);
      return false;
    }
    all.unshift({
      site, id,
      name: rec.name || "", pic: rec.pic || "", remark: rec.remark || "",
      tags: rec.tags || [], ts: Date.now()
    });
    if (all.length > 600) all.length = 600;
    lsSet(LS.fav, all);
    return true;
  },
  remove(id, site) {
    lsSet(LS.fav, this.all().filter((x) => !(x.site === (site || state.site) && String(x.id) === String(id))));
  },
  clear(site) {
    lsSet(LS.fav, site ? this.all().filter((x) => x.site !== site) : []);
  }
};

/** 观看历史：记录到集与秒，用于「继续观看」 */
const Hist = {
  all() { const v = lsGet(LS.hist, []); return Array.isArray(v) ? v : []; },
  of(site) { return site ? this.all().filter((x) => x.site === site) : this.all(); },
  find(id, site) {
    return this.all().find((x) => x.site === (site || state.site) && String(x.id) === String(id)) || null;
  },
  upsert(rec) {
    const site = rec.site || state.site;
    const id = String(rec.id);
    const all = this.all().filter((x) => !(x.site === site && String(x.id) === id));
    all.unshift(Object.assign({ ts: Date.now(), site, id }, rec, { id, site }));
    if (all.length > 300) all.length = 300;
    lsSet(LS.hist, all);
  },
  progress(id, ep, epTitle, pos, dur) {
    const all = this.all();
    const item = all.find((x) => x.site === state.site && String(x.id) === String(id));
    if (!item) return;
    item.ep = ep;
    item.epTitle = epTitle || item.epTitle || "";
    item.pos = Math.floor(num(pos));
    item.dur = Math.floor(num(dur));
    item.ts = Date.now();
    lsSet(LS.hist, all);
  },
  remove(id, site) {
    lsSet(LS.hist, this.all().filter((x) => !(x.site === (site || state.site) && String(x.id) === String(id))));
  },
  clear(site) {
    lsSet(LS.hist, site ? this.all().filter((x) => x.site !== site) : []);
  }
};

/** 搜索历史 */
const SearchLog = {
  all() { const v = lsGet(LS.search, []); return Array.isArray(v) ? v.slice(0, 10) : []; },
  push(kw) {
    kw = String(kw || "").trim();
    if (!kw) return;
    const list = this.all().filter((k) => k !== kw);
    list.unshift(kw);
    lsSet(LS.search, list.slice(0, 10));
  },
  remove(kw) { lsSet(LS.search, this.all().filter((k) => k !== kw)); },
  clear() { lsDel(LS.search); }
};

/* ============================================================
 * 3. 网络层：CORS 代理池
 * ------------------------------------------------------------
 * 策略：直连优先（4.5s 超时）→ 代理池竞速（先发上次命中者，
 * 直连与代理「同时起跑」，谁先给出合格响应就用谁，胜出者粘住本会话）
 * ============================================================ */
const BUILTIN_PROXIES = [
  "https://corsproxy.io/?key=adad7676&url=",        // 参数式：带 API 密钥，前缀 + URL 编码
  "https://jsnzkpg4.pages.dev/",                    // 直拼式：前缀 + 原始地址
  "https://allorigins.hexlet.app/raw?url=",        // 参数式：前缀 + URL 编码
  "https://api.allorigins.win/raw?url="
];

function normProxy(v) {
  v = String(v || "").trim();
  if (!v) return "";
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  // 模板式：含 {url} / {urlenc} 占位符，原样保留，取用时再替换
  if (/\{url(enc)?\}/i.test(v)) return v;
  // 参数式：前缀以 ? = & 结尾，等待拼接参数值（自动 URL 编码）
  if (/[?&=]$/.test(v)) return v;
  return v.replace(/\/+$/, "") + "/";              // 直拼式：前缀 + 原始 url
}

/**
 * 直连健康度（按源站 origin 记）。
 * 多数采集接口不发 CORS 头，直连注定失败；失败过的源 10 分钟内不再试直连，
 * 省掉每次请求开头那一两秒的握手失败时间。
 */
const NetHealth = {
  map: new Map(),
  TTL: 10 * 60000,
  key(url) {
    try { return new URL(url).origin; } catch (e) { return ""; }
  },
  bad(url) {
    const k = this.key(url);
    if (!k) return false;
    const t = this.map.get(k);
    return !!t && Date.now() - t < this.TTL;
  },
  markBad(url) {
    const k = this.key(url);
    if (k) this.map.set(k, Date.now());
  },
  markOk(url) {
    const k = this.key(url);
    if (k) this.map.delete(k);
  }
};

const ProxyPool = {
  _custom: null,
  _win: null,
  _bad: null,
  /**
   * 短期失效表：429（限流）和 5xx（网关错误）是全局性的，记一会儿，
   * 期间把它排到队尾、不再让它抢跑。注意是「排后面」不是「剔除」：
   * 某个代理只是对这个目标 429，换个目标可能就通了，直接丢掉等于自断一条通道；
   * 而且设置页要是少了条目，看起来就像代理被删了。
   * 403 多数是「这个域名不给过」，对别的目标仍然可用，所以不记。
   */
  badMap() {
    if (!this._bad) this._bad = new Map();
    return this._bad;
  },
  badNow(p) {
    const m = this.badMap();
    const t = m.get(p);
    if (!t) return false;
    if (Date.now() > t) { m.delete(p); return false; }
    return true;
  },
  markBad(p, ms) {
    if (p) this.badMap().set(p, Date.now() + (ms || 90000));
  },
  custom() {
    if (this._custom) return this._custom;
    const saved = lsGet(LS.proxy, null);
    this._custom = Array.isArray(saved) ? saved.filter((x) => typeof x === "string" && x).map(normProxy) : [];
    return this._custom;
  },
  /** 完整列表：自定义 + 内置，不受临时失效影响（设置页展示用这个） */
  all() {
    const out = [];
    this.custom().concat(BUILTIN_PROXIES).forEach((p) => { if (out.indexOf(p) < 0) out.push(p); });
    return out;
  },
  /**
   * 竞速用的列表：全部通道都在，只是把临时失效的排到队尾。
   * 通道数量恒定，所以不会出现「池子越用越少、加载越来越慢」。
   */
  pool() {
    const good = [], slow = [];
    this.all().forEach((p) => (this.badNow(p) ? slow : good).push(p));
    // 直拼式优先：它把原始地址直接接在前缀后面，字节流原样透传，
    // 大文件分片和 POST 都稳；参数式要多一次编码/解码，还常带「密钥过期」这类整条失效。
    good.sort((a, b) => (this.isParam(a) ? 1 : 0) - (this.isParam(b) ? 1 : 0));
    if (this._win) {
      const i = good.indexOf(this._win);
      if (i > 0) { good.splice(i, 1); good.unshift(this._win); }
    }
    return good.concat(slow);
  },
  add(u) {
    const n = normProxy(u);
    if (!n || this.custom().indexOf(n) >= 0 || BUILTIN_PROXIES.indexOf(n) >= 0) return false;
    this._custom = this.custom().concat(n);
    lsSet(LS.proxy, this._custom);
    return true;
  },
  remove(u) {
    this._custom = this.custom().filter((x) => x !== u);
    lsSet(LS.proxy, this._custom);
    if (this._win === u) this._win = null;
  },
  /** 参数式（含模板式）：不能直拼原始地址，也不能承载 POST */
  isParam(p) { return /[?&=]$/.test(p) || /\{url(enc)?\}/i.test(p); },
  build(p, url) {
    if (/\{url(enc)?\}/i.test(p)) {
      return p.replace(/\{urlenc\}/gi, encodeURIComponent(url)).replace(/\{url\}/gi, url);
    }
    return this.isParam(p) ? p + encodeURIComponent(url) : p + url;
  },
  hostOf(p) { try { return new URL(p).host; } catch (e) { return p; } },
  win() { return this._win; },
  /**
   * 忘掉当前粘住的代理。
   * 粘性代理对某个站失效时，后续请求还会先等它一次（race 的 headStart），
   * 重试前调用这里，下次直接全池并发，成功率明显高一些。
   */
  forget() { this._win = null; },

  /** 原始 fetch（带超时） */
  /** 原始 fetch（带超时）；init.signal 可与内部超时并存（竞速赢了要能取消其它请求） */
  async raw(url, ms, init) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms || 12000);
    const opts = Object.assign({ credentials: "omit" }, init || {});
    const ext = opts.signal;
    if (ext) {
      if (ext.aborted) ctrl.abort();
      else ext.addEventListener("abort", () => { try { ctrl.abort(); } catch (e) {} }, { once: true });
    }
    opts.signal = ctrl.signal;
    try {
      const r = await fetch(url, opts);
      if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { status: r.status });
      return await r.text();
    } finally {
      clearTimeout(timer);
    }
  },

  /**
   * 通道竞速：直连（可选）+ 代理池，谁先给出通过校验的响应谁赢。
   * 直连不是「先等它失败再走代理」，而是各跑各的、先到先得：
   * 直连能用时它总是最快，用不了时也不会白占一段时间。
   */
  race(url, opt) {
    opt = opt || {};
    const timeout = opt.timeout || 14000;
    const validate = opt.validate || ((t) => !!t && t.length > 0);
    const init = opt.init || {};
    const self = this;
    const directOK = !!opt.direct && !NetHealth.bad(url);
    const pool = this.pool();

    // 首批只走 2 条：直连 + 一条最优代理。
    // 之前是「直连 + 全部代理」同时下发，公共代理本来就只有十几 KB/s，
    // 四五条一起抢同一个目标，谁也快不了，还容易一起触发限流；
    // 结果是「等半天」，比单走一条还糟。剩下几条留作兜底，前两条都凉了才放出来。
    const head = [];
    if (directOK) head.push({ key: "direct", to: url, ms: opt.directTimeout || 6000, h: 1 });
    if (pool.length) head.push({ key: "p", proxy: pool[0], to: self.build(pool[0], url), ms: timeout, h: 1 });
    const rest = pool.slice(1).map((p) => ({ key: "p", proxy: p, to: self.build(p, url), ms: timeout }));
    if (!head.length && !rest.length) return Promise.resolve(null);
    const headStart = opt.headStart == null ? 500 : opt.headStart;

    return new Promise((resolve) => {
      let done = false, live = 0, started = 0, spilled = false, headFailed = 0;
      const timers = [];
      const killAll = new AbortController();
      const finish = (res) => {
        if (done) return;
        done = true;
        timers.forEach((t) => clearTimeout(t));
        try { killAll.abort(); } catch (e) {}
        resolve(res);
      };
      const settle = () => {
        if (done || !spilled || !started) return;
        if (live <= 0) finish(null);
      };
      const spillNow = () => {
        if (spilled || done) return;
        spilled = true;
        rest.forEach(attempt);
        settle();
      };
      const attempt = (ch) => {
        if (done) return;
        started++;
        live++;
        const c2 = new AbortController();
        killAll.signal.addEventListener("abort", () => { try { c2.abort(); } catch (e) {} }, { once: true });
        const timer = setTimeout(() => { try { c2.abort(); } catch (e) {} }, ch.ms);
        timers.push(timer);
        const fail = () => {
          clearTimeout(timer);
          live--;
          // 注意 done：竞速赢家会 abort 掉其它通道，被中止的直连不能算「直连不可用」，
          // 否则这个源接下来 10 分钟都只能走慢代理（表现为切源要等十几秒）。
          if (ch.key === "direct" && !done) NetHealth.markBad(url);
          if (ch.h && !done) {
            headFailed++;
            // 首批两条都凉了就别等对冲计时器了，立刻把剩下的放出来
            if (headFailed >= head.length) spillNow();
          }
          settle();
        };
        fetch(ch.to, Object.assign({ signal: c2.signal, credentials: "omit" }, init))
          .then((r) => {
            if (!r.ok) {
              // 限流 / 网关错误 / 代理自己拒绝（密钥失效会返回 401/403/405）：
              // 记下来，90 秒内排到队尾，别再让它每条请求都先白撞一次
              if (ch.proxy && (r.status === 403 || r.status === 405 || r.status === 429 || r.status >= 500)) self.markBad(ch.proxy);
              return fail();
            }
            return r.text().then((text) => {
              if (!validate(text)) {
                // 通了但内容不对（拦截页 / 空响应），一分钟内先跳过
                if (ch.proxy) self.markBad(ch.proxy, 60000);
                return fail();
              }
              if (done) return;
              clearTimeout(timer);
              if (ch.key === "direct") NetHealth.markOk(url);
              else self._win = ch.proxy;
              finish({ proxy: ch.proxy || "", text: text });
            }, fail);
          })
          .catch(fail);
      };

      if (head[0]) attempt(head[0]);
      if (head[1]) timers.push(setTimeout(() => attempt(head[1]), headStart));
      if (!rest.length) {
        spilled = true;
      } else {
        // 两路都迟迟没结果才铺开全池，正常情况（直连能用）压根不会走到这里
        timers.push(setTimeout(spillNow, headStart + (opt.spillDelay == null ? 1500 : opt.spillDelay)));
      }
      if (opt.deadline) timers.push(setTimeout(() => finish(null), opt.deadline));
    });
  },

  /** 直连 + 代理同时起跑，返回文本或 null */
  text(url, opt) {
    opt = opt || {};
    const validate = opt.validate || ((t) => !!t && t.length > 0);
    return this.race(url, Object.assign({}, opt, { direct: opt.direct !== false, validate: validate }))
      .then((win) => (win ? win.text : null));
  },

  /** 同上，返回解析后的 JSON */
  async json(url, opt) {
    const text = await this.text(url, Object.assign({ validate: isJSONText }, opt || {}));
    if (!text) return null;
    try { return JSON.parse(cleanJSON(text)); } catch (e) { return null; }
  },

  /** 单点测试（用于设置页） */
  async test(p, probe) {
    const url = probe || "https://jinguoduanju.me/api/v1/top-navigation";
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(this.build(normProxy(p), url), { signal: ctrl.signal, credentials: "omit" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const t = await r.text();
      if (!t || t.length < 2) throw new Error("空响应");
      return true;
    } finally { clearTimeout(timer); }
  }
};

function isJSONText(t) {
  if (!t) return false;
  const s = t.trim();
  if (!/^[\[{]/.test(s)) return false;
  try { JSON.parse(cleanJSON(s)); return true; } catch (e) { return false; }
}
/** 部分接口会返回 BOM / 前置空白，统一清理 */
function cleanJSON(t) { return String(t).replace(/^\uFEFF/, "").trim(); }

/* 接口 GET 结果缓存（60s），减少重复请求与代理压力 */
const ApiCache = new Map();
const API_TTL = 60000;
async function apiText(url, opt) {
  opt = opt || {};
  const key = url;
  const hit = ApiCache.get(key);
  if (hit && Date.now() - hit.t < (opt.ttl || API_TTL)) return hit.v;
  const text = await ProxyPool.text(url, opt);
  if (text) {
    ApiCache.set(key, { t: Date.now(), v: text });
    if (ApiCache.size > 120) {
      const first = ApiCache.keys().next().value;
      ApiCache.delete(first);
    }
  }
  return text;
}
async function apiJSON(url, opt) {
  const text = await apiText(url, Object.assign({ validate: isJSONText }, opt || {}));
  if (!text) return null;
  try { return JSON.parse(cleanJSON(text)); } catch (e) { return null; }
}

/* ============================================================
 * 4. 封面解密与懒加载
 * ------------------------------------------------------------
 * 部分站源封面经 AES-CBC 加密（无图片魔数），需解密后再转 webp
 * ============================================================ */
const IMG_KEY = new TextEncoder().encode("f5d965df75336270");
const IMG_IV = new TextEncoder().encode("97b60394abc2fbe1");
/* 已知加密封面域名：站源会不断换域名，因此除固定列表外，
 * 还维护一份「运行时学习」的域名表（解密成功后自动记住），
 * 配合 <img onerror> 兜底，任何新域名都能自动进入解密管道。 */
const ENC_IMG_HOSTS = [
  /pic\.drleao\.cn/, /pic\.sugfew\.cn/, /pic\.jtzatly\.cn/,
  /pic\.gyezbp\.cn/, /imgpublic\.ycomesc\.live/, /pic\.ycomesc\.live/
];
const JSL_IMG_HOSTS = [/pic\.nihmcl\.cn/];
const LS_ENC_HOSTS = "dj_enc_hosts_v1";
const encHostSet = new Set();
try {
  const saved = JSON.parse(localStorage.getItem(LS_ENC_HOSTS) || "[]");
  if (Array.isArray(saved)) saved.forEach((h) => { if (typeof h === "string" && h) encHostSet.add(h); });
} catch (e) {}
function hostOfUrl(u) {
  const m = /^https?:\/\/([^/?#]+)/i.exec(String(u || ""));
  return m ? m[1].toLowerCase() : "";
}
/** 记录一个确认为加密封面（无图片魔数且能被 AES 解开）的域名 */
function markEncHost(u) {
  const h = hostOfUrl(u);
  if (!h || encHostSet.has(h)) return;
  encHostSet.add(h);
  try { localStorage.setItem(LS_ENC_HOSTS, JSON.stringify(Array.from(encHostSet).slice(-60))); } catch (e) {}
}
function isEncImg(u) {
  const s = String(u || "");
  if (!s) return false;
  if (ENC_IMG_HOSTS.some((re) => re.test(s))) return true;
  const h = hostOfUrl(s);
  return !!(h && encHostSet.has(h));
}
function isJslImg(u) { return JSL_IMG_HOSTS.some((re) => re.test(u)); }

function imgMagic(b) {
  if (!b || b.length < 4) return null;
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return "image/jpeg";
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return "image/png";
  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return "image/gif";
  if (b.length >= 12 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return "image/webp";
  return null;
}
async function aesDecrypt(bytes, keyBytes, ivBytes) {
  try {
    const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
    const out = await crypto.subtle.decrypt({ name: "AES-CBC", iv: ivBytes }, key, bytes);
    return new Uint8Array(out);
  } catch (e) { return null; }
}

const imgBlobCache = new Map();
const IMG_CACHE_MAX = 240;
const imgQueue = [];
let imgActive = 0;
const IMG_CONCURRENCY = 6;

function cacheBlob(key, url) {
  imgBlobCache.set(key, url);
  if (imgBlobCache.size <= IMG_CACHE_MAX) return;
  const inUse = new Set();
  for (const im of document.images) inUse.add(im.src);
  for (const [k, u] of imgBlobCache) {
    if (imgBlobCache.size <= IMG_CACHE_MAX) break;
    if (k === key || inUse.has(u)) continue;
    imgBlobCache.delete(k);
    try { URL.revokeObjectURL(u); } catch (e) {}
  }
}

async function fetchDecodedImage(url, wantW) {
  const r = await fetch(url, { cache: "force-cache", referrerPolicy: "no-referrer", credentials: "omit" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  let buf = new Uint8Array(await r.arrayBuffer());
  let mime = imgMagic(buf);
  if (!mime) {
    const dec = await aesDecrypt(buf, IMG_KEY, IMG_IV);
    if (dec) {
      const m2 = imgMagic(dec);
      if (m2) {
        buf = dec;
        mime = m2;
        // 解密成功 → 记住该域名，后续同类封面直接走解密管道
        markEncHost(url);
      }
    }
  }
  if (!mime) throw new Error("not image");
  // 统一缩放到展示宽度，显著降低移动端解码压力
  if (wantW && self.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(new Blob([buf], { type: mime }), { resizeWidth: wantW, resizeQuality: "medium" });
      let cnv;
      if (typeof OffscreenCanvas !== "undefined") cnv = new OffscreenCanvas(bmp.width, bmp.height);
      else { cnv = document.createElement("canvas"); cnv.width = bmp.width; cnv.height = bmp.height; }
      cnv.getContext("2d").drawImage(bmp, 0, 0);
      if (bmp.close) bmp.close();
      const out = cnv.convertToBlob
        ? await cnv.convertToBlob({ type: "image/webp", quality: 0.82 })
        : await new Promise((res) => cnv.toBlob(res, "image/webp", 0.82));
      if (out && out.size) return out;
    } catch (e) { /* 降级为原图 */ }
  }
  return new Blob([buf], { type: mime });
}

async function loadEncImage(img) {
  const url = img.dataset.src;
  if (!url) return;
  const key = url + "@" + (img.dataset.w || 300);
  if (imgBlobCache.has(key)) {
    img.src = imgBlobCache.get(key);
    img.classList.remove("pending");
    return;
  }
  try {
    const blob = await fetchDecodedImage(url, parseInt(img.dataset.w, 10) || 300);
    const objUrl = URL.createObjectURL(blob);
    cacheBlob(key, objUrl);
    img.src = objUrl;
    img.classList.remove("pending");
  } catch (e) {
    img.classList.remove("pending");
    console.log("[cover]", e.message);
  }
}
function pumpImgQueue() {
  while (imgActive < IMG_CONCURRENCY && imgQueue.length) {
    const img = imgQueue.shift();
    imgActive++;
    loadEncImage(img).finally(() => { imgActive--; pumpImgQueue(); });
  }
}
const imgObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          imgObserver.unobserve(en.target);
          imgQueue.push(en.target);
          pumpImgQueue();
        }
      });
    }, { rootMargin: "500px" })
  : null;

function hydrateImages(root) {
  $$("img[data-enc]:not([data-queued])", root).forEach((img) => {
    img.dataset.queued = "1";
    if (imgObserver) imgObserver.observe(img);
    else { imgQueue.push(img); pumpImgQueue(); }
  });
}

/**
 * <img onerror> 兜底：普通 <img> 加载失败（多为加密封面伪装成 .png/.jpg，
 * 浏览器拿到二进制无法解码）时，立刻改为经解密管道重新加载。
 * 每个元素只兜底一次，避免死循环。
 */
function imgFallback(img) {
  if (!img || img.dataset.fb) return;
  const src = img.getAttribute("src") || img.dataset.src;
  if (!src || /^blob:|^data:/i.test(src)) return;
  img.dataset.fb = "1";
  img.removeAttribute("src");
  img.classList.add("pending");
  img.dataset.enc = "1";
  img.dataset.src = src;
  if (!img.dataset.w) img.dataset.w = "300";
  img.dataset.queued = "1";
  imgQueue.push(img);
  pumpImgQueue();
}

/** 站源图标加载失败：直接摘掉 <img>，露出底下已经渲染好的渐变底 + 首字 */
function logoFallback(img) {
  if (!img) return;
  const box = img.parentNode;
  if (box) box.removeChild(img);
}

/* 宽图 logo 自动裁切（方案 A+）：
 * 很多站的 logo 是「左边图形 + 右边站名」的长条（如 最大 220×70），
 * 直接塞进方形框会被压成一条或只露中间的半个字。这里按原始宽高比判断：
 * 宽高比 ≥ 1.6 就标成 wide，交给 CSS 用 cover + 左对齐 + 轻微放大，
 * 只保留左侧那块方形图形；方形 logo 不打标，维持 contain 原样。 */
function logoFit(img) {
  if (!img || !img.naturalWidth || !img.naturalHeight) return;
  if (img.naturalWidth / img.naturalHeight >= 1.6) img.classList.add("wide");
  else img.classList.remove("wide");
}

/* 面板重绘时图片常常直接命中缓存，inline onload 偶发不触发：补一层捕获监听兜底 */
document.addEventListener("load", function (e) {
  const img = e.target;
  if (!img || img.tagName !== "IMG") return;
  const box = img.parentNode;
  if (box && box.classList && box.classList.contains("slogo")) logoFit(img);
}, true);

/** 生成 <img> 属性串：加密封面走解密管道，普通封面直接懒加载 */
function imgAttrs(pic, w, lazy, priority) {
  const src = String(pic || "").trim();
  // 没有封面就干脆不给 src：空 src 会让浏览器显示「破图」图标（采集源的小说/图片常常没图）
  if (!src) return ' class="ph" alt=""';
  if (isEncImg(src) || isJslImg(src)) {
    return ' class="pending" data-enc="1" data-src="' + esc(src) + '" data-w="' + (w || 300) + '" alt=""';
  }
  return ' src="' + esc(src) + '"' + (lazy ? ' loading="lazy"' : "") +
    ' decoding="async" alt="" referrerpolicy="no-referrer"' +
    (priority ? ' fetchpriority="high"' : "") + ' onerror="imgFallback(this)"';
}

/**

 * 5 分钟内的算「新鲜」，直接用；过期的先用旧内容顶着，后台静默换新。
 */
const HomeCache = {
  map: new Map(),
  TTL: 5 * 60000,
  MAX: 12,
  get(id) {
    const it = this.map.get(id);
    if (!it) return null;
    return { data: it.data, fresh: Date.now() - it.ts < this.TTL };
  },
  set(id, data) {
    this.map.delete(id);
    this.map.set(id, { ts: Date.now(), data });
    if (this.map.size > this.MAX) this.map.delete(this.map.keys().next().value);
  },
  clear() { this.map.clear(); }
};

/** 统一的空态/错误渲染 */

function skelCards(n, view) {

/* ============================================================
 * 6. 站源适配层（一）公共工具 + 黄果
 * ------------------------------------------------------------
 * 每个站源统一暴露：
 *   cats()                      分类导航（父分类 + 子分类）
 *   home()                      首页（hero + modules）
 *   list({parent,sel,sort,page}) 列表
 *   rank({tab,page})             排行榜（不支持则 features.rank = false）
 *   search(kw,page)              搜索
 *   detail(id,seed)              详情（vod + routes[].episodes）
 *   play(playId)                 取播放地址
 *   hlsSource / makeLoader / verify / blockMessage  播放增强（可选）
 * ============================================================ */

/** 修正转义过的地址 */
function fixUrl(u) {
  let s = String(u || "").replace(/\\u0026/g, "&").replace(/&amp;/g, "&").trim();
  if (s.indexOf("//") === 0) s = "https:" + s;
  return s;
}

/** 是否是可被 <video>/hls.js 直接消费的媒体地址 */
function isMediaUrl(u) {
  const s = String(u || "");
  if (!s) return false;
  return /\.(m3u8|mp4|m4v|flv|webm|mkv|mov|ts)(\?|#|$)/i.test(s);
}

/**
 * HLS 清单里的相对地址 → 绝对地址（按清单自身地址解析）。
 * 代理改写过的清单里，分片路径常是相对的，交给 hls.js 前必须先补全，
 * 否则会按页面地址去解析，直接 404。
 */
function hlsAbsolutize(text, base) {
  const abs = (u) => { try { return new URL(u, base).href; } catch (e) { return u; } };
  return String(text).split(/\r?\n/).map((line) => {
    const s = line.trim();
    if (!s) return line;
    if (s.charAt(0) === "#") {
      if (/^#EXT-X-(KEY|MAP|MEDIA)/i.test(s)) return s.replace(/URI="([^"]*)"/g, (m, u) => 'URI="' + abs(u) + '"');
      return line;
    }
    return abs(s);
  }).join("\n");
}

/**
 * 改写后的清单缓存：verify 时存下补全过地址的清单，
 * hlsSource 取用时转成 blob: 给 hls.js，分片就不会再按原始相对路径去解析。
 */
function makeManifestStore() {
  let cache = null;
  let blob = "";
  return {
    set(src, text) {
      cache = { src, text };
      // 清单到手就预取前几片：把「要一段才拉一段」的等待挪到起播前
      try { warmSegments(text, src); } catch (e) {}
    },
    clear() {
      cache = null;
      if (blob) { URL.revokeObjectURL(blob); blob = ""; }
      warmGen++;                       // 换集了，正在跑的预取立刻作废
    },
    take(src) {
      if (!cache || cache.src !== src) return src;
      try {
        if (blob) URL.revokeObjectURL(blob);
        blob = URL.createObjectURL(new Blob([cache.text], { type: "application/vnd.apple.mpegurl" }));
        return blob;
      } catch (e) { return src; }
    }
  };
}

/**
 * 播放地址预取：打开详情页时先把第一集的直链取回来。
 * 短剧源的 /play 接口要走代理，实测 2 秒左右 —— 这 2 秒完全可以挪到
 * 「用户在详情页看简介」的那几秒里，点击播放时直接开拿清单。
 */
const PrePlay = {
  map: new Map(),
  TTL: 120000,
  key(sid, epId) { return sid + "|" + epId; },
  get(sid, epId) {
    const k = this.key(sid, epId);
    const it = this.map.get(k);
    if (!it) return null;
    if (Date.now() - it.at > this.TTL) { this.map.delete(k); return null; }
    return it.p;
  },
  set(sid, epId, p) {
    this.map.set(this.key(sid, epId), { p: p, at: Date.now() });
    while (this.map.size > 30) this.map.delete(this.map.keys().next().value);
  }
};

function prefetchPlay(site, ep) {
  if (!site || !site.api || typeof site.api.play !== "function") return;
  if (!ep || !ep.playId) return;
  if (PrePlay.get(site.id, ep.playId)) return;
  const p = Promise.resolve().then(() => site.api.play(ep.playId)).catch(() => null);
  PrePlay.set(site.id, ep.playId, p);
}

/* ------------------------------------------------------------
 * 分片缓存：预取回来的片段先存成 blob，hls.js 要的时候本地直接给。
 * 「播着老转圈」多半是「要一段才去拉一段」，一段 8 秒的片子、代理只有
 * 几十 KB/s，拉一段就要七八秒，播放器只能干等。预取把等待挪到起播前，
 * 而且是一次性、可并行的。
 * ---------------------------------------------------------- */
const SegCache = {
  map: new Map(),
  MAX: 20,                    // 20 片 ≈ 3~4MB，够 hls 预载一大段
  get(u) {
    const it = this.map.get(u);
    if (!it) return "";
    this.map.delete(u);
    this.map.set(u, it);      // 命中即提到队尾（LRU）
    return it.blob;
  },
  put(u, data) {
    const buf = data && data.buffer ? data.buffer : data;
    if (!buf || !buf.byteLength) return;
    const old = this.map.get(u);
    if (old) { try { URL.revokeObjectURL(old.blob); } catch (e) {} this.map.delete(u); }
    try {
      const blob = URL.createObjectURL(new Blob([buf], { type: "video/mp2t" }));
      this.map.set(u, { blob: blob, size: buf.byteLength });
      while (this.map.size > this.MAX) {
        const k = this.map.keys().next().value;
        const v = this.map.get(k);
        if (v) { try { URL.revokeObjectURL(v.blob); } catch (e) {} }
        this.map.delete(k);
      }
    } catch (e) { /* 内存不足就放弃缓存，不影响播放 */ }
  },
  clear() {
    this.map.forEach((v) => { try { URL.revokeObjectURL(v.blob); } catch (e) {} });
    this.map.clear();
  }
};

/* ------------------------------------------------------------
 * 分片选路：按「目标域名」单独记，跟清单走哪条通道无关。
 * 清单只有几百字节，谁先回谁赢；分片动辄上百 KB，拼的是吞吐。
 * 之前直接拿清单赢家当分片通道，选出来的常常是延迟低但带宽差的那条，
 * 于是每一段都要等满一整段时长 —— 看着就是一直转圈。
 * ---------------------------------------------------------- */
const SegNet = {
  mem: new Map(),             // origin -> { p, at }
  TTL: 6 * 60000,
  LS: "dj_segroute_v2",
  _saveAt: 0,
  key(u) { try { return new URL(u).origin; } catch (e) { return ""; } },
  /** 上次得出的「某个 CDN 该走哪条通道」存起来，下次起播省掉白试直连的那 1~2 秒 */
  load() {
    try {
      const raw = lsGet(this.LS, null);
      if (!raw || !raw.o || Date.now() - (raw.at || 0) > 24 * 3600 * 1000) return;
      Object.keys(raw.o).forEach((k) => { this.mem.set(k, { p: raw.o[k] || "", at: Date.now() }); });
    } catch (e) {}
  },
  save() {
    const now = Date.now();
    if (now - this._saveAt < 3000) return;      // 别每片都写盘
    this._saveAt = now;
    try {
      const o = {};
      this.mem.forEach((v, k) => { o[k] = v.p; });
      lsSet(this.LS, { o: o, at: now });
    } catch (e) {}
  },
  recall(origin) {
    const it = this.mem.get(origin);
    if (!it) return null;
    if (Date.now() - it.at > this.TTL) { this.mem.delete(origin); return null; }
    return it.p;
  },
  remember(origin, p) { if (origin) { this.mem.set(origin, { p: p || "", at: Date.now() }); this.save(); } },
  forget(origin) { this.mem.delete(origin); },
  build(orig, p) { return p ? ProxyPool.build(p, orig) : orig; },
  /**
   * 候选顺序：直连 → 直拼式代理（字节流透传，最适合大文件）→ 其余代理。
   * 直连排第一是因为不少 CDN 本来就带 CORS 头，直连又快又不占代理带宽。
   */
  cands() {
    const out = [];
    const add = (p) => { if (out.indexOf(p) < 0) out.push(p); };
    add("");
    const pool = ProxyPool.pool();
    pool.forEach((p) => { if (!ProxyPool.isParam(p)) add(p); });
    pool.forEach(add);
    return out;
  },
  async one(orig, p, timeout) {
    const c = new AbortController();
    const t = setTimeout(() => { try { c.abort(); } catch (e) {} }, timeout);
    try {
      const r = await fetch(this.build(orig, p), { credentials: "omit", signal: c.signal });
      if (!r.ok) {
        if (p && (r.status === 403 || r.status === 405 || r.status === 429 || r.status >= 500)) {
          ProxyPool.markBad(p, 90000);
        }
        return null;
      }
      const buf = await r.arrayBuffer();
      return buf && buf.byteLength > 512 ? buf : null;
    } catch (e) {
      return null;
    } finally { clearTimeout(t); }
  },
  /** 首次（或记忆失效）同时试直连和一条直拼代理，先到先用；之后固定用记下的那条 */
  async fetchSeg(orig, timeout) {
    const origin = this.key(orig);
    const memo = this.recall(origin);
    if (memo !== null) {
      const got = await this.one(orig, memo, timeout);
      if (got) return got;
      this.forget(origin);
    }
    const pool = ProxyPool.pool();
    const fast = pool.filter((p) => !ProxyPool.isParam(p)).slice(0, 1);
    const head = [""].concat(fast);
    try {
      const w = await Promise.any(head.map((p) =>
        this.one(orig, p, timeout).then((b) => { if (!b) throw new Error("x"); return { p: p, b: b }; })
      ));
      this.remember(origin, w.p);
      return w.b;
    } catch (e) { /* 头部全灭，下面顺序试 */ }
    const rest = pool.slice(0, 4);
    for (let i = 0; i < rest.length; i++) {
      const got = await this.one(orig, rest[i], timeout);
      if (got) { this.remember(origin, rest[i]); return got; }
    }
    return null;
  }
};

/** 清单里能直接播的分片地址（媒体清单才有；master 清单跳过） */
function segListOf(text, srcUrl) {
  const body = String(text || "");
  if (body.indexOf("#EXTINF") < 0) return [];
  if (body.indexOf("#EXT-X-STREAM-INF") >= 0) return [];
  const out = [];
  body.split(/\r?\n/).forEach((line) => {
    const s = line.trim();
    if (!s || s.charAt(0) === "#") return;
    if (!/\.(ts|m4s|mp4|aac|m4a)(\?|#|$)/i.test(s)) return;
    try { out.push(new URL(s, srcUrl).href); } catch (e) {}
  });
  return out;
}

/**
 * 正在下载中的分片。预取和 hls.js 会同时要同一片，
 * 不去重就会把同一片下载两遍（一片上百 KB，白等一倍时间）。
 */
const SegPending = new Map();
function fetchSegShared(url, timeout) {
  const on = SegPending.get(url);
  if (on) return on;
  const p = SegNet.fetchSeg(url, timeout).then(
    (buf) => { SegPending.delete(url); if (buf) SegCache.put(url, buf); return buf; },
    (e) => { SegPending.delete(url); return null; }
  );
  SegPending.set(url, p);
  return p;
}

let warmGen = 0;
/** 起播前把前几片拉下来。并发放 2，别把窄带代理自己挤死。 */
function warmSegments(text, srcUrl) {
  const urls = segListOf(text, srcUrl).slice(0, 10);
  if (!urls.length) return;
  const gen = ++warmGen;
  let i = 0, live = 0;
  const CONC = 2;
  const pump = () => {
    if (gen !== warmGen) return;
    while (live < CONC && i < urls.length) {
      const u = urls[i++];
      if (SegCache.get(u)) continue;
      live++;
      fetchSegShared(u, 12000)
        .then(() => {})
        .catch(() => {})
        .then(() => { live--; pump(); });
    }
  };
  pump();
}

/** 分片第一条路：有记忆用记忆，没有先直连（CORS 不通会立刻暴露，只付一次代价） */
function segFirst(orig) {
  const memo = SegNet.recall(SegNet.key(orig));
  if (memo !== null) return memo ? ProxyPool.build(memo, orig) : orig;
  return orig;
}

/** 换下一条：按候选顺序找第一个不等于当前地址的，并记住它 */
function segAlt(orig, prevUrl) {
  const origin = SegNet.key(orig);
  const list = SegNet.cands();
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const u = segFirstBuild(orig, p);
    if (u !== prevUrl) { SegNet.remember(origin, p); return u; }
  }
  return "";
}
function segFirstBuild(orig, p) { return p ? ProxyPool.build(p, orig) : orig; }

/**
 * 兼容旧调用点：把同一个地址换到另一条通道。
 * 现在优先走 SegNet 的记忆，避免每次盲换。
 */
function altProxyUrl(orig, prevUrl) {
  const alt = segAlt(orig, prevUrl);
  return alt || "";
}

/**
 * hls.js 分片加载器：把分片请求改写到代理地址，成功后把 URL 还原成原始地址，
 * 否则播放器会把代理地址当成分片标识，切集 / 续播时对不上。
 * route(orig) 返回改写后的地址，返回空串表示这一片不需要代理。
 * 失败时自动换一条代理再拉一次（404 这类确定性错误不重试）。
 */
function makeProxyLoader(route) {
  if (!window.Hls || !Hls.DefaultConfig || !Hls.DefaultConfig.loader) return null;
  const Base = Hls.DefaultConfig.loader;
  return class extends Base {
    load(ctx, cfg, cb) {
      const cur = ctx && ctx.url;
      // ctx.url 会被我们改成 blob/代理地址，原地址要单独记一份
      const orig = (ctx && ctx.__orig) || (typeof cur === "string" && /^https?:\/\//i.test(cur) ? cur : "");
      if (!orig) { super.load(ctx, cfg, cb); return; }
      ctx.__orig = orig;

      // hls.js 的 loader 实例只能 load 一次，重试必须开新实例，
      // 否则会抛 "Loader can only be used once" 并打断这次播放。
      const raw = (url, next) => {
        const L = new Base(cfg);
        L.load(Object.assign({}, ctx, { url: url }), cfg, next);
      };
      const ok = (res, stats, c, net) => { if (res) res.url = orig; cb.onSuccess(res, stats, c, net); };
      const prog = (st, c, d, n) => { if (typeof cb.onProgress === "function") cb.onProgress(st, c, d, n); };

      const net = (url, hop) => {
        raw(url, {
          onSuccess: (res, stats, c, n) => {
            if (res) {
              res.url = orig;
              // 顺手缓存：同一片重播（拖回去 / 卡顿重试）就不用再下载
              if (res.data && res.data.byteLength > 512) SegCache.put(orig, res.data);
            }
            cb.onSuccess(res, stats, c, n);
          },
          onError: (e, c, n, st) => {
            const code = e && e.response && e.response.code;
            const fatal = code >= 400 && code < 500;      // 404/403 换通道也没用
            if (!fatal && hop < 2) {
              const alt = segAlt(orig, url);
              if (alt && alt !== url) { net(alt, hop + 1); return; }
            }
            cb.onError(e, c, n, st);
          },
          onTimeout: (e, c, n, st) => {
            if (hop < 2) {
              const alt = segAlt(orig, url);
              if (alt && alt !== url) { net(alt, hop + 1); return; }
            }
            cb.onTimeout(e, c, n, st);
          },
          onProgress: prog
        });
      };

      const fromNet = () => { net(segFirst(orig), 0); };

      // 预取命中：本地 blob，零等待。这是「不转圈」的主力。
      const hit = SegCache.get(orig);
      if (hit) {
        raw(hit, {
          onSuccess: ok,
          onError: () => { SegCache.map.delete(orig); fromNet(); },
          onTimeout: () => { SegCache.map.delete(orig); fromNet(); },
          onProgress: prog
        });
        return;
      }
      // 这一片正在预取中：等它，别重复下载
      const pend = SegPending.get(orig);
      if (pend) {
        pend.then((buf) => {
          const b = buf ? SegCache.get(orig) : "";
          if (!b) { fromNet(); return; }
          raw(b, {
            onSuccess: ok,
            onError: () => fromNet(),
            onTimeout: () => fromNet(),
            onProgress: prog
          });
        });
        return;
      }
      // 只按分片域名自己选路。不再用「源指定的 route」——那条路是按清单通道来的，
      // 清单只有几百字节、谁先回谁赢，选出来的通道带宽往往最差，扛分片必卡。
      void route;
      fromNet();
    }
  };
}

/**
 * 取清单的通道竞速：直连 + 代理同时起跑，第一个通过 accept() 的胜出。
 * 以前是一个通道失败再试下一个，排在前面的公共中转一慢，用户就得对着
 * 「校验视频源」干等十几秒；现在是先到先用。
 * 返回 { chan, text }（chan 为 null 表示全灭）以及 decoy（是否只拿到宣传片）。
 */
function raceManifest(srcUrl, opt) {
  opt = opt || {};
  const timeout = opt.timeout || 9000;
  const accept = opt.accept || ((t) => !!t && t.indexOf("#EXTM3U") >= 0);
  const chans = [];
  if (opt.first) chans.push(opt.first);
  if (opt.direct !== false) chans.push({ key: "direct", build: (u) => u });
  ProxyPool.pool().forEach((p, i) => {
    // 清单只有几百字节，留 4 条足够；铺太多只会一起撞限流
    if (chans.length >= 4) return;
    chans.push({ key: "p" + i, base: p, build: (u) => ProxyPool.build(p, u) });
  });
  const uniq = [];
  chans.forEach((c) => { if (c && !uniq.some((x) => x.key === c.key)) uniq.push(c); });
  if (!uniq.length) return Promise.resolve({ chan: null, text: "", decoy: false });

  return new Promise((resolve) => {
    let done = false, left = uniq.length, decoy = false;
    const finish = (r) => { if (done) return; done = true; resolve(r); };
    const one = (c) => {
      if (done) return;
      // 直连给到 8s：冷 DNS + TLS 握手在部分 CDN 上能到 5~7s，
      // 卡在 5s 会让本来能直连的源白白判失败（随后整套流程要重来一遍）。
      const ms = c.key === "direct" ? Math.min(timeout, 8000) : timeout;
      const hit = (t) => {
        if (done) return;
        if (t && t.indexOf("#EXTM3U") >= 0) {
          if (accept(t)) { finish({ chan: c, text: t, decoy: decoy }); return; }
          decoy = true;
        }
        if (--left <= 0) finish({ chan: null, text: "", decoy: decoy });
      };
      ProxyPool.raw(c.build(srcUrl), ms).then(hit, (e) => {
        // 限流 / 网关错误：这条通道短期内别再用了
        if (c.base && e && (e.status === 403 || e.status === 405 || e.status === 429 || e.status >= 500)) ProxyPool.markBad(c.base);
        hit("");
      });
    };
    uniq.forEach((c, i) => setTimeout(() => one(c), i * 260));
    // 兜底时间要比直连那份预算宽，否则直连刚摸到门就被总闸砍掉
    setTimeout(() => finish({ chan: null, text: "", decoy: decoy }), Math.max(timeout, 8000) + 2200);
  });
}

/**
 * 从播放页 / 分享页 HTML 中提取真实媒体地址
 * 常见形态：var main = "/2026/xxx/index.m3u8?sign=..."、url:"https://.../a.m3u8"
 */
function pickMediaFromHtml(html, pageUrl) {
  const text = String(html || "").replace(/\\\//g, "/").replace(/\\u0026/g, "&").replace(/&amp;/g, "&");
  const re = /((?:https?:)?\/\/[^"'\s<>()\\]+?\.(?:m3u8|mp4)(?:\?[^"'\s<>()\\]*)?)|(\/[^"'\s<>()\\]+?\.(?:m3u8|mp4)(?:\?[^"'\s<>()\\]*)?)/i;
  const m = re.exec(text);
  if (!m) return "";
  const raw = m[1] || m[2] || "";
  if (!raw) return "";
  if (raw.indexOf("//") === 0) return "https:" + raw;
  if (/^https?:/i.test(raw)) return raw;
  try { return new URL(raw, pageUrl).href; } catch (e) { return ""; }
}

/** 解析 "第1集$播放ID#第2集$播放ID" 结构 */
function parseEpisodes(playUrl) {
  return String(playUrl || "").split("#").map((part) => {
    const i = part.indexOf("$");
    if (i < 0) {
      const t = fixUrl(part.trim());
      return t ? { title: "正片", playId: t } : null;
    }
    const title = part.slice(0, i).trim() || "正片";
    const playId = fixUrl(part.slice(i + 1).trim());
    return playId ? { title, playId } : null;
  }).filter(Boolean);
}

/** 统一卡片数据结构 */
function makeVod(o) {
  return {
    id: String(o.id == null ? "" : o.id),
    name: String(o.name || "未命名").trim(),
    pic: fixUrl(o.pic || ""),
    remark: String(o.remark || "").trim(),
    plays: String(o.plays || "").trim(),
    badge: o.badge || "",
    tags: Array.isArray(o.tags) ? o.tags.filter(Boolean).slice(0, 4) : [],
    intro: String(o.intro || "").trim(),
    type: String(o.type || "").trim(),
    metric: num(o.metric),
    metricLabel: o.metricLabel || "热度",
    rank: num(o.rank),
    score: o.score || "",
    extra: o.extra || {}
  };
}

/* ------------------------------------------------------------
 * 6.1 黄果短剧：多域名直连竞速 + 域名自动发现 + 页面解析 + 清单去诱饵
 * ------------------------------------------------------------
 * 站点靠「跳板域名 301 → 真实域名」防封，真实域名和跳板后缀都会轮换，
 * 硬编码清单迟早全部失效，所以分成三层：
 *   HOST_SEED   内置兜底清单（真实域名 + 主站 + 跳板）
 *   HostBook    探测学到的域名，实测耗时排序后写 localStorage（6h TTL）
 *   discover()  读官方地址发布页 publish.js 拼候选，再用 HEAD 探测一遍，
 *               同时把跳板 301 的落点（response.url）收进清单
 * ---------------------------------------------------------- */
const HG = (function () {
  const HOST_SEED = [
    "https://4d2984.dsqqahhno.cc",  // 当前真实站（跳板 301 的落点）
    "https://huangguoai.io",        // 主站备用域名
    "https://a1b2.ediayikma.cc",    // 老跳板（形如 {4位hex}.{后缀}）
    "https://thu.jxqgmx5ga.cc",     // 新跳板（形如 {大学缩写}.{后缀}）
    "https://huangguoai.com"        // 永久地址，偶发 5xx
  ];
  const PUBLISH_URL = "https://huangguoai.pages.dev/publish.js";   // 官方地址发布页
  const HOST_TTL = 6 * 60 * 60 * 1000;   // 学到的域名 6 小时内复用
  const MAX_PROBE = 5;                   // 一次最多探测几个域名
  const MAX_PROXY_HOSTS = 3;             // 代理兜底同时试几个域名
  const PROBE_PATH = "/chigua/";         // 探测页：体积小、任何镜像都有
  const now = () => (window.performance && performance.now ? performance.now() : Date.now());

  /** 规范化成 https://host 形式，非法返回空串 */
  function normHost(h) {
    const s = String(h || "").trim().replace(/\/+$/, "");
    return /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}$/i.test(s) ? s.toLowerCase() : "";
  }
  function originOf(u) { try { return normHost(new URL(u).origin); } catch (e) { return ""; } }

  /** 学到的域名（按探测耗时排序）+ 内置兜底，去重后合并 */
  const HostBook = {
    list: [],
    ts: 0,
    load() {
      const d = lsGet(LS.hostList, null);
      const fresh = d && Array.isArray(d.list) && Date.now() - (d.ts || 0) < HOST_TTL;
      this.list = fresh ? d.list.map(normHost).filter(Boolean) : [];
      this.ts = fresh ? (d.ts || 0) : 0;
      return this;
    },
    save() {
      try { lsSet(LS.hostList, { list: this.list.slice(0, 8), ts: this.ts }); } catch (e) {}
    },
    /** 用一次探测结果重排：命中的域名按耗时优先，内置补在后面 */
    learn(arr) {
      const out = [];
      (arr || []).forEach((h) => { h = normHost(h); if (h && out.indexOf(h) < 0) out.push(h); });
      if (!out.length) return;
      HOST_SEED.forEach((h) => { if (out.indexOf(h) < 0) out.push(h); });
      if (out.join("|") === this.list.join("|")) { this.ts = Date.now(); this.save(); return; }
      this.list = out;
      this.ts = Date.now();
      this.save();
    },
    all() { return this.list.slice(); }
  };
  HostBook.load();

  const CATS = [
    { id: "recommend", name: "精选推荐", mode: "html" },
    { id: "newest", name: "最近上新", mode: "html" },
    { id: "ai-duanju", name: "AI短剧", mode: "api" },
    { id: "ai-manju", name: "AI漫剧", mode: "api" },
    { id: "ai-huanlian", name: "AI换脸", mode: "api" },
    { id: "ai-mogai", name: "AI魔改", mode: "api" },
    /* 站点独立栏目放在最后：专题（合集）与吃瓜（图文社区），卡片形态与影视卡不同 */
    { id: "topics", name: "专题", mode: "topics" },
    { id: "chigua", name: "吃瓜", mode: "chigua" }
  ];
  const RANK_TABS = [
    { id: "hot", name: "热播榜", desc: "TOP 20 · 实时热力排行" },
    { id: "recommend", name: "推荐榜", desc: "TOP 20 · 口碑推荐精选" },
    { id: "potential", name: "潜力榜", desc: "TOP 20 · 潜力新剧预测" }
  ];
  const PAGE = 24;
  const PUBLIC_RELAYS = [
    { name: "allorigins", build: (u) => "https://allorigins.hexlet.app/raw?url=" + encodeURIComponent(u) },
    { name: "jina", build: (u) => "https://r.jina.ai/" + encodeURIComponent(u) }
  ];

  let goodHost = null;
  try {
    const saved = localStorage.getItem(LS.host);
    if (saved && normHost(saved)) goodHost = normHost(saved);
  } catch (e) {}
  function rememberHost(h) {
    if (!normHost(h)) return;
    goodHost = h;
    try { localStorage.setItem(LS.host, h); } catch (e) {}
  }
  /** 候选顺序：上次成功的域名 → 探测学到的（按耗时）→ 内置兜底 */
  function hostOrder() {
    const uniq = [];
    [].concat(goodHost ? [goodHost] : [], HostBook.all(), HOST_SEED).forEach((h) => {
      h = normHost(h);
      if (h && uniq.indexOf(h) < 0) uniq.push(h);
    });
    return uniq;
  }

  /**
   * 直连健康度：同一类请求直连失败后，短时间内不再白等直连超时。
   * 分类统计（api / html），因为多数网络环境下 API 被拦但页面能直连。
   */
  const DirectHealth = {
    bad: {},
    TTL: 20000,        // 20s 足够避开一阵抖动，又不至于一次失败后长时间全走代理
    key(path) { return path.indexOf("/api/") === 0 ? "api" : "html"; },
    isBad(k) { const t = this.bad[k]; return !!t && Date.now() - t < this.TTL; },
    markBad(k) { this.bad[k] = Date.now(); },
    markOk(k) { delete this.bad[k]; }
  };

  /* ---- 域名探测：HEAD 一次探测页，r.url 就是跟随 301 后的真实域名 ---- */
  async function probeHost(h) {
    const t0 = now();
    if (!normHost(h)) return null;
    try {
      const c1 = new AbortController();
      const t1 = setTimeout(() => { try { c1.abort(); } catch (e) {} }, 3200);
      let r;
      try {
        r = await fetch(h + PROBE_PATH, { method: "HEAD", signal: c1.signal, credentials: "omit", cache: "no-store" });
      } finally { clearTimeout(t1); }
      if (r && r.ok) return { host: h, fin: originOf(r.url), ms: now() - t0 };
      throw new Error("head " + (r ? r.status : "fail"));
    } catch (e) {
      // 超时说明整条链路不通，别再花一个超时去试 GET
      if (e && (e.name === "AbortError" || e.name === "TimeoutError")) return null;
      // 少数节点不支持 HEAD（405/403），退回 GET 再确认一次
      try {
        const c2 = new AbortController();
        const t2 = setTimeout(() => { try { c2.abort(); } catch (er) {} }, 3200);
        let r2;
        try {
          r2 = await fetch(h + PROBE_PATH, { signal: c2.signal, credentials: "omit", cache: "no-store" });
        } finally { clearTimeout(t2); }
        if (!r2 || !r2.ok) return null;
        const t = await r2.text();
        if (!t || t.length < 2000) return null;
        return { host: h, fin: originOf(r2.url), ms: now() - t0 };
      } catch (e2) { return null; }
    }
  }

  /** 官方地址发布页 publish.js：里面有当前后缀清单和子域前缀清单 */
  async function publishHosts() {
    try {
      const c = new AbortController();
      const timer = setTimeout(() => { try { c.abort(); } catch (e) {} }, 4500);
      let js = "";
      try {
        const r = await fetch(PUBLISH_URL + "?t=" + Date.now(), { signal: c.signal, credentials: "omit", cache: "no-store" });
        if (!r.ok) return [];
        js = await r.text();
      } finally { clearTimeout(timer); }
      const urlsSeg = (js.match(/var\s+urls\s*=\s*\[([\s\S]*?)\]/) || [])[1] || "";
      const subsSeg = (js.match(/var\s+subdomains\s*=\s*\[([\s\S]*?)\]/) || [])[1] || "";
      const suffixes = [];
      urlsSeg.replace(/['"]([a-z0-9-]+(?:\.[a-z0-9-]+)+)\/?['"]/gi, (m, g) => {
        if (suffixes.indexOf(g) < 0) suffixes.push(g);
        return m;
      });
      const prefixes = [];
      subsSeg.replace(/['"]([a-z0-9]{2,10})['"]/gi, (m, g) => {
        if (prefixes.indexOf(g) < 0) prefixes.push(g);
        return m;
      });
      if (!suffixes.length || !prefixes.length) return [];
      // 每个后缀配一个随机前缀即可：全部组合会打出几十个请求，没必要
      const out = [];
      suffixes.slice(0, 3).forEach((sf, i) => {
        const p = prefixes[(i * 7 + Math.floor(Math.random() * prefixes.length)) % prefixes.length];
        out.push("https://" + p + "." + sf);
      });
      return out;
    } catch (e) { return []; }
  }

  /**
   * 探测失败的域名短时间不再重复探：像 huangguoai.com 这种已经不响应的，
   * 每次发现都要白等满超时（拖慢整轮 3~4s），记一笔 10 分钟内跳过。
   */
  const ProbeFail = {
    map: {},
    TTL: 10 * 60 * 1000,
    bad(h) { const t = this.map[h]; return !!t && Date.now() - t < this.TTL; },
    mark(h) { this.map[h] = Date.now(); },
    good(h) { delete this.map[h]; }
  };

  let discovering = null;
  /** 把探测结果写回清单：命中的域名按实测耗时排进清单 */
  function applyProbe(ok) {
    if (!ok || !ok.length) return;
    const learn = [];
    ok.forEach((x) => { if (x.fin) learn.push(x.fin); learn.push(x.host); });
    HostBook.learn(learn);
    // 下次优先用本次实测最快的那个（可能是跳板，也可能是 301 落点本身）。
    // 不能盲信 301 落点：落点有时恰好是被墙的那个，跳板反而通。
    const best = (ok[0] && ok[0].host) || "";
    if (best && normHost(best) !== normHost(goodHost || "")) rememberHost(best);
  }
  /** 探一批候选，命中按耗时排序；探过就记成功/失败，失败的下一轮直接跳过 */
  async function probeBatch(list) {
    const res = await Promise.all(list.map((h) => probeHost(h).then((r) => {
      if (r) ProbeFail.good(h); else ProbeFail.mark(h);
      return r;
    })));
    return res.filter(Boolean).sort((a, b) => a.ms - b.ms);
  }
  /** 从发布页拼新域名并探测；返回命中的结果（可能为空） */
  async function probePublish(known) {
    const seeds = await publishHosts();
    const extra = (seeds || []).map(normHost)
      .filter((h) => h && known.indexOf(h) < 0 && !ProbeFail.bad(h)).slice(0, 3);
    if (!extra.length) return [];
    return probeBatch(extra);
  }
  /**
   * 刷新域名清单：先探已知候选（按上次成功的顺序）。
   * 已知域名还能用 → 立即写回返回，发布页的新域名放后台补探，不拖慢这一次；
   * 已知域名全灭 → 说明域名换了，发布页是唯一线索，这时等它探完再返回。
   * force=false 时 6 小时内直接复用缓存，不发请求。
   */
  function discover(force) {
    if (!force && HostBook.ts && Date.now() - HostBook.ts < HOST_TTL) return Promise.resolve(HostBook);
    if (discovering) return discovering;
    discovering = (async () => {
      const known = [];
      [].concat(goodHost ? [goodHost] : [], HostBook.all(), HOST_SEED).forEach((h) => {
        h = normHost(h);
        if (h && known.indexOf(h) < 0) known.push(h);
      });
      const poke = known.filter((h) => !ProbeFail.bad(h)).slice(0, MAX_PROBE);
      const knownOk = await probeBatch(poke);
      if (knownOk.length) {
        applyProbe(knownOk);
        probePublish(known).then((ok) => { if (ok.length) applyProbe(knownOk.concat(ok)); }).catch(() => {});
      } else {
        const ok = await probePublish(known);
        if (ok.length) applyProbe(ok);
        else HostBook.learn(known);   // 发布页也没辙（可能离线）：先把清单存下，别每轮重探
      }
      return HostBook;
    })().catch(() => HostBook).finally(() => { discovering = null; });
    return discovering;
  }

  /**
   * 代理兜底：一次只让「一个域名 × 整个代理池」跑竞速。
   * 这些域名其实是同一个后端的跳板，代理对 A 域名不通时对 B 通常也不通，
   * 所以按域名串行换（失败立刻换下一个），3.5s 还没结果再补一个域名并行。
   * 首页一次要拉 8 个栏目，如果每个都按「域名 × 代理」全发，会瞬间打出几十个请求
   * 反而把公共代理挤到超时。
   */
  function proxyRace(path, hosts) {
    const opt = { timeout: 12000, headStart: 500, validate: (t) => !!t && t.length >= 200 };
    return new Promise((resolve) => {
      let done = false, next = 0;
      const fin = (t) => { if (!done) { done = true; resolve(t || null); } };
      const start = () => {
        if (done || next >= hosts.length) return;
        const h = hosts[next++];
        ProxyPool.race(h + path, opt).then((r) => {
          if (r && r.text) { rememberHost(h); fin(r.text); return; }
          start();
        }, () => start());
      };
      start();
      // 首个域名迟迟没结果（可能被墙住），再补一个域名并行，不让用户干等
      setTimeout(() => { if (!done && next < 2) start(); }, 3500);
      // 兜底：所有域名都跑完一圈仍无果
      setTimeout(() => fin(null), 12000 + 1200 + 1600);
    });
  }

  /**
   * 多域名直连竞速取页面；全灭后并发走代理池，再不行就后台换一批域名。
   * 这里不再「一次把所有域名都发满」：首选域名先发，其余错峰 150ms 跟上，
   * 命中后立刻 abort 掉其余的 —— 首页一次要拉 8 个栏目，5 个域名全发就是 40 个请求。
   */
  async function fetchPage(path) {
    const list = hostOrder();
    const hk = DirectHealth.key(path);
    // 直连并行竞速：超时收紧到 4.2s，直连不通时尽快转代理，不让用户干等
    if (!DirectHealth.isBad(hk)) {
      const shared = new AbortController();
      const tries = list.map((h, i) => new Promise((resolve, reject) => {
        setTimeout(() => {
          if (shared.signal.aborted) { reject(new Error("cancel")); return; }
          ProxyPool.raw(h + path, 4200, { signal: shared.signal }).then((t) => {
            if (!t || t.length < 200) throw new Error("empty");
            resolve({ host: h, text: t });
          }).catch(reject);
        }, i * 150);
      }));
      try {
        const win = await Promise.any(tries);
        try { shared.abort(); } catch (e) {}     // 赢了就掐掉还在跑的其余请求
        rememberHost(win.host);
        DirectHealth.markOk(hk);
        return win.text;
      } catch (e) {
        // 直连全灭：记一笔，后续同类请求直接走代理，省掉 4.2s 空等
        DirectHealth.markBad(hk);
      }
    }
    // 代理兜底：多域名并发竞速（原来逐个串行，每加一个域名就多等 12s）
    const text = await proxyRace(path, list.slice(0, MAX_PROXY_HOSTS));
    if (text) return text;
    // 全灭多半是域名轮换了：后台重新发现，下次请求就能用上新域名
    discover(true).catch(() => {});
    return null;
  }
  async function apiGet(path) {
    const text = await fetchPage(path);
    if (!text) return null;
    try { return JSON.parse(cleanJSON(text)); } catch (e) { return null; }
  }

  function stripCardText(s) {
    return String(s || "")
      .replace(/<span class="sr-only">[\s\S]*?<\/span>/g, "")
      .replace(/<[^>]+>/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  function fromResults(html) {
    const i = html.indexOf("hg-card-grid");
    return i >= 0 ? html.slice(i) : html;
  }

  /** 解析列表页卡片 */
  function parseList(html) {
    if (!html) return [];
    const out = [];
    const seen = new Set();
    const blocks = html.split('<div class="hg-drama-card"');
    for (let i = 1; i < blocks.length; i++) {
      const b = blocks[i];
      const vm = b.match(/href="\/(?:video|detail)\/(\d+)\/"/);
      if (!vm) continue;
      const id = vm[1];
      if (seen.has(id)) continue;
      seen.add(id);
      const pm = b.match(/data-src="([^"]+)"/) || b.match(/src="(https?:\/\/[^"]+)"/);
      let title = "";
      const tm = b.match(/class="[^"]*hg-drama-card__title[^"]*"[^>]*>\s*<a[^>]*>([\s\S]*?)<\/a>/);
      if (tm) title = stripCardText(tm[1]);
      if (!title) {
        const am = b.match(/alt="([^"]+)"/);
        title = am ? stripCardText(am[1]) : "";
      }
      if (!title) continue;
      const epBase = b.match(/data-ep-base="([^"]+)"/);
      const epTxt = b.match(/(?:全|更新至)\s*\d+\s*集/);
      const badge = /hg-drama-card__badge--new/.test(b) ? "new"
        : (/hg-drama-card__badge--hot/.test(b) ? "hot" : "");
      const tags = [];
      const tagRefs = {};
      // 站点标签页：/tag/{slug}/ —— 连同 slug 一起收集，供「标签页」跳转
      const tagRe = /<a class="hg-tag"[^>]*href="\/tag\/([^\/"]+)\/"[^>]*>([\s\S]*?)<\/a>/g;
      let t;
      while ((t = tagRe.exec(b)) !== null) {
        const slug = t[1];
        const name = stripCardText(t[2]);
        if (!name) continue;
        if (tags.indexOf(name) < 0) tags.push(name);
        if (slug) tagRefs[name] = slug;
      }
      if (Object.keys(tagRefs).length) learnTagSlugs(tagRefs);
      const dm = b.match(/hg-drama-card__desc">([\s\S]*?)<\/p>/);
      const vod = makeVod({
        id, name: title,
        pic: pm ? pm[1] : "",
        remark: epBase ? stripCardText(epBase[1]) : (epTxt ? epTxt[0].replace(/\s+/g, "") : ""),
        badge, tags,
        intro: dm ? stripCardText(dm[1]) : ""
      });
      if (vod && Object.keys(tagRefs).length) vod.tagRefs = tagRefs;
      out.push(vod);
    }
    return out;
  }

  function toVod(it) {
    if (!it) return null;
    const id = String(it.id == null ? "" : it.id).trim();
    const name = String(it.title || "").trim();
    if (!id || !name) return null;
    const total = num(it.total_episodes || it.episode_count || it.episodeCount);
    const fin = it.is_finished === true || it.is_finished === 1;
    const tags = Array.isArray(it.tags) ? it.tags : [];
    // 接口类目没有 slug：用本地学到的「标签名 → slug」字典补全
    const tagRefs = {};
    tags.forEach((t) => { const s = tagSlugOf(t); if (s) tagRefs[t] = s; });
    const vod = makeVod({
      id, name,
      pic: it.cover || it.pic || "",
      remark: fin ? (total ? "全" + total + "集" : "已完结") : (total ? "更新至" + total + "集" : ""),
      plays: it.hot ? fmtPlays(it.hot) : "",
      tags,
      intro: it.description || ""
    });
    if (vod && Object.keys(tagRefs).length) vod.tagRefs = tagRefs;
    return vod;
  }

  async function dataHome() {
    // 专题 / 吃瓜是站点独立栏目（首页模块里不出），也没有 /api/videos/category/{id}，
    // 以前对它们也发请求，白打两个 404；这里只拉影视栏目，并发压到 3 个。
    const list = CATS.filter((c) => c.mode === "html" || c.mode === "api");
    const results = await mapLimit(list, 3, (c) => (c.mode === "html"
      ? fetchPage("/" + c.id + "/").then((t) => (t ? parseList(fromResults(t)) : null))
      : apiGet("/api/videos/category/" + c.id + "?sort=hot&page=1&size=12").then((d) => {
          const inner = (d && d.data && typeof d.data === "object") ? d.data : {};
          const items = Array.isArray(inner.items) ? inner.items : [];
          return items.map(toVod).filter(Boolean);
        })
    ));
    if (results.every((r) => !r || !r.length)) return { error: true, hero: [], modules: [] };
    const modules = [];
    results.forEach((items, i) => {
      if (items && items.length) {
        modules.push({ code: list[i].id, title: list[i].name, list: items.slice(0, 12), total: items.length, open: { parent: list[i].id, sel: [], title: list[i].name } });
      }
    });
    const hero = (results[0] || results[1] || []).slice(0, 6);
    return { hero, modules };
  }

  async function dataCategory(catId, pg, sub) {
    const cat = CATS.find((c) => c.id === catId) || CATS[0];
    if (cat.mode === "topics") return dataTopics(pg);
    if (cat.mode === "chigua") return dataChigua(pg, sub || state.list.sub);
    if (cat.mode === "api") {
      const d = await apiGet("/api/videos/category/" + cat.id + "?sort=hot&page=" + pg + "&size=" + PAGE);
      if (!d) return { items: [], total: 0, page: pg, pages: 1 };
      const inner = (d.data && typeof d.data === "object") ? d.data : {};
      const items = (Array.isArray(inner.items) ? inner.items : []).map(toVod).filter(Boolean);
      const total = num(inner.pagination && inner.pagination.total);
      const pages = num(inner.pagination && inner.pagination.pages) || (total ? Math.ceil(total / PAGE) : (items.length >= PAGE ? pg + 1 : pg));
      return { items, total, page: pg, pages: Math.max(1, pages) };
    }
    const html = await fetchPage(pg > 1 ? "/" + cat.id + "/" + pg + "/" : "/" + cat.id + "/");
    if (!html) return { error: true, items: [], total: 0, page: pg, pages: 1 };
    const items = parseList(fromResults(html));
    return { items, total: 0, page: pg, pages: items.length >= 12 ? pg + 1 : pg };
  }

  /* ------------------------------------------------------------
   * 站点栏目：专题（/topics/）与吃瓜（/chigua/）
   * 专题是「短剧合集」入口，点进去仍是普通剧集列表；
   * 吃瓜是站点图文社区，点进去读文章（图文 + 相关推荐）。
   * ---------------------------------------------------------- */
  /**
   * 页面里出现的最大页码。
   * 站点所有分页都是 `/xxx/page/N/` 形态，直接全局抓 `/page/N/` 取最大值即可。
   * （早前按栏目前缀拼正则，前缀里的 `\/` 被二次转义，永远匹配不到 →
   *   专题只出第一页 9 个、吃瓜只出 13 条，看着就是“内容不全”。）
   */
  function maxPageFrom(html) {
    let max = 1;
    if (!html) return max;
    const re = /\/page\/(\d+)\//g;
    let m;
    while ((m = re.exec(html)) !== null) max = Math.max(max, num(m[1]));
    return max;
  }
  /**
   * 按卡片根节点 class 切块。
   * 不能直接 split('class="hg-post-card"')：站点会给部分卡片加修饰类
   * （如 hg-post-card hg-post-card--nocover），而 __body/__img 这类子元素
   * 前缀又相同，容易误切。这里只在「完整 class 属性」上切。
   */
  function splitCards(html, cls) {
    if (!html) return [];
    const re = new RegExp('class="' + cls + '(?:\\s[^"]*)?"', "g");
    const at = [];
    let m;
    while ((m = re.exec(html)) !== null) at.push(m.index);
    const out = [];
    for (let i = 0; i < at.length; i++) out.push(html.slice(at[i], i + 1 < at.length ? at[i + 1] : html.length));
    return out;
  }
  /** 专题卡片：/topics/ 与 /topics/page/N/ */
  function parseTopicCards(html) {
    if (!html) return [];
    const out = [];
    const seen = new Set();
    const blocks = splitCards(html, "hg-topic-card");
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const hm = b.match(/href="\/topics\/([^\/"]+)\/"/);
      if (!hm) continue;
      const slug = hm[1];
      if (seen.has(slug)) continue;
      seen.add(slug);
      const pm = b.match(/data-src="([^"]+)"/) || b.match(/src="(https?:\/\/[^"]+)"/);
      const tm = b.match(/hg-topic-card__title"[^>]*>([\s\S]*?)<\/h[1-6]>/);
      const name = tm ? stripCardText(tm[1]) : "";
      if (!name) continue;
      const mm = b.match(/hg-topic-card__meta"[^>]*>([\s\S]*?)<\/p>/);
      out.push({
        id: slug,
        name,
        pic: pm ? pm[1] : "",
        remark: mm ? stripCardText(mm[1]) : "",
        tags: [],
        kind: "topic"
      });
    }
    return out;
  }
  async function dataTopics(pg) {
    const html = await fetchPage(pg > 1 ? "/topics/page/" + pg + "/" : "/topics/");
    if (!html) return { error: true, items: [], total: 0, page: pg, pages: 1, view: "topics" };
    const items = parseTopicCards(html);
    const pages = Math.max(pg, maxPageFrom(html));
    return { items, total: 0, page: pg, pages: Math.max(1, pages), view: "topics" };
  }
  /** 单个专题内的短剧列表 */
  async function dataTopic(slug, pg) {
    const path = "/topics/" + encodeURIComponent(slug) + "/";
    const html = await fetchPage(pg > 1 ? path + "page/" + pg + "/" : path);
    if (!html) return { error: true, items: [], total: 0, page: pg, pages: 1 };
    const items = parseList(fromResults(html));
    const dp = html.match(/data-pages="(\d+)"/);
    const total = num((html.match(/共\s*(\d+)\s*部/) || [])[1]);
    let pages = dp ? num(dp[1]) : maxPageFrom(html);
    if (pages <= pg && items.length >= 20) pages = pg + 1;
    return { items, total, page: pg, pages: Math.max(1, pages) };
  }
  /** 吃瓜帖子卡片：/chigua/ 与 /chigua/page/N/ */
  function parsePostCards(html) {
    if (!html) return [];
    const out = [];
    const seen = new Set();
    const blocks = splitCards(html, "hg-post-card");
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const hm = b.match(/href="\/archives\/(\d+)\/"/);
      if (!hm) continue;
      const id = hm[1];
      if (seen.has(id)) continue;
      seen.add(id);
      const pm = b.match(/data-src="([^"]+)"/) || b.match(/src="(https?:\/\/[^"]+)"/);
      // 标题优先取正文区里的 h3（页面结构：__gallery → __body > p.meta + h3）
      const tm = b.match(/hg-post-card__body[\s\S]{0,600}?<h3[^>]*>([\s\S]*?)<\/h3>/) ||
        b.match(/<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/);
      let name = tm ? stripCardText(tm[1]) : "";
      if (!name) {
        const am = b.match(/data-track-item-name="([^"]+)"/);
        name = am ? stripCardText(am[1]) : "";
      }
      if (!name) continue;
      const author = (b.match(/hg-post-card__user"[^>]*>([\s\S]*?)<\/span>/) || [])[1];
      const date = (b.match(/hg-post-card__date"[^>]*>([\s\S]*?)<\/span>/) || [])[1];
      const cat = (b.match(/hg-post-card__cat"[^>]*>([\s\S]*?)<\/span>/) || [])[1];
      const tags = [];
      if (cat) tags.push(stripCardText(cat));
      out.push({
        id,
        name,
        pic: pm ? pm[1] : "",
        remark: date ? stripCardText(date) : "",
        tags,
        author: author ? stripCardText(author) : "",
        kind: "post"
      });
    }
    return out;
  }
  /**
   * 吃瓜子栏目页签（页面上的 .hg-gossip-tabs）
   * 站点结构：全部 /chigua/、热门 /chigua/remen/、AI原创 /chigua/yuanchuang/
   * 返回 [{ slug, name, on }]，slug 为空串表示「全部」
   */
  function parseGossipTabs(html) {
    if (!html) return [];
    const out = [];
    const seen = new Set();
    const re = /class="hg-gossip-tabs__item([^"]*)"\s+href="([^"]+)"/g;
    let m;
    while ((m = re.exec(html)) !== null) {
      const href = m[2] || "";
      const slug = (href.match(/^\/chigua\/([^\/]+)\/?$/) || [])[1] || "";
      if (slug && seen.has(slug)) continue;
      const nm = html.slice(m.index, m.index + 500).match(/<span>([\s\S]*?)<\/span>/);
      if (!nm) continue;
      const name = stripCardText(nm[1]);
      if (!name) continue;
      seen.add(slug);
      out.push({ slug, name, on: /is-active/.test(m[1] || "") });
    }
    return out;
  }

  /**
   * 吃瓜列表
   *  - 全部：/chigua/           分页 /chigua/page/N/
   *  - 子栏目：/chigua/remen/   分页用查询参数 /chigua/remen/?page=N
   *    （站点对 /chigua/remen/page/N/ 返回 404，只有全部栏目走路径分页）
   */
  async function dataChigua(pg, sub) {
    const slug = String(sub || "").replace(/[^a-z0-9_-]/gi, "");
    const path = slug
      ? "/chigua/" + slug + "/" + (pg > 1 ? "?page=" + pg : "")
      : (pg > 1 ? "/chigua/page/" + pg + "/" : "/chigua/");
    const html = await fetchPage(path);
    if (!html) return { error: true, items: [], total: 0, page: pg, pages: 1, view: "posts", tabs: [] };
    const items = parsePostCards(html);
    // 站点 toolbar 直接写了「第 1/53 页 · 共 684 条」，比分页链接更准
    const tm = html.match(/第\s*(\d+)\s*\/\s*(\d+)\s*页[\s\S]{0,24}?共\s*(\d+)\s*条/);
    const total = tm ? num(tm[3]) : 0;
    const pages = Math.max(pg, tm ? num(tm[2]) : 0, maxPageFrom(html));
    return { items, total, page: pg, pages: Math.max(1, pages), view: "posts", tabs: parseGossipTabs(html) };
  }
  /** 吃瓜正文：按出现顺序抽成「文字块 / 图片块」，避免整段 HTML 注入 */
  function parsePostBody(seg) {
    const html = String(seg || "")
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/<style[\s\S]*?<\/style>/gi, "")
      .replace(/<noscript[\s\S]*?<\/noscript>/gi, "");
    const parts = [];
    let m;
    const imgRe = /<img\b[^>]*>/gi;
    while ((m = imgRe.exec(html)) !== null) {
      const tag = m[0];
      const src = (tag.match(/data-src="([^"]+)"/) || tag.match(/src="(https?:\/\/[^"]+)"/) || [])[1] || "";
      if (src && !/cover-placeholder/.test(src)) parts.push({ i: m.index, kind: "img", val: src });
    }
    const pRe = /<(p|h2|h3|blockquote)\b[^>]*>([\s\S]*?)<\/\1>/gi;
    while ((m = pRe.exec(html)) !== null) {
      const txt = stripCardText(m[2]);
      if (txt) parts.push({ i: m.index, kind: "text", val: txt });
    }
    parts.sort((a, b) => a.i - b.i);
    const out = [];
    parts.forEach((p) => {
      const last = out[out.length - 1];
      if (last && last.kind === p.kind && last.val === p.val) return;
      out.push(p);
    });
    return out.slice(0, 80);
  }
  /** 吃瓜文章详情 */
  async function dataPost(id) {
    const raw = await fetchPage("/archives/" + encodeURIComponent(id) + "/");
    if (!raw) return null;
    // 站点把同样的类名也写在 <style> 里，先剥掉样式与脚本，避免匹配到 CSS 规则
    const html = String(raw)
      .replace(/<style[\s\S]*?<\/style>/gi, "")
      .replace(/<script[\s\S]*?<\/script>/gi, "");
    const title = stripCardText((html.match(/<h1[^>]*hg-post-detail__title[^>]*>([\s\S]*?)<\/h1>/) || [])[1] || "");
    const metaSeg = (html.match(/<div[^>]*hg-post-detail__meta"[^>]*>([\s\S]*?)<\/div>/) || [])[1] || "";
    const metaText = stripCardText(metaSeg);
    const metaParts = metaText.split("·").map((s) => s.trim()).filter(Boolean);
    const date = (metaText.match(/\d{4}-\d{2}-\d{2}/) || [""])[0];
    const reads = (metaText.match(/([\d.]+\s*万?)\s*阅读/) || [])[1] || "";
    const catM = metaSeg.match(/<a[^>]*href="\/chigua\/([^\/"]+)\/"[^>]*>([\s\S]*?)<\/a>/);
    const cat = catM ? stripCardText(catM[2]) : "";
    // 作者取 meta 第一段（去掉可能粘上的日期 / 阅读数）
    const author = (metaParts[0] || "").replace(/\d{4}-\d{2}-\d{2}[\s\S]*$/, "").replace(/[\d.]+\s*万?\s*阅读[\s\S]*$/, "").trim();
    const bodyStart = html.indexOf('class="hg-post-detail__body');
    let bodySeg = "";
    if (bodyStart > 0) {
      const tagEnd = html.indexOf("hg-post-detail__tags", bodyStart);
      bodySeg = html.slice(bodyStart, tagEnd > 0 ? tagEnd : bodyStart + 20000);
    }
    const tagsSeg = (html.match(/<div[^>]*hg-post-detail__tags"[^>]*>([\s\S]*?)<\/div>/) || [])[1] || "";
    const tags = [];
    const tagRe = /<a\b[^>]*>([\s\S]*?)<\/a>/g;
    let tm;
    while ((tm = tagRe.exec(tagsSeg)) !== null) {
      const t = stripCardText(tm[1]).replace(/^#/, "");
      if (t && tags.indexOf(t) < 0) tags.push(t);
    }
    // 相关推荐（同为吃瓜帖子）
    const related = [];
    const relBlocks = html.split('class="hg-post-detail__rel-card"');
    for (let i = 1; i < relBlocks.length && related.length < 6; i++) {
      const rb = relBlocks[i];
      const rid = (rb.match(/href="\/archives\/(\d+)\/"/) || [])[1];
      if (!rid || related.some((x) => x.id === rid)) continue;
      const rpic = (rb.match(/data-src="([^"]+)"/) || [])[1] || "";
      const ralt = (rb.match(/alt="([^"]*)"/) || [])[1] || "";
      const rtext = stripCardText(rb.slice(0, 1600));
      related.push({ id: rid, name: stripCardText(ralt) || rtext.slice(0, 40), pic: fixUrl(rpic) });
    }
    // 正文里提到的剧集（/video/{id}/）：点一下直接进详情看正片
    const videos = [];
    const vRe = /<a[^>]*href="[^"]*\/video\/(\d+)\/"[^>]*>([\s\S]*?)<\/a>/g;
    let vm2;
    while ((vm2 = vRe.exec(html)) !== null) {
      const vid = vm2[1];
      if (videos.some((x) => x.id === vid)) continue;
      const vname = stripCardText(vm2[2]).replace(/^点击观看[:：]?\s*/, "") || "正片";
      videos.push({ id: vid, name: vname });
      if (videos.length >= 3) break;
    }
    // 正文首图当封面
    const cover = (bodySeg.match(/data-src="([^"]+)"/) || [])[1] || (html.match(/<meta property="og:image" content="([^"]+)"/) || [])[1] || "";
    return {
      id: String(id),
      name: title || "吃瓜详情",
      author, date, cat,
      reads: reads ? reads + " 阅读" : "",
      tags: tags.slice(0, 8),
      videos,
      cover: fixUrl(cover),
      blocks: parsePostBody(bodySeg),
      related
    };
  }

  /* ---- 标签页：站点 /tag/{slug}/ ---- */
  const LS_TAGS = "dj_hg_tags_v1";
  let tagDict = null;
  function loadTagDict() {
    if (tagDict) return tagDict;
    const d = lsGet(LS_TAGS, null);
    tagDict = (d && typeof d === "object") ? d : {};
    return tagDict;
  }
  function learnTagSlugs(map) {
    const d = loadTagDict();
    let changed = false;
    Object.keys(map || {}).forEach((k) => {
      const v = map[k];
      if (v && d[k] !== v) { d[k] = v; changed = true; }
    });
    if (changed) lsSet(LS_TAGS, d);
  }
  function tagSlugOf(name) { return loadTagDict()[name] || ""; }

  async function dataTag(name, slug, pg) {
    const s = slug || tagSlugOf(name);
    if (!s) return { error: true, items: [], total: 0, page: pg, pages: 1 };
    const html = await fetchPage(pg > 1 ? "/tag/" + s + "/page/" + pg + "/" : "/tag/" + s + "/");
    if (!html) return { error: true, items: [], total: 0, page: pg, pages: 1 };
    const items = parseList(fromResults(html));
    // 末页页码从分页链接里取（底部会给出末页按钮）
    let maxPage = pg;
    const re = new RegExp("\\/tag\\/" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\/page\\/(\\d+)\\/", "g");
    let m;
    while ((m = re.exec(html)) !== null) maxPage = Math.max(maxPage, num(m[1]));
    if (maxPage === pg && items.length >= 12) maxPage = pg + 1;
    return { items, total: 0, page: pg, pages: Math.max(1, maxPage) };
  }

  async function dataSearch(kw, pg) {
    const q = encodeURIComponent(String(kw || "").replace(/\//g, " "));
    const html = await fetchPage(pg > 1 ? "/search/video/" + q + "/" + pg + "/" : "/search/video/" + q + "/");
    if (!html) return { error: true, items: [], page: pg, pages: 1, total: 0 };
    const items = parseList(fromResults(html));
    const tm = html.match(/<strong>([\d,]+)<\/strong>\s*部/);
    const total = tm ? num(tm[1].replace(/,/g, "")) : 0;
    const pages = total ? Math.max(1, Math.ceil(total / Math.max(1, items.length))) : (items.length >= 12 ? pg + 1 : pg);
    return { items, total, page: pg, pages };
  }

  async function dataRank(tab) {
    const t = RANK_TABS.find((x) => x.id === tab) || RANK_TABS[0];
    const d = await apiGet("/api/ranks/" + t.id);
    const inner = (d && d.data && typeof d.data === "object") ? d.data : {};
    const items = (Array.isArray(inner.items) ? inner.items : []).map((it) => {
      const id = String(it.video_id == null ? "" : it.video_id).trim();
