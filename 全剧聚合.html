<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-site="hg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f6fa">
<title>全剧聚合</title>

<!-- 预连接：提前建连，首屏接口与封面更快 -->
<link rel="preconnect" href="https://huangguoai.com" crossorigin>

  var CDN = [
    "https://registry.npmmirror.com/hls.js/1.5.13/files/dist/hls.min.js",

    s.crossOrigin = "anonymous";
    s.onerror = function () { s.remove(); next(); };
    document.head.appendChild(s);
  })();
})();
</script>

<style>
/* ============================================================
   0. 设计变量：深/浅两套主题 + 各站源专属配色
   ============================================================ */
:root{
  --accent:#ffd21a; --accent-2:#ff9d2e; --accent-3:#ffe36e;
  --accent-glow:rgba(255,210,26,.32); --accent-glow-2:rgba(255,157,46,.2);
  --on-accent:#2b1d00;
}
:root[data-site="jg"]{--accent:#ff5d7e;--accent-2:#ff2e63;--accent-3:#ff9db0;--accent-glow:rgba(255,93,126,.34);--accent-glow-2:rgba(255,46,99,.2);--on-accent:#fff}
:root[data-site="yg"]{--accent:#3ddc84;--accent-2:#17b26a;--accent-3:#a4f3c6;--accent-glow:rgba(61,220,132,.3);--accent-glow-2:rgba(23,178,106,.18);--on-accent:#052e1a}
:root[data-site="rou"]{--accent:#ff3b5c;--accent-2:#ff7a45;--accent-3:#ffb1a1;--accent-glow:rgba(255,59,92,.32);--accent-glow-2:rgba(255,122,69,.18);--on-accent:#fff}
:root[data-site="cms"]{--accent:#7c9bff;--accent-2:#a06bff;--accent-3:#c3ccff;--accent-glow:rgba(124,155,255,.32);--accent-glow-2:rgba(160,107,255,.2);--on-accent:#fff}

:root[data-theme="dark"]{
  --bg:#0e0e12; --bg-grad:#2b2005; --card:#17181d; --panel:#1a1b21;
  --line:rgba(255,255,255,.07); --line-hi:rgba(255,255,255,.16);
  --text:#f2f3f7; --dim:#b9bdcb; --sub:#7d8296;
  --hover:rgba(255,255,255,.06); --chip:rgba(255,255,255,.06);
  --header:rgba(14,14,18,.84); --drawer:rgba(19,20,26,.96);
  --mask:rgba(0,0,0,.6); --sk1:#16171c; --sk2:#23242c;
  --sh-md:0 12px 32px rgba(0,0,0,.5); --sh-lg:0 24px 56px rgba(0,0,0,.62);
  --hero-mask:linear-gradient(180deg,rgba(0,0,0,.02) 20%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.93) 100%);
}
:root[data-theme="light"]{
  --bg:#f5f6fa; --bg-grad:#ffe9b8; --card:#fff; --panel:#fff;
  --line:rgba(20,20,40,.08); --line-hi:rgba(20,20,40,.18);
  --text:#17181d; --dim:#3a3e4e; --sub:#6b7085;
  --hover:rgba(20,20,40,.05); --chip:rgba(20,20,40,.05);
  --header:rgba(255,255,255,.9); --drawer:rgba(255,255,255,.98);
  --mask:rgba(30,30,50,.38); --sk1:#eceef4; --sk2:#f8f9fc;
  --sh-md:0 10px 30px rgba(90,95,140,.12); --sh-lg:0 20px 50px rgba(90,95,140,.18);
  --hero-mask:linear-gradient(180deg,rgba(0,0,0,.02) 20%,rgba(0,0,0,.45) 62%,rgba(0,0,0,.84) 100%);
}
:root[data-theme="light"][data-site="jg"]{--bg-grad:#ffdce4}
:root[data-theme="light"][data-site="yg"]{--bg-grad:#d7f5e4}
:root[data-theme="light"][data-site="cms"]{--bg-grad:#e2e8ff}

/* ============================================================
   1. 基础重置
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{min-height:100vh}
body{
  background:var(--bg);color:var(--text);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .35s ease,color .35s ease;
}
body::before{
  content:"";position:fixed;inset:-30% -30% auto -30%;height:70vh;z-index:0;pointer-events:none;opacity:.55;
  background:radial-gradient(50% 80% at 18% 0%,var(--bg-grad) 0%,transparent 62%),
             radial-gradient(46% 70% at 86% 4%,var(--accent-glow-2) 0%,transparent 62%);
}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
img.pending{opacity:0}
img[data-enc]{transition:opacity .3s ease}
button,input,select,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:6px;height:0}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:6px}

/* ============================================================
   2. 顶部进度条 / 轻提示
   ============================================================ */
#topbar{
  position:fixed;top:0;left:0;height:3px;width:0;z-index:999;opacity:0;
  background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3),var(--accent));
  background-size:200% 100%;border-radius:0 3px 3px 0;box-shadow:0 0 14px var(--accent-glow);
  transition:width .3s cubic-bezier(.34,1.4,.64,1),opacity .3s;
  animation:shimmer 2s linear infinite;
}
@keyframes shimmer{from{background-position:0 0}to{background-position:200% 0}}
#toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:600;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;max-width:82vw;text-align:center;
  padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;
  background:var(--panel);color:var(--text);border:1px solid var(--line-hi);box-shadow:var(--sh-lg);
  transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   3. 顶部栏
   ============================================================ */
.hd{
  position:sticky;top:0;z-index:120;padding:12px 16px 10px;
  background:var(--header);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.hd-row{display:flex;gap:12px;align-items:center;max-width:1280px;margin:0 auto}
.hd-row .brand{flex:1;min-width:0}
.icon-btn{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--text);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .25s,color .25s,box-shadow .25s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 8px 22px var(--accent-glow);transform:translateY(-2px)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;user-select:none}
.brand .logo{
  font-size:27px;font-weight:900;letter-spacing:1.2px;line-height:1.15;white-space:nowrap;
  background:linear-gradient(110deg,var(--accent),var(--accent-2) 45%,var(--accent-3) 70%,var(--accent));
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite;
}
@keyframes shine{from{background-position:0 center}to{background-position:300% center}}
.brand .chev{width:16px;height:16px;flex-shrink:0;stroke:var(--sub);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s,stroke .3s}
.brand:hover .chev{stroke:var(--accent);transform:translateY(2px)}
.theme-btn{position:relative}
.theme-btn .sun,.theme-btn .moon{position:absolute;transition:opacity .35s,transform .5s cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"] .theme-btn .sun{opacity:1;transform:rotate(0) scale(1)}
:root[data-theme="dark"] .theme-btn .moon{opacity:0;transform:rotate(90deg) scale(.3)}
:root[data-theme="light"] .theme-btn .sun{opacity:0;transform:rotate(-90deg) scale(.3)}
:root[data-theme="light"] .theme-btn .moon{opacity:1;transform:rotate(0) scale(1)}

/* 桌面顶栏导航：排行 / 收藏 / 历史 / 设置，收进顶栏右侧、搜索左边，让页头只剩一行 */
.dnav{display:none;align-items:center;gap:2px;flex:0 0 auto}
.dnav .dlink{
  position:relative;padding:8px 13px;border-radius:11px;
  font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer;
  transition:color .22s,background .22s;
}
.dnav .dlink:hover{color:var(--text);background:var(--hover)}
.dnav .dlink.on{color:var(--accent);font-weight:800}
.dnav .dlink.on::after{
  content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);
  width:15px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
}
@media(min-width:900px){.dnav{display:flex}}

/* 页头第二行：首页 + 分类条，同一行排布（桌面端唯一的导航行） */
.hd-sub{display:flex;align-items:center;gap:8px;max-width:1280px;margin:10px auto 0;min-width:0}
.hlink{
  display:none;flex:0 0 auto;align-items:center;gap:5px;padding:6px 13px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer;
  transition:color .25s,border-color .25s,background .25s,box-shadow .25s;
}
.hlink svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hlink:hover{color:var(--text);border-color:var(--accent)}
.hlink.on{color:var(--accent);border-color:var(--accent);box-shadow:0 4px 14px var(--accent-glow)}
/* 与分类胶囊之间的细分隔线 */
.hd-sub .vsep{display:none;flex:0 0 auto;width:1px;height:16px;background:var(--line);margin:0 1px}
@media(min-width:900px){.hlink{display:flex}.hd-sub .vsep{display:block}}
/* 没有分类条（详情/排行/设置等页）时：桌面只留首页胶囊，移动端整行收起 */
.hd-sub.bare .vsep{display:none}
@media(max-width:899px){.hd-sub.bare{display:none}}
.hd-sub.bare{margin-top:0}
@media(min-width:900px){.hd-sub.bare{margin-top:8px}}
/* 顶部分类条：跟着 header 一起吸顶（header 是 sticky，本节点在其内部） */
.catnav{
  position:relative;z-index:1;
  display:flex;flex:1 1 auto;min-width:0;gap:8px;margin:0;padding:0;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.catnav::-webkit-scrollbar{display:none}
.catnav .clink{
  flex:0 0 auto;padding:7px 14px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;cursor:pointer;
  transition:color .25s,background .25s,border-color .25s,box-shadow .25s,transform .2s;
}
.catnav .clink:hover{color:var(--text);border-color:var(--accent)}
.catnav .clink:active{transform:scale(.95)}
.catnav .clink.on{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  border-color:transparent;font-weight:700;box-shadow:0 6px 16px var(--accent-glow);
}
/* 吸顶后内容会从下方穿过，滚动时加一层投影把页头与正文分开 */
.hd.scrolled{box-shadow:0 8px 26px rgba(0,0,0,.10)}
:root[data-theme="dark"] .hd.scrolled{box-shadow:0 8px 26px rgba(0,0,0,.5)}
@media(max-width:899px){
  .hd-sub{margin-top:6px;gap:7px}
  .catnav .clink{font-size:12.5px;padding:6px 12px}
}

/* ============================================================
   4. 主区域 / 页脚
   ============================================================ */
main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:16px 16px 40px;min-height:60vh}
@media(max-width:768px){main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}}
.foot{
  position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:6px 16px calc(28px + env(safe-area-inset-bottom));
  text-align:center;font-size:11.5px;line-height:1.9;color:var(--sub);opacity:.75;
}
@media(max-width:768px){.foot{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}

/* ============================================================
   5. 骨架屏 / 空状态
   ============================================================ */
.sk{background:linear-gradient(90deg,var(--sk1),var(--sk2),var(--sk1));background-size:200% 100%;animation:skshift 1.5s ease-in-out infinite}
@keyframes skshift{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:70px 20px;color:var(--sub);font-size:14px;font-weight:500}
.empty .ico{font-size:46px;margin-bottom:14px;opacity:.5}
.empty .eact{
  display:inline-block;margin-top:16px;padding:9px 22px;border-radius:20px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  font-size:13px;font-weight:700;box-shadow:0 8px 22px var(--accent-glow);transition:transform .25s;
}
.empty .eact:hover{transform:translateY(-2px)}

/* ============================================================
   6. 首页：Hero 轮播
   ============================================================ */
.hero{
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px 2px 14px;margin:0 -2px 4px;scrollbar-width:none;
}
.hero::-webkit-scrollbar{display:none}
.hero-card{
  position:relative;flex:0 0 72%;max-width:620px;aspect-ratio:16/8.2;border-radius:18px;overflow:hidden;
  background:var(--sk1);border:1px solid var(--line);box-shadow:var(--sh-md);cursor:pointer;
  scroll-snap-align:start;transition:transform .4s cubic-bezier(.34,1.4,.64,1),box-shadow .4s;
  animation:fadeUp .55s cubic-bezier(.34,1.4,.64,1) backwards;
}
.hero-card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg),0 0 0 1px var(--accent-glow)}
.hero-card img{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.hero-card:hover img{transform:scale(1.06)}
.hero-card::after{content:"";position:absolute;inset:0;background:var(--hero-mask);pointer-events:none}
.hero-info{position:absolute;inset:auto 0 0 0;z-index:3;padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:7px}
.hero-badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hero-rank{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);letter-spacing:.4px;
  box-shadow:0 4px 14px rgba(0,0,0,.32);
}
.hero-chip{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
/* 轮播内的标签同样可点击（进入该站点标签页）；无标签页则仅展示 */
.hero-chip[data-act]{cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.hero-chip[data-act]:hover{background:rgba(0,0,0,.7);border-color:var(--accent);transform:translateY(-1px)}
.hero-title{font-size:21px;font-weight:800;line-height:1.3;text-shadow:0 2px 14px rgba(0,0,0,.7);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hero-desc{font-size:12.5px;font-weight:500;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.65);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-play{
  position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .3s;
}
.hero-play svg{width:16px;height:16px;fill:currentColor;margin-left:2px}
.hero-card:hover .hero-play{background:var(--accent);border-color:transparent;transform:scale(1.08);box-shadow:0 8px 22px var(--accent-glow)}
.hero-dots{display:flex;justify-content:center;gap:6px;margin:-2px 0 16px}
.hero-dots i{width:6px;height:6px;border-radius:3px;background:var(--line-hi);cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.hero-dots i.on{width:22px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-glow)}
@media(max-width:640px){
  .hero-card{flex:0 0 90%;aspect-ratio:16/10;border-radius:14px}
  .hero-info{padding:12px 14px}.hero-title{font-size:17px}
}

/* 继续观看 */
.cont{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px 6px;scrollbar-width:none}
.cont::-webkit-scrollbar{display:none}
.cont-card{flex:0 0 118px;cursor:pointer;animation:fadeUp .45s cubic-bezier(.34,1.56,.64,1) backwards}
.cont-poster{position:relative;width:118px;height:158px;border-radius:12px;overflow:hidden;background:var(--sk1);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cont-poster .pbadge{position:absolute;top:7px;left:7px;z-index:2;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.cont-poster .pmask{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.75))}
.cont-poster .presume{position:absolute;inset:auto 8px 8px 8px;display:flex;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:600}
.cont-poster .picon{width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.cont-poster .picon svg{width:10px;height:10px;fill:#fff;margin-left:1px}
.cont-title{margin-top:7px;font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.cont-sub{font-size:11px;color:var(--sub);margin-top:2px}

/* ============================================================
   7. 通用标题栏
   ============================================================ */
.sec-head{display:flex;align-items:center;gap:10px;margin:6px 2px 14px;animation:fadeUp .45s cubic-bezier(.34,1.56,.64,1)}
.sec-head .bar{width:4px;height:19px;border-radius:3px;flex-shrink:0;background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent-glow)}
.sec-head h2{font-size:17px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.sec-head .sub{font-size:12px;color:var(--sub);white-space:nowrap;margin-top:2px}
.sec-head .more{
  margin-left:auto;display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:18px;
  font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .25s;white-space:nowrap;
}
.sec-head .more:hover{color:var(--accent);background:var(--hover)}
.sec-head .more svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   8. 卡片网格
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
/* 长列表渲染优化：视口外的卡片跳过布局与绘制，滚动更跟手 */
.grid .card{content-visibility:auto;contain-intrinsic-size:auto 232px}
@media(max-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px}}
.card{position:relative;cursor:pointer;animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards}
.card:active{transform:scale(.975)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.thumb{
  position:relative;height:0;padding-top:133.34%;border-radius:12px;overflow:hidden;
  background:var(--sk1);border:1px solid var(--line);
  transition:transform .35s cubic-bezier(.34,1.4,.64,1),box-shadow .35s,border-color .35s;
}
/* 无封面（采集源的小说/图片条目常常没有图）时隐藏 img，只用底色，避免出现破图图标 */
.thumb img.ph{display:none}
/* 无封面的卡片给一个首字占位，比一片纯色更容易辨认 */
.thumb-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--sk1),var(--sk2));
  color:var(--sub);font-size:38px;font-weight:900;letter-spacing:2px;opacity:.5;user-select:none;
}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:52%;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.35) 50%,rgba(0,0,0,.8))}
.thumb img{position:absolute;inset:0;transition:transform .6s cubic-bezier(.34,1.2,.64,1)}
/* 封面统一：容器内等比裁切铺满（加密封面解密后同样适用） */
.thumb img,.hero-card img,.stage img,.cont-poster img,.rank-cover img,.detail-head .poster img{
  display:block;width:100%;height:100%;object-fit:cover;
}
.hero-card img,.stage img,.cont-poster img,.rank-cover img{position:absolute;inset:0}
@media(hover:hover){
  .card:hover .thumb{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 18px 38px rgba(0,0,0,.42),0 0 0 1px var(--accent-glow),0 0 30px var(--accent-glow);z-index:4}
  .card:hover .thumb img{transform:scale(1.07)}
  .card:hover .card-title{color:var(--accent)}
}
.badge{position:absolute;top:8px;left:8px;z-index:3;padding:3px 9px;border-radius:14px;font-size:10.5px;font-weight:800;letter-spacing:.5px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.badge.new{background:linear-gradient(135deg,#22c55e,#4ade80);color:#fff}
.badge.hot{background:linear-gradient(135deg,#ff4d6d,#ff7a45);color:#fff}
.badge.vip{background:linear-gradient(135deg,#f6b73c,#ffd76a);color:#3a2900}
.badge.rank{background:rgba(0,0,0,.62);color:#fff;border:1px solid rgba(255,255,255,.25);min-width:26px;text-align:center;backdrop-filter:blur(6px)}
.badge.rank.r1{background:linear-gradient(135deg,#ff4d6d,#ff8fa3);border:none}
.badge.rank.r2{background:linear-gradient(135deg,#ffa23a,#ffc46b);border:none}
.badge.rank.r3{background:linear-gradient(135deg,#ffd166,#ffe3a3);border:none;color:#5c4300}
/* 右上角分类标签：子分类优先，没有子分类时显示父分类名 */
.badge.cat{
  left:auto;right:8px;max-width:64%;
  font-size:10px;font-weight:700;letter-spacing:0;padding:2.5px 8px;
  color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;
}
.thumb-meta{position:absolute;inset:auto 9px 8px 9px;z-index:3;display:flex;align-items:center;gap:4px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.65)}
.thumb-meta svg{width:11px;height:11px;fill:currentColor;flex-shrink:0}
.thumb-meta .rem{margin-left:auto;font-size:10.5px;opacity:.95;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title{padding:8px 2px 0;font-size:13px;font-weight:600;line-height:1.42;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
@media(max-width:640px){.card-title{font-size:12px}}
.card-tags{display:flex;gap:5px;margin-top:5px;overflow:hidden;min-height:22px}
.ctag{
  flex-shrink:0;padding:2.5px 8px;border-radius:10px;font-size:10.5px;font-weight:600;
  color:var(--sub);background:var(--chip);border:1px solid var(--line);white-space:nowrap;
  cursor:pointer;transition:color .2s,border-color .2s,background .2s,transform .2s;
}
/* 标签可点击：命中后进入该站点的标签页 */
.ctag:hover{color:var(--accent);border-color:var(--accent);background:var(--card)}
.ctag:active{transform:scale(.94)}
/* 无标签页的站源：标签只作展示 */
.ctag.plain,.hero-chip.plain{cursor:default}
.ctag.plain:hover{color:var(--sub);border-color:var(--line);background:var(--chip)}
@media(max-width:640px){
  /* 小屏收窄间距与内边距，保证 3 个标签仍能完整排进一行 */
  .card-tags{gap:4px}
  .ctag{padding:2px 5px;font-size:10px}
}
.card-sub{font-size:11px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------------------------------------
   8.1 专题 / 吃瓜：横版封面卡（参照 sanguodj 的 topic/post 形态）
   ------------------------------------------------------------
   站点原生的专题图是 499×298、吃瓜图是 1300×650，都是横图；
   套竖版 3:4 会裁掉大半画面，所以封面统一按 2:1 显示：
     专题 → 文字压在封面底部（渐变遮罩）
     吃瓜 → 封面在上、作者/日期/标题在下
   ---------------------------------------------------------- */
.topic-grid,.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
@media(max-width:640px){.topic-grid,.post-grid{grid-template-columns:1fr;gap:12px}}
.topic-grid .card,.post-grid .card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  contain-intrinsic-size:auto 240px;
  transition:transform .3s,border-color .3s,box-shadow .3s;
}
@media(hover:hover){
  .topic-grid .card:hover,.post-grid .card:hover{
    transform:translateY(-3px);border-color:var(--accent);
    box-shadow:0 16px 32px rgba(0,0,0,.26),0 0 0 1px var(--accent-glow);
  }
}
/* 封面：覆盖全局 .thumb 的 3:4 与悬停位移，改为 2:1 满宽 */
.topic-card .thumb,.post-card .thumb{
  height:0;padding-top:50%;border-radius:0;border:0;transform:none;
  background:var(--sk1);
}
@media(hover:hover){
  .topic-card:hover .thumb,.post-card:hover .thumb{transform:none;box-shadow:none;border:0}
  .topic-card:hover .thumb img,.post-card:hover .thumb img{transform:scale(1.05)}
}
.topic-card .thumb::after{
  height:100%;
  background:linear-gradient(180deg,rgba(0,0,0,0) 28%,rgba(0,0,0,.45) 58%,rgba(0,0,0,.88));
}
.topic-info{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:11px 13px 12px;color:#fff}
.topic-info h3{
  font-size:14.5px;font-weight:800;line-height:1.34;letter-spacing:.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 2px 10px rgba(0,0,0,.7);
}
.topic-info .cnt{margin-top:4px;font-size:11px;font-weight:600;opacity:.9}
.pc-body{padding:10px 12px 12px}
.pc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-bottom:5px}
.pc-meta .pc-cat{color:var(--accent);font-weight:700}
.pc-title{
  font-size:14px;font-weight:700;line-height:1.45;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
@media(max-width:640px){.pc-title{font-size:13px}}
/* 专题/吃瓜骨架：横向比例，避免加载完从竖版跳成横版 */
.topic-grid .skel-card .thumb,.post-grid .skel-card .thumb{padding-top:50%;border-radius:0;border:0}
.hist-prog{height:4px;border-radius:3px;background:var(--chip);margin-top:7px;overflow:hidden}
.hist-prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 8px var(--accent-glow)}
.card-del{
  position:absolute;top:6px;right:6px;z-index:5;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:#fff;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);
  opacity:0;transition:all .25s;
}
.card:hover .card-del,.card-del.always{opacity:1}
.card-del:hover{background:#e5484d;transform:scale(1.1)}
@media(hover:none){.card-del{opacity:1}}
.skel-card .thumb{background:linear-gradient(90deg,var(--sk1),var(--sk2),var(--sk1));background-size:200% 100%;animation:skshift 1.5s ease-in-out infinite}
.skel-card .card-title{background:var(--sk1);color:transparent;border-radius:5px;height:15px;margin-top:8px}

/* ============================================================
   9. 列表工具条 / 分类筛选 / 分页
   ============================================================ */
.tools{display:flex;align-items:flex-start;gap:10px;margin:2px 2px 12px;animation:fadeUp .4s cubic-bezier(.34,1.56,.64,1)}
.tools .bar{width:4px;height:19px;border-radius:3px;flex-shrink:0;margin-top:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 0 12px var(--accent-glow)}
.tools h2{font-size:17px;font-weight:800;letter-spacing:.3px}
.tools .total{font-size:12px;color:var(--sub);margin-top:2px}
.tools .act{
  margin-left:auto;flex-shrink:0;padding:7px 14px;border-radius:18px;font-size:12.5px;font-weight:600;
  color:var(--sub);background:var(--card);border:1px solid var(--line);white-space:nowrap;transition:all .25s;
}
.tools .act:hover{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 6px 18px var(--accent-glow)}

/* 吸顶筛选条：子栏目页签 + 子分类/排序打包成一块，随页面滚动固定
   在页头下方（--hd-h 由 JS 按页头实际高度写入，页头高度变了也能贴住） */
.stickycat{
  position:sticky;top:var(--hd-h,0px);z-index:60;
  margin:0 -16px 12px;padding:8px 16px;
  background:var(--header);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-radius:0 0 14px 14px;transition:box-shadow .25s,border-color .25s;
  border-bottom:1px solid transparent;
}
@media(max-width:768px){.stickycat{margin:0 -12px 10px;padding:7px 12px}}
.stickycat.stuck{border-bottom-color:var(--line);box-shadow:0 10px 22px rgba(0,0,0,.07)}
.stickycat > * + *{margin-top:8px}
.stickycat .subtabs{margin:0}
.stickycat .catbar{margin:0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .stickycat{background:var(--bg)}
}

/* 子栏目页签（吃瓜：全部 / 热门吃瓜 / AI原创），只在站源给出 tabs 时出现 */
.subtabs{display:flex;gap:7px;overflow-x:auto;margin:0 0 14px;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subtabs::-webkit-scrollbar{display:none}
.subtab{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--sub);
  transition:color .25s,background .25s,border-color .25s,box-shadow .25s,transform .2s;
}
.subtab:hover{color:var(--text);border-color:var(--accent)}
.subtab:active{transform:scale(.95)}
.subtab.on{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  border-color:transparent;font-weight:700;box-shadow:0 6px 16px var(--accent-glow);
}

.catbar{display:flex;flex-direction:column;gap:8px;margin:2px 0 14px}
.catrow{display:flex;align-items:center;gap:8px}
.catrow .clabel{flex-shrink:0;font-size:12px;font-weight:700;color:var(--sub);min-width:30px;white-space:nowrap}
.catrow .cscroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;flex:1;min-width:0}
.catrow .cscroll::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 13px;border-radius:18px;font-size:12.5px;font-weight:500;cursor:pointer;
  color:var(--dim);background:var(--chip);border:1px solid var(--line);white-space:nowrap;
  transition:all .22s cubic-bezier(.34,1.4,.64,1);
}
.chip:hover{color:var(--text);border-color:var(--line-hi);transform:translateY(-1px)}
.chip.on{color:var(--on-accent);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 5px 16px var(--accent-glow)}
.chip.sub{padding:5px 11px;font-size:12px}
.chip .cnt{opacity:.7;margin-left:4px;font-size:11px}

.pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:26px 0 6px}
.pager button,.pager .pinfo{
  min-width:42px;height:42px;padding:0 14px;border-radius:11px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;color:var(--text);background:var(--card);border:1px solid var(--line);
  transition:all .25s;
}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);box-shadow:0 6px 18px var(--accent-glow);transform:translateY(-2px)}
.pager button:disabled{opacity:.3;cursor:not-allowed}
.pager .pinfo{background:transparent;border:none;color:var(--sub);font-weight:500;cursor:default}
.pager .pinfo b{color:var(--accent);font-size:15px;font-weight:800;margin:0 3px}
.pager .jump input{width:62px;height:42px;text-align:center;border-radius:11px;font-size:13.5px;font-weight:600;
  background:var(--card);border:1px solid var(--line);outline:none;transition:all .25s}
.pager .jump input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}

/* 自动加载模式：底部加载器（可点击兜底 + 触底自动触发） */
.loadmore{display:flex;flex-direction:column;align-items:center;gap:9px;padding:26px 0 10px;color:var(--sub);font-size:12.5px;font-weight:600}
.loadmore .lm-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:20px;
  font-size:13px;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--line);
  transition:all .25s;cursor:pointer;
}
.loadmore .lm-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);box-shadow:0 6px 18px var(--accent-glow);transform:translateY(-2px)}
.loadmore .lm-btn:disabled{opacity:.55;cursor:default}
.loadmore .lm-spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-hi);border-top-color:var(--accent);animation:lmspin .8s linear infinite}
.loadmore.done{padding:26px 0 12px}
.loadmore.done .lm-done{display:inline-flex;align-items:center;gap:8px}
.loadmore.done .lm-done::before,.loadmore.done .lm-done::after{content:"";width:26px;height:1px;background:var(--line-hi)}
@keyframes lmspin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 2px 16px}
.seg .seg-item{padding:8px 17px;border-radius:20px;font-size:13px;font-weight:600;color:var(--dim);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .25s;white-space:nowrap}
.seg .seg-item:hover{color:var(--text);border-color:var(--line-hi)}
.seg .seg-item.on{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 6px 18px var(--accent-glow)}

/* ============================================================
   10. 排行榜
   ============================================================ */
.rank-list{display:flex;flex-direction:column;gap:10px}
.rank-row{
  display:flex;gap:12px;padding:10px;border-radius:15px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);transition:all .28s;
  animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) backwards;
}
.rank-row:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.3),0 0 0 1px var(--accent-glow)}
.rank-no{width:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-style:italic;color:var(--sub)}
.rank-no.r1,.rank-no.r2,.rank-no.r3{font-size:21px;color:transparent;-webkit-background-clip:text;background-clip:text}
.rank-no.r1{background-image:linear-gradient(135deg,#ff4d6d,#ff8fa3)}
.rank-no.r2{background-image:linear-gradient(135deg,#ffa23a,#ffc46b)}
.rank-no.r3{background-image:linear-gradient(135deg,#ffd166,#ffe3a3)}
.rank-cover{position:relative;width:82px;height:110px;flex-shrink:0;border-radius:11px;overflow:hidden;background:var(--sk1);border:1px solid var(--line)}
.rank-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:2px 0}
.rank-title{font-size:14.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank-tags{display:flex;gap:5px;flex-wrap:wrap;max-height:24px;overflow:hidden}
.rank-meta{margin-top:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
.rank-meta .heat{color:var(--accent);font-weight:800}
.rank-bar{height:4px;border-radius:3px;background:var(--chip);overflow:hidden}
.rank-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 8px var(--accent-glow)}

/* ============================================================
   11. 详情页
   ============================================================ */
/* ---- 吃瓜文章（图文社区） ---- */
.post{max-width:780px;margin:0 auto;animation:fadeUp .45s}
.post-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.post-title{font-size:21px;font-weight:800;line-height:1.42;margin-bottom:10px;letter-spacing:.3px}
.post-meta{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.post-body{margin-bottom:18px}
/* 文章导语（简介）：比正文略淡，与正文区分开 */
.post-lead{font-size:14px;color:var(--sub);line-height:1.8;padding:10px 12px;border-radius:10px;background:var(--hover);margin-bottom:16px}
.post-p{font-size:14.5px;line-height:1.85;color:var(--fg);margin-bottom:12px;word-break:break-word}
.post-img{margin:0 0 12px;border-radius:14px;overflow:hidden;background:var(--sk1);border:1px solid var(--line)}
.post-img img{display:block;width:100%;height:auto}
/* 外链图床挂掉时图片没有 src，容器只剩一圈边框像一排细线，直接整块收掉 */
.post-img:has(img:not([src])),.post-img:has(img[src=""]){display:none}
.post-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.post .grid{margin-bottom:18px}

.detail-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;animation:fadeUp .4s}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:11px;font-size:14px;font-weight:600;
  color:var(--dim);background:var(--card);border:1px solid var(--line);transition:all .28s;white-space:nowrap;
}
.back-btn:hover{color:var(--accent);border-color:var(--accent);transform:translateX(-3px);box-shadow:0 6px 18px var(--accent-glow)}
.fav-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;
  font-size:13px;font-weight:600;color:var(--dim);background:var(--card);border:1px solid var(--line);transition:all .28s;
}
.fav-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fav-btn:hover{color:var(--accent);border-color:var(--accent);box-shadow:0 6px 18px var(--accent-glow)}
.fav-btn.on{color:var(--accent);border-color:var(--accent);background:var(--hover)}
.fav-btn.on svg{fill:var(--accent);stroke:var(--accent)}

.stage{position:relative;width:100%;max-width:780px;margin:0 auto 18px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
  background:#000;border:1px solid var(--line);box-shadow:var(--sh-lg),0 0 44px var(--accent-glow-2);animation:fadeUp .45s}
.stage img{position:absolute;inset:0;filter:brightness(.62)}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.stage .play-btn{
  position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;
}
.stage .play-btn .pb-circle{
  width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);
  box-shadow:0 14px 40px var(--accent-glow),0 0 0 8px rgba(255,255,255,.08);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;
}
.stage .play-btn .pb-circle svg{width:26px;height:26px;fill:currentColor;margin-left:3px}
.stage .play-btn span{font-size:13px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.8);letter-spacing:.5px}
.stage .play-btn:hover .pb-circle{transform:scale(1.07);box-shadow:0 18px 46px var(--accent-glow),0 0 0 10px rgba(255,255,255,.1)}
.stage .ep-tip{position:absolute;left:14px;bottom:12px;z-index:3;font-size:12px;font-weight:600;color:#fff;
  padding:4px 10px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2)}

.detail-head{display:flex;gap:16px;margin-bottom:16px;animation:fadeUp .5s backwards;animation-delay:.05s}.detail-head .poster{position:relative;width:122px;height:163px;flex-shrink:0;border-radius:14px;overflow:hidden;background:var(--sk1);border:1px solid var(--line);box-shadow:var(--sh-md),0 0 24px var(--accent-glow-2)}
.detail-info{min-width:0;padding-top:2px}
.detail-info h1{font-size:19px;font-weight:800;line-height:1.38;letter-spacing:.3px;margin-bottom:10px}
.detail-info .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.tag{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--sub);background:var(--chip);border:1px solid var(--line)}
.tag[data-act]{cursor:pointer;transition:color .2s,border-color .2s}
.tag[data-act]:hover{color:var(--accent);border-color:var(--accent)}
.tag.accent{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;font-weight:700;box-shadow:0 4px 14px var(--accent-glow)}
.desc{font-size:12.5px;line-height:1.75;color:var(--sub);white-space:pre-line;cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;transition:color .25s}
.desc.open{display:block}
.desc:hover{color:var(--dim)}
@media(max-width:560px){
  .detail-head{gap:12px}
  .detail-head .poster{width:96px;height:128px}
  .detail-info h1{font-size:16.5px}
}
.sec-line{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin:20px 0 12px;letter-spacing:.3px}
.sec-line::before{content:"";width:4px;height:17px;border-radius:3px;flex-shrink:0;background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-glow)}
.sec-line .aside{margin-left:auto;font-size:12px;font-weight:500;color:var(--sub)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px}
@media(max-width:640px){.eps{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}}
.ep{
  padding:10px 5px;border-radius:10px;text-align:center;font-size:12px;font-weight:600;color:var(--sub);
  background:var(--panel);border:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:all .25s;
}
.ep:hover{color:var(--text);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 16px var(--accent-glow)}
.ep.on{color:var(--on-accent);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:0 6px 20px var(--accent-glow)}
.route-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ============================================================
   12. 设置页
   ============================================================ */
.set-wrap{display:flex;flex-direction:column;gap:16px}
.set-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;animation:fadeUp .45s backwards}
.set-card:nth-child(2){animation-delay:.04s}
.set-card:nth-child(3){animation-delay:.08s}
.set-card:nth-child(4){animation-delay:.12s}
.set-card:nth-child(5){animation-delay:.16s}
.set-card:nth-child(6){animation-delay:.2s}
.set-card:nth-child(7){animation-delay:.24s}
.set-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:12px}
.set-title::before{content:"";width:4px;height:16px;border-radius:3px;flex-shrink:0;background:linear-gradient(180deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-glow)}
.set-title .aside{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--sub)}
.set-note{font-size:11.5px;line-height:1.85;color:var(--sub);margin-top:8px}
.set-note b{color:var(--dim)}
.set-note code,.set-details code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
  padding:1px 5px;border-radius:5px;background:var(--chip);color:var(--text);word-break:break-all;
}
.set-details{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.set-details summary{
  display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  color:var(--accent);cursor:pointer;list-style:none;outline:none;
}
.set-details summary::-webkit-details-marker{display:none}
.set-details summary::before{content:"▸";font-size:11px;transition:transform .25s}
.set-details[open] summary::before{transform:rotate(90deg)}
.set-details .sd-body{font-size:11.5px;line-height:1.85;color:var(--sub);margin-top:9px}
.set-details .sd-body p{margin:0 0 7px}
.set-details .sd-body a{color:var(--accent);text-decoration:underline}
.set-pre{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.55;
  white-space:pre-wrap;word-break:break-all;color:var(--text);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px;margin:7px 0;max-height:320px;overflow:auto;
}
.set-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-row+.set-row{margin-top:8px}
.set-input{
  flex:1;min-width:180px;height:40px;padding:0 12px;border-radius:10px;font-size:12.5px;outline:none;
  color:var(--text);background:var(--chip);border:1px solid var(--line);transition:border-color .25s,box-shadow .25s;
}
.set-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
/* 采集源表单：18+ 勾选 */
.set-chk{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;user-select:none;flex-shrink:0}
.set-chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.set-chk.on{color:#e5484d}
/* 窄屏：图标地址独占一行，避免被 18+ 勾选挤成一小截 */
@media (max-width:520px){#cmsLogo{flex-basis:100%}}
/* 采集源管理行：上行名称+接口+按钮，下行说明/官网（没有就不占位） */
.prox-row .cms-main{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.prox-row .cms-main .purl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prox-row.cms-row{flex-direction:column;align-items:stretch;gap:5px}
.prox-row.cms-row .cms-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;line-height:1.5;color:var(--sub);width:100%}
.prox-row.cms-row .cms-sub a{color:var(--accent);font-weight:700;text-decoration:none}
.prox-row.cms-row .cms-sub a:hover{text-decoration:underline}
/* 编辑态：表单上方提示 + 正在编辑的那一行高亮 */
.cms-editing{margin:2px 0 10px;padding:9px 12px;border-radius:10px;font-size:11.5px;line-height:1.6;color:var(--text);
  background:var(--accent-glow);border:1px solid var(--accent);border-left-width:3px}
.cms-editing b{font-weight:800;color:var(--accent)}
.prox-row.editing{background:var(--accent-glow);border-radius:10px;box-shadow:0 0 0 1px var(--accent) inset}
.set-input:disabled{opacity:.62;cursor:not-allowed;background:var(--line);color:var(--sub)}
.set-input::placeholder{color:var(--sub)}
.set-btn{height:40px;padding:0 18px;border-radius:10px;flex-shrink:0;font-size:13px;font-weight:700;
  color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:all .25s}
.set-btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 16px var(--accent-glow)}
.set-btn.ghost{color:var(--dim);background:var(--chip);border:1px solid var(--line)}
.set-btn.ghost:hover{color:var(--text);border-color:var(--line-hi);box-shadow:none;filter:none}
.set-btn.danger{color:#fff;background:linear-gradient(135deg,#e5484d,#ff6b6b)}
.set-btn.sm{height:30px;padding:0 12px;font-size:11.5px;border-radius:8px}
.set-kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.set-kv:last-child{border-bottom:none}
.set-kv .k{color:var(--dim);flex-shrink:0}
.set-kv .v{color:var(--text);font-weight:600;text-align:right;word-break:break-all;display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13px;border-top:1px solid var(--line)}
.opt-row:first-of-type{border-top:none}
.opt-row > span:first-child{color:var(--dim);flex-shrink:0}
.opt-ctl{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.opt-ctl input[type=range]{width:130px;accent-color:var(--accent)}
.opt-ctl .val{font-size:12px;font-weight:700;color:var(--accent);width:60px;flex-shrink:0;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.opt-ctl select{height:30px;padding:0 8px;border-radius:8px;font-size:12px;background:var(--chip);border:1px solid var(--line);outline:none}
.mini-btn{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;color:var(--dim);background:var(--chip);border:1px solid var(--line);transition:all .2s}
.mini-btn:hover{color:var(--text);border-color:var(--line-hi)}
.mini-btn.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.tgl{width:44px;height:24px;border-radius:12px;background:var(--line-hi);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.tgl.on::after{left:22px}
.prox-row{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-bottom:7px;border-radius:10px;
  font-size:12px;color:var(--dim);background:var(--chip);border:1px solid var(--line);word-break:break-all}
.prox-row .pname{flex-shrink:0;font-weight:700;color:var(--text)}
.prox-row .purl{flex:1;min-width:0}
.prox-row .hit{color:var(--accent);font-weight:700}
.prox-row .pbtn{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--sub);border:1px solid var(--line);transition:all .2s}
.prox-row .pbtn:hover{color:#fff;background:#e5484d;border-color:transparent}

/* ============================================================
   13. 站源卡片 / 底部弹层
   ============================================================ */
.mask{position:fixed;inset:0;z-index:200;background:var(--mask);opacity:0;pointer-events:none;transition:opacity .35s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:201;max-height:80vh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  background:var(--drawer);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid var(--line);box-shadow:var(--sh-lg);
  transform:translateY(104%);transition:transform .42s cubic-bezier(.34,1.2,.64,1);
}
.sheet.show{transform:none}
.sheet-grip{width:42px;height:4px;border-radius:3px;background:var(--line-hi);margin:6px auto 12px;flex-shrink:0}
.sheet-title{font-size:16px;font-weight:800;margin:0 2px 12px;flex-shrink:0}
.sheet-body{overflow-y:auto;flex:1;min-height:0}
/* 宽屏下弹层居中收窄，避免 4 列采集源卡片被拉得过宽 */
@media(min-width:640px){
  .sheet{left:50%;right:auto;width:560px;max-width:94vw;transform:translate(-50%,104%)}
  .sheet.show{transform:translate(-50%,0)}
}
.site-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:9px;border-radius:14px;cursor:pointer;
  position:relative;background:var(--card);border:1px solid var(--line);transition:all .25s}
.site-opt:hover{border-color:var(--line-hi);transform:translateY(-1px)}
.site-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow),0 8px 22px var(--accent-glow)}
.site-opt .slogo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;position:relative;overflow:hidden}
/* 图片底透明：透明底的白字 logo 能透出下面的渐变底，不会变成一块白板；
   contain 的方形 logo 原样居中，宽图由 img.wide 走左对齐裁切 */
.site-opt .slogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit;background:transparent}
/* 宽图 logo（左边图形 + 右边站名文字）：cover 按高度撑满、宽度溢出，左对齐后露出的正好是
   「宽 = 图高」的左侧方形 = 图形本身；再放大 8% 把贴着图形的半个字顶出去。 */
.site-opt .slogo img.wide{object-fit:cover;object-position:left center;transform:scale(1.08);transform-origin:left center}
.site-opt .sinfo{flex:1;min-width:0}
.site-opt .sname{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:800}
.site-opt .sdesc{font-size:11.5px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-opt .scheck{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:var(--accent);color:var(--on-accent)}
.site-opt.on .scheck{display:flex}
.tag18{padding:1.5px 6px;border-radius:8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:#e5484d;color:#fff}
/* 采集源：一行四个的紧凑网格 */
.site-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.site-grid .site-opt{flex-direction:column;gap:5px;padding:11px 4px 9px;margin-bottom:0;border-radius:12px;text-align:center}
.site-grid .slogo{width:34px;height:34px;border-radius:10px;font-size:15px}
.site-grid .sname{display:flex;align-items:center;justify-content:center;height:2.6em;
  font-size:11.5px;font-weight:700;line-height:1.3;text-align:center}
.site-grid .sname > span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.site-grid .sflags{display:flex;align-items:center;justify-content:center;gap:3px;height:14px}
.site-grid .tag18{padding:1px 4px;border-radius:6px;font-size:8.5px;letter-spacing:0}
.site-grid .scheck{position:absolute;top:3px;right:3px;width:15px;height:15px;font-size:9px}

/* ============================================================
   14. 抽屉 / 搜索
   ============================================================ */
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:201;width:252px;max-width:82vw;display:flex;flex-direction:column;
  background:var(--drawer);border-right:1px solid var(--line);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  transform:translateX(calc(-100% - 16px));transition:transform .45s cubic-bezier(.34,1.2,.64,1);
}
.drawer.show{transform:none}
.drawer-hd{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer-hd .name{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.drawer-hd .x{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:all .3s}
.drawer-hd .x:hover{background:var(--hover);color:var(--accent);transform:rotate(90deg)}
.drawer-bd{flex:1;overflow-y:auto;padding:6px 10px 24px}
.dlabel{padding:14px 10px 6px;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--sub)}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;margin-bottom:1px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--dim);cursor:pointer;transition:all .25s}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:700;box-shadow:0 6px 18px var(--accent-glow)}
.nav-item .ico{display:flex;width:17px;height:17px;flex-shrink:0}
.nav-item .ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--sub)}
.nav-item.on .cnt{color:rgba(255,255,255,.85)}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto;flex-shrink:0}
.nav-item.on .dot{background:var(--on-accent)}

.search-pop{
  position:fixed;top:0;left:0;right:0;z-index:220;padding:12px 16px calc(14px + env(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--header);border-bottom:1px solid var(--line);box-shadow:var(--sh-lg);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  transform:translateY(-102%);transition:transform .38s cubic-bezier(.34,1.2,.64,1);
}
.search-pop.show{transform:none}
.sp-row{display:flex;align-items:center;gap:10px;max-width:1280px;margin:0 auto}
.search{flex:1;display:flex;min-width:0;overflow:hidden;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:border-color .3s,box-shadow .35s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search input{flex:1;min-width:0;padding:12px 15px;font-size:14px;font-weight:500;background:none;border:none;outline:none;color:var(--text)}
.search input::placeholder{color:var(--sub)}
.search button{display:flex;align-items:center;justify-content:center;padding:0 20px;font-size:14px;font-weight:700;letter-spacing:.5px;
  color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));transition:filter .25s}
.search button:hover{filter:brightness(1.08)}
.search button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.sp-cancel{flex-shrink:0;padding:10px 4px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;transition:color .25s}
.sp-cancel:hover{color:var(--accent)}
.sp-hist{display:none;flex-wrap:wrap;align-items:center;gap:8px;max-width:1280px;margin:12px auto 0}
.sp-hist.show{display:flex}
.sp-hist .lbl{font-size:12px;font-weight:700;color:var(--sub)}
.sp-chip{position:relative;padding:5px 22px 5px 12px;border-radius:16px;font-size:12.5px;font-weight:500;color:var(--dim);background:var(--chip);border:1px solid var(--line);cursor:pointer;transition:all .22s;white-space:nowrap}
.sp-chip:hover{color:var(--text);border-color:var(--line-hi)}
.sp-chip .x{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-style:normal;line-height:1;color:var(--sub);background:var(--panel);border:1px solid var(--line-hi);transition:all .2s}
.sp-chip .x:hover{color:#fff;background:#e5484d;border-color:transparent;transform:scale(1.15)}

/* ============================================================
   15. 底部导航 / 回顶
   ============================================================ */
.bnav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:150;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:var(--header);border-top:1px solid var(--line);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
}
.bnav-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;
  font-size:10.5px;font-weight:600;color:var(--sub);cursor:pointer;user-select:none;transition:color .25s}
.bnav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.bnav-item.on{color:var(--accent)}
.bnav-item.on svg{transform:translateY(-1.5px) scale(1.12)}
.bnav-item:active svg{transform:scale(.85)}
.bnav-item .bdot{position:absolute;top:2px;right:50%;margin-right:-24px;min-width:16px;height:15px;padding:0 4px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px var(--accent-glow)}
@media(max-width:899px){.bnav{display:flex}}
.backtop{
  position:fixed;right:18px;bottom:26px;z-index:140;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--accent);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-md);
  opacity:0;visibility:hidden;transform:translateY(14px) scale(.85);
  transition:opacity .3s,transform .35s cubic-bezier(.34,1.56,.64,1),visibility .3s,border-color .25s,box-shadow .25s;
}
.backtop svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.backtop.show{opacity:1;visibility:visible;transform:none}
.backtop:hover{border-color:var(--accent);box-shadow:0 8px 24px var(--accent-glow);transform:translateY(-2px)}
@media(max-width:899px){.backtop{bottom:calc(82px + env(safe-area-inset-bottom))}}

/* ============================================================
   16. 播放器（全屏浮层）
   ============================================================ */
.player{position:fixed;inset:0;z-index:500;background:#000;display:none;overflow:hidden}
.player.show{display:block}

/* ---- 内联播放：播放器直接嵌进详情页的 .stage 窗口 ---- */
.stage.playing{background:#000}
.stage.playing::after{display:none}
.stage.playing > img,.stage.playing > .play-btn,.stage.playing > .ep-tip{display:none}
.player.inline{position:absolute;inset:0;z-index:auto;display:block;border-radius:inherit}
.player.inline .pl-wrap{border-radius:inherit}
/* 详情页窗口固定 16:9，可用高度有限：内联态整体收紧，避免弹幕输入把控制区抬到画面中间 */
.player.inline .pl-top{padding:6px 8px 14px}
.player.inline .pl-bottom{padding:12px 10px 6px}
.player.inline .pl-center{inset:0 0 92px}
.player.inline .pl-btn{width:32px;height:32px}
.player.inline .pl-btn svg{width:19px;height:19px}
.player.inline .pl-btn.txt{min-width:46px;height:28px;font-size:11.5px;padding:0 6px;white-space:nowrap}
.player.inline .pl-seek{height:18px}
.player.inline .pl-time{font-size:11.5px}
.player.inline .pl-center .pm.side{width:38px;height:38px}
.player.inline .pl-center .pm.main{width:50px;height:50px}
.player.inline .pl-center .pm svg{width:20px;height:20px}
.player.inline .pl-dmsend{margin-bottom:2px}
.player.inline .pl-dmsend input,.player.inline .pl-dmsend button{height:30px;font-size:12px;padding:0 12px;border-radius:15px}
/* 面板 / 遮罩在内联态挂到视口，避免被窗口高度挤压 */
.player.inline .pl-pmask{position:fixed;inset:0;z-index:900}
.player.inline .pl-panel{position:fixed;left:0;right:0;bottom:0;z-index:901;max-height:62vh}
.pl-wrap{position:absolute;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#plVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.pl-dim{position:absolute;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none;transition:opacity .12s}
.dm-layer{position:absolute;left:0;right:0;top:0;height:100%;z-index:6;overflow:hidden;pointer-events:none}
.dm-layer.hide{display:none}
.dm-item{position:absolute;left:0;top:0;white-space:nowrap;font-weight:700;will-change:transform;line-height:1.2;
  text-shadow:-1px -1px 2px rgba(0,0,0,.9),1px -1px 2px rgba(0,0,0,.9),-1px 1px 2px rgba(0,0,0,.9),1px 1px 2px rgba(0,0,0,.9)}
.pl-gesture{position:absolute;inset:0;z-index:8;touch-action:none}
.pl-loading{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.28);color:#fff;font-size:12px;font-weight:600}
.pl-loading.show{display:flex}
.pl-loading i{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-msg{position:absolute;inset:0;z-index:13;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
  background:rgba(0,0,0,.84);color:#fff;font-size:13.5px;font-weight:500;line-height:1.7;backdrop-filter:blur(6px)}
.pl-msg.show{display:flex}
.pl-msg .mbtn{padding:10px 24px;border-radius:11px;font-size:14px;font-weight:700;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 26px var(--accent-glow)}
.pl-tip{position:absolute;left:50%;top:50%;z-index:14;transform:translate(-50%,-50%);padding:9px 16px;border-radius:10px;
  display:none;white-space:nowrap;font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,.72);pointer-events:none}
.pl-tip.show{display:block}

.pl-top,.pl-bottom,.pl-center{position:absolute;z-index:15;transition:opacity .25s,transform .25s}
.pl-top{top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 22px;
  background:linear-gradient(180deg,rgba(0,0,0,.72),transparent)}
.pl-title{flex:1;min-width:0;color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:0 4px}
.pl-btn{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:background .2s,color .2s}
.pl-btn:hover{background:rgba(255,255,255,.14)}
.pl-btn svg{width:21px;height:21px;fill:#fff;stroke:none}
.pl-btn.on{color:var(--accent)}
.pl-btn.on svg{fill:var(--accent)}
.pl-btn.txt{width:auto;min-width:44px;padding:0 8px;border-radius:16px;font-size:12px;background:rgba(255,255,255,.12)}
.player.hide-ui .pl-top{opacity:0;transform:translateY(-100%);pointer-events:none}
.player.hide-ui .pl-bottom{opacity:0;transform:translateY(100%);pointer-events:none}
.player.hide-ui .pl-center{opacity:0;pointer-events:none}
.player.hide-ui .pl-dmsend{opacity:0;pointer-events:none}

.pl-center{inset:0;display:flex;align-items:center;justify-content:center;gap:40px;pointer-events:none}
.pl-center .pm{pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;
  background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,background .2s}
.pl-center .pm:active{transform:scale(.88)}
.pl-center .pm.side{width:46px;height:46px}
.pl-center .pm.main{width:66px;height:66px}
.pl-center .pm svg{width:26px;height:26px;fill:#fff}
.pl-center .pm.main svg{width:30px;height:30px}

.pl-bottom{left:0;right:0;bottom:0;padding:26px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
.pl-seek{position:relative;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.pl-seek .track{position:relative;width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.24);overflow:visible}
.pl-seek .buf{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;background:rgba(255,255,255,.4)}
.pl-seek .played{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-glow)}
.pl-seek .dot{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.55);transition:transform .15s}
.pl-seek:hover .dot{transform:translate(-50%,-50%) scale(1.2)}
.pl-seek .fly{position:absolute;bottom:26px;transform:translateX(-50%);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.85);white-space:nowrap;display:none}
.pl-seek:hover .fly{display:block}
.pl-ctrl{display:flex;align-items:center;gap:6px;margin-top:2px}
.pl-time{flex-shrink:0;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.86);font-variant-numeric:tabular-nums}
.pl-ctrl .right{margin-left:auto;display:flex;align-items:center;gap:2px}
/* 弹幕输入框：位于控制条内部（进度条上方），无论全屏还是详情页内联都在窗口里 */
.pl-dmsend{position:relative;z-index:15;display:none;gap:8px;margin:0 0 4px;transition:opacity .25s}
.pl-dmsend.show{display:flex}
.pl-dmsend input{flex:1;min-width:0;height:36px;padding:0 14px;border-radius:18px;font-size:12.5px;color:#fff;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.24);outline:none;backdrop-filter:blur(8px)}
.pl-dmsend input::placeholder{color:rgba(255,255,255,.55)}
.pl-dmsend button{flex-shrink:0;height:36px;padding:0 16px;border-radius:18px;font-size:12.5px;font-weight:700;
  color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2))}

.pl-pmask{position:absolute;inset:0;z-index:18;display:none;background:rgba(0,0,0,.45)}
.pl-pmask.show{display:block}
.pl-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:19;max-height:64%;display:flex;flex-direction:column;
  border-radius:16px 16px 0 0;background:rgba(20,20,22,.98);border-top:1px solid rgba(255,255,255,.08);
  transform:translateY(102%);transition:transform .32s cubic-bezier(.34,1.1,.64,1);
}
.pl-panel.show{transform:none}
.plp-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.plp-hd span{color:#fff;font-size:15px;font-weight:700}
.plp-hd button{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.1);font-size:13px}
.plp-bd{flex:1;min-height:0;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.pp-eps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:640px){.pp-eps{grid-template-columns:repeat(8,1fr)}}
.pp-ep{padding:11px 4px;border-radius:8px;text-align:center;font-size:12px;font-weight:600;color:#dcdcdc;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.pp-ep:hover{background:rgba(255,255,255,.16)}
.pp-ep.on{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;font-weight:800}
.pp-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;margin-bottom:8px;border-radius:10px;
  font-size:13.5px;color:#dcdcdc;background:rgba(255,255,255,.07);transition:background .15s}
.pp-line:hover{background:rgba(255,255,255,.13)}
.pp-line.on{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));font-weight:700}
.pp-line .n{opacity:.7;font-size:11.5px}
.pp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;color:#dcdcdc;font-size:13px;border-top:1px solid rgba(255,255,255,.08)}
.pp-row:first-child{border-top:none}
.pp-row .k{flex-shrink:0}
.pp-row input[type=range]{width:130px;accent-color:var(--accent)}
.pp-row select{height:30px;padding:0 8px;border-radius:8px;font-size:12px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);outline:none}
.pp-row .pp-val{font-size:12px;font-weight:700;color:var(--accent);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.pp-btns{display:flex;gap:6px;flex-wrap:wrap}
.pp-btn{padding:6px 12px;border-radius:14px;font-size:12px;color:#dcdcdc;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.pp-btn.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;font-weight:700}
.pp-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.55);margin:14px 0 8px;letter-spacing:.5px}
.pp-title:first-child{margin-top:0}
.pp-note{font-size:11.5px;line-height:1.7;color:rgba(255,255,255,.5);margin-top:8px}
.pp-full{width:100%;padding:10px;border-radius:10px;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);margin-top:8px}
.pp-input{width:100%;height:34px;padding:0 10px;border-radius:8px;font-size:12px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);outline:none}

/* 旋转横屏：隐藏系统滚动，播放器最大化 */
@media(orientation:landscape) and (max-height:520px){
  .pl-top{padding-top:8px}
  .pl-bottom{padding-bottom:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<!-- ==================== 全局层 ==================== -->
<div id="topbar"></div>
<div id="toast"></div>

<!-- ==================== 顶栏 ==================== -->
<header class="hd">
  <div class="hd-row">
    <button class="icon-btn" id="menuBtn" aria-label="菜单">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand" id="brand" title="点击切换数据源">
      <span class="logo" id="brandName">全剧聚合</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <!-- 桌面端导航收进顶栏，紧贴搜索左侧 -->
    <nav class="dnav" id="dnav"></nav>
    <button class="icon-btn" id="searchBtn" aria-label="搜索">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <button class="icon-btn theme-btn" id="themeBtn" aria-label="切换主题">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
  <!-- 第二行：首页 + 分类条同一行，桌面端不再有独立的导航行 -->
  <div class="hd-sub">
    <span class="hlink" id="homeLink" data-act="nav" data-id="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>首页</span>
    </span>
    <span class="vsep"></span>
    <!-- 分类条放在 header 内：header 本身 sticky，分类随之一起吸顶 -->
    <nav class="catnav" id="catnav"></nav>
  </div>
</header>

<!-- ==================== 主区域 ==================== -->
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<nav class="bnav" id="bnav"></nav>
<button class="backtop" id="backTop" aria-label="回到顶部">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<!-- ==================== 抽屉 ==================== -->
<div class="mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-hd">
    <div class="name" id="drawerName">全剧聚合</div>
    <button class="x" id="drawerClose" aria-label="关闭">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-bd" id="drawerBody"></div>
</aside>

<!-- ==================== 搜索 ==================== -->
<div class="mask" id="searchMask"></div>
<div class="search-pop" id="searchPop">
  <div class="sp-row">
    <div class="search">
      <input id="wd" type="search" placeholder="搜索短剧 / 影视…" autocomplete="off" enterkeyhint="search">
      <button id="searchGo" aria-label="搜索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
    <button class="sp-cancel" id="searchCancel">取消</button>
  </div>
  <div class="sp-hist" id="spHist"></div>
</div>

<!-- ==================== 数据源选择 ==================== -->
<div class="mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-title" id="sheetTitle">切换数据源</div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ==================== 播放器 ==================== -->
<section class="player" id="player" aria-hidden="true">
  <div class="pl-wrap" id="plWrap">
    <video id="plVideo" playsinline webkit-playsinline x5-playsinline preload="metadata"></video>
    <div class="dm-layer" id="dmLayer"></div>
    <div class="pl-dim" id="plDim"></div>
    <div class="pl-gesture" id="plGesture"></div>

    <div class="pl-loading" id="plLoading"><i></i><span id="plLoadingTxt">加载中…</span></div>
    <div class="pl-msg" id="plMsg"></div>
    <div class="pl-tip" id="plTip"></div>

    <div class="pl-top">
      <button class="pl-btn" id="plBack" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <div class="pl-title" id="plTitle">—</div>
      <button class="pl-btn" id="plFav" aria-label="收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
      </button>
      <button class="pl-btn" id="plDmToggle" aria-label="弹幕开关">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 9h12v2H6zm8 5H6v-2h8zm4-6H6V6h12z"/></svg>
      </button>
      <button class="pl-btn" id="plDmSet" aria-label="弹幕设置">
        <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      </button>
    </div>
