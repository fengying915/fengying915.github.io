  app.innerHTML =
    '<div class="tools"><span class="bar"></span><div><h2>我的收藏</h2><div class="total">共 ' + all.length + " 部</div></div>" +
      '<span class="act" data-act="clearFav">清空' + (state.favSite === "all" ? "全部" : "") + "</span></div>" +
    siteFilterHtml(state.favSite, counts, "favSite") +
    '<div class="grid">' + list.map((f, i) => cardHtml(
      makeVod({ id: f.id, name: f.name, pic: f.pic, remark: f.remark, tags: f.tags }),

/* 自建代理模板（Cloudflare Worker）：公共代理全部失效时的兜底方案，

const WORKER_TEMPLATE = [
  "export default {",
  "  async fetch(request) {",
  "    const cors = {",
  "      'Access-Control-Allow-Origin': '*',",
  "      'Access-Control-Allow-Methods': 'GET,OPTIONS',",
  "      'Access-Control-Allow-Headers': '*',",
  "      'Access-Control-Max-Age': '86400'",
  "    };",
  "    if (request.method === 'OPTIONS') return new Response(null, { status: 204, headers: cors });",
  "",
  "    const target = new URL(request.url).searchParams.get('url');",
  "    if (!target) return new Response('usage: ?url=<encodeURIComponent(url)>', { status: 400, headers: cors });",
  "",
  "    let u;",
  "    try { u = new URL(target); } catch (e) { return new Response('invalid url', { status: 400, headers: cors }); }",
  "    if (u.protocol !== 'http:' && u.protocol !== 'https:') {",
  "      return new Response('only http/https', { status: 400, headers: cors });",
  "    }",
  "",
  "    // 关键：不要转发浏览器的 Accept-Encoding，交给 Workers 运行时协商并自动解压，",
  "    // 否则可能拿到「已压缩的 body + 被剥掉的 Content-Encoding」，前端 JSON 解析必然失败",
  "    const headers = new Headers();",
  "    headers.set('User-Agent', request.headers.get('User-Agent') ||",
  "      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');",
  "    headers.set('Accept', '*/*');",
  "    headers.set('Referer', u.origin + '/');",
  "    const range = request.headers.get('Range');",
  "    if (range) headers.set('Range', range);   // 需要代理视频分片时有用",
  "",
  "    let upstream;",
  "    try {",
  "      upstream = await fetch(u.href, { headers, redirect: 'follow' });",
  "    } catch (e) {",
  "      return new Response(JSON.stringify({ error: String((e && e.message) || e) }), {",
  "        status: 502,",
  "        headers: Object.assign({}, cors, { 'Content-Type': 'application/json; charset=utf-8' })",
  "      });",
  "    }",
  "",
  "    // 透传上游响应头（流式返回 body），跳过压缩/长度/Cookie 这类不能再透传的头",
  "    const out = new Headers(cors);",
  "    upstream.headers.forEach(function (v, k) {",
  "      const lk = k.toLowerCase();",
  "      if (['content-encoding', 'content-length', 'set-cookie', 'access-control-allow-origin'].indexOf(lk) >= 0) return;",
  "      out.set(k, v);",
  "    });",
  "    if (!out.has('Content-Type')) out.set('Content-Type', 'application/json; charset=utf-8');",
  "    return new Response(upstream.body, { status: upstream.status, headers: out });",
  "  }",
  "};"
].join("\n");

function cmsForm() {

  return {

}
/** 图标 / 官网只收 http(s)：填了但不是链接就直接拦下，避免存进去变成死链 */
function cmsLinkGuard(logo, url) {
  const bad = [["图标", logo], ["官网", url]].find(([, v]) => {
    const s = String(v || "").trim();
    return s && !/^https?:\/\//i.test(s);
  });
  if (bad) toast(bad[0] + "地址需以 http(s):// 开头");
  return !!bad;
}

function cmsAdd() {
  const f = cmsForm();
  if (cmsLinkGuard(f.logo, f.url)) return;
  const r = CmsStore.add(f.name, f.api, f.adult, f);
  if (!r.ok) { toast(r.msg); return; }
  toast("已添加采集源：" + r.item.name);
  renderSettings();
  openSitePicker();
  closeSheet();
}
function cmsBatch() {
  const raw = prompt("批量导入采集源，每行一个：\n名称|接口|说明|图标|官网|18\n（第 3 项起可留空，最后一列填 18 即标记成人站；接口已存在的源只补空着的字段，不覆盖你改过的内容）");
  if (!raw) return;
  const list = CmsStore.all();
  const byApi = new Map(list.map((x) => [x.api, x]));
  let added = 0;
  let filled = 0;
  raw.split(/\r?\n/).forEach((line) => {
    const p = line.trim().split("|").map((x) => x.trim());
    const name = p[0];
    const api = p[1];
    if (!name || !/^https?:\/\//i.test(api || "")) return;
    const desc = p[2] || "";
    const logo = p[3] || "";
    const url = p[4] || "";
    const adult = /^(18|18\+|1|true|yes|adult|是)$/i.test(p[5] || "");
    // 接口已存在：只补还空着的展示字段，已有内容一律不动
    const exist = byApi.get(api);
    if (exist) {
      let hit = false;
      if (desc && !String(exist.desc || "").trim()) { exist.desc = desc; hit = true; }
      if (logo && !exist.logo) { exist.logo = logo; hit = true; }
      if (url && !exist.url) { exist.url = url; hit = true; }
      if (adult && !exist.adult) { exist.adult = true; hit = true; }
      if (hit) filled++;
      return;
    }
    const item = Object.assign(
      { id: "cms_" + hashStr(api), name: cmsNameClean(name), api, adult: adult || ADULT_RE.test(name) },
      cmsShowFields({ desc, logo, url })
    );
    list.push(item);
    byApi.set(api, item);
    added++;
  });
  if (added || filled) CmsStore.save(list);
  toast(added || filled
    ? "新增 " + added + " 个采集源" + (filled ? "，补全 " + filled + " 个已有源的说明/图标/官网" : "")
    : "没有可导入的有效条目");
  renderSettings();
}
/** 进入编辑态：把该源的数据回填到表单（接口只读），并把视图滚到表单 */
function cmsEdit(id) {
  const cfg = CmsStore.all().find((c) => "cms_" + hashStr(c.api) === id);

/** 保存编辑：接口地址不参与，只改名称 / 图标 / 说明 / 官网 / 18+ */
function cmsSave() {
  const id = state.cmsEdit;
  if (!id) return;
  const f = cmsForm();

  if (!String(f.name).trim()) { toast("源名称不能为空"); return; }

function cmsDel(id) {
  const cfg = CmsStore.all().find((c) => "cms_" + hashStr(c.api) === id);

  if (!confirm("确定删除采集源「" + cfg.name + "」？")) return;

function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try { d = JSON.parse(String(reader.result)); } catch (e) { toast("文件格式错误"); return; }
    if (!d || (!d.fav && !d.hist && !d.cms)) { toast("不是有效的备份文件"); return; }
    if (!confirm("导入将覆盖当前收藏、历史、搜索记录与站源配置，确定继续？")) return;
    if (Array.isArray(d.fav)) lsSet(LS.fav, d.fav);
    if (Array.isArray(d.hist)) lsSet(LS.hist, d.hist);
    if (Array.isArray(d.search)) lsSet(LS.search, d.search);
    if (Array.isArray(d.cms) && d.cms.length) CmsStore.save(d.cms);
    if (Array.isArray(d.proxies)) {
      d.proxies.forEach((p) => ProxyPool.add(p));
    }
    if (d.dm && typeof d.dm === "object") { Object.assign(DM.cfg, d.dm); DM.save(); }
    if (typeof d.dmApi === "string") { DM.api = d.dmApi; DM.save(); }
    if (d.prefs && typeof d.prefs === "object") {
      if (typeof d.prefs.heroAuto === "boolean") Prefs.d.heroAuto = d.prefs.heroAuto;
      if (d.prefs.pageMode === "auto" || d.prefs.pageMode === "pager") Prefs.d.pageMode = d.prefs.pageMode;
      Prefs.save();
    }
    renderNav();
    renderSettings();
    toast("导入完成");
  };
  reader.readAsText(file);
}

  if (!eps.length) { toast("该作品暂无播放资源"); return; }
  idx = clamp(num(idx, state.curEp), 0, eps.length - 1);

  let pos = 0;
  const h = state.detail ? Hist.find(state.detail.id, state.site) : null;

    el.loading = $("plLoading");
    el.loadingTxt = $("plLoadingTxt");
    el.msg = $("plMsg");
    el.tip = $("plTip");
    el.title = $("plTitle");
    el.fav = $("plFav");
    el.dmToggle = $("plDmToggle");
    el.playIcon = $("plPlayIcon");
    el.seek = $("plSeek");
    el.track = el.seek.querySelector(".track");
    el.buf = $("plBuf");
    el.played = $("plPlayed");
    el.dot = $("plDot");
    el.fly = $("plFly");
    el.time = $("plTime");
    el.rate = $("plRate");
    el.fsIcon = $("plFsIcon");
    el.dmSend = $("plDmSend");
    el.dmInput = $("dmInput");
    el.pmask = $("plPMask");
    el.panel = $("plPanel");
    el.plpTitle = $("plpTitle");
    el.plpBody = $("plpBody");
    el.back = $("plBack");
    el.playBtn = $("plPlay");
    el.prev = $("plPrev");
    el.next = $("plNext");
    el.fs = $("plFs");
    el.epBtn = $("plEpBtn");
    el.routeBtn = $("plRouteBtn");
    el.setBtn = $("plSetBtn");
    el.dmSet = $("plDmSet");
    el.plpClose = $("plpClose");
    el.dmSendBtn = $("dmSend");
  }

  /* ---- HLS 配置 ---- */
  function hlsConfig(site) {
    const cfg = {
      // 缓冲上限放小一档：短剧单集也就两三分钟，攒 90s 反而让首帧更慢
      maxBufferLength: 40,
      maxMaxBufferLength: 90,
      backBufferLength: 30,
      // 超时全部收紧：代理挂掉时 30s 才换通道，用户看到的就是一直转圈
      manifestLoadingTimeOut: 10000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      levelLoadingTimeOut: 10000,
      levelLoadingMaxRetry: 3,
      levelLoadingRetryDelay: 500,
      fragLoadingTimeOut: 14000,
      fragLoadingMaxRetry: 4,
      fragLoadingRetryDelay: 400,
      startLevel: -1,
      lowLatencyMode: false,
      // 卡住时允许直接跳到已缓冲的位置，减少「等一格缓冲」的停顿
      maxBufferHole: 0.5,
      nudgeMaxRetry: 6,
      enableWorker: true,
      capLevelToPlayerSize: true
    };
    if (site && typeof site.makeLoader === "function") {
      try {
        const L = site.makeLoader();
        if (L) cfg.loader = L;
      } catch (e) { /* Loader 注入失败则按直连播放 */ }
    }
    return cfg;
  }

  function isHls(src, orig, site) {
    if (site && typeof site.forceHls === "function") {
      try { if (site.forceHls()) return true; } catch (e) {}
    }
    const s = String(orig || src || "");
    if (/\.m3u8(\?|#|$)/i.test(s)) return true;
    return /^blob:/i.test(String(src || ""));
  }

  function destroyHls() {
    if (!hls) return;
    try { hls.destroy(); } catch (e) {}
    hls = null;
  }

  /* ---- 状态提示 ---- */
  function setLoading(on, txt) {
    if (!el.loading) return;
    el.loading.classList.toggle("show", !!on);
    if (txt && el.loadingTxt) el.loadingTxt.textContent = txt;
  }
  function showMsg(html, retryable) {
    if (!el.msg) return;
    el.msg.innerHTML = "<div>" + html + "</div>" +
      (retryable ? '<button class="mbtn" data-act="plRetry">重试</button>' : "") +
      '<button class="mbtn" style="background:rgba(255,255,255,.16);color:#fff;box-shadow:none" data-act="plBackDetail">返回详情</button>';
    el.msg.classList.add("show");
    setLoading(false);
  }
  function hideMsg() { if (el.msg) el.msg.classList.remove("show"); }
  function showTip(txt, ms) {
    if (!el.tip) return;
    el.tip.textContent = txt;
    el.tip.classList.add("show");
    clearTimeout(tipTimer);
    if (ms !== 0) tipTimer = setTimeout(hideTip, ms || 1200);
  }
  function hideTip() {
    clearTimeout(tipTimer);
    if (el.tip) el.tip.classList.remove("show");
  }

  /* ---- 卡顿自救 ----
   * 分片走公共代理时，代理会在播放中途变慢甚至挂掉，表现就是进度条不动、
   * 画面一直转圈。这里在卡住 8 秒后主动清掉挂起的请求、从当前进度重新拉，
   * 第二次仍然卡就直接换一套通道重开本集（不打断观看位置）。
   */
  function clearStall() {
    clearTimeout(stallTimer);
    stallTimer = 0;
  }
  function armStall() {
    clearStall();
    if (!active) return;
    stallTimer = setTimeout(() => {
      stallTimer = 0;
      const v = el.video;
      if (!active || v.paused || v.readyState >= 3) return;
      stallN++;
      if (stallN === 1 || stallN === 2) {
        setLoading(true, "网络较慢，正在重新缓冲…");
        if (hls) {
          try { hls.stopLoad(); } catch (e) {}
          try { hls.startLoad(Math.max(0, num(v.currentTime))); } catch (e) {}
        } else if (v.currentSrc) {
          try { v.load(); v.play(); } catch (e) {}
        }
        armStall();
        return;
      }
      if (stallN >= 3 && stallN <= 4) {
        setLoading(true, "正在切换播放通道…");
        const at = num(v.currentTime);
        ProxyPool.forget();            // 别再吊死在同一条代理上
        playEpisode(state.curEp, at);
      }
    }, 8000);
  }

  /* ---- 进度绘制 ---- */
  function bufferPct(v) {
    const d = num(v.duration);
    if (!d || !v.buffered || !v.buffered.length) return 0;
    try { return clamp(v.buffered.end(v.buffered.length - 1) / d * 100, 0, 100); } catch (e) { return 0; }
  }
  function paint(p, t, d) {
    const w = (clamp(p, 0, 1) * 100).toFixed(2) + "%";
    el.played.style.width = w;
    el.dot.style.left = w;
    el.time.textContent = fmtTime(t) + " / " + fmtTime(d);
  }
  function updateProgress() {
    const v = el.video;
    const d = num(v.duration);
    paint(d ? num(v.currentTime) / d : 0, num(v.currentTime), d);
    el.buf.style.width = bufferPct(v) + "%";
  }

  /* ---- 播放控制 ---- */
  function setPlayIcon(playing) {
    if (el.playIcon) el.playIcon.innerHTML = playing ? PL_ICONS.pause : PL_ICONS.play;
  }
  function toggle() {
    const v = el.video;
    if (v.paused) v.play().catch(() => {});
    else v.pause();
  }
  function seekBy(sec) {
    const v = el.video;
    const d = num(v.duration);
    if (!d) return;
    v.currentTime = clamp(num(v.currentTime) + sec, 0, Math.max(0, d - 0.3));
    updateProgress();
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!el.video.paused && !panelKind) el.root.classList.add("hide-ui");
    }, 3600);
  }
  function toggleUI() {
    el.root.classList.toggle("hide-ui");
    if (!el.root.classList.contains("hide-ui")) scheduleHide();
  }

  function cycleRate() {
    const cur = num(el.video.playbackRate, 1);
    const i = PL_RATES.indexOf(cur);
    setRate(PL_RATES[(i + 1) % PL_RATES.length]);
  }
  function setRate(v) {
    const r = num(v, 1);
    el.video.playbackRate = r;
    el.rate.textContent = r + "x";
    if (panelKind) refreshPanel();
    toast("倍速 " + r + "x", 1000);
  }

  function toggleFs() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
      return;
    }
    const wrap = el.wrap;
    if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
    else if (el.video.webkitEnterFullscreen) el.video.webkitEnterFullscreen();
    else toast("当前环境不支持全屏", 1400);
  }
  function syncFsIcon() {
    if (!el.fsIcon) return;
    el.fsIcon.innerHTML = document.fullscreenElement ? PL_ICONS.fsOut : PL_ICONS.fsIn;
  }

  /* ---- 进度保存 ---- */
  function saveProgress() {
    const d = state.detail;
    const ep = (state.episodes || [])[state.curEp];
    if (!d || !ep || !el.video) return;
    const pos = num(el.video.currentTime);
    const dur = num(el.video.duration);
    if (!pos && !dur) return;
    Hist.upsert({
      id: d.id, name: d.name, pic: d.pic, remark: d.remark,
      ep: ep.num != null ? ep.num : state.curEp + 1,
      epTitle: ep.title, pos: pos, dur: dur
    });
  }

  /* ---- 内联挂载：把播放器搬进详情页的 .stage 窗口 ---- */
  function mountInline() {
    const stage = $("stage");
    if (!stage || !el.root) return false;
    stage.classList.add("playing");
    stage.appendChild(el.root);
    el.root.classList.add("inline");
    inline = true;
    return true;
  }
  /** 还原：节点搬回 body，清掉窗口上的播放态与自适应尺寸 */
  function unmountInline() {
    if (!inline) return false;
    inline = false;
    if (el.root && el.root.parentNode && el.root.parentNode !== document.body) {
      document.body.appendChild(el.root);
    }
    if (el.root) el.root.classList.remove("inline");
    const stage = $("stage");
    if (stage) {
      stage.classList.remove("playing", "portrait");
      stage.style.aspectRatio = "";
      stage.style.maxHeight = "";
      stage.style.width = "";
    }
    return true;
  }
  /* ---- 打开 / 关闭 ---- */
  function open(idx, pos, opts) {
    const d = state.detail;
    if (!d) { toast("请先选择作品"); return; }
    if (!(state.episodes || []).length) { toast("该作品暂无播放资源"); return; }
    opts = opts || {};
    cache();
    bindEvents();
    active = true;
    // 详情页存在固定窗口时默认内联播放，不再铺满全屏
    const useInline = opts.inline !== false && !!$("stage");
    if (useInline) mountInline();
    el.root.classList.add("show");
    el.root.setAttribute("aria-hidden", "false");
    el.root.classList.remove("hide-ui");
    if (useInline) document.body.classList.remove("lock");
    else document.body.classList.add("lock");
    el.rate.textContent = num(el.video.playbackRate, 1) + "x";
    el.dmSend.classList.toggle("show", !!DM.cfg.enabled);
    el.dmToggle.classList.toggle("on", !!DM.cfg.enabled);
    syncFav();
    syncFsIcon();
    Dm.attach(el.dm);
    Dm.setEnabled(!!DM.cfg.enabled);
    // 舞台尺寸要等浮层可见后才准确，延后一帧再算轨道
    setTimeout(() => Dm.resize(), 120);
    playEpisode(idx == null ? state.curEp : idx, pos);
    if (pos) setTimeout(() => showTip("已为你续播至 " + fmtTime(pos), 1600), 600);
  }

  function close(silent) {
    if (!active) return;
    saveProgress();
    active = false;
    clearStall();
    stallN = 0;
    token++;                       // 作废进行中的加载
    try { el.video.pause(); } catch (e) {}
    destroyHls();
    try { el.video.removeAttribute("src"); el.video.load(); } catch (e) {}
    Dm.clear();
    Dm.detach();
    clearTimeout(hideTimer);
    closePanel();
    hideMsg();
    hideTip();
    setLoading(false);
    // 先隐藏再搬节点：避免同一帧内 fixed 定位短暂铺满屏幕
    el.root.classList.remove("show", "hide-ui");
    el.root.setAttribute("aria-hidden", "true");
    unmountInline();               // 再把节点搬回 body，详情页重绘时不会被清掉
    document.body.classList.remove("lock");
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
    if (!silent) { syncDetailChips(); renderNav(); }
  }

  /* ---- 加载一集 ---- */
  async function playEpisode(idx, startPos) {
    const eps = state.episodes || [];
    if (!eps.length || !active) return;
    idx = clamp(num(idx, 0), 0, eps.length - 1);
    const ep = eps[idx];
    const site = currentSite();
    const my = ++token;
    state.curEp = idx;
    netRetry = 0; medRetry = 0; proxyTried = false;
    clearStall(); stallN = 0;
    el.title.textContent = ((state.detail && state.detail.name) || "") + " · " + ep.title;
    closePanel();
    hideMsg();
    Dm.clear();
    Dm.load(state.detail, ep, site.id);
    setLoading(true, "解析播放地址…");

    let start = startPos;
    if (start == null) {
      const h = state.detail ? Hist.find(state.detail.id, site.id) : null;
      start = (h && String(h.ep) === String(ep.num)) ? num(h.pos) : 0;
    }
    try {
      // 详情页已经把第一集直链预取好了，这里直接复用；失败或没预取到再自己请求
      let res = null;
      const pre = PrePlay.get(site.id, ep.playId);
      if (pre) { try { res = await pre; } catch (e) { res = null; } }
      if (!res || !res.url) res = await Promise.resolve(site.api.play(ep.playId));
      if (my !== token || !active) return;
      const url = String((res && res.url) || "").trim();
      if (!url) throw new Error("未获取到播放地址");
      if (!start && res && num(res.resume) > 0) start = num(res.resume);

      if (typeof site.verify === "function") {
        setLoading(true, "校验视频源…");
        const vs = await site.verify(url);
        if (my !== token || !active) return;
        if (vs !== "ok") {
          showMsg((typeof site.blockMessage === "function" ? site.blockMessage(vs) : "视频源校验失败，请重试。"), true);
          return;
        }
      }
      if (my !== token || !active) return;
      const src = typeof site.hlsSource === "function" ? site.hlsSource(url) : url;
      attach(src, url, site, start, my);
    } catch (e) {
      if (my !== token || !active) return;
      showMsg("播放失败：" + esc((e && e.message) || "网络错误"), true);
    }
  }

  /* ---- 挂载视频 ---- */
  function attach(src, orig, site, start, my) {
    destroyHls();
    lastOrig = orig;
    const v = el.video;
    setLoading(true, "缓冲中…");
    const startNow = () => {
      if (start && isFinite(start)) {
        try { v.currentTime = clamp(start, 0, Math.max(0, (num(v.duration) || start) - 0.5)); } catch (e) {}
      }
      const p = v.play();
      if (p && p.catch) p.catch(() => {
        setPlayIcon(false);
        showTip("已就绪，点击 ▶ 开始播放", 2600);
      });
    };

    if (isHls(src, orig, site) && window.Hls && Hls.isSupported()) {
      const h = new Hls(hlsConfig(site));
      hls = h;
      h.on(Hls.Events.MANIFEST_PARSED, () => {
        if (my !== token) return;
        setLoading(false);
        startNow();
      });
      h.on(Hls.Events.ERROR, (evt, data) => onHlsError(data, my));
      h.loadSource(src);
      h.attachMedia(v);
      return;
    }

    // 原生播放（mp4 / Safari 原生 HLS）
    v.src = src;
    v.addEventListener("loadedmetadata", () => {
      if (my !== token) return;
      setLoading(false);
      startNow();
    }, { once: true });
    try { v.load(); } catch (e) {}
    if (v.canPlayType && v.canPlayType("application/vnd.apple.mpegurl")) {
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }
  }

  function onHlsError(data, my) {
    if (!data || my !== token) return;
    // 卡在缓冲上（非致命）：交给卡顿自救，别在这里重开
    if (data.details === "bufferStalledError") { armStall(); return; }
    if (!data.fatal) return;
    const site = currentSite();
    const details = String(data.details || "");
    // 清单/子清单加载失败（多为 CORS 或防盗链）→ 直接升级到代理，不再原地重试
    const isManifestErr = /Manifest|LevelLoad|LevelParsing/i.test(details);
    const tryProxy = () => {
      if (!site || !site.canProxy || typeof site.enableProxy !== "function" || proxyTried) return false;
      let on = false;
      try { on = typeof site.proxyMode === "function" ? site.proxyMode() : false; } catch (e) {}
      if (on) return false;
      proxyTried = true;
      site.enableProxy();
      toast("直连受限，已启用代理重试", 1800);
      playEpisode(state.curEp, num(el.video.currentTime));
      return true;
    };
    if (isManifestErr && tryProxy()) return;
    if (data.type === "networkError" && netRetry < 2) {
      netRetry++;
      setLoading(true, "网络中断，重试 " + netRetry + "/2…");
      try { hls.startLoad(); } catch (e) {}
      return;
    }
    if (data.type === "mediaError" && medRetry < 2) {
      medRetry++;
      try { hls.recoverMediaError(); return; } catch (e) {}
    }
    if (tryProxy()) return;
    const extra = (site && typeof site.blockMessage === "function") ? "<br>" + esc(site.blockMessage("")) : "";
    showMsg("播放出错：" + esc(details || data.type || "未知错误") + extra, true);
  }

  /* ---- 面板 ---- */
  function panelHtml(kind) {
    const eps = state.episodes || [];
    const routes = state.routes || [];
    const dm = DM.cfg;
    if (kind === "eps") {
      if (!eps.length) return '<div class="pp-note">暂无剧集</div>';
      return '<div class="pp-eps">' + eps.map((e, i) =>
        '<div class="pp-ep ' + (i === state.curEp ? "on" : "") + '" data-act="plEp" data-i="' + i + '">' + esc(e.title) + "</div>"
      ).join("") + "</div>";
    }
    if (kind === "route") {
      if (routes.length <= 1) return '<div class="pp-note">当前作品只有一条线路</div>';
      return routes.map((r, i) =>
        '<div class="pp-line ' + (i === state.routeIdx ? "on" : "") + '" data-act="plRoute" data-i="' + i + '">' +
          "<span>" + esc(r.name || "线路" + (i + 1)) + "</span>" +
          '<span class="n">' + (r.episodes || []).length + " 集</span>" +
        "</div>"
      ).join("");
    }
    if (kind === "set") {
      const cur = num(el.video.playbackRate, 1);
      return '<div class="pp-title">播放倍速</div>' +
        '<div class="pp-btns">' + PL_RATES.map((r) =>
          '<button class="pp-btn ' + (Math.abs(cur - r) < 0.01 ? "on" : "") + '" data-act="plRate" data-v="' + r + '">' + r + "x</button>"
        ).join("") + "</div>" +
        '<div class="pp-title">画面</div>' +
        '<div class="pp-btns"><button class="pp-btn" data-act="plFull">全屏 / 退出全屏</button>' +
        '<button class="pp-btn" data-act="plReload">重载本集</button></div>' +
        '<div class="pp-title">弹幕</div>' +
        '<div class="pp-btns"><button class="pp-btn ' + (dm.enabled ? "on" : "") + '" data-act="plDmToggle">' + (dm.enabled ? "已开启" : "已关闭") + "</button>" +
        '<button class="pp-btn" data-act="plDmMore">更多设置</button></div>' +
        '<div class="pp-note">进度每 4 秒自动记录，退出后可继续观看。</div>';
    }
    // dm
    return '<div class="pp-row"><span class="k">弹幕开关</span>' +
        '<div class="pp-btns"><button class="pp-btn ' + (dm.enabled ? "on" : "") + '" data-act="plDmToggle">' + (dm.enabled ? "开启" : "关闭") + "</button></div></div>" +
      '<div class="pp-row"><span class="k">不透明度</span><input type="range" id="pdmOpacity" min="20" max="100" value="' + Math.round(dm.opacity * 100) + '">' +
        '<span class="pp-val" id="pdmOpacityVal">' + Math.round(dm.opacity * 100) + "%</span></div>" +
      '<div class="pp-row"><span class="k">字号</span><input type="range" id="pdmSize" min="14" max="40" value="' + dm.size + '">' +
        '<span class="pp-val" id="pdmSizeVal">' + dm.size + "px</span></div>" +
      '<div class="pp-row"><span class="k">速度</span><select id="pdmSpeed">' +
        SPEED_LIST.map((s) => '<option value="' + s + '" ' + (dm.speed === s ? "selected" : "") + ">" + s + " px/s</option>").join("") +
      "</select></div>" +
      '<div class="pp-row"><span class="k">显示区域</span><div class="pp-btns">' +
        AREA_LIST.map((a) => '<button class="pp-btn ' + (dm.area === a.v ? "on" : "") + '" data-act="pdmArea" data-v="' + a.v + '">' + a.name + "</button>").join("") +
      "</div></div>" +
      '<div class="pp-row"><span class="k">时延</span><div class="pp-btns">' +
        '<button class="pp-btn" data-act="pdmDelay" data-v="-0.5">-0.5s</button>' +
        '<span class="pp-val">' + (dm.delay >= 0 ? "+" : "") + dm.delay.toFixed(1) + "s</span>" +
        '<button class="pp-btn" data-act="pdmDelay" data-v="0.5">+0.5s</button>' +
      "</div></div>" +
      '<div class="pp-title">自定义弹幕接口</div>' +
      '<input class="pp-input" id="pdmApi" placeholder="留空使用内置源" value="' + esc(DM.api) + '" spellcheck="false">' +
      '<button class="pp-full" data-act="pdmApiSave">保存接口地址</button>' +
      '<div class="pp-note">弹幕按片名自动匹配公开接口，匹配不到时仅显示本机发送的弹幕。发送的弹幕保存在本机，重看本集仍会出现。</div>';
  }

  function refreshPanel() {
    if (!panelKind) return;
    el.plpTitle.textContent = PANEL_TITLES[panelKind] || "";
    el.plpBody.innerHTML = panelHtml(panelKind);
    bindPanel();
    el.root.classList.remove("hide-ui");
  }
  function openPanel(kind) {
    panelKind = kind;
    refreshPanel();
    el.pmask.classList.add("show");
    el.panel.classList.add("show");
    clearTimeout(hideTimer);
    if (kind === "eps") {
      const on = el.plpBody.querySelector(".pp-ep.on");
      if (on && on.scrollIntoView) on.scrollIntoView({ block: "center" });
    }
  }
  function closePanel() {
    if (!el.panel) return;
    panelKind = "";
    el.pmask.classList.remove("show");
    el.panel.classList.remove("show");
  }

  function bindPanel() {
    const op = $("pdmOpacity");
    if (op) op.oninput = () => {
      DM.set("opacity", num(op.value) / 100);
      const lab = $("pdmOpacityVal");
      if (lab) lab.textContent = op.value + "%";
      Dm.refresh();
    };
    const sz = $("pdmSize");
    if (sz) sz.oninput = () => {
      DM.set("size", num(sz.value));
      const lab = $("pdmSizeVal");
      if (lab) lab.textContent = sz.value + "px";
      Dm.refresh();
    };
    const sp = $("pdmSpeed");
    if (sp) sp.onchange = () => { DM.set("speed", num(sp.value)); Dm.refresh(); };
  }

  /* ---- 收藏按钮 ---- */
  function syncFav() {
    const d = state.detail;
    el.fav.classList.toggle("on", !!(d && Fav.has(d.id, state.site)));
  }
  function toggleFav() {
    const d = state.detail;
    if (!d) return;
    const added = Fav.toggle({ id: d.id, name: d.name, pic: d.pic, remark: d.remark, tags: d.tags });
    syncFav();
    renderNav();
    toast(added ? "已加入收藏 ♥" : "已取消收藏", 1200);
  }

  function toggleDm() {
    const on = !DM.cfg.enabled;
    DM.set("enabled", on);
    Dm.setEnabled(on);
    el.dmToggle.classList.toggle("on", on);
    el.dmSend.classList.toggle("show", on);
    if (panelKind) refreshPanel();
    toast(on ? "弹幕已开启" : "弹幕已关闭", 1200);
  }

  function sendDanmu() {
    const txt = String(el.dmInput.value || "").trim();
    if (!txt) { toast("说点什么吧", 1200); return; }
    if (!DM.cfg.enabled) { toast("请先开启弹幕", 1200); return; }
    Dm.send(txt);
    el.dmInput.value = "";
  }

  /* ---- 播放结束 ---- */
  function onEnded() {
    saveProgress();
    const total = (state.episodes || []).length;
    if (state.curEp < total - 1) {
      showTip("即将播放下一集", 1400);
      setTimeout(() => { if (active) playEpisode(state.curEp + 1, 0); }, 700);
    } else {
      showMsg("已播放完最后一集", false);
    }
  }

  /* ---- 事件绑定（仅一次） ---- */
  function bindEvents() {
    if (bound) return;
    bound = true;

    el.back.onclick = () => close();
    el.playBtn.onclick = toggle;
    el.prev.onclick = () => { if (state.curEp > 0) playEpisode(state.curEp - 1, 0); else toast("已经是第一集", 1200); };
    el.next.onclick = () => {
      const total = (state.episodes || []).length;
      if (state.curEp < total - 1) playEpisode(state.curEp + 1, 0); else toast("已经是最后一集", 1200);
    };
    el.fs.onclick = toggleFs;
    el.rate.onclick = cycleRate;
    el.epBtn.onclick = () => openPanel("eps");
    el.routeBtn.onclick = () => openPanel("route");
    el.setBtn.onclick = () => openPanel("set");
    el.dmSet.onclick = () => openPanel("dm");
    el.dmToggle.onclick = toggleDm;
    el.fav.onclick = toggleFav;
    el.plpClose.onclick = closePanel;
    el.pmask.onclick = closePanel;
    el.dmSendBtn.onclick = sendDanmu;
    el.dmInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendDanmu(); }
    });

    const v = el.video;
    v.addEventListener("timeupdate", () => {
      if (!dragging) updateProgress();
      if (Date.now() - saveTick > 4000) { saveTick = Date.now(); saveProgress(); }
    });
    v.addEventListener("progress", updateProgress);
    v.addEventListener("durationchange", updateProgress);
    v.addEventListener("play", () => { setPlayIcon(true); scheduleHide(); });
    v.addEventListener("playing", () => {
      clearStall();
      stallN = 0;
      setLoading(false); hideMsg(); setPlayIcon(true); Dm.resize();
    });
    v.addEventListener("waiting", () => { setLoading(true, "缓冲中…"); armStall(); });
    v.addEventListener("seeking", () => { clearStall(); stallN = 0; });
    v.addEventListener("pause", () => {
      clearStall();
      setPlayIcon(false);
      el.root.classList.remove("hide-ui");
      saveProgress();
    });
    v.addEventListener("ended", onEnded);
    v.addEventListener("error", () => {
      if (hls) return;                       // hls 自身有错误处理
      if (!v.currentSrc) return;
      showMsg("视频加载失败，请重试。", true);
    });
    document.addEventListener("fullscreenchange", syncFsIcon);

    bindSeek();
    bindGesture();
    window.addEventListener("resize", () => Dm.resize());
  }

  /* ---- 进度条拖动 ---- */
  function bindSeek() {
    let drag = false;
    const posOf = (e) => {
      const r = el.track.getBoundingClientRect();
      const p = clamp((e.clientX - r.left) / Math.max(1, r.width), 0, 1);
      return { p: p, t: p * num(el.video.duration) };
    };
    el.seek.addEventListener("pointerdown", (e) => {
      if (!num(el.video.duration)) return;
      drag = true;
      dragging = true;
      try { el.seek.setPointerCapture(e.pointerId); } catch (err) {}
      el.fly.style.display = "block";
      const a = posOf(e);
      el.fly.style.left = a.p * 100 + "%";
      el.fly.textContent = fmtTime(a.t);
      paint(a.p, a.t, num(el.video.duration));
    });
    el.seek.addEventListener("pointermove", (e) => {
      const d = num(el.video.duration);
      if (!d) return;
      const a = posOf(e);
      el.fly.style.left = a.p * 100 + "%";
      el.fly.textContent = fmtTime(a.t);
      if (drag) paint(a.p, a.t, d);
    });
    const end = (e) => {
      if (!drag) return;
      drag = false;
      dragging = false;
      el.fly.style.display = "";
      const d = num(el.video.duration);
      const a = posOf(e);
      if (d) el.video.currentTime = clamp(a.t, 0, Math.max(0, d - 0.3));
      updateProgress();
      scheduleHide();
    };
    el.seek.addEventListener("pointerup", end);
    el.seek.addEventListener("pointercancel", () => {
      drag = false; dragging = false;
      el.fly.style.display = "";
      updateProgress();
    });
  }

  /* ---- 手势 ---- */
  function bindGesture() {
    const g = el.gesture;
    let g0 = null;

    g.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      const v = el.video;
      g0 = {
        x: e.clientX, y: e.clientY,
        pos: num(v.currentTime), vol: v.muted ? 0 : v.volume,
        w: g.clientWidth || 1, h: g.clientHeight || 1,
        dur: num(v.duration), rate: num(v.playbackRate, 1),
        moved: false, mode: "", target: null, baseDim: num(el.dim.style.opacity)
      };
      clearTimeout(hideTimer);
      longTimer = setTimeout(() => {
        if (!g0 || g0.moved) return;
        g0.mode = "rate";
        rateBefore = g0.rate;
        el.video.playbackRate = 2;
        showTip("2 倍速播放中 · 松手恢复", 0);
      }, 520);
      try { g.setPointerCapture(e.pointerId); } catch (err) {}
    });

    g.addEventListener("pointermove", (e) => {
      if (!g0) return;
      const dx = e.clientX - g0.x;
      const dy = e.clientY - g0.y;
      if (!g0.moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      clearTimeout(longTimer);
      if (g0.mode === "rate") return;
      g0.moved = true;
      if (!g0.mode) g0.mode = Math.abs(dx) > Math.abs(dy) ? "seek" : (g0.x < g0.w / 2 ? "bright" : "vol");

      if (g0.mode === "seek") {
        if (!g0.dur) return;
        const span = Math.min(g0.dur, 240);
        g0.target = clamp(g0.pos + (dx / g0.w) * span, 0, g0.dur);
        showTip(fmtTime(g0.target) + " / " + fmtTime(g0.dur), 0);
        el.fly.style.display = "block";
        el.fly.style.left = (g0.target / g0.dur * 100) + "%";
        el.fly.textContent = fmtTime(g0.target);
        paint(g0.target / g0.dur, g0.target, g0.dur);
      } else if (g0.mode === "vol") {
        const nv = clamp(g0.vol - dy / (g0.h * 0.72), 0, 1);
        el.video.volume = nv;
        el.video.muted = nv <= 0.01;
        showTip("音量 " + Math.round(nv * 100) + "%", 0);
      } else {
        const nb = clamp(0.72 + (dy / (g0.h * 0.72)) * 0.72, 0, 0.72);
        el.dim.style.opacity = String(nb);
        showTip("亮度 " + Math.round((1 - nb / 0.72) * 100) + "%", 0);
      }
    });

    const finish = (e, canceled) => {
      if (!g0) return;
      clearTimeout(longTimer);
      const st = g0;
      g0 = null;
      hideTip();
      el.fly.style.display = "";
      if (st.mode === "rate") { el.video.playbackRate = rateBefore || 1; return; }
      if (st.mode === "seek") {
        if (!canceled && st.target != null) el.video.currentTime = st.target;
        updateProgress();
        return;
      }
      if (st.mode) { updateProgress(); return; }
      if (canceled) return;

      // 未发生位移 → 单击 / 双击
      const now = Date.now();
      const x = e.clientX;
      if (now - lastTap < 300 && Math.abs(x - lastTapX) < 90) {
        clearTimeout(tapTimer);
        lastTap = 0;
        const dir = x < st.w / 2 ? -1 : 1;
        seekBy(dir * 10);
        showTip(dir < 0 ? "◀ 快退 10 秒" : "快进 10 秒 ▶", 700);
        return;
      }
      lastTap = now;
      lastTapX = x;
      tapTimer = setTimeout(toggleUI, 240);
    };
    g.addEventListener("pointerup", (e) => finish(e, false));
    g.addEventListener("pointercancel", (e) => finish(e, true));
  }

  return {
    open: open,
    close: close,
    retry: () => { hideMsg(); playEpisode(state.curEp, num(el.video.currentTime)); },
    jump: (i) => { closePanel(); playEpisode(i, 0); },
    reload: () => { closePanel(); playEpisode(state.curEp, num(el.video.currentTime)); },
    setRate: setRate,
    toggleDm: toggleDm,
    isActive: () => active,
    isInline: () => inline,
    park: () => unmountInline(),
    save: saveProgress,
    syncFav: () => { if (active) syncFav(); },
    /** 播放器面板内的交互统一入口 */
    panelAct(act, v, i) {
      if (act === "plEp") { closePanel(); playEpisode(i, 0); return; }
      if (act === "plRoute") {
        const routes = state.routes || [];
        if (!routes[i]) return;
        const epNum = (state.episodes[state.curEp] || {}).num;
        state.routeIdx = i;
        state.episodes = routes[i].episodes || [];
        const k = state.episodes.findIndex((e) => String(e.num) === String(epNum));
        state.curEp = k >= 0 ? k : 0;
        closePanel();
        toast("已切换到 " + (routes[i].name || "线路" + (i + 1)), 1400);
        playEpisode(state.curEp, 0);
        return;
      }
      if (act === "plRate") { setRate(v); return; }
      if (act === "plReload") { closePanel(); playEpisode(state.curEp, num(el.video.currentTime)); return; }
      if (act === "plFull") { closePanel(); toggleFs(); return; }
      if (act === "plDmToggle") { toggleDm(); return; }
      if (act === "plDmMore") { openPanel("dm"); return; }
      if (act === "pdmArea") { DM.set("area", num(v)); Dm.refresh(); refreshPanel(); return; }
      if (act === "pdmDelay") {
        DM.set("delay", clamp(num(DM.cfg.delay) + num(v), -10, 10));
        Dm.refresh();
        refreshPanel();
        return;
      }
      if (act === "pdmApiSave") {
        const inp = $("pdmApi");
        DM.api = inp ? String(inp.value || "").trim() : "";
        DM.save();
        toast(DM.api ? "已保存自定义接口" : "已恢复内置弹幕源", 1600);
        return;
      }
    }
  };
})();

/* ============================================================
 * 12. 弹幕引擎
 * ------------------------------------------------------------
 * 自绘方案：requestAnimationFrame 驱动轨道位移，弹幕按视频时间轴
 * 从池中发射；池 = 本机发送（localStorage）+ 远端匹配结果。
 * 远端接口采用 danmaku 社区通用形态：
 *   GET {base}/api/v2/search/episodes?anime=片名
 *   GET {base}/api/v2/bangumi/{animeId}
 *   GET {base}/api/v2/comment/{episodeId}?withRelated=true
 * 接口不可用时静默降级，仅显示本机弹幕。
 * ============================================================ */
const DM_API_BASE = "https://api.danmu.xqful.cn/87654321";

const Dm = (function () {
  const TOP_PAD = 44;       // 顶部控制条高度，弹幕从它下方开始排列
  let root = null;
  let enabled = true;
  let active = [];          // 屏上弹幕 {el,x,w,speed,lane}
  let pool = [];            // 待发射 {t,m,c}
  let pi = 0;               // 池指针
  let busy = [];            // 每条轨道上最后一条弹幕
  let lanes = 0;
  let laneH = 26;
  let raf = 0;
  let lastTs = 0;
  let lastT = -1;
  let key = "";
  let seq = 0;

  /* ---- 轨道与尺寸 ---- */
  function resize() {
    if (!root) return;
    const cfg = DM.cfg;
    laneH = Math.max(20, Math.round(num(cfg.size, 20) * 1.5));
    const h = root.clientHeight || 0;
    const ratio = cfg.area === 0 ? 0.25 : cfg.area === 1 ? 1 / 3 : cfg.area === 2 ? 2 / 3 : 1;
    const next = Math.max(1, Math.floor(Math.max(0, h * ratio - TOP_PAD) / laneH));
    if (next !== lanes) {
      lanes = next;
      busy = new Array(lanes).fill(null);
    }
    root.style.opacity = String(clamp(num(cfg.opacity, 0.85), 0.2, 1));
  }

  /* ---- 动画主循环 ---- */
  function loop(ts) {
    raf = requestAnimationFrame(loop);
    if (!root || !enabled) { lastTs = ts; return; }
    const v = $("plVideo");
    if (!v) return;
    const dt = lastTs ? Math.min(0.12, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    const t = num(v.currentTime);
    if (lastT >= 0 && Math.abs(t - lastT) > 1.5) resync(t);
    lastT = t;
    if (v.paused || v.seeking || !dt) return;
    move(dt);
    emit(t + num(DM.cfg.delay, 0));
  }
  function start() {
    if (raf) return;
    lastTs = 0;
    raf = requestAnimationFrame(loop);
  }
  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  /* ---- 单条弹幕 ---- */
  function pickLane() {
    const W = root.clientWidth || 360;
    for (let i = 0; i < lanes; i++) {
      const b = busy[i];
      if (!b || b.x + b.w < W - 14) return i;
    }
    return -1;
  }

  function spawn(it) {
    if (!root || !lanes) return;
    const lane = pickLane();
    if (lane < 0) return;                       // 轨道占满，丢弃避免重叠
    const cfg = DM.cfg;
    const size = num(cfg.size, 20);
    const d = document.createElement("div");
    d.className = "dm-item";
    d.textContent = String(it.m || "");
    d.style.fontSize = size + "px";
    if (it.c) d.style.color = it.c;
    d.style.top = TOP_PAD + lane * laneH + 4 + "px";
    const W = root.clientWidth || 360;
    d.style.transform = "translateX(" + W + "px)";
    root.appendChild(d);
    const w = d.offsetWidth || Math.min(W, String(it.m || "").length * size * 0.95);
    const item = { el: d, x: W, w: w, speed: num(cfg.speed, 120), lane: lane };
    d.style.transform = "translateX(" + item.x + "px)";
    active.push(item);
    busy[lane] = item;
  }

  function move(dt) {
    for (let i = active.length - 1; i >= 0; i--) {
      const it = active[i];
      it.x -= it.speed * dt;
      it.el.style.transform = "translateX(" + it.x + "px)";
      if (it.x + it.w < -10) {
        it.el.remove();
        if (busy[it.lane] === it) busy[it.lane] = null;
        active.splice(i, 1);
      }
    }
  }

  function emit(tt) {
    while (pi < pool.length && pool[pi].t <= tt) {
      const it = pool[pi++];
      if (tt - it.t > 6) continue;               // 过期太久的不再补发
      spawn(it);
    }
  }

  function clearActive() {
    active.forEach((it) => { try { it.el.remove(); } catch (e) {} });
    active = [];
    busy = new Array(lanes).fill(null);
  }

  function resync(t) {
    clearActive();
    pi = 0;
    while (pi < pool.length && pool[pi].t < t - 0.6) pi++;
  }

  /* ---- 生命周期 ---- */
  function attach(layer) {
    root = layer || null;
    if (!root) return;
    root.innerHTML = "";
    active = [];
    lanes = 0;
    resize();
    root.classList.toggle("hide", !enabled);
    start();
  }
  function detach() {
    stop();
    root = null;
    active = [];
    pool = [];
    pi = 0;
  }
  function clear() {
    clearActive();
    pi = 0;
    lastT = -1;
  }
  function setEnabled(v) {
    enabled = !!v;
    if (!root) return;
    root.classList.toggle("hide", !enabled);
    if (!enabled) clearActive();
  }
  function refresh() { resize(); }

  /* ---- 本机弹幕持久化 ---- */
  function readStore() {
    const all = lsGet(LS.dmLocal, null);
    return all && typeof all === "object" ? all : {};
  }
  function saveLocal(rec) {
    if (!key) return;
    const all = readStore();
    const arr = Array.isArray(all[key]) ? all[key] : [];
    arr.push(rec);
    if (arr.length > 300) arr.splice(0, arr.length - 300);
    all[key] = arr;
    const keys = Object.keys(all);
    if (keys.length > 80) keys.slice(0, keys.length - 80).forEach((k) => { delete all[k]; });
    lsSet(LS.dmLocal, all);
  }

  /* ---- 远端弹幕匹配 ---- */
  async function dmJSON(url) {
    const txt = await ProxyPool.text(url, {
      directTimeout: 6000,
      timeout: 8000,
      deadline: 9000,
      validate: isJSONText
    });
    if (!txt) throw new Error("无响应");
    return JSON.parse(cleanJSON(txt));
  }
  function parseComments(data) {
    const arr = (data && (data.comments || (data.data && data.data.comments))) || [];
    return arr.map((c) => {
      const p = String(c.p || "").split(",");
      const t = parseFloat(p[0]);
      const m = String(c.m || "").trim();
      if (!isFinite(t) || !m) return null;
      let color = "";
      if (p[2] && /^\d+$/.test(p[2])) {
        color = "#" + ("000000" + Number(p[2]).toString(16)).slice(-6);
        if (color === "#000000") color = "";
      }
      return { t: t, m: m, c: color };
    }).filter(Boolean).sort((a, b) => a.t - b.t);
  }

  async function loadRemote(vod, ep) {
    const name = String((vod && vod.name) || "").trim();
    if (!name) return [];
    const ck = "dj_dm_ep_" + hashStr(name + "|" + ((ep && ep.title) || ""));
    const cached = lsGet(ck, null);
    if (cached && Array.isArray(cached.list)) return cached.list;

    const bases = DM.api ? [String(DM.api).replace(/\/+$/, "")] : [DM_API_BASE];
    for (const base of bases) {
      try {
        const s = await dmJSON(base + "/api/v2/search/episodes?anime=" + encodeURIComponent(name));
        const animes = (s && s.animes) || [];
        if (!animes.length) continue;
        const aid = animes[0].animeId;
        const want = String(ep && ep.num != null ? ep.num : 1);
        let epId = "";
        const eps = s.episodes || [];
        const hit = eps.find((e) => String(e.episodeNumber) === want && String(e.animeId) === String(aid))
          || eps.find((e) => String(e.episodeNumber) === want)
          || eps[0];
        if (hit) epId = String(hit.episodeId || "");
        if (!epId) {
          const bg = await dmJSON(base + "/api/v2/bangumi/" + encodeURIComponent(aid));
          const list = (bg && ((bg.bangumi && bg.bangumi.episodes) || bg.episodes)) || [];
          const h2 = list.find((e) => String(e.episodeNumber) === want) || list[0];
          if (h2) epId = String(h2.episodeId || "");
        }
        if (!epId) continue;
        const cm = await dmJSON(base + "/api/v2/comment/" + encodeURIComponent(epId) + "?withRelated=true&chConvert=0");
        const list = parseComments(cm);
        if (list.length) {
          lsSet(ck, { list: list });
          return list;
        }
      } catch (e) { /* 单个源失败继续下一个 */ }
    }
    return [];
  }

  /* ---- 装载某一集 ---- */
  function load(vod, ep, siteId) {
    key = [siteId || "", (vod && vod.id) || "", ep ? (ep.num != null ? ep.num : ep.title) : ""].join("|");
    clear();
    const local = readStore()[key];
    pool = Array.isArray(local)
      ? local.map((x) => ({ t: num(x.t), m: String(x.m || ""), c: x.c || "" })).filter((x) => x.m)
      : [];
    pool.sort((a, b) => a.t - b.t);
    const my = ++seq;
    loadRemote(vod, ep).then((list) => {
      if (my !== seq || !list || !list.length) return;
      pool = pool.concat(list).sort((a, b) => a.t - b.t);
      resync(num(($("plVideo") || {}).currentTime));
    }).catch(() => {});
  }

  /* ---- 发送 ---- */
  function send(text) {
    const t = num(($("plVideo") || {}).currentTime);
    const rec = { t: Math.round(t * 10) / 10, m: text, c: "" };
    spawn({ m: text, c: "" });
    saveLocal(rec);
    pool.push({ t: rec.t, m: text, c: "" });
    pool.sort((a, b) => a.t - b.t);
    toast("弹幕已发送", 1000);
  }

  return {
    attach: attach,
    detach: detach,
    clear: clear,
    load: load,
    send: send,
    setEnabled: setEnabled,
    resize: resize,
    refresh: refresh,
    isEnabled: () => enabled
  };
})();

/* ============================================================
 * 13. 全局事件委托
 * ------------------------------------------------------------
 * 所有动态生成的节点只带 data-act，不在渲染时绑定函数；
 * 统一由 document 上的一个监听器分发，避免内存泄漏与重复绑定。
 * ============================================================ */
function navTo(id) {
  // 离开设置页就退出采集源编辑态，下次回来是干净的新增表单（未保存的修改随之丢弃）
  if (id !== "settings") state.cmsEdit = "";
  if (id === "home") goHome();
  else if (id === "rank") goRank();
  else if (id === "fav") goFav();
  else if (id === "hist") goHist();
  else if (id === "settings") goSettings();
}

/** 跨站源打开前先静默切换站源 */
function ensureSite(id) {
  if (!id || id === state.site) return true;
  const site = getSite(id);
  if (!site) { toast("该站源已不存在", 1600); return false; }
  resetViewState();
  state.site = id;
  try { localStorage.setItem(LS.site, id); } catch (e) {}
  if (site.warm) { try { site.warm(); } catch (e) {} }
  renderNav();
  ensureCats();
  return true;
}

function openItem(src, i) {
  if (src === "hero") {
    const v = (state.home.hero || [])[i];
    if (v) openDetail(v, { from: "home" });
    return;
  }
  if (src === "rank") {
    const v = (state.rank.items || [])[i];
    if (v) openDetail(v, { from: "rank" });
    return;
  }
  if (src === "fav") { openFavItem(i); return; }
  if (src === "hist") { openHistItem(i); return; }
  const v = (state.list.items || [])[i];
  if (v) openDetail(v, { from: "list" });
}

function openFavItem(i) {
  const rec = (state.favList || Fav.all())[i];
  if (!rec) return;
  if (!ensureSite(rec.site)) return;
  openDetail(makeVod({ id: rec.id, name: rec.name, pic: rec.pic, remark: rec.remark, tags: rec.tags }), { from: "fav" });
}

function openHistItem(i) {
  const list = state.mode === "hist" ? (state.histList || Hist.all()) : Hist.of(state.site).slice(0, 8);
  const rec = list[i];
  if (!rec) return;
  if (!ensureSite(rec.site)) return;
  openDetail(makeVod({ id: rec.id, name: rec.name, pic: rec.pic, remark: rec.remark }),
    { from: state.mode === "hist" ? "hist" : "home", resume: { ep: rec.ep, pos: rec.pos } });
}

function delFavItem(i) {
  const rec = (state.favList || [])[i];
  if (!rec) return;
  Fav.remove(rec.id, rec.site);
  renderFav();
  renderNav();
  toast("已取消收藏", 1200);
}
function delHistItem(i) {
  const rec = (state.histList || [])[i];
  if (!rec) return;
  Hist.remove(rec.id, rec.site);
  renderHist();
  renderNav();
  toast("已删除该记录", 1200);
}
function clearFavList() {
  const scope = state.favSite;
  if (!confirm(scope === "all" ? "清空全部收藏？此操作不可恢复。" : "清空该站源的收藏？")) return;
  Fav.clear(scope === "all" ? null : scope);
  state.favSite = "all";
  renderFav();
  renderNav();
  toast("已清空收藏", 1200);
}
function clearHistList() {
  const scope = state.histSite;
  if (!confirm(scope === "all" ? "清空全部观看历史？" : "清空该站源的历史记录？")) return;
  Hist.clear(scope === "all" ? null : scope);
  state.histSite = "all";
  renderHist();
  renderNav();
  toast("已清空历史", 1200);
}

function goPage(p) {
  p = Math.max(1, num(p, 1));
  if (state.mode === "list") {
    if (p === state.list.page) return;
    state.list.page = p;
    listTop();
    loadList();
    return;
  }
  if (state.mode === "rank") {
    const r = state.rank;
    if (p === r.page) return;
    r.page = p;
    progress(true);
    currentSite().api.rank({ tab: r.tab, page: p }).then((d) => {
      if (state.mode !== "rank" || !d || !d.items) return;
      r.items = d.items;
      r.rows = !!d.rows;
      r.pages = num(d.pages, 1);
      renderRank();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }).catch(() => toast("加载失败", 1400))
      .finally(() => progress(false));
  }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", cur);
  try { localStorage.setItem(LS.theme, cur); } catch (e) {}
  syncThemeMeta();
  if (state.mode === "settings") renderSettings();
  toast(cur === "dark" ? "已切换到深色主题" : "已切换到浅色主题", 1200);
}
function syncThemeMeta() {
  const m = document.querySelector('meta[name="theme-color"]');
  if (!m) return;
  const light = document.documentElement.getAttribute("data-theme") === "light";
  m.setAttribute("content", light ? "#f4f5f8" : "#0b0b0d");
}

/** 播放器面板内的动作前缀 */
const PANEL_ACTS = {
  plEp: 1, plRoute: 1, plRate: 1, plReload: 1, plFull: 1, plDmToggle: 1, plDmMore: 1,
  pdmArea: 1, pdmDelay: 1, pdmApiSave: 1
};

function onDocClick(e) {
  const t = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!t) return;
  const act = t.getAttribute("data-act");
  if (!act) return;

  // 播放器动态面板
  if (PANEL_ACTS[act]) {
    Player.panelAct(act, t.getAttribute("data-v"), num(t.getAttribute("data-i"), 0));
    return;
  }

  const rawI = t.getAttribute("data-i");
  const i = rawI == null ? 0 : num(rawI);
  const id = t.getAttribute("data-id") || "";
  const vAttr = t.getAttribute("data-v");
  const kw = t.getAttribute("data-kw") || "";

  switch (act) {
    /* --- 导航 --- */
    case "nav": navTo(id); break;
    case "cat": closeDrawer(); pickParent(id); break;
    case "backHome": goHome(); break;

    /* --- 站源 --- */
    case "openSheet": openSitePicker(); break;
    case "setSite": setSite(id); break;

    /* --- 首页 --- */
    case "open": openItem(t.getAttribute("data-src") || "list", i); break;
    case "openMod": {
      const m = (state.home.modules || [])[num(t.getAttribute("data-m"), 0)];
      const v = m && m.list ? m.list[i] : null;
      if (v) openDetail(v, { from: "home" });
      break;
    }
    case "modMore": {
      const m = (state.home.modules || [])[i];
      if (!m || !m.open) break;
      goList({ parent: m.open.parent, sel: m.open.sel, sort: m.open.sort, title: m.title });
      break;
    }
    case "openHist": openHistItem(i); break;
    case "openRank": {
      const v = (state.rank.items || [])[i];
      if (v) openDetail(v, { from: "rank" });
      break;
    }
    case "dot": {
      const sc = $("heroScroll");
      const card = sc && sc.querySelector(".hero-card");
      if (sc && card) {
        const total = (state.home.hero || []).length || 1;
        const w = card.offsetWidth + 14;
        const inClone = Math.round(sc.scrollLeft / w) >= total;
        sc.scrollTo({ left: (inClone ? total : 0) + i * w, behavior: "smooth" });
      }
      break;
    }
    case "reloadHome": loadHome(true); break;

    /* --- 列表 --- */
    case "pickChild": pickChild(id); break;
    case "pickSort": pickSort(id); break;
    case "subcat": {
      const slug = t.getAttribute("data-slug") || "";
      if ((state.list.sub || "") === slug) break;
      state.list.sub = slug;
      state.list.page = 1;
      state.list.pages = 1;
      // 先就地切高亮，点击立刻有反馈；数据到了 renderList 会整体重绘
      const box = t.parentNode;
      if (box && box.querySelectorAll) {
        box.querySelectorAll(".subtab").forEach((x) => x.classList.toggle("on", x === t));
      }
      listTop();               // 换了子栏目就从头看，别停在上一栏的滚动位置
      loadList();
      break;
    }
    case "clearSel":
      state.list.sel = [];
      state.list.page = 1;
      listTop();
      loadList();
      break;
    case "page": goPage(num(t.getAttribute("data-p"), 1)); break;
    case "moreList": loadList({ append: true }); break;
    case "reloadList": loadList(); break;
    case "reloadRank": loadRank(); break;
    case "rankTab":
      state.rank.tab = id;
      state.rank.page = 1;
      loadRank();
      break;

    /* --- 搜索 --- */
    case "searchChip": doSearch(kw); break;
    /* 卡片 / 轮播 / 榜单 / 详情页上的标签：进入该站点的标签页 */
    case "tagOpen": goTag(kw, t.getAttribute("data-slug") || ""); break;
    case "delKeyword": SearchLog.remove(kw); renderSearchHist(); break;

    /* --- 黄果栏目：专题合集 / 吃瓜文章 --- */
    case "openTopic": {
      const tv = (state.list.items || [])[i];
      if (tv) openTopic(tv.id, tv.name);
      break;
    }
    case "openPost": {
      const pv = (state.list.items || [])[i];
      if (pv) openPost(pv.id);
      break;
    }
    case "openRelPost": openPost(id); break;
    case "openPostVideo": openDetail({ id: id, name: t.getAttribute("data-name") || "" }, { from: "post" }); break;
    case "backPost": if (Date.now() - viewAt >= 400) backToList(); break;
    case "retryPost": openPost(state.postId); break;

    /* --- 详情 --- */
    case "backDetail": backDetail(); break;
    case "retryDetail":
      if (state.detail) openDetail(state.detail, { from: state.backTo });
      break;
    case "playDetail": startPlay(state.curEp); break;
    case "playEp": startPlay(i); break;
    case "pickRoute": pickRoute(i); break;
    case "toggleFav": toggleDetailFav(); break;

    /* --- 收藏 / 历史 --- */
    case "delFav": delFavItem(i); break;
    case "delHist": delHistItem(i); break;
    case "favSite": state.favSite = id; renderFav(); break;
    case "histSite": state.histSite = id; renderHist(); break;
    case "clearFav": clearFavList(); break;
    case "clearHist": clearHistList(); break;
    case "clearFavAll":
      if (!confirm("清空全部站源的收藏？")) return;
      Fav.clear(null);
      renderSettings();
      renderNav();
      toast("已清空全部收藏", 1400);
      break;
    case "clearHistAll":
      if (!confirm("清空全部站源的观看历史？")) return;
      Hist.clear(null);
      renderSettings();
      renderNav();
      toast("已清空全部历史", 1400);
      break;
    case "clearSearch":
      SearchLog.clear();
      renderSearchHist();
      renderSettings();
      toast("已清空搜索记录", 1400);
      break;

    /* --- 设置：主题 / 代理 / 采集源 --- */
    case "theme": toggleTheme(); break;
    /* --- 设置：功能开关 --- */
    case "heroAutoToggle":
      Prefs.set("heroAuto", !Prefs.d.heroAuto);
      renderSettings();
      if (state.mode === "home") bindHero();          // 首页可见时即时生效
      toast(Prefs.d.heroAuto ? "已开启轮播自动播放" : "已关闭轮播自动播放", 1400);
      break;
    case "pageModeToggle":
      Prefs.set("pageMode", Prefs.autoPage() ? "pager" : "auto");
      renderSettings();
      toast(Prefs.autoPage() ? "列表已改为触底自动加载" : "列表已改为页码切换", 1600);
      break;
    case "proxyAdd": proxyAdd(); break;
    case "proxyTest": proxyTest(t.getAttribute("data-url")); break;
    case "proxyTestAll": proxyTestAll(); break;
    case "proxyDel": proxyDel(t.getAttribute("data-url")); break;
    case "proxyLearn": ProxyPool._win = null; toast("已清空代理学习结果，将重新竞速择优", 2000); break;
    case "cmsAdd": cmsAdd(); break;
    case "cmsEdit": cmsEdit(id); break;
    case "cmsSave": cmsSave(); break;
    case "cmsCancel": cmsCancel(); break;
    case "cmsBatch": cmsBatch(); break;
    case "cmsDel": cmsDel(id); break;
    case "cmsTest": cmsTest(id); break;
    case "cmsRestore": cmsRestore(); break;

    /* --- 设置：弹幕 / 数据 --- */
    case "dmToggle":
      DM.set("enabled", !DM.cfg.enabled);
      Dm.setEnabled(!!DM.cfg.enabled);
      renderSettings();
      break;
    case "dmArea":
      DM.set("area", num(vAttr));
      Dm.refresh();
      renderSettings();
      break;
    case "dmDelay":
      DM.set("delay", clamp(num(DM.cfg.delay) + num(vAttr), -10, 10));
      Dm.refresh();
      renderSettings();
      break;
    case "dmApiSave": {
      const inp = $("dmApi");
      DM.api = inp ? String(inp.value || "").trim() : "";
      DM.save();
      toast(DM.api ? "已保存自定义弹幕接口" : "已恢复内置弹幕源", 1600);
      break;
    }
    case "exportData": exportData(); break;
    case "importData": importData(); break;
    case "clearCache": clearCache(); break;
    case "resetAll": resetAll(); break;

    /* --- 播放器 --- */
    case "plRetry": Player.retry(); break;
    case "plBackDetail": Player.close(); break;

    default: break;
  }
}

function onDocKey(e) {
  const t = e.target;
  if (t && t.id === "pgInput" && e.key === "Enter") {
    e.preventDefault();
    goPage(num(t.value, 1));
    return;
  }
  if (t && t.id === "wd" && e.key === "Enter") {
    e.preventDefault();
    doSearch();
    return;
  }
  if (e.key === "Escape") {
    const panel = $("plPanel");
    if (panel && panel.classList.contains("show")) { $("plpClose").click(); return; }
    if (Player.isActive()) { Player.close(); return; }
    if ($("sheet").classList.contains("show")) { closeSheet(); return; }
    if ($("drawer").classList.contains("show")) { closeDrawer(); return; }
    if ($("searchPop").classList.contains("show")) { closeSearch(); return; }
    return;
  }
  // 播放器快捷键（仅在播放器激活时生效）
  if (!Player.isActive()) return;
  if (e.key === " " || e.code === "Space") {
    if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) return;
    e.preventDefault();
    const v = $("plVideo");
    if (v) { if (v.paused) v.play().catch(() => {}); else v.pause(); }
  } else if (e.key === "ArrowLeft") {
    const v = $("plVideo");
    if (v) v.currentTime = Math.max(0, num(v.currentTime) - 10);
  } else if (e.key === "ArrowRight") {
    const v = $("plVideo");
    if (v && num(v.duration)) v.currentTime = Math.min(num(v.duration) - 0.3, num(v.currentTime) + 10);
  } else if (e.key === "f" || e.key === "F") {
    $("plFs").click();
  }
}

/** 从被点的卡片反推它对应的作品对象（与 openItem / openMod 的取数口径保持一致） */
function itemFromCardEl(el) {
  if (!el) return null;
  const act = el.getAttribute("data-act");
  const i = num(el.getAttribute("data-i"), 0);
  if (act === "openMod") {
    const m = (state.home.modules || [])[num(el.getAttribute("data-m"), 0)];
    return m && m.list ? m.list[i] : null;
  }
  if (act !== "open" && act !== "openRank" && act !== "openFav" && act !== "openHist") return null;
  const src = act === "open" ? (el.getAttribute("data-src") || "list") : act.replace("open", "").toLowerCase();
  if (src === "hero") return (state.home.hero || [])[i] || null;
  if (src === "rank") return (state.rank.items || [])[i] || null;
  if (src === "fav") return (state.favList || Fav.all())[i] || null;
  if (src === "hist") return (state.histList || Hist.all())[i] || null;
  return (state.list.items || [])[i] || null;
}

/**
 * 切源预热：指针刚落到站源卡片上，就先把那一站的首页数据拉回来。
 * 真正点下去时数据已在缓存里，几乎立刻出画面。
 */
const SiteWarm = (function () {
  const busy = new Set();
  return function (site) {
    if (!site || busy.has(site.id)) return;
    const hit = HomeCache.get(site.id);
    if (hit && hit.fresh) return;
    busy.add(site.id);
    const done = () => busy.delete(site.id);
    // 只热首页。分类不阻塞首屏（goHome 里是 ensureCats().then(renderNav)），
    // 之前把 cats 和 home 一起发，等于切源瞬间两个请求抢同一条窄通道。
    Promise.resolve()
      .then(() => site.api.home())
      .then((d) => {
        if (!d || d.error || ((!d.modules || !d.modules.length) && !(d.hero || []).length)) return;
        HomeCache.set(site.id, { hero: (d.hero || []).slice(0, 6), modules: d.modules || [] });
      })
      .catch(() => {})
      .then(done);
  };
})();

function bindGlobal() {
  document.addEventListener("click", onDocClick, false);
  document.addEventListener("keydown", onDocKey, false);
  // 详情预取：按下（触摸/鼠标）即开始请求；桌面端悬停 120ms 后请求
  const canPrefetch = (el) => !!el && el.getAttribute("data-act") !== "dot";
  document.addEventListener("pointerdown", (e) => {
    const t = e.target && e.target.closest ? e.target : null;
    if (!t) return;
    const siteEl = t.closest('[data-act="setSite"]');
    if (siteEl) SiteWarm(getSite(siteEl.getAttribute("data-id")));
    const el = t.closest('[data-act="open"],[data-act="openMod"],[data-act="openRank"]');
    if (canPrefetch(el)) prefetchDetail(itemFromCardEl(el));
  }, { passive: true, capture: true });
  let hoverT = 0;
  document.addEventListener("pointerover", (e) => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    const t = e.target && e.target.closest ? e.target : null;
    if (!t) return;
    const siteEl = t.closest('[data-act="setSite"]');
    if (siteEl) {
      clearTimeout(hoverT);
      hoverT = setTimeout(() => SiteWarm(getSite(siteEl.getAttribute("data-id"))), 80);
      return;
    }
    const el = t.closest('[data-act="open"],[data-act="openMod"]');
    if (!el) return;
    clearTimeout(hoverT);
    hoverT = setTimeout(() => prefetchDetail(itemFromCardEl(el)), 120);
  }, { passive: true });
}

/* ============================================================
 * 14. 页面外壳绑定 / 启动
 * ============================================================ */
function bindChrome() {
  $("menuBtn").onclick = () => openDrawer();
  $("brand").onclick = () => openSitePicker();
  $("searchBtn").onclick = () => openSearch();
  $("themeBtn").onclick = () => toggleTheme();
  $("drawerClose").onclick = () => closeDrawer();
  $("drawerMask").onclick = () => closeDrawer();
  $("sheetMask").onclick = () => closeSheet();
  $("searchMask").onclick = () => closeSearch();
  $("searchCancel").onclick = () => closeSearch();
  $("searchGo").onclick = () => doSearch();
  $("backTop").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

  const file = $("importFile");
  if (file) file.onchange = () => {
    const f = file.files && file.files[0];
    file.value = "";
    if (f) handleImportFile(f);
  };
}

/** 把页头实际高度写进 --hd-h：吸顶筛选条据此贴在页头下沿，页头变高变矮都跟得上 */
function syncHdHeight() {
  const hd = document.querySelector(".hd");
  if (!hd) return;
  const h = Math.round(hd.offsetHeight);
  document.documentElement.style.setProperty("--hd-h", h + "px");
}

function onScroll() {
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  const btn = $("backTop");
  if (btn) btn.classList.toggle("show", y > 420);
  // 页头吸顶后加投影，让正文从下面穿过时有明确分界
  const hd = document.querySelector(".hd");
  if (hd) hd.classList.toggle("scrolled", y > 8);
  // 吸顶筛选条贴住页头时补一条分隔线和投影
  const sc = document.querySelector(".stickycat");
  if (sc) sc.classList.toggle("stuck", sc.getBoundingClientRect().top <= (hd ? hd.offsetHeight : 0) + 1);
}

function init() {
  // 主题：默认浅色，用户手动切换后按本地记录恢复
  let theme = "light";
  try { theme = localStorage.getItem(LS.theme) || "light"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
  syncThemeMeta();

  // 站源（配置可能因采集源被删而失效）
  let sid = "hg";
  try { sid = localStorage.getItem(LS.site) || "hg"; } catch (e) {}
  // 采集源可能被删或被整批替换：解析不到同一个 id 就回落到首页
  if (sid !== "hg" && getSite(sid).id !== sid) sid = "hg";
  state.site = sid;

  try { SegNet.load(); } catch (e) {}       // 上次记住的分片通道，起播时少试一遍
  bindGlobal();
  bindChrome();
  renderNav();
  goHome();
  // 首屏之后静默刷新黄果域名清单（不阻塞渲染；6h 内只跑一次）
  setTimeout(() => {
    const s = currentSite();
    if (s && s.warm) { try { s.warm(); } catch (e) {} }
  }, 2500);

  window.addEventListener("scroll", onScroll, { passive: true });
  syncHdHeight();
  onScroll();
  // 页头高度随页面（有无分类条）变化，实时同步给吸顶筛选条
  window.addEventListener("resize", syncHdHeight);
  if (typeof ResizeObserver !== "undefined") {
    const hdEl = document.querySelector(".hd");
    if (hdEl) new ResizeObserver(syncHdHeight).observe(hdEl);
  }

  // 离开页面 / 切后台时保存播放进度
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && Player.isActive()) Player.save();
  });
  window.addEventListener("pagehide", () => {
    if (Player.isActive()) Player.save();
  });

  // 首屏提示
  setTimeout(() => {
    if (!navigator.onLine) toast("当前处于离线状态，部分内容可能无法加载", 2200);
  }, 1200);
}

init();
