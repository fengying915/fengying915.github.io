// 代理地址，不要直接访问api.github.com
const API_PROXY_PREFIX = "https://api.github.com";
// 如果你遇到403限流，替换为第三方代理： const API_PROXY_PREFIX = "https://ghapi.huchen.dev";

function formatBytes(bytes){
    const mb=(bytes/1024/1024).toFixed(1);
    return mb+" MB";
}

function timeAgo(dateString) {
    const now = Date.now();
    const then = new Date(dateString).getTime();
    const diffMs = now - then;
    const diffDays = Math.floor(diffMs / 86400000);
    const diffHours = Math.floor(diffMs / 3600000);
    if(diffDays > 30) return `${Math.floor(diffDays/30)} 个月前`;
    if(diffDays > 0) return `${diffDays} 天前`;
    return `${diffHours} 小时前`;
}

function renderCard(item){
    const mdHtml = marked.parse(item.body||"");
    let warnDom = item.warn ? `<div class="my-2 text-site-danger font-medium">${item.warn}</div>` : "";
    let assetHtml = "";
    (item.assets||[]).forEach(a=>{
        assetHtml += `
        <div class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1">
            <span class="text-sm">${a.name} ${formatBytes(a.size)}</span>
            <a href="${a.browser_download_url}" target="_blank" class="bg-site-primary text-white px-3 py-1 rounded-md text-sm hover:bg-blue-700">下载 (${a.download_count} 次)</a>
        </div>`
    })
    return `
<div class="bg-site-cardBg dark:bg-site-cardBgDark rounded-xl p-5 mb-6 shadow-sm">
    <div class="flex items-center gap-2 text-xl font-semibold mb-3">
        ${item.title}
        ${item.isBeta?'<span class="bg-site-beta text-white text-xs px-2 py-0.5 rounded">beta</span>':''}
    </div>
    <div class="text-sm text-gray-700 dark:text-gray-200 whitespace-pre-wrap mb-2">${item.desc}</div>
    ${warnDom}
    <div class="text-sm text-gray-500 dark:text-gray-400">版本${item.version} | 发布${item.publishAgo}</div>
    <div class="text-sm text-gray-500 dark:text-gray-400">仓库：<a href="https://github.com/${item.repo}" target="_blank" class="text-site-primary underline">${item.repo}</a></div>
    <h3 class="mt-4 mb-2 pl-3 border-l-4 border-site-primary text-base font-semibold">更新日志</h3>
    <div class="bg-gray-100 dark:bg-gray-700 p-3 rounded-md text-sm md-body">${mdHtml}</div>
    <div class="mt-3">${assetHtml}</div>
</div>`;
}

// 渲染整套列表
function renderList(data){
    const app = document.getElementById("app");
    let html = "";
    data.forEach(i=> html += renderCard(i));
    app.innerHTML = html;
    document.querySelector("#lastUpdate").innerText = `最后更新: ${new Date().toLocaleString('zh-CN')}`;
}

// 拉取单仓库release
async function fetchRelease(repo){
    const url = `${API_PROXY_PREFIX}/repos/${repo}/releases/latest`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`http ${res.status}`);
    return await res.json();
}

// 主逻辑：线上优先拉取，出错直接渲染快照兜底
async function main(){
    try{
        const list = [];
        for(const cfg of reposConfig){
            const rel = await fetchRelease(cfg.repo);
            list.push({
                title:cfg.title,
                isBeta:cfg.isBeta,
                repo:cfg.repo,
                version:rel.tag_name,
                publishAgo: timeAgo(rel.published_at),
                desc:cfg.desc,
                warn:cfg.warn,
                body: rel.body,
                assets: rel.assets.map(as=>({
                    name:as.name,
                    size:as.size,
                    download_count:as.download_count,
                    browser_download_url: as.browser_download_url
                }))
            })
        }
        renderList(list);
    }catch(err){
        console.warn("GitHub API拉取失败，使用静态快照兜底：",err);
        renderList(snapshotData);
    }
}

document.getElementById("toggleDark").addEventListener("click",()=>{
    document.documentElement.classList.toggle("dark");
})

main();
</script>
