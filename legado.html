<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读系列版本下载页</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --cream-2:#6b7280;
            --accent-teal:#0d9488;
            --border:#e5e7eb;
            --shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg:#111827;
            --card-bg:#1f2937;
            --text-main:#f3f4f6;
            --text-secondary:#d1d5db;
            --cream-2:#9ca3af;
            --accent-teal:#2dd4bf;
            --border:#374151;
            --shadow:0 4px 16px rgba(0,0,0,0.35);
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
            background:var(--bg);
            color:var(--text-main);
            min-height:100vh;
            padding:24px 16px;
            position:relative;
            overflow-x:hidden;
        }
        #particles{
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:0;
            overflow:hidden;
        }
        .particle{
            position:absolute;
            width:2px;height:2px;
            background:rgba(13,148,136,0.25);
            border-radius:50%;
            animation:floatUp linear infinite;
        }
        @keyframes floatUp{
            0%{transform:translateY(0);opacity:0;}
            10%{opacity:1;}
            90%{opacity:1;}
            100%{transform:translateY(-110vh);opacity:0;}
        }
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(14px);}
            to{opacity:1;transform:translateY(0);}
        }
        .container{
            max-width:920px;
            margin:0 auto;
            position:relative;
            z-index:1;
        }
        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:28px;
        }
        .page-title{font-size:26px;font-weight:600;}
        .header-right{display:flex;gap:12px;align-items:center;}
        .toggle-wrap{display:flex;align-items:center;gap:6px;font-size:14px;}
        button{
            padding:8px 14px;
            border:1px solid var(--border);
            background:var(--card-bg);
            color:var(--text-main);
            border-radius:8px;
            cursor:pointer;
        }
        button:hover{background:var(--border);}
        #versions-container{
            display:flex;
            flex-direction:column;
            gap:18px;
        }
        .version-card{
            background:var(--card-bg);
            border-radius:14px;
            box-shadow:var(--shadow);
            overflow:hidden;
            border:1px solid var(--border);
        }
        .error-card{border-left:4px solid #ef4444;}
        .version-header{
            padding:18px 22px;
            cursor:pointer;
        }
        .version-name{font-size:18px;margin-bottom:6px;}
        .version-description{color:var(--text-secondary);font-size:14px;line-height:1.5;}
        .expand-icon{font-size:18px;color:var(--cream-2);}
        .version-content.collapsed{max-height:0;overflow:hidden;transition:max-height 0.32s ease;}
        .version-content.expanded{max-height:3000px;overflow:auto;transition:max-height 0.45s ease;}
        .version-info{padding:0 22px 14px;display:flex;flex-direction:column;gap:8px;}
        .info-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .info-label{font-weight:500;font-size:14px;min-width:86px;color:var(--text-secondary);}
        .version-number{font-weight:600;font-size:15px;}
        .changelog-section{padding:0 22px 14px;}
        .changelog-title{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
        .changelog-content{
            font-size:14px;
            line-height:1.6;
            color:var(--text-secondary);
            border-radius:8px;
            padding:10px 12px;
            background:rgba(13,148,136,0.06);
        }
        .changelog-content pre{overflow-x:auto;}
        .assets-section{padding:0 22px 20px;display:flex;flex-direction:column;gap:10px;}
        .asset-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid var(--border);
            border-radius:10px;
            padding:12px 14px;
            gap:12px;
            flex-wrap:wrap;
        }
        .asset-info{display:flex;flex-direction:column;gap:3px;}
        .asset-name{font-size:14px;font-weight:500;}
        .asset-size{font-size:12px;color:var(--cream-2);}
        .download-btn{
            white-space:nowrap;
            padding:7px 14px;
            background:var(--accent-teal);
            color:#fff;
            border-radius:8px;
            text-decoration:none;
            font-size:14px;
        }
        .download-btn:hover{opacity:0.88;}
        .footer-note{margin-top:30px;font-size:13px;color:var(--cream-2);text-align:center;}
    </style>
</head>
<body>
<div id="particles"></div>
<div class="container">
    <div class="page-header">
        <h1 class="page-title">阅读系列版本下载</h1>
        <div class="header-right">
            <label class="toggle-wrap">
                <input type="checkbox" id="proxySwitch" checked>
                GHProxy加速下载
            </label>
            <button id="themeToggle"><i class="fa fa-moon-o"></i> 切换主题</button>
        </div>
    </div>

    <div id="versions-container"></div>

    <div class="footer-note">
        数据来自 GitHub API · <span id="lastUpdate"></span>
    </div>
</div>

<script>
// 生成粒子
const particleBox = document.getElementById('particles');
for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + '%';
    p.style.bottom = '-10px';
    const sz = 1 + Math.random()*3;
    p.style.width = sz+'px';
    p.style.height = sz+'px';
    p.style.animationDelay = Math.random()*15+'s';
    p.style.animationDuration = 14 + Math.random()*8+'s';
    particleBox.appendChild(p);
}

// 折叠卡片
function toggleVersion(idx){
    const content = document.getElementById('versionContent-'+idx);
    const icon = document.getElementById('expandIcon-'+idx);
    if(!content || !icon) return;
    if(content.classList.contains('expanded')){
        content.classList.remove('expanded');
        content.classList.add('collapsed');
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
    }else{
        content.classList.remove('collapsed');
        content.classList.add('expanded');
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
    }
}

// 主题切换
const themeBtn = document.getElementById('themeToggle');
themeBtn.onclick = function(){
    const body = document.body;
    body.dataset.theme = body.dataset.theme === 'light' ? 'dark' : 'light';
};

// ========== 仓库配置 ==========
const repoConfigList = [
    {
        title:"🚩阅读 R",
        desc:"体验最好！阅读 R 继承自 Rimchars 维护的 阅读Archive，基于 Legado/lyc 分支开发，延续了 Legado 的开源阅读体验，并进一步增强了界面、AI、EPUB、漫画、视频和主题等功能。",
        owner:"refgd", repo:"legado",
        defaultExpand:false
    },
    {
        title:"🚩阅读 Sigma",
        desc:"阅读Sigma是gedoor/legado的一个分支版本，在原有基础上增加更多功能，为书源带来更多可能性。",
        owner:"Luoyacheng", repo:"legado",
        defaultExpand:true
    },
    {
        title:"🚩阅读 MAX",
        desc:"本项目基于 lyc版 持续开发，在此基础上有更多功能优化 appLegacy版：包名 io.legado.app，与原版相同，可覆盖更新 appMax版：包名 io.legado.app.yuedu，共存包名，不会覆盖原版 appS版：包名 io.legado.app.yuedu.a，另一个共存包名",
        owner:"Suml-1", repo:"Legado_Max",
        defaultExpand:false
    },
    {
        title:"🚩阅读 MD3",
        desc:"采用 Material Design 3 风格重新设计的界面版，本项目在对 UI 进行重绘的基础上，加入了多项分支独有功能，并正在逐步从传统 View 迁移至 Jetpack Compose 框架，目标是提供更加现代、流畅且一致的阅读体验。",
        owner:"HapeLee", repo:"legado-with-MD3",
        defaultExpand:true
    },
    {
        title:"🚩轻悦时光",
        desc:"轻悦时光全平台都可用,不需要后端服务器支持,不支持阅读书源,有自己的书源",
        owner:"autobcb", repo:"qysg",
        defaultExpand:true
    },
    {
        title:"🚩轻阅读",
        desc:"后端，需要自己部署，部署后可以绑定轻悦时光/栖阅，测试地址：https://qyd.gyks.cf",
        owner:"autobcb", repo:"read",
        defaultExpand:true
    }
];

const DEV_CORS_PROXY = "";
// const DEV_CORS_PROXY = "https://cors-anywhere.herokuapp.com/";

function getDownloadUrl(originUrl){
    const proxySwitch = document.getElementById('proxySwitch');
    if(proxySwitch.checked){
        return "https://mirror.ghproxy.com/"+originUrl;
    }else{
        return originUrl;
    }
}

/**
 * 获取release：过滤draft草稿，保留prerelease预发布
 */
async function fetchLatestRelease(owner,repo){
    const apiUrl = `${DEV_CORS_PROXY}https://api.github.com/repos/${owner}/${repo}/releases`;
    const resp = await fetch(apiUrl);
    if(!resp.ok){
        throw new Error(`HTTP ${resp.status}`);
    }
    const releaseList = await resp.json();
    if(!Array.isArray(releaseList) || releaseList.length === 0){
        throw new Error("仓库无任何Release");
    }
    const validReleases = releaseList.filter(r => !r.draft);
    if(validReleases.length === 0){
        throw new Error("所有Release均为草稿，无公开版本");
    }
    return validReleases[0];
}

function formatLocalDate(d){
    const dt = new Date(d);
    return dt.getFullYear()+"/"+String(dt.getMonth()+1).padStart(2,'0')+"/"+String(dt.getDate()).padStart(2,'0')+" "+String(dt.getHours()).padStart(2,'0')+":"+String(dt.getMinutes()).padStart(2,'0')+":"+String(dt.getSeconds()).padStart(2,'0');
}

function renderAll(repoFetchResultList){
    const container = document.getElementById('versions-container');
    let html = '';

    repoFetchResultList.forEach((item,idx)=>{
        if(item.error){
            html += `
            <div class="version-card error-card" style="animation: fadeUp 0.5s ease both; animation-delay: ${idx*0.1}s;">
                <div class="version-header">
                    <div>
                        <h2 class="version-name">${item.config.title}</h2>
                        <p class="version-description">${item.config.desc}</p>
                    </div>
                </div>
                <div style="padding:16px 22px;">
                    <i class="fa fa-exclamation-triangle"></i> 获取GitHub Release失败：${item.errorMsg}
                    <div style="font-size:12px;margin-top:6px;">可能：无公开release / api限流 /网络跨域</div>
                </div>
            </div>`;
            return;
        }

        const release = item.release;
        const cfg = item.config;
        const logMd = release.body || "暂无更新日志";
        const logHtml = marked.parse(logMd);
        const publishTimeText = formatLocalDate(release.published_at);

        let assetHtml = '';
        if(release.assets && release.assets.length>0){
            release.assets.forEach(ast=>{
                const dlUrl = getDownloadUrl(ast.browser_download_url);
                const sizeMb = (ast.size / 1024 /1024).toFixed(1)+" MB";
                assetHtml += `
<div class="asset-item">
    <div class="asset-info">
        <span class="asset-name">${ast.name}</span>
        <span class="asset-size">${sizeMb} · 下载次数: ${ast.download_count}</span>
    </div>
    <a href="${dlUrl}" class="download-btn" target="_blank">
        <i class="fa fa-download"></i> 下载
    </a>
</div>`;
            })
        }else{
            assetHtml = `<div style="padding:8px 0;color:var(--text-secondary);">该版本没有附件资产</div>`
        }

        const expandCls = cfg.defaultExpand ? 'expanded' : 'collapsed';
        const iconCls = cfg.defaultExpand ? 'fa-chevron-up' : 'fa-chevron-down';

        html += `
<div class="version-card" style="animation: fadeUp 0.5s ease both; animation-delay: ${idx*0.1}s;">
    <div class="version-header" onclick="toggleVersion(${idx})">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div>
                <h2 class="version-name">${cfg.title}</h2>
                <p class="version-description">${cfg.desc}</p>
            </div>
            <i class="fa expand-icon ${iconCls}" id="expandIcon-${idx}"></i>
        </div>
    </div>
    <div class="version-content ${expandCls}" id="versionContent-${idx}">
        <div class="version-info">
            <div class="info-item">
                <span class="info-label">版本标签</span>
                <span class="version-number">
                    ${release.tag_name}
                    ${release.prerelease ? '<span style="color:#ff9800;font-size:12px;margin-left:8px;">⚠️预发布</span>' : ''}
                </span>
            </div>
            <div class="info-item">
                <span class="info-label">发布时间</span>
                <span style="color: var(--cream-2); font-size: 13px;">${publishTimeText}</span>
            </div>
            <div class="info-item">
                <span class="info-label">仓库</span>
                <span style="color: var(--cream-2); font-size: 13px;">${cfg.owner}/${cfg.repo}</span>
            </div>
            <div class="info-item">
                <span class="info-label">发布页</span>
                <a href="${release.html_url}" target="_blank" style="color:var(--accent-teal);font-size:13px;">查看GitHub Release</a>
            </div>
        </div>
        <div class="changelog-section">
            <h3 class="changelog-title"><i class="fa fa-file-text-o"></i> 更新日志</h3>
            <div class="changelog-content">${logHtml}</div>
        </div>
        <div class="assets-section">${assetHtml}</div>
    </div>
</div>`;
    })
    container.innerHTML = html;
}

window.onload = async function(){
    const resultList = [];
    for(const cfg of repoConfigList){
        try{
            const rel = await fetchLatestRelease(cfg.owner, cfg.repo);
            resultList.push({config:cfg, error:false, release:rel});
        }catch(err){
            resultList.push({config:cfg, error:true, errorMsg:err.message});
        }
    }
    renderAll(resultList);
    document.getElementById('lastUpdate').innerText = formatLocalDate(new Date());
};
</script>
</body>
</html>
