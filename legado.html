function renderAll(data){
    const container = document.getElementById('versions-container');
    let html = '';
    data.forEach((item,idx)=>{
        const logHtml = marked.parse(item.mdLog);
        let assetHtml = '';
        item.assets.forEach(ast=>{
            assetHtml += `
<div class="asset-item">
    <div class="asset-info">
        <span class="asset-name">${ast.name}</span>
        <span class="asset-size">${ast.size}</span>
    </div>
    <a href="${ast.url}" class="download-btn" target="_blank">
        <i class="fa fa-download"></i> 下载 (${ast.count} 次)
    </a>
</div>`;
        });
        const expandCls = item.expanded ? 'expanded' : 'collapsed';
        const iconCls = item.expanded ? 'fa-chevron-up' : 'fa-chevron-down';
        html += `
<div class="version-card" style="animation: fadeUp 0.5s ease both; animation-delay: ${idx*0.1}s;">
    <div class="version-header" onclick="toggleVersion(${idx})">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div>
                <h2 class="version-name">${item.title}</h2>
                <p class="version-description">${item.desc}</p>
            </div>
            <i class="fa expand-icon ${iconCls}" id="expandIcon-${idx}"></i>
        </div>
    </div>
    <div class="version-content ${expandCls}" id="versionContent-${idx}">
        <div class="version-info">
            <div class="info-item">
                <span class="info-label">版本</span>
                <span class="version-number">${item.version}</span>
            </div>
            <div class="info-item">
                <span class="info-label">发布</span>
                <span style="color: var(--cream-2); font-size: 13px;">${item.publishText}</span>
            </div>
            <div class="info-item">
                <span class="info-label">下载</span>
                <span class="download-count"><i class="fa fa-download"></i> ${item.downloadCount}</span>
            </div>
            <div class="info-item">
                <span class="info-label">仓库</span>
                <span style="color: var(--cream-2); font-size: 13px;">${item.repo}</span>
            </div>
        </div>
        <div class="changelog-section">
            <h3 class="changelog-title"><i class="fa fa-file-alt"></i> 更新日志</h3>
            <div class="changelog-content">${logHtml}</div>
        </div>
        <div class="assets-section">${assetHtml}</div>
    </div>
</div>`;
    });
    container.innerHTML = html;
}

window.onload = function(){
    renderAll(staticReleaseData);
};
