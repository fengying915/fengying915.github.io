<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Legado 开源阅读多版本下载 - 聚合官方版、Sigma、MD3、Plus 等多个版本">
    <meta name="keywords" content="Legado,阅读,开源,下载,Android">
    <title>开源阅读 Legado 多版本下载</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ========== 基础样式（与原站完全一致） ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --teal:         #2DD4C0;
            --teal-deep:    #1AAD9A;
            --teal-glow:    #4EEADE;
            --teal-mist:    #0D8F80;
            --bg-base:      #070A0D;
            --bg-panel:     #0A0E12;
            --bg-card:      #0E1318;
            --bg-surface:   #121820;
            --cream:        #F2EDE4;
            --cream-2:      #B8AFA3;
            --cream-3:      #6A6059;
            --cream-dim:    #3A3530;
            --transition:   cubic-bezier(.4,0,.2,1);
        }

        html, body {
            height: 100%;
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-base);
            color: var(--cream);
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .space-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse 80% 60% at 15% 20%, rgba(13,143,128,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(45,212,192,0.05) 0%, transparent 55%),
                        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(10,20,28,0.9) 0%, transparent 100%),
                        var(--bg-base);
        }

        .aurora { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .aurora-orb {
            position: absolute; border-radius: 50%;
            filter: blur(110px);
            animation: drift ease-in-out infinite alternate;
        }
        .aurora-orb:nth-child(1) {
            width: 65vw; height: 65vw;
            background: radial-gradient(circle, rgba(13,80,74,0.55) 0%, transparent 65%);
            top: -20%; left: -15%;
            animation-duration: 26s;
        }
        .aurora-orb:nth-child(2) {
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(8,50,46,0.5) 0%, transparent 65%);
            bottom: -20%; right: -10%;
            animation-duration: 20s;
            animation-delay: -8s;
        }
        .aurora-orb:nth-child(3) {
            width: 30vw; height: 30vw;
            background: radial-gradient(circle, rgba(45,212,192,0.07) 0%, transparent 70%);
            top: 35%; left: 60%;
            animation-duration: 30s;
            animation-delay: -15s;
        }
        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(3vw,4vh) scale(1.06); }
        }

        .scanlines {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
        }

        .grid-texture {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background-image: linear-gradient(rgba(45,212,192,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(45,212,192,0.03) 1px, transparent 1px);
            background-size: 56px 56px;
        }

        .particles { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
        .particle {
            position: absolute; border-radius: 50%;
            background: var(--teal-glow);
            opacity: 0;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0%   { opacity:0; transform:translateY(0) scale(1); }
            8%   { opacity:0.55; }
            92%  { opacity:0.1; }
            100% { opacity:0; transform:translateY(-75vh) scale(0); }
        }

        .theme-toggle {
            position: fixed; top: 26px; right: 26px; z-index: 100;
            width: 40px; height: 40px; border-radius: 11px;
            border: 1px solid rgba(45,212,192,0.16);
            background: rgba(14,19,24,0.7);
            backdrop-filter: blur(20px);
            color: var(--teal); font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            background: rgba(45,212,192,0.1);
            box-shadow: 0 0 16px rgba(45,212,192,0.15);
        }

        .layout {
            position: relative; z-index: 10;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
        }

        .left-panel {
            display: flex; flex-direction: column;
            justify-content: center; align-items: flex-start;
            padding: 80px 60px 80px 80px;
            position: relative;
        }

        .brand-badge {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 60px;
        }
        .brand-icon {
            width: 58px; height: 58px;
            border-radius: 16px;
            background: var(--bg-surface);
            border: 1px solid rgba(45,212,192,0.25);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 24px rgba(45,212,192,0.15), inset 0 1px 0 rgba(45,212,192,0.1);
        }
        .brand-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px; font-weight: 600;
            letter-spacing: 0.14em;
            color: var(--cream);
        }
        .brand-name span {
            display: block;
            font-family: 'Lato', sans-serif;
            font-size: 10px; font-weight: 300;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: var(--teal);
            margin-top: 5px;
            opacity: 0.85;
        }

        .hero-headline {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(36px, 4.8vw, 62px);
            font-weight: 300;
            line-height: 1.25;
            color: var(--cream);
            margin-bottom: 22px;
            letter-spacing: 0.01em;
        }
        .hero-headline em {
            font-style: normal;
            background: linear-gradient(125deg, var(--teal-glow) 0%, var(--teal) 40%, #A8F0E8 80%, var(--cream) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-family: 'Lato', sans-serif;
            font-size: 14px; font-weight: 300;
            letter-spacing: 0.06em;
            color: var(--cream-2);
            line-height: 2;
            margin-bottom: 52px;
            max-width: 360px;
        }

        .feature-list { display: flex; flex-direction: column; gap: 18px; }
        .feature-item { display: flex; align-items: center; gap: 14px; }
        .feature-dot {
            width: 34px; height: 34px; border-radius: 9px;
            background: rgba(45,212,192,0.07);
            border: 1px solid rgba(45,212,192,0.18);
            display: flex; align-items: center; justify-content: center;
            color: var(--teal);
            font-size: 13px; flex-shrink: 0;
            transition: all 0.3s;
        }
        .feature-item:hover .feature-dot {
            background: rgba(45,212,192,0.13);
            border-color: rgba(45,212,192,0.4);
            box-shadow: 0 0 14px rgba(45,212,192,0.18);
        }
        .feature-text { font-size: 13px; color: var(--cream-2); letter-spacing: 0.04em; }

        .deco-line {
            position: absolute; right: 0; top: 50%;
            transform: translateY(-50%);
            width: 1px; height: 55vh;
            background: linear-gradient(to bottom,
                transparent,
                rgba(45,212,192,0.2) 25%,
                rgba(45,212,192,0.3) 50%,
                rgba(45,212,192,0.2) 75%,
                transparent
            );
        }
        .deco-line::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 10px var(--teal), 0 0 20px var(--teal);
        }

        .right-panel {
            display: flex; align-items: flex-start;
            justify-content: center;
            padding: 40px 60px 40px 40px;
            overflow-y: auto;
            max-height: 100vh;
        }
        .right-panel::-webkit-scrollbar { width: 6px; }
        .right-panel::-webkit-scrollbar-track { background: transparent; }
        .right-panel::-webkit-scrollbar-thumb { background: rgba(45,212,192,0.2); border-radius: 3px; }

        .content-wrapper {
            width: 100%;
            max-width: 680px;
            padding-top: 20px;
        }

        .versions-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .version-card {
            background: rgba(14,19,24,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(45,212,192,0.12);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s var(--transition);
            position: relative;
        }
        .version-card::before {
            content: '';
            position: absolute;
            top:0; left:0; right:0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--teal-glow), transparent);
            opacity: 0.5;
        }
        .version-card:hover {
            transform: translateY(-4px);
            border-color: rgba(45,212,192,0.25);
            box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 30px rgba(45,212,192,0.1);
        }

        .version-header {
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px;
            margin: -4px;
            border-radius: 12px;
        }
        .version-header:hover { background: rgba(45,212,192,0.05); }

        .expand-icon {
            font-size: 14px;
            color: var(--teal);
            transition: all 0.3s var(--transition);
            line-height: 1;
            margin-left: 12px;
        }

        .version-content {
            overflow: hidden;
            transition: all 0.4s var(--transition);
        }
        .version-content.collapsed {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            margin-top: 0;
        }
        .version-content.expanded {
            max-height: 2000px;
            opacity: 1;
            padding-top: 20px;
        }

        .version-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--cream);
            margin-bottom: 6px;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
        }
        .version-name::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--teal);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px var(--teal);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        .version-description {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            color: var(--cream-3);
            line-height: 1.6;
        }

        .version-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(45,212,192,0.05);
            border: 1px solid rgba(45,212,192,0.1);
            border-radius: 12px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-label {
            font-family: 'Lato', sans-serif;
            font-size: 10px;
            font-weight: 400;
            color: var(--cream-3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .version-number, .download-count {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--teal);
        }
        .download-count i { font-size: 11px; margin-right: 4px; }

        .changelog-section { margin-bottom: 20px; }
        .changelog-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--cream);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.04em;
        }
        .changelog-title i { color: var(--teal); font-size: 12px; }

        .changelog-content {
            max-height: 160px;
            overflow-y: auto;
            padding: 16px;
            background: rgba(45,212,192,0.03);
            border: 1px solid rgba(45,212,192,0.1);
            border-radius: 12px;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            line-height: 1.7;
            color: var(--cream-2);
        }
        .changelog-content::-webkit-scrollbar { width: 4px; }
        .changelog-content::-webkit-scrollbar-thumb { background: rgba(45,212,192,0.3); border-radius: 2px; }
        .changelog-content h1, .changelog-content h2, .changelog-content h3 {
            font-size: 14px;
            margin: 10px 0 6px 0;
            color: var(--teal);
            font-weight: 600;
        }
        .changelog-content ul, .changelog-content ol { margin-left: 16px; margin-bottom: 10px; }
        .changelog-content li { margin-bottom: 4px; }
        .changelog-content li::marker { color: var(--teal); }
        .changelog-content code {
            background: rgba(45,212,192,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 11px;
            color: var(--teal-glow);
        }

        .assets-section { display: flex; flex-direction: column; gap: 12px; }
        .asset-item {
            background: rgba(45,212,192,0.05);
            border: 1px solid rgba(45,212,192,0.1);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
        }
        .asset-item:hover {
            border-color: rgba(45,212,192,0.2);
            background: rgba(45,212,192,0.08);
        }
        .asset-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .asset-name {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--cream);
            word-break: break-all;
        }
        .asset-size {
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            color: var(--cream-3);
            background: rgba(45,212,192,0.1);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--teal-mist) 0%, var(--teal-deep) 40%, var(--teal) 100%);
            color: var(--bg-base);
            text-decoration: none;
            border-radius: 10px;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            transition: all 0.3s var(--transition);
            box-shadow: 0 4px 16px rgba(26,173,154,0.3);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .download-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26,173,154,0.4);
        }
        .download-btn:hover::before { opacity: 1; }
        .download-btn:active { transform: translateY(0); }
        .download-btn i { font-size: 12px; }

        .error-message {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Lato', sans-serif;
        }
        .error-message h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .error-message button {
            margin-top: 12px;
            padding: 10px 20px;
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .error-message button:hover { background: rgba(239,68,68,0.3); }

        .footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid rgba(45,212,192,0.1);
            margin-top: 10px;
        }
        .footer p {
            font-family: 'Lato', sans-serif;
            font-size: 12px;
            color: var(--cream-3);
            margin: 4px 0;
            letter-spacing: 0.04em;
        }
        .footer #lastUpdate { color: var(--teal); font-weight: 600; }
        .footer .disclaimer { margin-top: 8px; font-size: 11px; opacity: 0.7; }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(20px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .left-panel > * { animation: fadeUp 0.65s var(--transition) both; }
        .left-panel > *:nth-child(2) { animation-delay:.08s; }
        .left-panel > *:nth-child(3) { animation-delay:.16s; }
        .left-panel > *:nth-child(4) { animation-delay:.24s; }
        .left-panel > *:nth-child(5) { animation-delay:.32s; }
        .content-wrapper { animation: fadeUp 0.65s var(--transition) both; animation-delay: 0.1s; }

        @media (max-width: 1024px) {
            .layout { grid-template-columns: 1fr; }
            .left-panel { display: none; }
            .right-panel { padding: 20px; max-height: none; overflow-y: visible; }
            .content-wrapper { padding-top: 60px; }
            .mobile-brand { display: flex !important; align-items: center; gap: 12px; margin-bottom: 24px; justify-content: center; }
            .theme-toggle { top: 16px; right: 16px; }
        }
        @media (min-width: 1025px) { .mobile-brand { display: none !important; } }

        @media (max-width: 480px) {
            .version-card { padding: 18px; }
            .version-info { padding: 12px; gap: 10px; }
            .changelog-content { padding: 12px; max-height: 130px; }
        }

        /* Light theme */
        [data-theme="light"] {
            --bg-base:    #E8F0EE;
            --bg-panel:   #F0F6F4;
            --bg-card:    rgba(240,248,246,0.9);
            --bg-surface: #E0EBE8;
            --cream:      #0D1C1A;
            --cream-2:    #3A5550;
            --cream-3:    #6A9090;
            --cream-dim:  #9ABABA;
        }
        [data-theme="light"] body { background: #DDE8E6; }
        [data-theme="light"] .space-bg {
            background: radial-gradient(ellipse 80% 60% at 15% 20%, rgba(45,212,192,0.08) 0%, transparent 60%), #DDE8E6;
        }
        [data-theme="light"] .aurora-orb:nth-child(1) { opacity: 0.35; }
        [data-theme="light"] .aurora-orb:nth-child(2) { opacity: 0.28; }
        [data-theme="light"] .scanlines { opacity: 0.15; }
        [data-theme="light"] .grid-texture {
            background-image: linear-gradient(rgba(45,212,192,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(45,212,192,0.05) 1px, transparent 1px);
        }
        [data-theme="light"] .theme-toggle {
            background: rgba(220,238,234,0.9);
            border-color: rgba(45,212,192,0.3);
            color: var(--teal-deep);
        }
        [data-theme="light"] .version-card {
            background: rgba(255,255,255,0.8);
            border-color: rgba(45,212,192,0.15);
            box-shadow: 0 8px 32px rgba(0,80,70,0.1);
        }
        [data-theme="light"] .version-card:hover {
            border-color: rgba(45,212,192,0.3);
            box-shadow: 0 16px 48px rgba(0,80,70,0.15);
        }
        [data-theme="light"] .version-info,
        [data-theme="light"] .changelog-content,
        [data-theme="light"] .asset-item {
            background: rgba(45,212,192,0.05);
            border-color: rgba(45,212,192,0.15);
        }
        [data-theme="light"] .asset-item:hover { background: rgba(45,212,192,0.1); }
        [data-theme="light"] .download-btn { color: #fff; }
        [data-theme="light"] .footer { border-color: rgba(45,212,192,0.15); }
        [data-theme="light"] .slider { background: rgba(45,212,192,0.2); }
    </style>
</head>
<body data-theme="light">

<button class="theme-toggle" id="themeToggle"><i class="fas fa-adjust"></i></button>

<div class="space-bg"></div>
<div class="aurora"><div class="aurora-orb"></div><div class="aurora-orb"></div><div class="aurora-orb"></div></div>
<div class="scanlines"></div>
<div class="grid-texture"></div>
<div class="particles" id="particles"></div>

<div class="layout">
    <div class="left-panel">
        <div class="brand-badge">
            <div class="brand-icon"><i class="fas fa-book-open" style="color:#2DD4C0;font-size:26px;"></i></div>
            <div class="brand-name">开源阅读<span>Legado Reader</span></div>
        </div>
        <h1 class="hero-headline">探索<em>阅读</em><br>无限可能</h1>
        <p class="hero-desc">聚合多个 Legado 版本下载<br>让每一次阅读，都是与文字的美好邂逅</p>
        <div class="feature-list">
            <div class="feature-item"><div class="feature-dot"><i class="fas fa-code-branch"></i></div><span class="feature-text">多版本聚合，官方版、Sigma、MD3、Plus 等</span></div>
            <div class="feature-item"><div class="feature-dot"><i class="fas fa-bolt"></i></div><span class="feature-text">没有加速代理，缓慢下载体验</span></div>
            <div class="feature-item"><div class="feature-dot"><i class="fas fa-sync-alt"></i></div><span class="feature-text">实时同步，自动获取最新版本</span></div>
        </div>
        <div class="deco-line"></div>
    </div>

    <div class="right-panel">
        <div class="content-wrapper">
            <div class="mobile-brand">
                <div class="brand-icon" style="width:42px;height:42px;border-radius:11px;"><i class="fas fa-book-open" style="color:#2DD4C0;font-size:20px;"></i></div>
                <span style="font-family:'Noto Serif SC',serif;font-size:17px;font-weight:600;letter-spacing:0.1em;color:var(--cream);">开源阅读</span>
            </div>

            <div id="versions-container" class="versions-grid">
                <div class="loading" style="display:flex;justify-content:center;align-items:center;min-height:300px;">
                    <div class="loading-spinner" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;">
                        <div class="spinner" style="border:3px solid rgba(45,212,192,0.1);border-top:3px solid var(--teal);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;"></div>
                        <p style="color:var(--cream-2);font-family:'Lato',sans-serif;font-size:14px;">正在从 GitHub 拉取最新 Release 数据...</p>
                    </div>
                </div>
            </div>

            <footer class="footer">
                <p>最后更新: <span id="lastUpdate">--</span></p>
                <p>数据来源: GitHub Release API</p>
                <p class="disclaimer">本项目仅为聚合下载页面，应用版权归原作者所有</p>
            </footer>
        </div>
    </div>
</div>

<script>
    // ========== 粒子背景 ==========
    (function() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.bottom = '-10px';
            const size = 1 + Math.random() * 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (14 + Math.random() * 8) + 's';
            container.appendChild(p);
        }
    })();

    // ========== 主题切换 ==========
    document.getElementById('themeToggle').addEventListener('click', function() {
        const body = document.body;
        const current = body.getAttribute('data-theme');
        body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    });

    // ========== 折叠切换 ==========
    function toggleVersion(idx) {
        const content = document.getElementById('versionContent-' + idx);
        const icon = document.getElementById('expandIcon-' + idx);
        if (!content || !icon) return;
        if (content.classList.contains('collapsed')) {
            content.classList.remove('collapsed');
            content.classList.add('expanded');
            icon.classList.remove('fa-chevron-down');
            icon.classList.add('fa-chevron-up');
        } else {
            content.classList.remove('expanded');
            content.classList.add('collapsed');
            icon.classList.remove('fa-chevron-up');
            icon.classList.add('fa-chevron-down');
        }
    }

    // ========== localStorage 缓存 ==========
    const CACHE_TTL = 10 * 60 * 1000; // 10 分钟

    function getCachedData(key) {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        try {
            const data = JSON.parse(raw);
            if (Date.now() - data.timestamp < CACHE_TTL) {
                return data.value;
            }
        } catch (_) {}
        return null;
    }

    function setCachedData(key, value) {
        localStorage.setItem(key, JSON.stringify({ timestamp: Date.now(), value: value }));
    }

    // ========== 优化后的数据获取（超时 + 重试 + 缓存降级） ==========
    const REQUEST_TIMEOUT = 8000; // 8 秒超时
    const MAX_RETRIES = 2;

    function fetchWithTimeout(url, options = {}, timeout = REQUEST_TIMEOUT) {
        return new Promise((resolve, reject) => {
            const controller = new AbortController();
            const signal = controller.signal;
            const timer = setTimeout(() => {
                controller.abort();
                reject(new Error('请求超时'));
            }, timeout);

            fetch(url, { ...options, signal })
                .then(resolve)
                .catch(reject)
                .finally(() => clearTimeout(timer));
        });
    }

    async function fetchWithRetry(url, retries = MAX_RETRIES) {
        let lastError;
        for (let i = 0; i <= retries; i++) {
            try {
                const resp = await fetchWithTimeout(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.json();
            } catch (err) {
                lastError = err;
                if (i === retries) throw err;
                await new Promise(r => setTimeout(r, 500));
            }
        }
        throw lastError;
    }

    // ========== 获取 Release 数据（通过 Worker 代理，带降级） ==========
    const PROXY_BASE = 'https://legado-proxy.fengying915.workers.dev/api/repos';

    async function fetchLatestSoft(owner, repo) {
        const cacheKey = `gh_cache_latest_${owner}_${repo}`;
        const cached = getCachedData(cacheKey);

        try {
            const url = `${PROXY_BASE}/${owner}/${repo}`;
            const data = await fetchWithRetry(url);
            if (!data.releases || data.releases.length === 0) throw new Error('无发布');
            const stable = data.releases.find(r => !r.prerelease);
            if (!stable) throw new Error('无稳定版');
            setCachedData(cacheKey, stable);
            return stable;
        } catch (err) {
            if (cached) return cached;
            throw err;
        }
    }

    async function fetchNewestFromList(owner, repo) {
        const cacheKey = `gh_cache_newest_${owner}_${repo}`;
        const cached = getCachedData(cacheKey);

        try {
            const url = `${PROXY_BASE}/${owner}/${repo}`;
            const data = await fetchWithRetry(url);
            if (!data.releases || data.releases.length === 0) throw new Error('无公开 Release');
            const newest = data.releases[0];
            setCachedData(cacheKey, newest);
            return newest;
        } catch (err) {
            if (cached) return cached;
            throw err;
        }
    }

    async function fetchRelease(owner, repo) {
        try {
            return await fetchLatestSoft(owner, repo);
        } catch (_) {
            return await fetchNewestFromList(owner, repo);
        }
    }

    // ========== 工具函数 ==========
    function formatLocalDate(d) {
        const dt = new Date(d);
        return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}:${String(dt.getSeconds()).padStart(2,'0')}`;
    }

    function timeAgo(date) {
        const now = new Date();
        const diff = (now - date) / 1000;
        if (diff < 60) return '刚刚';
        const minutes = Math.floor(diff / 60);
        if (minutes < 60) return minutes + ' 分钟前';
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + ' 小时前';
        const days = Math.floor(hours / 24);
        if (days < 30) return days + ' 天前';
        const months = Math.floor(days / 30);
        if (months < 12) return months + ' 个月前';
        const years = Math.floor(months / 12);
        return years + ' 年前';
    }

    // ========== 渲染卡片（不过滤资产类型） ==========
    function renderCard(cfg, release, idx, titleSuffix = '') {
        const logHtml = marked.parse(release.body || '暂无更新日志');
        const publishTime = new Date(release.published_at);
        const timeStr = timeAgo(publishTime);

        let totalDownloads = 0;
        let assetsHtml = '';
        if (release.assets && release.assets.length > 0) {
            for (const ast of release.assets) {
                totalDownloads += ast.download_count;
                const sizeMb = (ast.size / 1024 / 1024).toFixed(1) + ' MB';
                assetsHtml += `
                    <div class="asset-item">
                        <div class="asset-info">
                            <span class="asset-name">${ast.name}</span>
                            <span class="asset-size">${sizeMb}</span>
                        </div>
                        <a href="${ast.browser_download_url}" class="download-btn" target="_blank">
                            <i class="fas fa-download"></i> 下载 (${ast.download_count} 次)
                        </a>
                    </div>
                `;
            }
        }
        if (!assetsHtml) {
            assetsHtml = `<div style="padding:8px 0;color:var(--cream-3);">暂无可用文件下载</div>`;
        }

        const expandCls = 'collapsed';
        const iconCls = 'fa-chevron-down';

        return `
            <div class="version-card" style="animation: fadeUp 0.5s ease both; animation-delay: ${idx * 0.1}s;">
                <div class="version-header" onclick="toggleVersion(${idx})">
                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                        <div>
                            <h2 class="version-name">${cfg.title} ${titleSuffix}</h2>
                            <p class="version-description">${cfg.desc}</p>
                        </div>
                        <i class="fas expand-icon ${iconCls}" id="expandIcon-${idx}"></i>
                    </div>
                </div>
                <div class="version-content ${expandCls}" id="versionContent-${idx}">
                    <div class="version-info">
                        <div class="info-item">
                            <span class="info-label">版本</span>
                            <span class="version-number">${release.tag_name}${release.prerelease ? ' <span style="color:#ffb042;font-size:12px;">⚠️预发布</span>' : ''}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">发布</span>
                            <span style="color: var(--cream-2); font-size: 13px;">${timeStr}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">下载</span>
                            <span class="download-count"><i class="fas fa-download"></i> ${totalDownloads}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">仓库</span>
                            <span style="color: var(--cream-2); font-size: 13px;">${cfg.owner}/${cfg.repo}</span>
                        </div>
                    </div>
                    <div class="changelog-section">
                        <h3 class="changelog-title"><i class="fas fa-file-alt"></i> 更新日志</h3>
                        <div class="changelog-content">${logHtml}</div>
                    </div>
                    <div class="assets-section">${assetsHtml}</div>
                </div>
            </div>
        `;
    }

    // ========== 仓库配置 ==========
    const repoConfigList = [
        {
            title: '🚩阅读 R',
            desc: '体验最好！阅读 R 继承自 Rimchars 维护的 阅读Archive，基于 Legado/lyc 分支开发，延续了 Legado 的开源阅读体验，并进一步增强了界面、AI、EPUB、漫画、视频和主题等功能。',
            owner: 'refgd',
            repo: 'legado',
            dual: false
        },
        {
            title: '🚩阅读 Sigma',
            desc: '阅读Sigma是gedoor/legado的一个分支版本，在原有基础上增加更多功能，为书源带来更多可能性。',
            owner: 'Luoyacheng',
            repo: 'legado',
            dual: true
        },
        {
            title: '🚩阅读 MAX',
            desc: '本项目基于 lyc版 持续开发，在此基础上有更多功能优化 appLegacy版：包名 io.legado.app，与原版相同，可覆盖更新 appMax版：包名 io.legado.app.yuedu，共存包名，不会覆盖原版 appS版：包名 io.legado.app.yuedu.a，另一个共存包名',
            owner: 'Suml-1',
            repo: 'Legado_Max',
            dual: false
        },
        {
            title: '🚩阅读 MD3',
            desc: '采用 Material Design 3 风格重新设计的界面版，本项目在对 UI 进行重绘的基础上，加入了多项分支独有功能，并正在逐步从传统 View 迁移至 Jetpack Compose 框架，目标是提供更加现代、流畅且一致的阅读体验。',
            owner: 'HapeLee',
            repo: 'legado-with-MD3',
            dual: true
        },
        {
            title: '🚩轻悦时光',
            desc: '轻悦时光全平台都可用,不需要后端服务器支持,不支持阅读书源,有自己的书源',
            owner: 'autobcb',
            repo: 'qysg',
            dual: false
        },
        {
            title: '🚩轻阅读',
            desc: '后端，需要自己部署，部署后可以绑定轻悦时光/栖阅',
            owner: 'autobcb',
            repo: 'read',
            dual: false
        }
    ];

    // ========== 启动加载 ==========
    window.addEventListener('DOMContentLoaded', async function() {
        const container = document.getElementById('versions-container');
        let html = '';
        let idx = 0;

        for (const cfg of repoConfigList) {
            if (cfg.dual) {
                try {
                    const stable = await fetchLatestSoft(cfg.owner, cfg.repo);
                    if (stable) {
                        html += renderCard(cfg, stable, idx++, '【稳定版】');
                    }
                    const newest = await fetchNewestFromList(cfg.owner, cfg.repo);
                    if (newest) {
                        html += renderCard(cfg, newest, idx++, '【最新（测试版）】');
                    }
                } catch (err) {
                    html += `
                        <div class="version-card error-message" style="padding:20px;">
                            <h3><i class="fas fa-exclamation-triangle"></i> 获取失败</h3>
                            <p style="margin-bottom:6px;">${cfg.title} — ${err.message}</p>
                            <button onclick="location.reload()">重试</button>
                        </div>
                    `;
                    idx += 2;
                }
            } else {
                try {
                    const release = await fetchRelease(cfg.owner, cfg.repo);
                    html += renderCard(cfg, release, idx++, '');
                } catch (err) {
                    html += `
                        <div class="version-card error-message" style="padding:20px;">
                            <h3><i class="fas fa-exclamation-triangle"></i> 获取失败</h3>
                            <p style="margin-bottom:6px;">${cfg.title} — ${err.message}</p>
                            <button onclick="location.reload()">重试</button>
                        </div>
                    `;
                    idx++;
                }
            }
        }

        container.innerHTML = html;
        document.getElementById('lastUpdate').textContent = formatLocalDate(new Date());
    });
</script>

</body>
</html>
