    <style>
:root {
    --bg-main: #0b0e17;
    --bg-card: rgba(22,27,40,0.7);
    --bg-card-opaque: #161b28;
    --text-primary: #e8e8e8;
    --text-secondary: #b8c2cc;
    --cream: #f0e6d2;
    --cream-2: #d4c8b0;
    --accent-teal: #2DD4C0;
    --border: rgba(255,255,255,0.12);
    --shadow-card: 0 8px 32px rgba(0,0,0,0.35);
}
[data-theme="light"] {
    --bg-main: #f7f8fa;
    --bg-card: rgba(255,255,255,0.75);
    --bg-card-opaque: #ffffff;
    --text-primary: #1c2028;
    --text-secondary: #444954;
    --cream: #2c2820;
    --cream-2: #544e42;
    --border: rgba(0,0,0,0.10);
    --shadow-card: 0 6px 24px rgba(0,0,0,0.08);
}
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body {
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height:100vh;
    overflow-x:hidden;
}
.theme-toggle {
    position:fixed;
    top:14px;
    right:14px;
    z-index:999;
    background:var(--bg-card);
    backdrop-filter: blur(8px);
    border:1px solid var(--border);
    color:var(--text-primary);
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
/* 背景特效 */
.space-bg {
    position:fixed;
    inset:0;
    z-index:-4;
    background: var(--bg-main);
}
.aurora {
    position:fixed;
    inset:0;
    z-index:-3;
    overflow:hidden;
    pointer-events:none;
}
.aurora-orb {
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.25;
}
.aurora-orb:nth-child(1) {
    width:420px;height:420px;
    background:#2DD4C0;
    top:-120px;left:-80px;
}
.aurora-orb:nth-child(2) {
    width:460px;height:460px;
    background:#7c3aed;
    bottom:-140px;right:-100px;
}
.aurora-orb:nth-child(3) {
    width:340px;height:340px;
    background:#db2777;
    top:30%;right:20%;
}
.scanlines {
    position:fixed;inset:0;z-index:-2;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0px,rgba(255,255,255,0.02) 1px,transparent 1px,transparent 3px);
    pointer-events:none;
}
.grid-texture {
    position:fixed;inset:0;z-index:-1;
    background-image: linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
    background-size:40px 40px;
    opacity:0.25;
    pointer-events:none;
}
.particles {
    position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
}
.particle {
    position:absolute;
    background:#fff;
    border-radius:50%;
    animation: particleUp linear infinite;
}
@keyframes particleUp {
    0% {transform: translateY(0);opacity:0;}
    10% {opacity:0.7;}
    90% {opacity:0.7;}
    100% {transform: translateY(-110vh);opacity:0;}
}
@keyframes fadeUp {
    from {opacity:0;transform: translateY(18px);}
    to {opacity:1;transform: translateY(0);}
}
/* 双栏布局 */
.layout {
    display:flex;
    min-height:100vh;
}
.left-panel {
    width:420px;
    flex:0 0 420px;
    padding:48px 32px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
}
.brand-badge {
    display:flex;align-items:center;gap:12px;margin-bottom:24px;
}
.brand-icon {
    width:44px;height:44px;
    border-radius:12px;
    background:rgba(45,212,192,0.12);
    display:flex;align-items:center;justify-content:center;
}
.brand-name {
    font-family:'Noto Serif SC',serif;
    font-size:19px;letter-spacing:0.08em;

}
.hero-headline {

}
.hero-headline em {
    color:var(--accent-teal);

}
.hero-desc {
    color:var(--text-secondary);
    font-size:16px;
    line-height:1.7;
    margin-bottom:32px;
}
.feature-list {
    display:flex;flex-direction:column;gap:16px;margin-bottom:36px;
}
.feature-item {
    display:flex;align-items:center;gap:12px;
}
.feature-dot {

.feature-text {

}
.deco-line {
    height:1px;
    background:linear-gradient(90deg,var(--accent-teal),transparent);

    opacity:0.4;
}
.right-panel {
    flex:1;
    overflow-y:auto;
}
.content-wrapper {
    max-width:860px;
    padding:48px 32px;
    margin:0 auto;
}
.mobile-brand {
    display:none;
    align-items:center;gap:10px;margin-bottom:24px;
}
.proxy-toggle {
    display:flex;align-items:center;gap:10px;margin-bottom:28px;
}
.switch {
    position:relative;
    display:inline-block;
    width:44px;height:24px;
}
.switch input {opacity:0;width:0;height:0;}
.slider {
    position:absolute;cursor:pointer;inset:0;
    background:#444;border-radius:24px;
    transition:0.25s;
}
.slider:before {
    position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;
    background:white;border-radius:50%;
    transition:0.25s;
}
input:checked + .slider {
    background-color:var(--accent-teal);
}
input:checked + .slider:before {
    transform: translateX(20px);
}
.toggle-label {
    font-size:15px;color:var(--text-secondary);
}
.versions-grid {
    display:flex;flex-direction:column;gap:20px;
}
.version-card {
    background:var(--bg-card);
    backdrop-filter: blur(10px);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow-card);
    overflow:hidden;
}
.version-header {
    padding:20px 22px;
    cursor:pointer;
}
.version-name {
    font-size:19px;margin-bottom:8px;
}
.version-description {
    font-size:14.5px;color:var(--text-secondary);
    line-height:1.6;
}
.version-content {
    padding:0 22px 22px;
    max-height:0;
    overflow:hidden;
    transition: max-height 0.38s ease;
}
.version-content.expanded {
    max-height:2200px;
}
.version-content.collapsed {
    max-height:0;
}
.expand-icon {
    transition:transform 0.28s ease;
}
.expand-icon.fa-chevron-up {
    transform:rotate(180deg);
}
.version-info {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
    margin:16px 0 22px;
}
.info-item {
    display:flex;flex-direction:column;gap:3px;
}
.info-label {
    font-size:12px;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:0.04em;
}
.version-number,.download-count {
    font-size:14.5px;
}
.changelog-section {
    margin-bottom:22px;
}
.changelog-title {
    display:flex;align-items:center;gap:8px;
    font-size:16px;margin-bottom:10px;
}
.changelog-content {
    background:rgba(0,0,0,0.15);
    border-radius:10px;
    padding:14px 16px;
    font-size:14px;
    line-height:1.65;
    color:var(--text-secondary);
}
.changelog-content ul {
    padding-left:20px;
}
.changelog-content table {
    width:100%;border-collapse:collapse;margin:10px 0;
}
.changelog-content th,.changelog-content td {
    border:1px solid var(--border);
    padding:7px 9px;
}
.assets-section {
    display:flex;flex-direction:column;gap:12px;
}
.asset-item {
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    background:rgba(255,255,255,0.04);
    padding:12px 14px;
    border-radius:10px;
}
.asset-info {
    display:flex;flex-direction:column;gap:2px;
}
.asset-name {
    font-size:14px;
}
.asset-size {
    font-size:12.5px;color:var(--text-secondary);
}
.download-btn {
    white-space:nowrap;
    background:var(--accent-teal);
    color:#000;
    text-decoration:none;
    padding:7px 14px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:500;
}
.footer {
    margin-top:40px;
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.7;
}
.disclaimer {
    margin-top:8px;opacity:0.7;
}
.loading-card{
    padding:32px 22px;text-align:center;color:var(--text-secondary);
    background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
}
.error-card{
    padding:24px 22px;background:rgba(220,40,40,0.12);border:1px solid rgba(220,80,80,0.25);border-radius:14px;color:#ffb8b8;
}
/* 移动端 */
@media (max-width: 960px) {
    .layout {flex-direction:column;}
    .left-panel {

        padding:24px 20px;
    }
    .hero-headline,.brand-badge,.feature-list,.deco-line {
        display:none;
    }
    .mobile-brand {display:flex;}
    .content-wrapper {padding:24px 18px;}
}
    </style>

<script>
// 生成粒子
const particleBox = document.getElementById('particles');
for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + '%';
    p.style.bottom = '-10px';
    const sz = 1 + Math.random()*3;
    p.style.width = sz+'px';
    p.style.height = sz+'px';
    p.style.animationDelay = Math.random()*15+'s';
    p.style.animationDuration = 14 + Math.random()*8+'s';
    particleBox.appendChild(p);
}

// 折叠卡片
function toggleVersion(idx){
    const content = document.getElementById('versionContent-'+idx);
    const icon = document.getElementById('expandIcon-'+idx);
    if(!content || !icon) return;
    if(content.classList.contains('expanded')){
        content.classList.remove('expanded');
        content.classList.add('collapsed');
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
    }else{
        content.classList.remove('collapsed');
        content.classList.add('expanded');
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
    }
}

// 主题切换
const themeBtn = document.getElementById('themeToggle');
themeBtn.onclick = function(){
    const body = document.body;
    body.dataset.theme = body.dataset.theme === 'light' ? 'dark' : 'light';
};

// ========== 仓库配置：仅静态配置元信息，不包含任何release/版本/日志/下载数据 ==========
const repoConfigList = [

// 开发跨域代理前缀，生产环境请删除，改用后端转发
const DEV_CORS_PROXY = "";
// const DEV_CORS_PROXY = "https://cors-anywhere.herokuapp.com/";

// github下载加速地址前缀
function getDownloadUrl(originUrl){
    const proxySwitch = document.getElementById('proxySwitch');
    if(proxySwitch.checked){
        return "https://mirror.ghproxy.com/"+originUrl;
    }else{
        return originUrl;
    }
}

/**
 * ✅ 修改：不使用/releases/latest，请求/releases列表，取数组第0项（页面最顶部release，包含预发布）
 * @param {string} owner
 * @param {string} repo
 */
async function fetchLatestRelease(owner,repo){
    const apiUrl = `${DEV_CORS_PROXY}https://api.github.com/repos/${owner}/${repo}/releases`;
    const resp = await fetch(apiUrl);
    if(!resp.ok){
        throw new Error(`HTTP ${resp.status}`);
    }
    const releaseList = await resp.json();
    if(!Array.isArray(releaseList) || releaseList.length === 0){
        throw new Error("仓库无任何Release");
    }
    // GitHub返回已经按发布时间倒序，第0项就是网页看到最顶部版本
    return releaseList[0];
}

/**
 * 格式化时间为本地字符串
 */
function formatLocalDate(d){
    const dt = new Date(d);
    return dt.getFullYear()+"/"+String(dt.getMonth()+1).padStart(2,'0')+"/"+String(dt.getDate()).padStart(2,'0')+" "+String(dt.getHours()).padStart(2,'0')+":"+String(dt.getMinutes()).padStart(2,'0')+":"+String(dt.getSeconds()).padStart(2,'0');
}

/**
 * 渲染全部卡片，数据来自github api返回结果
 */
function renderAll(repoFetchResultList){
    const container = document.getElementById('versions-container');
    let html = '';

    repoFetchResultList.forEach((item,idx)=>{
        // 处理异常情况
        if(item.error){
            html += `
            <div class="version-card error-card" style="animation: fadeUp 0.5s ease both; animation-delay: ${idx*0.1}s;">
                <div class="version-header">
                    <div>
                        <h2 class="version-name">${item.config.title}</h2>
                        <p class="version-description">${item.config.desc}</p>
                    </div>
                </div>
                <div style="padding:16px 22px;">
                    <i class="fa fa-exclamation-triangle"></i> 获取GitHub Release失败：${item.errorMsg}
                    <div style="font-size:12px;margin-top:6px;">可能：无最新release / api限流 /网络跨域</div>
                </div>
            </div>`;
            return;
        }

        const release = item.release;
        const cfg = item.config;
        const logMd = release.body || "暂无更新日志";
        const logHtml = marked.parse(logMd);
        const publishTimeText = formatLocalDate(release.published_at);

        // 渲染资产列表
        let assetHtml = '';
        if(release.assets && release.assets.length>0){
            release.assets.forEach(ast=>{
                const dlUrl = getDownloadUrl(ast.browser_download_url);
                const sizeMb = (ast.size / 1024 /1024).toFixed(1)+" MB";
                assetHtml += `
<div class="asset-item">
    <div class="asset-info">
        <span class="asset-name">${ast.name}</span>
        <span class="asset-size">${sizeMb} · 下载次数: ${ast.download_count}</span>
    </div>
    <a href="${dlUrl}" class="download-btn" target="_blank">
        <i class="fa fa-download"></i> 下载
    </a>
</div>`;
            })
        }else{
            assetHtml = `<div style="padding:8px 0;color:var(--text-secondary);">该版本没有附件资产</div>`
        }

        const expandCls = cfg.defaultExpand ? 'expanded' : 'collapsed';
        const iconCls = cfg.defaultExpand ? 'fa-chevron-up' : 'fa-chevron-down';

        html += `
<div class="version-card" style="animation: fadeUp 0.5s ease both; animation-delay: ${idx*0.1}s;">
    <div class="version-header" onclick="toggleVersion(${idx})">
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div>
                <h2 class="version-name">${cfg.title}</h2>
                <p class="version-description">${cfg.desc}</p>
            </div>
            <i class="fa expand-icon ${iconCls}" id="expandIcon-${idx}"></i>
        </div>
    </div>
    <div class="version-content ${expandCls}" id="versionContent-${idx}">
        <div class="version-info">
            <div class="info-item">
                <span class="info-label">版本标签</span>
                <span class="version-number">${release.tag_name}</span>
            </div>
            <div class="info-item">
                <span class="info-label">发布时间</span>
                <span style="color: var(--cream-2); font-size: 13px;">${publishTimeText}</span>
            </div>
            <div class="info-item">
                <span class="info-label">仓库</span>
                <span style="color: var(--cream-2); font-size: 13px;">${cfg.owner}/${cfg.repo}</span>
            </div>
            <div class="info-item">
                <span class="info-label">发布页</span>
                <a href="${release.html_url}" target="_blank" style="color:var(--accent-teal);font-size:13px;">查看GitHub Release</a>
            </div>
        </div>
        <div class="changelog-section">
            <h3 class="changelog-title"><i class="fa fa-file-text-o"></i> 更新日志</h3>
            <div class="changelog-content">${logHtml}</div>
        </div>
        <div class="assets-section">${assetHtml}</div>
    </div>
</div>`;
    })
    container.innerHTML = html;
}

// 页面加载完成，批量拉取所有仓库release
window.onload = async function(){
    const resultList = [];
    for(const cfg of repoConfigList){
        try{
            const rel = await fetchLatestRelease(cfg.owner, cfg.repo);
            resultList.push({config:cfg, error:false, release:rel});
        }catch(err){
            resultList.push({config:cfg, error:true, errorMsg:err.message});
        }
    }
    renderAll(resultList);
    document.getElementById('lastUpdate').innerText = formatLocalDate(new Date());
};
</script>
</body>
</html>
