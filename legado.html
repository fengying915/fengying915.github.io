// 渲染单个版本区块
function renderBlock(item) {
    let betaTag = item.isBeta ? `<span class="beta-label">beta</span>` : "";
    let warnHtml = item.warn ? `<p class="warn-notice">${item.warn}</p>` : "";
    let logRender = marked.parse(item.mdLog);
    let assetHtml = "";
    item.assets.forEach(ast => {
        assetHtml += `<div class="download-row">${ast.name} ${ast.size}<a class="download-btn" href="${ast.url}" target="_blank">下载 (${ast.count} 次)</a></div>`;
    });
    return `
<div class="version-block">
    <h2 class="block-title">${item.title}${betaTag}</h2>
    <div class="block-desc">${item.desc}</div>
    ${warnHtml}
    <div class="meta-line">版本${item.version} &nbsp;发布${item.publishText} &nbsp;总下载 ${item.totalDL}</div>
    <div class="meta-line">仓库：<a href="https://github.com/${item.repo}" target="_blank">${item.repo}</a></div>
    <h3 class="log-heading">更新日志</h3>
    <div class="log-wrap">${logRender}</div>
    ${assetHtml}
</div>
`;
}

// 批量渲染全部区块
function renderAll(data) {
    const wrap = document.getElementById("main-content");
    let fullHtml = "";
    data.forEach(block => fullHtml += renderBlock(block));
    wrap.innerHTML = fullHtml;
}

// GH API 拉取逻辑，失败静默切静态快照
async function loadReleaseData() {
    const repoMap = [
        {repo: "refgd/legado", idx: 0},
        {repo: "Luoyacheng/legado", idx: 1},
        {repo: "Suml-1/Legado_Max", idx: 2},
        {repo: "HapeLee/legado-with-MD3", idx: 3},
        {repo: "HapeLee/legado-with-MD3", idx: 4},
        {repo: "Luoyacheng/legado", idx: 5},
        {repo: "autobcb/qysg", idx: 6},
        {repo: "autobcb/read", idx: 7}
    ];
    // 公共GH代理，规避浏览器CORS
    const proxyUrl = "https://ghapi.huchen.dev";
    try {
        for (let item of repoMap) {
            const res = await fetch(`${proxyUrl}/repos/${item.repo}/releases/latest`);
            if (!res.ok) throw new Error("limit");
            const rel = await res.json();
            const target = staticReleaseData[item.idx];
            target.version = rel.tag_name;
            target.assets = rel.assets.map(a => ({
                name: a.name,
                size: (a.size / 1024 / 1024).toFixed(1) + " MB",
                count: a.download_count,
                url: a.browser_download_url
            }));
        }
        renderAll(staticReleaseData);
    } catch (err) {
        // 跨域/403/网络错误 静默使用内置快照，无任何报错文字
        console.log("GH API 请求异常，使用本地快照", err);
        renderAll(staticReleaseData);
    }
}

// 页面加载执行
window.onload = loadReleaseData;
