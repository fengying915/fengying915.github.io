// 渲染单模块
function renderBlock(item) {
    const logHtml = marked.parse(item.logContent);
    let betaLabel = item.isBeta ? `<span class="beta-tag">beta</span>` : "";
    let warnDom = item.warn ? `<p class="warn-text">${item.warn}</p>` : "";
    let assetHtml = "";
    item.assets.forEach(ast => {
        assetHtml += `
        <div class="download-item">
            ${ast.name} ${ast.size}
            <a href="${ast.url}" target="_blank" class="download-link">下载 (${ast.count} 次)</a>
        </div>`;
    });
    return `
<div class="version-block">
    <div class="block-title">${item.title} ${betaLabel}</div>
    <div class="meta-row">${item.desc}</div>
    ${warnDom}
    <div class="meta-row">版本${item.version} &nbsp;发布${item.publishAgo} &nbsp;总下载 ${item.totalDownload}</div>
    <div class="meta-row">仓库：<a href="https://github.com/${item.repo}" target="_blank">${item.repo}</a></div>

    <h3 class="log-title">更新日志</h3>
    <div class="log-box">${logHtml}</div>

    ${assetHtml}
</div>`;
}

// 批量渲染全部区块
function renderAll(list) {
    const container = document.getElementById("container");
    let fullHtml = "";
    list.forEach(block => fullHtml += renderBlock(block));
    container.innerHTML = fullHtml;
}

// 线上API请求函数（带异常捕获，失败自动切静态快照）
async function loadGithubData() {
    const repoList = [
        {key:"refgd/legado",idx:0},
        {key:"Luoyacheng/legado",idx:1},
        {key:"Suml-1/Legado_Max",idx:2},
        {key:"HapeLee/legado-with-MD3",idx:3},
        {key:"HapeLee/legado-with-MD3",idx:4},
        {key:"Luoyacheng/legado",idx:5},
        {key:"autobcb/qysg",idx:6},
        {key:"autobcb/read",idx:7},
    ];
    try {
        // 使用公共gh代理解决跨域，替换#为真实加速下载链接
        const proxy = "https://ghapi.huchen.dev";
        for(let r of repoList) {
            const res = await fetch(`${proxy}/repos/${r.key}/releases/latest`);
            if(!res.ok) throw new Error("api limit");
            const data = await res.json();
            const target = staticData[r.idx];
            target.version = data.tag_name;
            target.assets = data.assets.map(a=>({
                name:a.name,
                size:(a.size/1024/1024).toFixed(1)+" MB",
                count:a.download_count,
                url:a.browser_download_url
            }));
        }
        renderAll(staticData);
    } catch(e) {
        // 无论跨域/403/网络错误，直接渲染内置快照，无报错提示
        console.log("GitHub API获取失败，使用本地静态快照",e);
        renderAll(staticData);
    }
}

// 页面加载执行
window.onload = function() {
    loadGithubData();
}
