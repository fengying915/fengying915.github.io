<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Github Release 卡片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    /* 目标卡片样式，复刻github项目卡片视觉 */
    .repo-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s;
    }
    .repo-card:hover {
      border-color: #58a6ff;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .repo-name {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
    }
    .repo-desc {
      font-size: 13px;
      color: #8b949e;
      min-height: 36px;
      margin-bottom: 12px;
    }
    .release-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
    }
    .tag-text {
      color: #3fb950;
      font-weight: 500;
    }
    .time-text {
      color: #8b949e;
    }
    .loading,.error-text {
      font-size:13px;color:#8b949e;padding:8px 0;
    }
    .error-text{color:#f85149;}
  </style>
</head>
<body>
<div class="card-wrap" id="container"></div>

<script>
// 仓库列表
const repos = [
  {owner:"xxx",repo:"xxx"},
  {owner:"xxx",repo:"xxx"}
];
const container = document.getElementById('container');

/**
 * ✅重点：不调用 /releases/latest
 * 请求 /repos/owner/repo/releases 取数组第0项，就是页面最上方真正最新release
 */
async function fetchRepoRelease(owner, repo){
  const url = `https://api.github.com/repos/${owner}/${repo}/releases`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`请求失败 ${res.status}`);
  const list = await res.json();
  // 第一条就是页面顶部最新，注意有可能空数组（无release）
  return list.length ? list[0] : null;
}

async function renderCard(item){
  const {owner,repo} = item;
  // 渲染loading
  const cardDom = document.createElement('div');
  cardDom.className = 'repo-card';
  cardDom.innerHTML = `
    <div class="card-header">
      <span class="repo-name">${owner}/${repo}</span>
    </div>
    <div class="repo-desc">加载中…</div>
    <div class="release-info">
      <span class="loading">正在获取版本</span>
    </div>
  `;
  container.appendChild(cardDom);

  try{
    const release = await fetchRepoRelease(owner,repo);
    if(!release){
      cardDom.querySelector('.repo-desc').textContent = "暂无发布";
      cardDom.querySelector('.release-info').innerHTML = `<span class="time-text">无Release</span>`;
      return;
    }
    const tagName = release.tag_name;
    const publishAt = new Date(release.published_at).toLocaleString();
    const body = release.body ? (release.body.slice(0,80)+"…") : "无描述";

    cardDom.querySelector('.repo-desc').textContent = body;
    cardDom.querySelector('.release-info').innerHTML = `
      <span class="tag-text">${tagName}</span>
      <span class="time-text">${publishAt}</span>
    `;
  }catch(err){
    cardDom.querySelector('.repo-desc').textContent = "获取信息异常";
    cardDom.querySelector('.release-info').innerHTML = `<span class="error-text">${err.message}</span>`;
  }
}

// 批量渲染
(async ()=>{
  for(let r of repos){
    await renderCard(r);
  }
})()
</script>
</body>
</html>
