<style>

  :root {

  }
  :root[data-theme="light"] {
    --bg: #f5f6fa;
    --bg-grad-1: #ffe0e6;
    --card: #ffffff;
    --card-hi: #ffffff;
    --panel: #ffffff;
    --panel-solid: #ffffff;
    --line: rgba(20,20,40,.08);
    --line-hi: rgba(20,20,40,.18);
    --text: #17181d;
    --text-dim: #3a3e4e;
    --sub: #6b7085;
    --hover: rgba(20,20,40,.05);
    --header-bg: rgba(255,255,255,.88);
    --drawer-bg: rgba(255,255,255,.98);
    --mask: rgba(30,30,50,.35);

  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg); color: var(--text);

    border-radius: 13px;

    border: 1px solid var(--line);
    color: var(--text);

    cursor: pointer;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);

    -webkit-background-clip: text; background-clip: text; color: transparent;

    line-height: 1.1;

  @keyframes logo-shine { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }

  /* 桌面导航行 */
  .navrow { display: none; max-width: 1280px; margin: 10px auto 0; gap: 4px; }
  .navrow .nlink {

  @media (min-width: 900px) { .navrow { display: flex; } }

  :root[data-theme="dark"] .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
  :root[data-theme="dark"] .theme-btn .moon { opacity: 0; transform: rotate(90deg) scale(.3); }
  :root[data-theme="light"] .theme-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.3); }
  :root[data-theme="light"] .theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }

  /* ============ 搜索（弹层） ============ */
  .search-pop {
    position: fixed; top: 0; left: 0; right: 0; z-index: 220;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 1px solid var(--line);

    padding-top: calc(12px + env(safe-area-inset-top));

    transition: transform .38s cubic-bezier(.34,1.2,.64,1);
    box-shadow: var(--shadow-lg);
  }
  .search-pop.show { transform: translateY(0); }
  .search-pop .sp-row {
    display: flex; align-items: center; gap: 10px;
    max-width: 1280px; margin: 0 auto;
  }
  .search-pop .search { flex: 1; }
  .search-cancel {

  }
  .search-cancel:hover { color: var(--accent); }
  .sp-hist {
    max-width: 1280px; margin: 12px auto 0;
    display: none; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .sp-hist.show { display: flex; }
  .sp-hist .sp-label { font-size: 12px; font-weight: 700; color: var(--sub); }
  .sp-hist .sp-chip {
    position: relative;
    padding: 5px 22px 5px 12px; border-radius: 16px;

  }
  .sp-hist .sp-chip:hover { color: var(--text); border-color: var(--line-hi); }

  }
  .sp-hist .sp-x:hover { background: #e5484d; color: #fff; border-color: transparent; transform: scale(1.15); }
  .sp-hist .sp-chip:hover .sp-x { opacity: 1; }
  @media (hover: hover) { .sp-hist .sp-x { opacity: .65; } .sp-hist .sp-chip:hover .sp-x { opacity: 1; } }
  .search-mask {

  .search {

  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

  }
  .search .sico { display: none; width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .search button:hover { filter: brightness(1.1); }
  .search button:active { filter: brightness(.94); transform: scale(.97); }

  /* ============ 抽屉 ============ */
  .drawer-mask {

  .nav-item {

  .nav-item.active .cnt { color: rgba(255,255,255,.85); }

  /* ============ 主内容 ============ */
  main {
    max-width: 1280px; margin: 0 auto;
    padding: 16px 16px 40px;
    position: relative; z-index: 1;
  }
  @media (max-width: 768px) {

  }

  /* ============ Hero 轮播 ============ */
  .hero-scroll {
    display: flex; gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 4px 2px 16px;
    margin: 0 -2px 8px;
    scrollbar-width: none;
  }
  .hero-scroll::-webkit-scrollbar { display: none; }
  .hero-card {
    flex: 0 0 72%; max-width: 620px;
    scroll-snap-align: start;
    aspect-ratio: 16/8.2;
    border-radius: 18px; overflow: hidden; position: relative;
    background: var(--sk-1);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    cursor: pointer;
    transition: transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s;
    animation: hero-in .6s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  @keyframes hero-in { from { opacity: 0; transform: translateY(20px) scale(.96); } to { opacity: 1; transform: none; } }
  .hero-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg), 0 0 0 1px var(--accent-glow); }
  @media (max-width: 640px) { .hero-card { flex: 0 0 90%; aspect-ratio: 16/10; border-radius: 14px; } }
  /* 老版安卓内核不支持 aspect-ratio，退化为固定高度，避免横版海报高度错乱 */
  @supports not (aspect-ratio: 16 / 8.2) {
    .hero-card { height: 300px; }
    @media (max-width: 640px) { .hero-card { height: 210px; } }
  }
  .hero-card img { transition: transform .9s cubic-bezier(.4,0,.2,1); }
  .hero-card:hover img { transform: scale(1.07); }
  .hero-card::after { content: ""; position: absolute; inset: 0; background: var(--hero-mask); pointer-events: none; }
  .hero-info {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 18px 20px; color: #fff; z-index: 3;
    display: flex; flex-direction: column; gap: 7px;
  }
  @media (max-width: 640px) { .hero-info { padding: 12px 14px; } }

    padding: 4px 11px; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);

  }
  .hero-chip {

    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hero-title {
    font-size: 21px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 2px 14px rgba(0,0,0,.7);

  }
  @media (max-width: 640px) { .hero-title { font-size: 17px; } }
  .hero-desc {
    font-size: 12.5px; opacity: .9; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .hero-play {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.3);

  .hero-dots .dot-item.on { width: 22px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent-glow); }

    border: 1px solid var(--line);
    background: var(--sk-1);
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .cont-poster .pbadge {
    position: absolute; top: 7px; left: 7px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 2;
  }
  .cont-poster .pmask { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.72)); }
  .cont-poster .presume {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    display: flex; align-items: center; gap: 6px;
    color: #fff; font-size: 11px; font-weight: 600;
  }
  .presume .picon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .presume .picon svg { width: 10px; height: 10px; fill: #fff; stroke: none; margin-left: 1px; }
  .cont-title {
    margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cont-sub { font-size: 11px; color: var(--sub); margin-top: 1px; }

  /* ============ 区块标题 ============ */
  .sec-head {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 2px 14px;
    animation: fade-up .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sec-head .bar {
    width: 4px; height: 19px; border-radius: 3px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .sec-head h2 { font-size: 17px; font-weight: 800; letter-spacing: .3px; color: var(--text); white-space: nowrap; }
  .sec-head .sub { font-size: 12px; color: var(--sub); white-space: nowrap; margin-top: 2px; }
  .sec-head .more {
    margin-left: auto; font-size: 13px; font-weight: 600;
    color: var(--sub); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 3px;
    padding: 5px 10px; border-radius: 18px;
    transition: all .25s;
  }
  .sec-head .more:hover { color: var(--accent); background: var(--hover); }
  .sec-head .more svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }

  /* ============ 筛选条 ============ */
  .filters { display: flex; flex-direction: column; gap: 9px; margin: 4px 0 16px; }
  .frow { display: flex; align-items: center; gap: 8px; }
  .frow .flabel { font-size: 12px; font-weight: 700; color: var(--sub); flex-shrink: 0; width: 34px; }
  .frow .fchips {
    display: flex; gap: 7px;
    overflow-x: auto; scrollbar-width: none;
    padding: 2px 0;
  }
  .frow .fchips::-webkit-scrollbar { display: none; }
  .fchip {
    flex-shrink: 0;
    padding: 6px 13px; border-radius: 18px;
    background: var(--chip-bg);
    border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 500;
    color: var(--text-dim);
    cursor: pointer; user-select: none;
    transition: all .22s cubic-bezier(.34,1.4,.64,1);
    white-space: nowrap;
  }
  .fchip:hover { color: var(--text); border-color: var(--line-hi); transform: translateY(-1px); }
  .fchip.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 5px 16px var(--accent-glow);
  }

  /* ============ 卡片网格 ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  /* minmax(0,1fr)：避免长标题/标签把某一列撑宽导致卡片大小不一 */
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 18px; } }

  .card { background: transparent; cursor: pointer; position: relative; animation: card-in .5s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes card-in { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
  .card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.06s}
  .card:nth-child(4){animation-delay:.08s}.card:nth-child(5){animation-delay:.1s}.card:nth-child(6){animation-delay:.12s}
  .card:nth-child(7){animation-delay:.14s}.card:nth-child(8){animation-delay:.16s}.card:nth-child(9){animation-delay:.18s}
  .card:nth-child(n+10){animation-delay:.2s}
  .card:active { transform: scale(.97); }

  /* 封面框固定 3:4：用 padding 撑高（padding 百分比按卡片列宽计算），
     不依赖 aspect-ratio，老版安卓 WebView / X5 内核下尺寸同样一致 */
  .thumb {
    position: relative;
    height: 0;
    padding-top: 133.34%;
    background: var(--sk-1);
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line);
    transition: box-shadow .35s, border-color .35s, transform .35s cubic-bezier(.34,1.4,.64,1);
  }
  .thumb::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 55%;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.3) 50%, rgba(0,0,0,.78) 100%);
    pointer-events: none; z-index: 2;
  }
  .thumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .6s cubic-bezier(.34,1.2,.64,1);
  }
  @media (hover: hover) {
    .card:hover .thumb {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 38px rgba(0,0,0,.4), 0 0 0 1px var(--accent-glow), 0 0 34px var(--accent-glow);
      z-index: 4;
    }
    .card:hover .thumb img { transform: scale(1.08); }
    .card:hover .card-title { color: var(--accent); }
  }

  .badge-new, .badge-hot, .badge-rank {
    position: absolute; top: 8px; z-index: 3;
    font-size: 10.5px; font-weight: 800;
    padding: 3px 9px; border-radius: 14px;
    letter-spacing: .5px;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  .badge-new { left: 8px; background: linear-gradient(135deg, #22c55e, #4ade80); color: #fff; }
  .badge-hot { left: 8px; background: linear-gradient(135deg, #ff4d6d, #ff7a45); color: #fff; }
  .badge-rank {
    left: 8px; min-width: 26px; text-align: center;
    background: rgba(0,0,0,.62); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .badge-rank.r1 { background: linear-gradient(135deg, var(--rank-1), #ff8fa3); border: none; }
  .badge-rank.r2 { background: linear-gradient(135deg, var(--rank-2), #ffc46b); border: none; }
  .badge-rank.r3 { background: linear-gradient(135deg, var(--rank-3), #ffe3a3); border: none; color: #5c4300; }

  .thumb-plays {
    position: absolute; bottom: 8px; left: 9px; right: 9px; z-index: 3;
    display: flex; align-items: center; gap: 4px;
    color: #fff; font-size: 11px; font-weight: 600;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .thumb-plays svg { width: 11px; height: 11px; fill: currentColor; stroke: none; flex-shrink: 0; }
  .thumb-plays .rem { margin-left: auto; font-size: 10.5px; opacity: .95; }

  .card-title {
    padding: 8px 2px 0;
    font-size: 13px; line-height: 1.42; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .25s; letter-spacing: .2px;
  }
  @media (max-width: 640px) { .card-title { font-size: 12px; } }
  /* 固定行高，保证有标签/无标签的卡片总高一致 */
  .card-tags { display: flex; gap: 5px; margin-top: 5px; overflow: hidden; min-height: 23px; }
  .ctag {
    flex-shrink: 0;
    font-size: 10.5px; font-weight: 600;
    padding: 2.5px 8px; border-radius: 10px;
    background: var(--chip-bg);
    color: var(--sub);
    border: 1px solid var(--line);
    white-space: nowrap;
    cursor: pointer;
    transition: all .2s;
  }
  .ctag:hover { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  @media (max-width: 640px) { .card-tags .ctag:nth-child(n+3) { display: none; } }

  .card-del {
    position: absolute; top: 6px; right: 6px; z-index: 5;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; line-height: 1;
    opacity: 0; transition: all .25s;
  }
  .card:hover .card-del, .card-del.always { opacity: 1; }
  .card-del:hover { background: #e5484d; transform: scale(1.1); }
  @media (hover: none) { .card-del { opacity: 1; } }

  .hist-prog { height: 4px; border-radius: 3px; background: var(--chip-bg); margin-top: 7px; overflow: hidden; }
  .hist-prog i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .card-sub { font-size: 11px; color: var(--sub); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .skel .thumb { background: linear-gradient(90deg, var(--sk-1), var(--sk-2), var(--sk-1)); background-size: 200% 100%; animation: sk 1.6s ease-in-out infinite; }
  .skel .card-title { background: var(--sk-1); color: transparent; border-radius: 5px; height: 16px; margin-top: 8px; }
  .skel .card-tags { visibility: hidden; }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ============ 分页 ============ */
  .pager {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 26px 0 6px; flex-wrap: wrap;
  }
  .pager button, .pager .pg-info {
    min-width: 42px; height: 42px; padding: 0 15px;
    border-radius: 11px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text); font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all .28s;
    display: flex; align-items: center; justify-content: center;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); transform: translateY(-2px); }
  .pager button:active:not(:disabled) { transform: scale(.94); }
  .pager button:disabled { opacity: .3; cursor: not-allowed; }
  .pager .pg-info { background: transparent; border: none; cursor: default; color: var(--sub); font-weight: 500; }
  .pager .pg-info b { color: var(--accent); margin: 0 3px; font-size: 15px; font-weight: 800; }
  .pager .goto input {
    width: 62px; height: 42px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    color: var(--text); text-align: center;
    font-size: 13.5px; font-weight: 600; outline: none;
    transition: all .28s; font-family: inherit;
  }
  .pager .goto input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
  .pager .goto input::-webkit-outer-spin-button,
  .pager .goto input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ============ 列表页工具行 ============ */
  .list-tools {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 2px 14px;
    animation: fade-up .4s cubic-bezier(.34,1.56,.64,1);
  }
  .list-tools .bar { width: 4px; height: 19px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px var(--accent-glow); flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
  .list-tools h2 { font-size: 17px; font-weight: 800; letter-spacing: .3px; }
  .list-tools .total { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .list-tools .act {
    margin-left: auto;
    padding: 7px 14px; border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--card); color: var(--sub);
    font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: all .25s;
    white-space: nowrap;
  }
  .list-tools .act:hover { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; box-shadow: 0 6px 18px var(--accent-glow); }

  /* ============ 详情 & 播放器 ============ */
  .player-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 10px;
    animation: fade-up .4s cubic-bezier(.34,1.56,.64,1);
  }
  .toolbar-right { display: flex; gap: 8px; align-items: center; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    padding: 9px 15px; cursor: pointer; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    transition: all .28s;
    white-space: nowrap;
  }
  .back-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateX(-3px); box-shadow: 0 6px 18px var(--accent-glow); }
  .fav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600;
    padding: 9px 14px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text-dim); cursor: pointer; transition: all .28s;
    white-space: nowrap;
  }
  .fav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fav-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 6px 18px var(--accent-glow); }
  .fav-btn.on { color: var(--accent); border-color: var(--accent); background: var(--hover); }
  .fav-btn.on svg { fill: var(--accent); stroke: var(--accent); }
  .close-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--card); color: var(--sub);
    border: 1px solid var(--line);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .35s; padding: 0; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--hover); color: var(--accent); border-color: var(--accent); transform: rotate(90deg) scale(1.08); }

  .player-wrap {
    position: relative; width: 100%;
    background: #000;
    border-radius: 18px; overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow-lg), 0 0 50px var(--accent-glow-2);
    border: 1px solid var(--line);
    animation: fade-up .45s cubic-bezier(.34,1.56,.64,1);
  }
  video { width: 100%; display: block; background: #000; max-height: 76vh; }

  .detail-head {
    display: flex; gap: 16px;
    margin-bottom: 18px;
    animation: fade-up .5s cubic-bezier(.34,1.56,.64,1) backwards;
    animation-delay: .08s;
  }
  .detail-head .poster {
    width: 128px; height: 171px; flex-shrink: 0;
    border-radius: 16px; overflow: hidden;
    background: var(--sk-1); border: 1px solid var(--line);
    box-shadow: var(--shadow-md), 0 0 26px var(--accent-glow-2);
  }
  @media (max-width: 560px) { .detail-head .poster { width: 100px; height: 133px; } .detail-head { gap: 12px; } }
  .detail-info { min-width: 0; padding-top: 2px; }
  .detail-info h1 { font-size: 19px; line-height: 1.38; margin-bottom: 10px; font-weight: 800; letter-spacing: .3px; }
  @media (max-width: 560px) { .detail-info h1 { font-size: 16.5px; } }
  .detail-info .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .tag {
    font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 20px;
    background: var(--chip-bg); color: var(--sub);
    border: 1px solid var(--line);
  }
  .tag.tg { cursor: pointer; transition: all .22s; }
  .tag.tg:hover {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    box-shadow: 0 5px 16px var(--accent-glow);
    transform: translateY(-1px);
  }
  .hash { color: var(--accent); font-weight: 900; }
  .tag.accent {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .desc {
    font-size: 12.5px; line-height: 1.75; color: var(--sub);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer; transition: color .25s;
    white-space: pre-line;
  }
  .desc.open { display: block; }
  .desc:hover { color: var(--text-dim); }

  .ep-section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 800;
    margin: 20px 0 12px; letter-spacing: .3px;
  }
  .ep-section-title::before {
    content: ""; width: 4px; height: 17px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 10px var(--accent-glow); flex-shrink: 0;
  }
  .episodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 9px; }
  @media (max-width: 640px) { .episodes { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; } }
  .ep {
    background: var(--panel-solid);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 5px;
    font-size: 12px; font-weight: 600;
    color: var(--sub); text-align: center;
    cursor: pointer; transition: all .25s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    user-select: none;
  }
  .ep:hover { color: var(--text); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 16px var(--accent-glow); }
  .ep.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent; font-weight: 800;
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  .empty { text-align: center; padding: 80px 20px; color: var(--sub); font-size: 14px; font-weight: 500; }
  .empty .ico { font-size: 50px; margin-bottom: 16px; opacity: .45; }
  .empty .eact {
    display: inline-block; margin-top: 16px;
    padding: 9px 22px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 22px var(--accent-glow);
    transition: transform .25s;
  }
  .empty .eact:hover { transform: translateY(-2px); }

  .player-error {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.82);
    color: #fff; gap: 16px;
    font-size: 14px; font-weight: 500;
    padding: 24px; text-align: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 5;
  }
  .player-error button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
    padding: 11px 26px; border-radius: 11px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 26px var(--accent-glow);
    transition: all .3s;
  }
  .player-error button:hover { transform: translateY(-2px) scale(1.04); }

  .topbar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    background-size: 200% 100%;
    width: 0; z-index: 999;
    transition: width .3s cubic-bezier(.34,1.4,.64,1);
    box-shadow: 0 0 14px var(--accent-glow);
    border-radius: 0 3px 3px 0;
    animation: topbar-shine 2s linear infinite;
  }
  @keyframes topbar-shine { 0%{background-position:0% 0} 100%{background-position:200% 0} }

  /* ============ 手机底部导航 ============ */
  .bottom-nav {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0; z-index: 150;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .bnav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    padding: 5px 2px;
    color: var(--sub); font-size: 10.5px; font-weight: 600;
    cursor: pointer; user-select: none;
    border-radius: 12px;
    transition: color .25s, background .25s;
    position: relative;
  }
  .bnav-item svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .bnav-item.on { color: var(--accent); }
  .bnav-item.on svg { transform: translateY(-1.5px) scale(1.12); }

<script>
/* ============================================================
   禁果短剧 · 单文件版
   打开 HTML 即用：登录、数据、视频全部经 CORS 代理转发
   默认代理：https://jsnzkpg4.pages.dev/（netnr/workers 风格）
   可用 ?proxy=https://你的代理/ 或侧边栏“更换代理”覆盖
   ============================================================ */
"use strict";

const API_ORIGIN   = "https://jinguoduanju.me";
const API_TARGET   = API_ORIGIN + "/api/v1";
const DEFAULT_PROXY = "https://jsnzkpg4.pages.dev/";
const LS_PROXY     = "jinguo_proxy";
const LS_TOKEN     = "jinguo_token_v1";
const LS_DEVICE    = "jinguo_device_v1";

const _QS = new URLSearchParams(location.search);

function normalizeProxy(v) {
  v = String(v || "").trim();
  if (!v) return DEFAULT_PROXY;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  return v.replace(/\/+$/, "") + "/";
}

function readStoredProxy() {
  try { return localStorage.getItem(LS_PROXY) || ""; } catch (e) { return ""; }
}

const PROXY_BASE = normalizeProxy(_QS.get("proxy") || readStoredProxy() || DEFAULT_PROXY);
const API_ROOT   = PROXY_BASE + API_TARGET;

const PAGE_SIZE   = 24;
const SEARCH_SIZE = 30;
const RANK_LIMIT  = 100;
const TAG_ROWS    = ["都市", "校园", "古装", "NTR", "绿帽", "后宫", "穿越"];

const NAV_FALLBACK = [
  { id: 2, frontendName: "全部" },
  { id: 7, frontendName: "原创精品" },
  { id: 3, frontendName: "单体作品" },
  { id: 6, frontendName: "动漫改编" },
  { id: 5, frontendName: "影视改编" }
];

const LS_FAV    = "jinguo_fav_v1";
const LS_HIST   = "jinguo_hist_v1";
const LS_SEARCH = "jinguo_search_v1";
const LS_THEME  = "jinguo_theme";

const state = {
  mode: "home",
  navId: "2",
  sort: "latest",
  tags: [],
  catTitle: "全部片库",
  pg: 1,
  pageSize: PAGE_SIZE,
  fullList: [],
  list: [],
  pagecount: 1,
  total: 0,
  heroList: [],
  modules: [],
  keyword: "",
  tagName: "",
  loading: false,
  detail: null,
  episodes: [],
  currentEp: 0,
  resume: null,
  hls: null,
  hlsWait: 0,
  savedScrollY: 0,
  backTo: "home",
  navs: NAV_FALLBACK.slice(),
  filterGroups: []
};

const CAT = {
  latest: [],
  hot: [],
  popular: [],
  byNav: new Map(),
  navs: [],
  filters: [],
  newIds: new Set(),
  ready: null
};

/* ============================ 基础工具 ============================ */
function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function fmtPlays(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "亿";
  if (n >= 10000) return Math.round(n / 10000) + "W";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}

function fmtTime(sec) {
  sec = Math.floor(sec || 0);
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + "分钟前";
  if (s < 86400) return Math.floor(s / 3600) + "小时前";
  if (s < 2592000) return Math.floor(s / 86400) + "天前";
  return new Date(ts).toLocaleDateString("zh-CN");
}

function mediaUrl(u) {
  u = String(u || "").trim();
  if (!u) return "";
  if (/^https?:\/\//i.test(u)) return u;
  return API_ORIGIN + (u.charAt(0) === "/" ? u : "/" + u);
}

function coverUrl(u, w) {
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) return u;
  const width = Math.round(w || 300);
  const height = Math.round(width * 4 / 3);
  return "https://images.weserv.nl/?url=" + encodeURIComponent(u) +
         "&w=" + width + "&h=" + height + "&fit=cover&output=webp&q=72";
}

function imgAttrs(pic, w, lazy) {
  if (!pic) return ' src=""';
  const src = coverUrl(pic, w);
  const fallback = src !== pic
    ? ' data-fb="' + esc(pic) + '" onerror="if(this.dataset.fb){this.onerror=null;this.src=this.dataset.fb}"'
    : ' onerror="this.style.opacity=0"';
  return ' src="' + esc(src) + '"' + fallback +
         (lazy ? ' loading="lazy"' : "") +
         ' decoding="async" referrerpolicy="no-referrer" alt=""';
}

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1900);
}

function progress(on) {
  const bar = $("topbar");
  if (!bar) return;
  if (on) { bar.style.width = "70%"; bar.style.opacity = "1"; }
  else {
    bar.style.width = "100%";
    setTimeout(function () { bar.style.opacity = "0"; bar.style.width = "0"; }, 300);
  }
}

/* ============================ 本地存储 ============================ */
function lsGet(k, fb) {
  try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; }
  catch (e) { return fb; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function getFav() { const v = lsGet(LS_FAV, []); return Array.isArray(v) ? v : []; }
function isFav(id) { return getFav().some(function (x) { return x.id === String(id); }); }
function toggleFav(rec) {
  let fav = getFav();
  const id = String(rec.id);
  if (fav.some(function (x) { return x.id === id; })) {
    lsSet(LS_FAV, fav.filter(function (x) { return x.id !== id; }));
    return false;
  }
  fav.unshift({ id: id, name: rec.name, pic: rec.pic, remark: rec.remark || "", tags: rec.tags || [], ts: Date.now() });
  if (fav.length > 300) fav.length = 300;
  lsSet(LS_FAV, fav);
  return true;
}
function removeFav(id) { lsSet(LS_FAV, getFav().filter(function (x) { return x.id !== String(id); })); }

function getHist() { const v = lsGet(LS_HIST, []); return Array.isArray(v) ? v : []; }
function upsertHist(rec) {
  let h = getHist().filter(function (x) { return x.id !== String(rec.id); });
  h.unshift(Object.assign({ ts: Date.now() }, rec, { id: String(rec.id) }));
  if (h.length > 100) h.length = 100;
  lsSet(LS_HIST, h);
}
function saveProgress(id, ep, epTitle, pos, dur) {
  const h = getHist();
  const item = h.find(function (x) { return x.id === String(id); });
  if (!item) return;
  item.ep = ep;
  item.epTitle = epTitle || item.epTitle;
  item.pos = Math.floor(pos || 0);
  item.dur = Math.floor(dur || 0);
  item.ts = Date.now();
  lsSet(LS_HIST, h);
}
function removeHist(id) { lsSet(LS_HIST, getHist().filter(function (x) { return x.id !== String(id); })); }

/* ============================ 登录 / 数据层 ============================ */
let AUTH_PENDING = null;

function getDeviceId() {
  try {
    let d = localStorage.getItem(LS_DEVICE);
    if (!d) {
      const uuid = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : (Date.now().toString(36) + "-" + Math.random().toString(36).slice(2));
      d = "h5:jinguo-web-" + uuid;
      localStorage.setItem(LS_DEVICE, d);
    }
    return d;
  } catch (e) {
    return "h5:jinguo-web-3f7c2a90-5d1b-4e8a-9c63-2b7d4f1a6e08";
  }
}

function getToken() {
  try { return localStorage.getItem(LS_TOKEN) || ""; } catch (e) { return ""; }
}
function setToken(t) {
  try { if (t) localStorage.setItem(LS_TOKEN, t); else localStorage.removeItem(LS_TOKEN); } catch (e) {}
}

async function authDevice() {
  if (AUTH_PENDING) return AUTH_PENDING;
  AUTH_PENDING = (async function () {
    const res = await fetch(API_ROOT + "/auth/device", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ deviceId: getDeviceId() }),
      cache: "no-store"
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) {}
    if (!res.ok || !data || !data.token) {
      const msg = (data && (data.message || data.error)) || ("设备登录失败（HTTP " + res.status + "）");
      throw new Error(msg);
    }
    setToken(data.token);
    return data.token;
  })();
  try { return await AUTH_PENDING; }
  finally { AUTH_PENDING = null; }
}

async function ensureToken(force) {
  if (!force) {
    const t = getToken();
    if (t) return t;
  }
  return authDevice();
}

async function jget(path, retried) {
  const token = await ensureToken(false);
  let res;
  try {
    res = await fetch(API_ROOT + path, {
      headers: { "Accept": "application/json", "Authorization": "Bearer " + token },
      cache: "default"
    });
  } catch (e) {
    throw new Error("网络请求失败，请检查 CORS 代理是否可用");
  }
  if (res.status === 401 && !retried) {
    setToken("");
    return jget(path, true);
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; }
  catch (e) {
    if (res.status === 429) throw new Error("代理请求过于频繁，请稍后重试或更换代理");
    throw new Error("接口返回格式异常（HTTP " + res.status + "），请检查代理地址");
  }
  if (!res.ok) {
    let msg = (data && (data.message || data.error)) || ("请求失败 " + res.status);
    if (res.status === 401) msg = "登录状态已失效，请重试";
    else if (res.status === 429) msg = "代理请求过于频繁，请稍后重试";
    else if (res.status >= 500) msg = "上游服务暂时不可用，请稍后重试";
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return data;
}

function toVod(it) {
  if (!it || it.id == null) return null;
  const eps = Number(it.episodeCount) || 0;
  const tags = Array.isArray(it.tags) ? it.tags.map(String).filter(Boolean) : [];
  const vip = it.filmType === "VIP";
  return {
    vod_id: String(it.id),
    vod_name: String(it.title || ("短剧 " + it.id)),
    vod_pic: mediaUrl(it.coverUrl),
    vod_remarks: eps > 1 ? ("全" + eps + "集") : (vip ? "VIP" : "单集"),
    vod_plays: it.likeCount ? (fmtPlays(it.likeCount) + "赞")
             : (it.followCount ? (fmtPlays(it.followCount) + "收藏") : ""),
    vod_badge: vip ? "vip" : (CAT.newIds.has(String(it.id)) ? "new" : ""),
    vod_tags: tags.slice(0, 3),
    _tags: tags,
    vod_intro: String(it.subtitle || "").trim(),
    vod_episodes: eps,
    vod_likes: Number(it.likeCount) || 0,
    vod_follows: Number(it.followCount) || 0
  };
}

async function bootstrapData() {
  if (CAT.ready) return CAT.ready;
  CAT.ready = (async function () {
    const latest = await jget("/dramas?sort=latest&navigationId=2");
    const side = await Promise.all([
      jget("/top-navigation").catch(function () { return []; }),
      jget("/filter-config").catch(function () { return []; })
    ]);
    const navs = side[0];
    const filters = side[1];

    if (!Array.isArray(latest) || !latest.length) throw new Error("片库暂时为空");

    CAT.newIds = new Set(latest.slice(0, 18).map(function (d) { return String(d.id); }));
    CAT.latest = latest.map(toVod).filter(Boolean);
    CAT.popular = CAT.latest.slice().sort(function (a, b) {
      const sa = a.vod_follows * 4 + a.vod_likes * 2;
      const sb = b.vod_follows * 4 + b.vod_likes * 2;
      return sb - sa || (Number(b.vod_id) - Number(a.vod_id));
    });
    if (!CAT.popular.some(function (v) { return v.vod_follows || v.vod_likes; })) {
      CAT.popular = CAT.latest.slice();
    }
    CAT.hot = CAT.popular;
    CAT.navs = (Array.isArray(navs) ? navs : []).filter(function (n) {
      return n && n.active !== false && n.id != null;
    });
    CAT.filters = (Array.isArray(filters) ? filters : []).filter(function (g) {
      return g && g.active !== false && g.frontendVisible !== false && Array.isArray(g.tags) && g.tags.length;
    });

    state.navs = CAT.navs.length ? CAT.navs : NAV_FALLBACK.slice();
    state.filterGroups = CAT.filters.map(function (g) {
      const seen = new Set();
      const tags = g.tags.filter(function (t) {
        if (!t || t.active === false || t.frontendVisible === false || !t.name) return false;
        if (seen.has(t.name)) return false;
        seen.add(t.name);
        return true;
      }).map(function (t) { return t.name; });
      return { name: g.name || "标签", tags: tags };
    }).filter(function (g) { return g.tags.length; });

    renderNav();
  })();

  try { await CAT.ready; }
  catch (e) { CAT.ready = null; throw e; }
  return CAT.ready;
}

async function navData(navId, sort) {
  navId = String(navId || "2");
  sort = sort || "latest";
  if (navId === "2") {
    await bootstrapData();
    if (sort === "hot") return CAT.popular.length ? CAT.popular : CAT.hot;
    return CAT.latest;
  }
  const key = navId + "|" + sort;
  if (CAT.byNav.has(key)) return CAT.byNav.get(key);
  let arr;
  try {
    arr = await jget("/dramas?sort=" + encodeURIComponent(sort) + "&navigationId=" + encodeURIComponent(navId));
  } catch (e) {
    arr = await jget("/dramas?sort=latest&navigationId=" + encodeURIComponent(navId));
  }
  let list = (Array.isArray(arr) ? arr : []).map(toVod).filter(Boolean);
  if (sort === "hot") {
    list = list.slice().sort(function (a, b) {
      const sa = a.vod_follows * 4 + a.vod_likes * 2;
      const sb = b.vod_follows * 4 + b.vod_likes * 2;
      return sb - sa || (Number(b.vod_id) - Number(a.vod_id));
    });
  }
  CAT.byNav.set(key, list);
  return list;
}

function buildHome() {
  const latest = CAT.latest;
  const hot = CAT.popular.length ? CAT.popular : CAT.hot;
  const heroes = hot.slice(0, 6);
  const modules = [
    { code: "latest", title: "最新上线", list: latest.slice(0, 12), total: latest.length },
    { code: "hot", title: "人气热播", list: hot.slice(0, 12), total: hot.length }
  ];

  const multiAll = latest.filter(function (v) { return v.vod_episodes > 1; });
  if (multiAll.length >= 4) {
    modules.push({ code: "multi", title: "多集连播", list: multiAll.slice(0, 12), total: multiAll.length });
  }

  TAG_ROWS.forEach(function (tag) {
    const all = latest.filter(function (v) { return v._tags.indexOf(tag) >= 0; });
    if (all.length >= 4) {
      modules.push({ code: "tag:" + tag, title: tag + "精选", list: all.slice(0, 12), total: all.length });
    }
  });
  return { hero: heroes, modules: modules };
}

async function dataSearch(kw) {
  let arr = null;
  try {
    arr = await jget("/dramas?q=" + encodeURIComponent(kw) + "&sort=latest&navigationId=2");
  } catch (e) { arr = null; }
  let list = (Array.isArray(arr) ? arr : []).map(toVod).filter(Boolean);

  if (!list.length) {
    try { await bootstrapData(); } catch (e) {}
    const k = String(kw).toLowerCase();
    list = CAT.latest.filter(function (v) {
      return v.vod_name.toLowerCase().indexOf(k) >= 0 ||
             v._tags.some(function (t) { return t.toLowerCase().indexOf(k) >= 0; });
    });
  }

  const seen = new Set();
  return list.filter(function (v) {
    if (seen.has(v.vod_id)) return false;
    seen.add(v.vod_id);
    return true;
  });
}

async function dataDetail(id) {
  const raw = await jget("/dramas/" + encodeURIComponent(id));
  const drama = raw.drama || {};
  let eps = Array.isArray(raw.episodes) ? raw.episodes.slice() : [];
  eps.sort(function (a, b) { return (Number(a.number) || 0) - (Number(b.number) || 0); });

  const base = toVod(drama) || { vod_id: String(id), vod_name: "短剧", vod_tags: [] };
  const episodes = eps.map(function (e, i) {
    const num = Number(e.number) || (i + 1);
    return {
      id: e.id,
      num: num,
      title: String(e.title || ("第" + num + "集")).trim(),
      locked: !!e.locked,
      duration: Number(e.durationSeconds) || 0
    };
  });

  return {
    detail: Object.assign({}, base, {
      vod_content: String(raw.description || drama.subtitle || "").trim(),
      vod_remarks: episodes.length > 1 ? ("全" + episodes.length + "集") : "单集",
      vod_play_from: "禁果专线"
    }),
    episodes: episodes
  };
}

async function dataPlay(epId) {
  const d = await jget("/episodes/" + encodeURIComponent(epId) + "/play");
  const url = d && (d.videoUrl || d.url);
  if (!url) throw new Error("未获取到播放地址");
  if (d.allowance && d.allowance.allowed === false) throw new Error("本集暂不可播放");
  return { url: String(url), resume: Number(d.resumeSeconds) || 0 };
}

/* ============================ 视图工具 ============================ */
function cardHtml(v, i, opts) {
  opts = opts || {};
  const rank = opts.rank;
  const badgeHtml = rank
    ? '<span class="badge-rank r' + Math.min(rank, 3) + '">' + (rank <= 3 ? "TOP" : "") + rank + "</span>"
    : (v.vod_badge === "new" ? '<span class="badge-new">新</span>'
      : (v.vod_badge === "vip" ? '<span class="badge-vip">VIP</span>'
        : (v.vod_badge === "hot" ? '<span class="badge-hot">热</span>' : "")));
  const tags = (v.vod_tags || []).slice(0, 2).map(function (t) {
    return '<span class="ctag" data-tag="' + esc(t) + '">' + esc(t) + "</span>";
  }).join("");
  const del = opts.del ? '<span class="card-del' + (opts.delAlways ? " always" : "") + '" data-del="1" title="移除">✕</span>' : "";
  const extra = opts.hist
    ? '<div class="hist-prog"><i style="width:' + Math.min(100, Math.round((v.pos || 0) / (v.dur || 1) * 100)) + '%"></i></div>' +
      '<div class="card-sub">' + esc(v.epTitle || ("第" + (v.ep || 1) + "集")) + " · " + fmtTime(v.pos || 0) +
      (v.dur ? " / " + fmtTime(v.dur) : "") + "</div>"
    : (opts.sub ? '<div class="card-sub">' + esc(opts.sub) + "</div>" : "");
  return '' +
    '<div class="card" data-i="' + i + '">' +
      '<div class="thumb">' +
        badgeHtml + del +
        "<img" + imgAttrs(v.vod_pic, opts.w || 300, true) + ">" +
        ((v.vod_plays || v.vod_remarks) ? '<div class="thumb-plays">' +
          (v.vod_plays ? '<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>' + esc(v.vod_plays) : "") +
          (v.vod_remarks ? '<span class="rem">' + esc(v.vod_remarks) + "</span>" : "") +
        "</div>" : "") +
      "</div>" +
      '<div class="card-title">' + esc(v.vod_name) + "</div>" +
      '<div class="card-tags">' + tags + "</div>" +
      extra +
    "</div>";
}

function bindCards(gridEl, list, onOpen, onDel) {
  if (!gridEl) return;
  gridEl.querySelectorAll(".card").forEach(function (node) {
    node.onclick = function (e) {
      const i = +node.dataset.i;
      const tagEl = e.target.closest(".ctag");
      if (tagEl) { e.stopPropagation(); goTag(tagEl.dataset.tag); return; }
      if (e.target.closest(".card-del")) {
        e.stopPropagation();
        if (onDel) onDel(list[i], i);
        return;
      }
      if (onOpen) onOpen(list[i], i);
    };
  });
}

function resetView() {
  saveCurrentProgress();
  destroyPlayer();
  closeSearch();
  closeDrawer();
  state.detail = null;
  state.episodes = [];
  state.resume = null;
}

function goHome() {
  resetView();
  state.mode = "home";
  state.backTo = "home";
  state.savedScrollY = 0;
  const wd = $("wd"); if (wd) wd.value = "";
  renderNav();
  const hasCache = (state.modules || []).length > 0;
  if (hasCache) renderHome(); else renderSkeletonHome();
  window.scrollTo(0, 0);
  if (!hasCache) progress(true);
  bootstrapData().then(function () {
    if (state.mode !== "home") return;
    const home = buildHome();
    state.heroList = home.hero;
    state.modules = home.modules;
    renderHome();
  }).catch(function (e) {
    if (!hasCache) renderEmpty("加载失败：" + esc(e.message || "网络错误"), "重试", "goHome()");
  }).finally(function () { progress(false); });
}

function goRank() {

  state.mode = "rank";
  state.backTo = "rank";
  state.catTitle = "排行榜";

  state.fullList = [];

  renderListSkeleton();

function switchNav(id) {
  openCategory({ navId: String(id), title: navName(id) });

function openCategory(opts) {
  opts = opts || {};
  resetView();
  state.mode = "category";
  state.backTo = "category";
  if (opts.navId != null) state.navId = String(opts.navId);
  if (opts.sort) state.sort = opts.sort;
  if (opts.tags) state.tags = opts.tags.slice();
  state.catTitle = opts.title || (state.tags.length ? state.tags.join(" · ") : navName(state.navId));
  state.pg = 1;
  state.fullList = [];
  state.savedScrollY = 0;
  closeDrawer();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  loadCategory();
}

async function loadCategory() {
  if (state.loading) return;
  state.loading = true;
  progress(true);
  try {
    await bootstrapData();
    if (state.mode !== "category") return;
    let full = await navData(state.navId, state.sort);
    if (state.tags.length) {
      full = full.filter(function (v) {
        return state.tags.every(function (t) { return v._tags.indexOf(t) >= 0; });
      });
    }
    state.fullList = full;
    state.pageSize = PAGE_SIZE;
    state.total = full.length;
    state.pagecount = Math.max(1, Math.ceil(full.length / PAGE_SIZE));
    state.pg = Math.min(state.pg, state.pagecount);
    renderListPage();
  } catch (e) {
    renderEmpty("加载失败：" + esc(e.message || "网络错误"), "重试", "loadCategory()");
  } finally {
    state.loading = false;
    progress(false);
  }
}

function goTag(tag) {
  if (!tag) return;
  resetView();
  state.mode = "tag";
  state.backTo = "tag";
  state.tagName = String(tag);
  state.pg = 1;
  state.fullList = [];
  state.total = 0;
  state.savedScrollY = 0;
  closeDrawer();
  closeSearch();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  loadTag();
}

async function loadTag() {
  progress(true);
  try {
    await bootstrapData();
    if (state.mode !== "tag") return;
    state.fullList = CAT.latest.filter(function (v) { return v._tags.indexOf(state.tagName) >= 0; });
    state.pageSize = PAGE_SIZE;
    state.total = state.fullList.length;
    state.pagecount = Math.max(1, Math.ceil(state.total / PAGE_SIZE));
    state.pg = 1;
    renderListPage();
  } catch (e) {
    renderEmpty("加载失败：" + esc(e.message || "网络错误"), "重试", "loadTag()");
  } finally {
    progress(false);
  }
}

function openCustomList(title, list) {

function openModule(code) {
  if (!code) return;
  if (code === "latest") return openCategory({ navId: "2", sort: "latest", title: "最新上线" });
  if (code === "hot") return openCategory({ navId: "2", sort: "hot", title: "人气热播" });
  if (code === "multi") {
    return openCustomList("多集连播", CAT.latest.filter(function (v) { return v.vod_episodes > 1; }));
  }
  if (code.indexOf("tag:") === 0) return goTag(code.slice(4));
}

    const groups = state.filterGroups || [];
    filtersHtml = '<div class="filters">' +
      '<div class="frow"><span class="flabel">分区</span><div class="fchips">' +
        navs.map(function (n) {
          return '<span class="fchip ' + (String(state.navId) === String(n.id) ? "on" : "") +
            '" data-nav="' + n.id + '">' + esc(n.frontendName || n.name || "全部") + "</span>";
        }).join("") +
      "</div></div>" +
      '<div class="frow"><span class="flabel">排序</span><div class="fchips">' +
        '<span class="fchip ' + (state.sort === "latest" ? "on" : "") + '" data-sort="latest">最新</span>' +
        '<span class="fchip ' + (state.sort === "hot" ? "on" : "") + '" data-sort="hot">最热</span>' +
      "</div></div>" +
      groups.map(function (g) {
        return '<div class="frow"><span class="flabel">' + esc(g.name) + '</span><div class="fchips">' +
          g.tags.map(function (t) {
            return '<span class="fchip ' + (state.tags.indexOf(t) >= 0 ? "on" : "") +
              '" data-ftag="' + esc(t) + '">' + esc(t) + "</span>";
          }).join("") +
        "</div></div>";
      }).join("") +
      (state.tags.length ? '<div class="frow"><span class="flabel"></span><div class="fchips">' +
        '<span class="fchip" data-clear="1">清空筛选 ✕</span></div></div>' : "") +
    "</div>";
  }

  const cards = state.list.map(function (v, i) {
    return cardHtml(v, i, { w: 300, rank: isRank ? offset + i + 1 : 0 });
  }).join("");

  const pg = state.pg;
  const pagecount = Math.max(1, state.pagecount);
  const pagerHtml = pagecount > 1 ? (
    '<div class="pager">' +
      '<button id="pgFirst" ' + (pg <= 1 ? "disabled" : "") + ">首页</button>" +
      '<button id="pgPrev" ' + (pg <= 1 ? "disabled" : "") + ">上一页</button>" +
      '<div class="pg-info">第 <b>' + pg + "</b> / " + pagecount + " 页" + (state.total ? " · 共" + state.total + "部" : "") + "</div>" +
      '<button id="pgNext" ' + (pg >= pagecount ? "disabled" : "") + ">下一页</button>" +
      '<button id="pgLast" ' + (pg >= pagecount ? "disabled" : "") + ">末页</button>" +
      '<div class="goto"><input type="number" id="pgInput" min="1" max="' + pagecount + '" placeholder="页码"></div>' +
    "</div>"
  ) : (state.total ? '<div class="pager"><div class="pg-info">共 ' + state.total + " 部</div></div>" : "");

  const title = isSearch ? ("搜索：" + esc(state.keyword))
    : isTag ? ('<span class="hash">#</span>' + esc(state.tagName))
    : isRank ? "排行榜"
    : esc(state.catTitle);

  const emptyHtml = '<div class="empty"><div class="ico">🎬</div><div>没有符合筛选的作品</div>' +
    '<span class="eact" onclick="clearFilters()">清空筛选</span></div>';

  app.innerHTML =
    '<div class="list-tools"><span class="bar"></span><div><h2>' + title + "</h2>" +
      (state.total ? '<div class="total">' + (isTag ? "该标签下共 " : "共 ") + state.total + " 部作品</div>" : "") +
    "</div>" + (isRank ? '<span class="act" onclick="goHome()">回首页</span>' : "") + "</div>" +
    filtersHtml +
    (state.list.length ? '<div class="grid" id="listGrid">' + cards + "</div>" : emptyHtml) +
    pagerHtml;

  if (state.mode === "category") {
    app.querySelectorAll(".filters [data-nav]").forEach(function (chip) {
      chip.onclick = function () {
        openCategory({ navId: chip.dataset.nav, sort: state.sort, tags: state.tags, title: navName(chip.dataset.nav) });
      };
    });
    app.querySelectorAll(".filters [data-sort]").forEach(function (chip) {
      chip.onclick = function () {
        if (state.sort === chip.dataset.sort) return;
        openCategory({ navId: state.navId, sort: chip.dataset.sort, tags: state.tags });
      };
    });
    app.querySelectorAll(".filters [data-ftag]").forEach(function (chip) {
      chip.onclick = function () {
        const tag = chip.dataset.ftag;
        const tags = state.tags.slice();
        const idx = tags.indexOf(tag);
        if (idx >= 0) tags.splice(idx, 1); else tags.push(tag);
        openCategory({ navId: state.navId, sort: state.sort, tags: tags });
      };
    });
    const clear = app.querySelector(".filters [data-clear]");
    if (clear) clear.onclick = function () {
      openCategory({ navId: state.navId, sort: state.sort, tags: [] });
    };
  }

  bindCards($("listGrid"), state.list, function (v) { openDetail(v, null, state.mode); });

  const jumpTo = function (p) {
    p = Math.min(Math.max(1, p), pagecount);
    if (p === state.pg) return;
    state.pg = p;
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderListPage();
  };
  const first = $("pgFirst"), prev = $("pgPrev"), next = $("pgNext"), last = $("pgLast"), input = $("pgInput");
  if (first) first.onclick = function () { jumpTo(1); };
  if (prev) prev.onclick = function () { jumpTo(pg - 1); };
  if (next) next.onclick = function () { jumpTo(pg + 1); };
  if (last) last.onclick = function () { jumpTo(pagecount); };
  if (input) input.onkeydown = function (e) {
    if (e.key === "Enter") {
      const v = parseInt(input.value, 10);
      if (v) jumpTo(v);
    }
  };
}

/* ============================ 详情 & 播放 ============================ */
async function openDetail(item, resume, fromMode) {
  if (!item || !item.vod_id) return;
  if (state.mode !== "detail") state.savedScrollY = window.scrollY || 0;
  state.backTo = fromMode || (state.mode === "detail" ? state.backTo : state.mode);
  state.mode = "detail";
  state.detail = Object.assign({}, item);
  state.episodes = [];
  state.currentEp = 0;
  state.resume = resume || null;
  destroyPlayer();
  renderNav();
  window.scrollTo(0, 0);
  renderDetailSkeleton();
  progress(true);
  try {
    const d = await dataDetail(item.vod_id);
    if (state.mode !== "detail") return;
    state.detail = d.detail;
    state.episodes = d.episodes;
    renderDetail();
  } catch (e) {
    renderEmpty("加载详情失败：" + esc(e.message || "网络错误"), "返回", "closePlayer()");
  } finally {
    progress(false);
  }
}

      '<div class="back-btn" id="backBtn">← 返回</div>' +

    "</div>" +
    '<div class="player-wrap" id="playerWrap"><video id="video" controls playsinline preload="metadata"></video></div>' +
    '<div class="detail-head"><div class="poster"></div>' +
      '<div class="detail-info"><h1 style="color:var(--sub);font-size:15px">加载中…</h1></div></div>';
  $("backBtn").onclick = closePlayer;
  $("closeBtn").onclick = closePlayer;
}

function epNumOf(idx) {
  const ep = state.episodes[idx];
  return ep ? ep.num : idx + 1;
}

async function playEpisode(idx) {
  if (idx < 0 || idx >= state.episodes.length) return;
  state.currentEp = idx;
  document.querySelectorAll(".ep").forEach(function (el, i) {
    el.classList.toggle("on", i === idx);
  });
  const ep = state.episodes[idx];

  let seekPos = 0;
  if (state.resume && String(state.resume.ep) === String(ep.num) && state.resume.pos > 8) {
    seekPos = state.resume.pos;
  }
  state.resume = null;

  const d = state.detail || {};
  upsertHist({
    id: d.vod_id, name: d.vod_name, pic: d.vod_pic, remark: d.vod_remarks,
    ep: ep.num, epTitle: ep.title, pos: seekPos, dur: 0
  });

  showPlayerLoading("正在加载 " + ep.title + "…");
  state.hlsWait = 0;
  try {
    const p = await dataPlay(ep.id);
    if (state.mode !== "detail") return;
    playVideo(p.url, seekPos);
  } catch (e) {
    showPlayerError(e.message || "播放地址获取失败");
  }
}

function closePlayer() {
  saveCurrentProgress();
  destroyPlayer();
  const back = state.backTo || "home";
  state.mode = back;
  state.detail = null;
  state.episodes = [];
  state.currentEp = 0;
  renderNav();
  window.scrollTo(0, state.savedScrollY || 0);
  if (back === "fav") renderFav();
  else if (back === "hist") renderHist();
  else if (back === "category" || back === "tag" || back === "rank" || back === "search" || back === "custom") {
    if (state.fullList.length) renderListPage();
    else if (back === "category") openCategory({ navId: state.navId, sort: state.sort, tags: state.tags });
    else if (back === "tag") goTag(state.tagName);
    else if (back === "rank") goRank();
    else if (back === "search") doSearch(state.keyword);
    else goHome();
  } else if (state.modules.length) renderHome();
  else goHome();
}

function destroyPlayer() {
  if (state.hls) {
    try { state.hls.destroy(); } catch (e) {}
    state.hls = null;
  }
  const v = $("video");
  if (v) {
    try { v.pause(); } catch (e) {}
    try { v.removeAttribute("src"); v.load(); } catch (e) {}
    v.onended = null;
    v.ontimeupdate = null;
  }
}

function saveCurrentProgress() {
  const v = $("video");
  const d = state.detail;
  if (!v || !d || !state.episodes.length || !v.currentTime) return;
  try {
    const ep = state.episodes[state.currentEp];
    if (ep) saveProgress(d.vod_id, ep.num, ep.title, v.currentTime, isFinite(v.duration) ? v.duration : 0);
  } catch (e) {}
}

function showPlayerLoading(msg) {
  const wrap = $("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(function (n) { n.remove(); });
  const div = document.createElement("div");
  div.className = "player-error";
  div.style.background = "rgba(0,0,0,.6)";
  div.innerHTML = "<div>" + esc(msg) + "</div>";
  wrap.appendChild(div);
}
function showPlayerError(msg) {
  const wrap = $("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(function (n) { n.remove(); });
  const div = document.createElement("div");
  div.className = "player-error";
  div.innerHTML = "<div>⚠️ " + esc(msg) + "</div><button id=\"retryPlay\">重试</button>";
  wrap.appendChild(div);
  const btn = div.querySelector("#retryPlay");
  if (btn) btn.onclick = function () { div.remove(); playEpisode(state.currentEp); };
}
function showPlayerLoadingHide() {
  const wrap = $("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(function (n) { n.remove(); });
}
function showFinishedOverlay() {
  const wrap = $("playerWrap");
  if (!wrap) return;
  wrap.querySelectorAll(".player-error").forEach(function (n) { n.remove(); });
  const div = document.createElement("div");
  div.className = "player-error";
  div.style.background = "rgba(0,0,0,.75)";
  div.innerHTML = "<div>🎉 已看完最后一集</div>";
  wrap.appendChild(div);
}

function makeProxyLoader() {
  if (!window.Hls || !Hls.DefaultConfig || !Hls.DefaultConfig.loader) return null;
  const Base = Hls.DefaultConfig.loader;
  return class ProxyLoader extends Base {
    load(context, config, callbacks) {
      const u = context && context.url;
      if (typeof u === "string" && /^https?:\/\//i.test(u) && u.indexOf(PROXY_BASE) !== 0) {
        context.url = PROXY_BASE + u;
      }
      super.load(context, config, callbacks);
    }
  };
}

function playVideo(originalUrl, seekTo) {
  destroyPlayer();
  const v = $("video");
  if (!v) return;
  if (!originalUrl) { showPlayerError("播放地址为空"); return; }

  const src = PROXY_BASE + originalUrl;
  let lastSave = 0;
  v.ontimeupdate = function () {
    const now = Date.now();
    if (now - lastSave > 5000 && v.currentTime > 1) {
      lastSave = now;
      saveCurrentProgress();
    }
  };

  v.onended = function () {
    saveCurrentProgress();
    const next = state.currentEp + 1;
    if (next < state.episodes.length) {
      playEpisode(next);
      setTimeout(function () {
        const el = document.querySelector('.ep[data-idx="' + next + '"]');
        if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, 100);
    } else showFinishedOverlay();
  };

  const doSeek = function () {
    if (seekTo > 0) {
      try { v.currentTime = seekTo; } catch (e) {}
      toast("已从 " + fmtTime(seekTo) + " 继续播放");
    }
  };

  const isM3u8 = /\.m3u8($|\?)/i.test(originalUrl) || /mpegurl/i.test(originalUrl);
  const nativeHls = !!(v.canPlayType && v.canPlayType("application/vnd.apple.mpegurl"));

  if (isM3u8 && !(window.Hls && Hls.isSupported()) && !nativeHls) {
    state.hlsWait = (state.hlsWait || 0) + 1;
    if (state.hlsWait <= 6) {
      showPlayerLoading("播放器加载中…");
      setTimeout(function () {
        if (state.mode === "detail") playVideo(originalUrl, seekTo);
      }, 900);
      return;
    }
  }

  if (isM3u8 && window.Hls && Hls.isSupported()) {
    const hlsConfig = {
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      enableWorker: true,
      lowLatencyMode: false,
      manifestLoadingMaxRetry: 2,
      levelLoadingMaxRetry: 2,
      fragLoadingMaxRetry: 3
    };
    const ProxyLoader = makeProxyLoader();
    if (ProxyLoader) hlsConfig.loader = ProxyLoader;
    const hls = new Hls(hlsConfig);
    state.hls = hls;
    hls.loadSource(src);
    hls.attachMedia(v);
    const loadTimer = setTimeout(function () {
      if (state.hls === hls && v.readyState < 2) showPlayerError("视频加载超时，请重试");
    }, 25000);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      clearTimeout(loadTimer);
      doSeek();
      showPlayerLoadingHide();
      v.play().catch(function () {});
    });
    let recovered = false;
    hls.on(Hls.Events.ERROR, function (e, data) {
      if (!data || !data.fatal) return;
      clearTimeout(loadTimer);
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (!recovered) {
          recovered = true;
          showPlayerLoading("网络波动，正在重试…");
          try { hls.startLoad(); return; } catch (err) {}
        }
        showPlayerError("网络错误，播放失败");
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hls.recoverMediaError(); }
        catch (err) { showPlayerError("媒体解码失败"); }
      } else {
        showPlayerError("播放失败：" + (data.details || "未知错误"));
      }
    });
  } else {
    v.src = src;
    v.addEventListener("loadedmetadata", function () {
      doSeek();
      showPlayerLoadingHide();
      v.play().catch(function () {});
    }, { once: true });
    v.addEventListener("error", function () { showPlayerError("播放失败"); }, { once: true });
  }
}

window.addEventListener("pagehide", saveCurrentProgress);
document.addEventListener("visibilitychange", function () { if (document.hidden) saveCurrentProgress(); });

/* ============================ 搜索 ============================ */
function getRecentKeywords() {
  const v = lsGet(LS_SEARCH, []);
  return Array.isArray(v) ? v.slice(0, 10) : [];
}
function pushRecentKeyword(wd) {
  const list = getRecentKeywords().filter(function (k) { return k !== wd; });
  list.unshift(wd);
  lsSet(LS_SEARCH, list.slice(0, 10));
}
function renderSearchHist() {
  const box = $("spHist");
  if (!box) return;
  const list = getRecentKeywords();
  if (!list.length) { box.classList.remove("show"); box.innerHTML = ""; return; }
  box.classList.add("show");
  box.innerHTML = '<span class="sp-label">最近搜索</span>' +
    list.map(function (k) {
      return '<span class="sp-chip" data-kw="' + esc(k) + '">' + esc(k) +
        '<i class="sp-x" data-del="' + esc(k) + '" title="删除">✕</i></span>';
    }).join("");
  box.querySelectorAll(".sp-chip").forEach(function (chip) {
    chip.onclick = function (e) {
      if (e.target.closest(".sp-x")) {
        e.stopPropagation();
        const kw = e.target.closest(".sp-x").dataset.del;
        lsSet(LS_SEARCH, getRecentKeywords().filter(function (k) { return k !== kw; }));
        renderSearchHist();
        return;
      }
      $("wd").value = chip.dataset.kw;
      doSearch();
    };
  });
}
function openSearch() {
  renderSearchHist();
  $("searchPop").classList.add("show");
  $("searchMask").classList.add("show");
  document.body.style.overflow = "hidden";
  const wd = $("wd");
  setTimeout(function () { try { wd.focus(); wd.select(); } catch (e) {} }, 260);
}
function closeSearch() {
  $("searchPop").classList.remove("show");
  $("searchMask").classList.remove("show");
  document.body.style.overflow = "";
}

async function doSearch(kw) {
  const wd = (typeof kw === "string" ? kw : $("wd").value).trim();
  if (!wd) return;
  pushRecentKeyword(wd);
  closeSearch();
  resetView();
  state.mode = "search";
  state.backTo = "search";
  state.keyword = wd;
  state.pg = 1;
  state.fullList = [];
  state.savedScrollY = 0;
  closeDrawer();
  renderNav();
  renderListSkeleton();
  window.scrollTo(0, 0);
  progress(true);
  try {
    const list = await dataSearch(wd);
    if (state.mode !== "search") return;
    state.fullList = list;
    state.pageSize = SEARCH_SIZE;
    state.total = list.length;
    state.pagecount = Math.max(1, Math.ceil(list.length / SEARCH_SIZE));
    renderListPage();
    if (!list.length) renderEmpty("未找到「" + esc(wd) + "」相关作品");
  } catch (e) {
    renderEmpty("搜索失败：" + esc(e.message || "网络错误"), "重试", "doSearchRetry()");
  } finally {
    progress(false);
  }
}
function doSearchRetry() { doSearch(state.keyword); }

/* ============================ 主题 & 启动 ============================ */
function initTheme() {
  try {
    const t = localStorage.getItem(LS_THEME) || "dark";
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  } catch (e) {}
}
function toggleTheme() {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(LS_THEME, next); } catch (e) {}
}

function bindBootEvents() {
  const menuBtn = $("menuBtn");
  if (menuBtn) menuBtn.onclick = openDrawer;
  const drawerClose = $("drawerClose");
  if (drawerClose) drawerClose.onclick = closeDrawer;
  const drawerMask = $("drawerMask");
  if (drawerMask) drawerMask.onclick = closeDrawer;
  const themeBtn = $("themeBtn");
  if (themeBtn) themeBtn.onclick = toggleTheme;
  const searchBtn = $("searchBtn");
  if (searchBtn) searchBtn.onclick = openSearch;
  const searchCancel = $("searchCancel");
  if (searchCancel) searchCancel.onclick = closeSearch;
  const searchMask = $("searchMask");
  if (searchMask) searchMask.onclick = closeSearch;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if ($("searchPop").classList.contains("show")) closeSearch();
      else closeDrawer();
    }
  });
}

function boot() {
  initTheme();
  bindBootEvents();
  renderNav();
  goHome();
}

boot();

</script>
